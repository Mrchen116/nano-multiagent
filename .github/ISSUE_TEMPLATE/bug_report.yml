name: Bug · 缺陷反馈
description: 报告错误行为、回归或使用中断。
labels:
- type:bug
- status:needs-triage
body:
- type: markdown
  attributes:
    value: 请先搜索已有 Issue。描述你知道的事实即可，不需要提前定位根因或给出实现方案。
- type: dropdown
  id: area
  attributes:
    label: 影响区域
    description: 可多选；不清楚时选择“不确定”。这里只记录线索，维护者会补 area:* 标签。
    multiple: true
    options:
    - 个人助手与任务路由 (pa)
    - 电脑节点与本地启动 (node)
    - DSH 执行集成 (dsh-integration)
    - IM 服务端 (im-server)
    - Web 客户端 (web)
    - iOS 客户端 (ios)
    - 飞书等消息渠道 (channels)
    - CI、部署与仓库工具 (infra)
    - 文档 (docs)
    - 不确定
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 实际现象
    description: 发生了什么？影响了谁、频率如何、是否阻断使用？
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 预期结果
    description: 你原本期望看到什么？
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: 复现步骤
    description: 列出操作步骤；偶发问题可写最近一次发生的过程和时间。
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: 环境与版本
    description: 客户端/操作系统、版本或 commit、节点与渠道；不知道的项写“不确定”。
  validations:
    required: true
- type: textarea
  id: validation
  attributes:
    label: 修复验证
    description: 修复后重复哪些操作、看到什么结果，才说明问题解决？
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: 补充日志或截图
    description: 可选。请移除密钥、令牌和私人聊天内容后提供。
  validations:
    required: false
- type: textarea
  id: links
  attributes:
    label: 相关资料
    description: 相关 Issue、PR、spec 或截图链接；没有可留空。
  validations:
    required: false
