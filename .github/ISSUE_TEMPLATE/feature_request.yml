name: Feature · 功能建议
description: 描述希望新增的行为或产品能力。
labels:
- type:feature
- status:needs-triage
body:
- type: markdown
  attributes:
    value: 请先搜索已有 Issue。描述你知道的事实即可，不需要提前定位根因或给出实现方案。
- type: dropdown
  id: area
  attributes:
    label: 影响区域
    description: 可多选；不清楚时选择“不确定”。这里只记录线索，维护者会补 area:* 标签。
    multiple: true
    options:
    - 个人助手与任务路由 (pa)
    - 电脑节点与本地启动 (node)
    - DSH 执行集成 (dsh-integration)
    - IM 服务端 (im-server)
    - Web 客户端 (web)
    - iOS 客户端 (ios)
    - 飞书等消息渠道 (channels)
    - CI、部署与仓库工具 (infra)
    - 文档 (docs)
    - 不确定
  validations:
    required: true
- type: textarea
  id: scenario
  attributes:
    label: 使用场景
    description: 谁在什么情况下需要这个能力？
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: 现有困难
    description: 目前如何完成？有什么不足？
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 期望行为
    description: 希望产品如何响应？可以用一个具体例子说明。
  validations:
    required: true
- type: textarea
  id: validation
  attributes:
    label: 完成标准
    description: 通过哪些操作和可见结果判断功能已经满足需求？
  validations:
    required: true
- type: textarea
  id: links
  attributes:
    label: 相关资料
    description: 相关 Issue、PR、spec 或截图链接；没有可留空。
  validations:
    required: false
