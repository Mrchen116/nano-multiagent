# feat-388 触点 (c) — 远端兜底 CI：push/PR 时前后端双门任一红阻止合并
# Python 质量门禁、两个互斥的 pytest 分片和 frontend（dependency audit + vitest）并行执行。
# 分片让全量 Python 检查适配 hosted runner 的短生命周期，且不减少覆盖范围。
name: CI

on:
  # push 仅限主干：功能分支由 pull_request 跑一次，避免开 PR 后同一 commit 被 push+pull_request 双触发。
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Diff-aware test quality gates compare the PR head with origin/main.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Change unit is archived
        if: github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: python scripts/check_change_unit_archived.py --head-ref "$GITHUB_HEAD_REF"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Documentation integrity
        run: ./scripts/docs-check

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

  python_tests_agent_pa:
    name: Python tests (agent and PA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: pytest (agent and PA, not e2e)
        run: pytest -m "not e2e" -n 4 --dist worksteal --durations=20 --durations-min=0.5 tests/unit/agent tests/unit/personal_assistant

  python_tests_remaining:
    name: Python tests (remaining)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: pytest (remaining, not e2e)
        run: pytest -m "not e2e" -n 4 --dist worksteal --durations=20 --durations-min=0.5 --ignore=tests/unit/agent --ignore=tests/unit/personal_assistant

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/IM/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest 3.x + jsdom 27 require Node >= 20
          node-version: "20"
          cache: npm
          cache-dependency-path: src/IM/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

      # npm run test = vitest run；不跑 npm run build（不引入 tsc 类型检查）
      - name: vitest run
        run: npm run test
