# feat-388 触点 (c) — 远端兜底 CI：push/PR 时前后端双门任一红阻止合并
# TypeScript runtime/center, standalone Python tooling, Web and iOS each keep their own gate.
name: CI

on:
  # push 仅限主干：功能分支由 pull_request 跑一次，避免开 PR 后同一 commit 被 push+pull_request 双触发。
  push:
    branches: [main]
  pull_request:

jobs:
  ios_changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          # PRs compare their full branch diff; pushes compare the entire update.
          revisions = [f"{base}...{head}"] if os.environ['EVENT_NAME'] == 'pull_request' else [base, head]
          diff = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "-z",
              *revisions,
          ])
          paths = [os.fsdecode(path) for path in diff.split(b"\0") if path]
          required = any(
              path == ".github/workflows/ci.yml"
              or (path.startswith("src/IM/ios/") and not path.endswith((".md", "/.gitignore")))
              for path in paths
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"required={str(required).lower()}\n")
          PY

  ios:
    name: iOS build and tests
    needs: ios_changes
    # Only a successful, explicit negative detection may skip the required check.
    if: ${{ !cancelled() && (needs.ios_changes.result != 'success' || needs.ios_changes.outputs.required != 'false') }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl create 'NanoIM CI' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-4)
          echo "NANO_IOS_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Native regression tests
        run: ./src/IM/ios/scripts/build.sh test

      - name: Release device archive
        run: ./src/IM/ios/scripts/build.sh archive

  backend:
    name: TypeScript backend and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Diff-aware test quality gates compare the PR head with origin/main.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Documentation integrity
        run: ./scripts/docs-check

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Install frozen runtime dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        run: pnpm build && pnpm typecheck
      - name: Check packaged native interactive runtime
        run: pnpm check:ios-runtime
      - name: Native runtime and IM regressions
        run: pnpm test

      - name: Standalone helper and architecture tests
        run: pytest -m "not e2e" -q

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: Change unit is archived
        if: github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: python scripts/check_change_unit_archived.py --head-ref "$GITHUB_HEAD_REF"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/IM/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: src/IM/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

      # npm run test = vitest run；不跑 npm run build（不引入 tsc 类型检查）
      - name: vitest run
        run: npm run test
