# feat-388 触点 (c) — 远端兜底 CI：push/PR 时前后端双门任一红阻止合并
# TypeScript runtime/center, standalone Python tooling, Web and iOS each keep their own gate.
name: CI

on:
  # push 仅限主干：功能分支由 pull_request 跑一次，避免开 PR 后同一 commit 被 push+pull_request 双触发。
  push:
    branches: [main]
  pull_request:

jobs:
  archive:
    name: Change unit is archived
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check change unit
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/check_change_unit_archived.py --head-ref "$GITHUB_HEAD_REF"

  ios_changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          # PRs compare their full branch diff; pushes compare the entire update.
          revisions = [f"{base}...{head}"] if os.environ['EVENT_NAME'] == 'pull_request' else [base, head]
          diff = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "-z",
              *revisions,
          ])
          paths = [os.fsdecode(path) for path in diff.split(b"\0") if path]
          required = any(
              path == ".github/workflows/ci.yml"
              or (path.startswith("src/IM/ios/") and not path.endswith((".md", "/.gitignore")))
              or path.startswith("src/IM/shared/")
              or path in ("src/IM/frontend/src/features/chat/components/avatar.tsx", "src/IM/frontend/src/features/chat/components/assistant-portrait.tsx")
              or path.startswith("src/IM/frontend/src/features/chat/interactive/")
              or path.startswith("src/IM/frontend/src/ios-interactive/")
              or path in ("src/IM/frontend/vite.ios.config.ts", "src/IM/frontend/package.json", "src/IM/frontend/package-lock.json")
              or path.startswith("packages/product-contracts/src/interactive-")
              for path in paths
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"required={str(required).lower()}\n")
          PY

  ios:
    name: iOS ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [test, archive]
    needs: ios_changes
    # Only a successful, explicit negative detection may skip the required check.
    if: ${{ !cancelled() && (needs.ios_changes.result != 'success' || needs.ios_changes.outputs.required != 'false') }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select iPhone simulator
        if: matrix.task == 'test'
        run: |
          DEVICE_ID=$(xcrun simctl create 'NanoIM CI' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-4)
          echo "NANO_IOS_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Install shared renderer dependencies
        run: |
          pnpm install --frozen-lockfile
          npm --prefix src/IM/frontend ci

      - name: Run iOS ${{ matrix.task }}
        run: ./src/IM/ios/scripts/build.sh "${{ matrix.task }}"

  backend:
    name: TypeScript backend and tooling (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Keep native runtime regression tests on the validated runner image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Diff-aware test quality gates compare the PR head with origin/main.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Documentation integrity
        if: matrix.shard == 1
        run: ./scripts/docs-check

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Install frozen runtime dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Typecheck
        if: matrix.shard == 1
        run: pnpm typecheck
      - name: Check packaged native interactive runtime
        if: matrix.shard == 1
        run: pnpm check:ios-runtime
      - name: Native runtime and IM regressions
        run: pnpm test --shard=${{ matrix.shard }}/2

      - name: Standalone helper and architecture tests
        if: matrix.shard == 1
        run: pytest -m "not e2e" -q

      - name: ruff check
        if: matrix.shard == 1
        run: ruff check .

      - name: ruff format check
        if: matrix.shard == 1
        run: ruff format --check .

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/IM/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: src/IM/frontend/package-lock.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Install shared contract dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        run: npm ci

      - name: Build shared browser contracts
        run: npx tsc -p ../../../packages/product-contracts/tsconfig.json --typeRoots ./node_modules/@types

      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

      - name: Typecheck Web IM and its component contracts
        run: npx tsc -b
      - name: vitest run
        run: npm run test
