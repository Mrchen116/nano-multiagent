name: Temporary Desktop Windows 10 & 11 VM QA

on:
  push:
    branches: [unit/feat-790-desktop-client]
    paths:
      - '.github/workflows/desktop-windows-vm-qa.yml'
      - '.github/scripts/desktop-hyperv/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-packages:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: src/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/apps/desktop
      - name: Build workspace and frontend
        working-directory: src
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix src/IM/frontend ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix src/IM/frontend run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Crewden Desktop v1.0.0, run smoke.ps1, and build v1.0.1 / v1.0.2-bad / feat-781 bundle
        working-directory: src
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaOut = Join-Path $env:RUNNER_TEMP 'qa-windows-bundle'
          New-Item -ItemType Directory -Force "$qaOut\v1.0.0", "$qaOut\v1.0.1", "$qaOut\v1.0.2", "$qaOut\feat781" | Out-Null

          # 1. Build v1.0.0 + run DesktopGatewayHost & Rust unit tests + run smoke.ps1
          ./scripts/build-desktop-windows.ps1 -Version '1.0.0'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./packaging/desktop/windows/smoke.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item 'dist\desktop-windows-release\*' "$qaOut\v1.0.0\" -Force

          # 2. Build v1.0.1 pure-app update candidate (reuses cached Node 24.22.1 runtime)
          ./scripts/build-desktop-windows.ps1 -Version '1.0.1' -ExtraAppNote "upgraded-1.0.1`n" -OutDir "$qaOut\v1.0.1" -SkipHostTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          # 3. Build v1.0.2-bad broken candidate for automatic rollback verification
          python .github/scripts/desktop-hyperv/make-bad-candidate.py "$qaOut\v1.0.0" "$qaOut\v1.0.1" "$qaOut\v1.0.2"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          # 4. Build feat-781 lightweight Windows installer + Smoke.exe for coexistence/takeover test
          $env:RELEASE_VERSION = '1.0.0'
          ./scripts/build-windows-installer.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:exe /platform:x64 /codepage:65001 /main:Smoke "/out:dist\windows-build\Smoke.exe" /r:System.Web.Extensions.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:Microsoft.CSharp.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll packaging\windows\Package.cs packaging\windows\Launcher.cs packaging\windows\Smoke.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item 'dist\windows-release\*' "$qaOut\feat781\" -Force
          Copy-Item 'dist\windows-build\Smoke.exe' "$qaOut\feat781\Smoke.exe" -Force
          Copy-Item 'packaging\windows\Crewden.exe.config' "$qaOut\feat781\Smoke.exe.config" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: qa-windows-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/qa-windows-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  windows10:
    needs: build-packages
    runs-on: windows-2025
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: src/package.json
      - name: Compile host IM server workspace
        working-directory: src
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix src/IM/frontend ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix src/IM/frontend run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: qa-windows-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/qa-windows-bundle
      - name: Boot clean official Windows 10 x64 VM and run full M2 acceptance
        working-directory: src
        shell: pwsh
        run: ./.github/scripts/desktop-hyperv/host.ps1 -Edition win10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win10-desktop-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/win10-desktop-evidence/
          if-no-files-found: warn
          retention-days: 5

  windows11:
    needs: build-packages
    runs-on: windows-2025
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: src/package.json
      - name: Compile host IM server workspace
        working-directory: src
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix src/IM/frontend ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix src/IM/frontend run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: qa-windows-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/qa-windows-bundle
      - name: Boot clean official Windows 11 x64 VM (TPM2 + Secure Boot) and run full M2 acceptance
        working-directory: src
        shell: pwsh
        run: ./.github/scripts/desktop-hyperv/host.ps1 -Edition win11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win11-desktop-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/win11-desktop-evidence/
          if-no-files-found: warn
          retention-days: 5
