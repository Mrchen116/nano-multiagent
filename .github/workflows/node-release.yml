name: Publish Node installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicitly requested release version (X.Y.Z, without v prefix)
        type: string
        required: true
      commit:
        description: Full source commit SHA (40 lowercase hex characters)
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: node-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit version and fixed source revision
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      # Keep publishing policy from this workflow revision, even for older source commits.
      - uses: actions/checkout@v4
      - name: Preserve the versioned publisher
        run: cp scripts/publish-node-release.mjs "$RUNNER_TEMP/nano-publish-node-release.mjs"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile
      - name: Build candidate exactly once
        run: pnpm build
      - name: Verify runtime and installer
        run: pnpm typecheck && pnpm test
      - name: Publish and anonymously verify the same package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/nano-publish-node-release.mjs"
      - name: Preserve verified manifest for the matching IM deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-manifest-${{ inputs.version }}
          path: dist/node-release/manifest.json
          if-no-files-found: error
