[package]
name = "crewden-desktop"
version = "0.1.0"
description = "Crewden Desktop resident workspace and local node manager"
edition = "2021"

[lib]
name = "crewden_desktop"
path = "src/lib.rs"

[[bin]]
name = "crewden-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
bytes = "1"
futures-util = "0.3"
http = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSDictionary", "NSObject", "NSNotification", "NSString", "NSUserNotification"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications"] }
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
