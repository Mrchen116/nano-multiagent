# Repository-owned, secret-free default for isolated IM + Gateway E2E stacks.
# scripts/e2e-up.sh rewrites node, IM URL and workspaces in its worktree copy.
# Model catalog maintenance: docs/development/llm-integration.md.
node:
  node_id: e2e-gateway
  workspace_base: /tmp/nano-e2e-workspace

im_service:
  url: http://127.0.0.1:8011
  username: nano
  password: nano1234

# This isolated fixture deliberately exercises the opt-in external footer.
# Production/local configuration remains disabled unless an operator enables it.
display:
  runtime_footer:
    enabled: true

agents:
  - agent_id: e2e
    title: E2E Agent
    workspace_root: /tmp/nano-e2e-workspace/e2e
    custom_prompt: You are the isolated E2E test agent. Reply concisely.
    default_model: deepseek:deepseek-v4-flash
    work_mode: single_thread
    # Explicit tools survive registration/config sync; omitted lists canonicalize to [].
    tool_allowlist: &e2e_tools
      - read
      - write
      - edit
      - bash
      - web_search
      - web_fetch
      - skill
      - send_message
      - inbox
      - conversations
    skills: []
    skills_selection_mode: explicit_denylist
    features:
      heartbeat: false
      cron_scheduling: false
  - agent_id: e2e-peer
    title: E2E Peer Agent
    workspace_root: /tmp/nano-e2e-workspace/e2e-peer
    custom_prompt: You are the peer in isolated E2E group-chat tests. Reply concisely.
    default_model: deepseek:deepseek-v4-flash
    group_reply_policy: mention_only
    work_mode: single_thread
    tool_allowlist: *e2e_tools
    skills: []
    skills_selection_mode: explicit_denylist
    features:
      heartbeat: false
      cron_scheduling: false
  - agent_id: e2e-global
    title: E2E Global Agent
    workspace_root: /tmp/nano-e2e-workspace/e2e-global
    custom_prompt: You are the isolated global E2E test agent. Reply concisely to the source conversation.
    default_model: deepseek:deepseek-v4-flash
    work_mode: global
    group_reply_policy: mention_only
    tool_allowlist: *e2e_tools
    skills: []
    skills_selection_mode: explicit_denylist
    features:
      heartbeat: false
      cron_scheduling: false

channels:
  - name: web_relay
    enabled: true
  # The fixed Feishu E2E agent/channel is opt-in. `e2e-up.sh --feishu` enables
  # it only in the generated worktree config after it verifies private test-App
  # credentials; default E2E never opens a Feishu listener.
  - name: feishu:e2e
    enabled: false
    settings: {}

llm:
  default_model: deepseek:deepseek-v4-flash
  providers:
    - name: anthropic
      base_url: http://127.0.0.1:4000
      models:
        - name: deepseek:deepseek-v4-flash
          context_window: 262144
          reasoning:
            default: high
            levels: [high, max]
        - name: codexOAuth:gpt-6.1-sol
          context_window: 258400
          reasoning:
            default: medium
            levels: [none, low, medium, high, xhigh, max]
        - name: codexOAuth:gpt-6-astra
          context_window: 258400
          reasoning:
            default: medium
            levels: [none, low, medium, high, xhigh, max]
        - name: codexOAuth:gpt-6-luna
          context_window: 258400
          reasoning:
            default: medium
            levels: [none, low, medium, high, xhigh, max]
        # E2E model catalog coverage: routable models with fixed and absent
        # reasoning declarations let browser acceptance exercise all three UI
        # states without exposing a model that cannot complete a real chat.
        - name: kimiCoding:kimi-for-coding
          reasoning: fixed
        - name: mimo:mimo-v2.5-pro
