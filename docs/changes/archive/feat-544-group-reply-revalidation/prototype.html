<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群聊插话复核 · 交互草案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fa;color:#202a2e;font:14px/1.65 system-ui,-apple-system,sans-serif}header{background:#141e22;color:#f4f7f7;padding:15px 24px;display:flex;justify-content:space-between;align-items:center}header b{font-size:19px}header small{color:#abc1c8}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1280px;margin:auto;min-height:calc(100vh - 62px)}aside{background:#1b2529;color:#d4dfe2;padding:25px 18px}.room{padding:14px;border:1px solid #167c73;border-radius:12px;background:#26383b;margin-top:14px}.room small{display:block;color:#a3b6bc}main{min-width:0;background:white}.title{padding:18px 28px;border-bottom:1px solid #e2e7e9}.title b{font-size:18px}.muted{color:#6a797f;font-size:12px}.controls{padding:16px 28px;background:#f7faf9;border-bottom:1px solid #e2e7e9}.controls label{display:block;font-weight:600;margin-bottom:8px}.buttons{display:flex;gap:7px;flex-wrap:wrap}button{font:inherit;cursor:pointer;background:white;border:1px solid #cedbd8;border-radius:7px;padding:7px 11px;color:#34494c}button[aria-pressed=true]{background:#008778;color:white;border-color:#008778}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #38aeb5;outline-offset:3px}.hint{margin:10px 0 0;color:#536869;font-size:12px}.timeline{max-width:790px;margin:0 auto;padding:22px 26px 35px}.message{display:flex;gap:10px;margin:18px 0;align-items:flex-start;scroll-margin:20px}.avatar{width:30px;height:30px;border-radius:50%;background:#98600c;color:white;display:grid;place-items:center;flex:none;font-weight:600;font-size:11px;margin-top:24px}.avatar.a{background:#4f719d}.content{min-width:0;max-width:100%}.name{font-size:12px;color:#95621e;font-weight:600;margin-bottom:4px}.name time{font-weight:400;color:#8b979c;margin-left:8px}.card{border:1px solid #e1e7ea;border-radius:11px;padding:13px 16px;background:#fff;box-shadow:0 2px 8px #213b4507}.user{justify-content:flex-end}.user .card{background:#e4f2ee;border-color:#d9eae5}.user .name{text-align:right;color:#54716c}.body{margin:0 0 12px}.body:last-child{margin:0}.process{font-size:12px;color:#576b74}.process>summary{cursor:pointer;list-style:none;padding:3px 0;color:#526b73}.process>summary:before{content:'▸ ';color:#748991}.process[open]>summary:before{content:'▾ '}.rows{margin-top:9px;border-top:1px solid #eef1f3;padding-top:4px}.row{padding:8px 0;display:flex;gap:9px;border-bottom:1px solid #f0f3f4}.row:last-child{border:0}.icon{width:16px;flex:none}.row a,.ref{color:#007e73;text-decoration:none}.row a:hover,.ref:hover{text-decoration:underline}.row details{min-width:0}.row summary{cursor:pointer}.row p{margin:5px 0;color:#60747d}.outcome{font-size:12px;color:#59756b;margin-top:10px}.small-link{margin-left:7px}.composer{margin:0 26px 25px;border:1px solid #dbe2e5;border-radius:12px;padding:13px;color:#8c989e}.legend{padding:15px 28px;border-top:1px solid #e4e9eb;font-size:12px;color:#64757c}.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#078a7b;margin-right:5px;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.3}}.draft-body{white-space:pre-wrap;border-left:2px solid #bccbc8;background:#f5f8f7;padding:10px 12px;color:#485d64;margin-top:8px}.latest{border-color:#bfdad3}.footnote{margin:8px 0 0;font-size:12px;color:#667b83}@media(max-width:720px){.layout{display:block}aside{display:none}header{padding:12px 16px}.title,.controls{padding:14px 16px}.timeline{padding:10px 13px 24px}.card{padding:11px 12px}.composer{margin:0 14px 20px}.legend{padding:14px 16px}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style><header><b>✓ nano IM <small>internal</small></b><small>Chat　 Agents</small></header><div class="layout"><aside><b>CHATS</b><div class="room">项目讨论组<small>你 · plato · luban</small></div><p class="muted">交互原型 · 非真实会话</p></aside><main><div class="title"><b>项目讨论组</b><div class="muted">群聊 · 保留现有消息块与可折叠 Process</div></div><section class="controls"><label>预览处理结果</label><div class="buttons" id="buttons"><button data-mode="reviewing">复核中</button><button data-mode="revised" aria-pressed="true">修改后回复</button><button data-mode="unchanged">原文继续发送</button><button data-mode="silent">原规则允许静默</button><button data-mode="again">再次收到更新</button></div><p class="hint">切换的是示例状态；真实产品不新增这些按钮。点击 Process 可查看分段，点击消息引用可定位更新。</p></section><section class="timeline" id="timeline"></section><div class="composer">输入消息…　　<span style="float:right">发送 ↑</span></div><div class="legend">设计建议：旧块留在原位 · 复核从新块开始 · 新块位于它已采纳的更新之后 · 原草稿可在 Process 展开 · 明确标注未发送</div></main></div>
<script>
const row=(text,icon='✓')=>`<div class="row"><span class="icon">${icon}</span><div>${text}</div></div>`;
const draft=(text)=>row(`<details class="draft"><summary>原草稿 · 未发送</summary><p class="muted">这是当时生成的草稿，不是正式回复。</p><div class="draft-body">${text}</div></details>`,'▤');
const proc=(summary,rows,open=false)=>`<details class="process" ${open?'open':''}><summary>Process · ${summary}</summary><div class="rows">${rows}</div></details>`;
function msg(name,time,body,id='',cls='',footer=''){let user=name==='你';return `<article class="message ${user?'user':''}" id="${id}">${user?'':`<span class="avatar ${name==='luban'?'a':''}">${name==='luban'?'LU':'PL'}</span>`}<div class="content"><div class="name">${name}<time>${time}</time></div><div class="card ${cls}">${body}${footer}</div></div></article>`}
function render(mode){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));let unchanged=mode==='unchanged';let text=msg('你','10:00','请确认会议日期，给出后续安排。','original');
text+=msg('plato','10:00',proc('草稿未发送 · 转入后续处理',row('查询日历完成','🔧')+draft(unchanged?'会议定于周五。我会在周四前准备好会议材料。':'会议定于周四。我会在周三前准备好会议材料。')+row('收到后续消息，本段草稿未发送。<a href="#new-block">查看后续处理 ↓</a>','↳')),'old-block');
text+=msg('luban','10:01',unchanged?'我补充说明：会议室位置稍后确认，日期不变。':'会议日期已改到周五，请以周五为准。','update');
const source=row('<a href="#update">luban · '+(unchanged?'日期不变，补充会议室信息':'会议日期已改到周五')+'</a>','↳');
const review=row('<details><summary>正在结合 1 条新消息复核</summary><p>已接入该条更新，原草稿尚未发送。</p></details>','↻');
let body='',rows=source;
if(mode==='reviewing'){rows+=review;body=proc('<span class="pulse"></span>正在复核新消息',rows,true)}
else if(mode==='silent'){rows+=row('本轮处理结束，未发送正文。此示例仅用于原规则允许静默的场景。','↻');body=proc('处理结束 · 未发言',rows,true)}
else if(unchanged){rows+=row('复核结束，本段已发送正文。','↻');body='<p class="body">会议定于周五。我会在周四前准备好会议材料。</p>'+proc('1 次复核',rows,true)}
else {rows+=row('已结合周五的更新重新处理。','↻')+row('查询周五日历'+(mode==='again'?'完成':'完成'),'🔧');body=(mode==='again'?'':'<p class="body">按最新安排，会议定于周五。我会在周四前准备好材料，并检查周五的时间冲突。</p>')+proc(mode==='again'?'草稿未发送 · 转入后续处理':'1 次复核 · 1 次工具调用',rows+(mode==='again'?draft('会议定于周五。我会在周四前准备好会议材料。')+row('收到进一步更新。<a href="#third-block">查看后续处理 ↓</a>','↳'):''),true)}
text+=msg('plato','10:01',body,'new-block','latest');
if(mode==='again'){text+=msg('你','10:02','更正：最终定周六。','update2');text+=msg('plato','10:02',proc('<span class="pulse"></span>正在复核新消息',row('<a href="#update2">你 · 最终定周六</a>','↳')+row('正在结合此次更新继续处理，周五草稿未发送。','↻'),true),'third-block','latest')}
document.getElementById('timeline').innerHTML=text;
}
document.getElementById('buttons').addEventListener('click',e=>{let b=e.target.closest('button[data-mode]');if(b)render(b.dataset.mode)});render('revised');
</script></html>
