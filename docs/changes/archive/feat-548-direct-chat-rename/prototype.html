<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>私聊会话菜单</title><style>body{font:15px system-ui;background:#f8fafc;color:#1e293b;margin:0}main{max-width:760px;margin:30px auto;background:white;height:500px;border:1px solid #e2e8f0}header{padding:16px;display:flex;align-items:center;border-bottom:1px solid #eee;gap:12px}h3{margin:0}small{color:#64748b}button,input{font:inherit;padding:9px;border:1px solid #cbd5e1;background:white;border-radius:8px}aside{position:relative;margin-left:auto}nav{position:absolute;right:0;width:150px;background:white;padding:5px;box-shadow:0 4px 18px #0002;z-index:1}nav button{display:block;width:100%;border:0;text-align:left}dialog{border:1px solid #ddd;border-radius:12px;width:min(320px,80vw)}input{box-sizing:border-box;width:100%;margin:18px 0}footer{display:flex;gap:8px;justify-content:flex-end}p{padding:16px;color:#64748b}</style><main><header><span>策</span><div><h3 id="title">小策</h3><small>Test User · 小策</small></div><aside><button aria-label="会话菜单" onclick="menu.hidden=!menu.hidden">⋯</button><nav id="menu" hidden><button onclick="menu.hidden=true;nameInput.value=title.textContent;rename.showModal()">重命名</button><button onclick="menu.hidden=true;alert('进入现有 Agent 配置')">Agent 配置</button></nav></aside></header><p>已有聊天内容保持。</p></main><dialog id="rename"><form onsubmit="event.preventDefault();if(fail.checked){error.hidden=false;return;}title.textContent=nameInput.value.trim();error.hidden=true;rename.close()"><h3>重命名会话</h3><input id="nameInput" aria-label="会话名称" required oninput="save.disabled=!this.value.trim()"><label><input id="fail" type="checkbox" style="width:auto;margin:0">模拟保存失败（原型演示）</label><p id="error" hidden style="color:#be123c;padding:0">保存失败，请重试。</p><footer><button type="button" onclick="rename.close()">取消</button><button id="save">保存</button></footer></form></dialog></html>
