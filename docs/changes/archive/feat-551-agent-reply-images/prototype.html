<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>feat-551 · 图片回复状态原型</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.65 system-ui,sans-serif;color:#29323c;background:#fff}header{padding:16px 24px;border-bottom:1px solid #e5e7eb}header p{margin:2px 0;color:#687385;font-size:12px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;cursor:pointer;background:white;border:1px solid #d6dce4;border-radius:8px;padding:5px 12px}button:focus-visible{outline:2px solid #3680e6;outline-offset:2px}button[aria-pressed=true]{background:#eaf2ff;border-color:#83ade7}main{max-width:760px;margin:36px auto;padding:0 20px;display:flex;gap:12px}.avatar{width:34px;height:34px;flex-shrink:0;border-radius:10px;background:#e4edff;color:#3d6098;text-align:center;line-height:34px}.column{min-width:0;flex:1}.name{font-size:12px;color:#687385;margin-bottom:7px}.bubble{background:#f4f5f7;border:1px solid #e8eaed;border-radius:16px 16px 16px 4px;padding:14px;display:grid;gap:10px;max-width:560px}.bubble p{margin:0}.picture{display:block;width:min(320px,100%);padding:0;border:0;overflow:hidden;background:white}.picture svg{display:block;width:100%;height:auto}.state{max-width:320px;border:1px dashed #c9d1dc;border-radius:8px;padding:24px 14px;color:#677487;background:#fafbfd}.error{padding:12px 14px;color:#a24f31;border-color:#e7c7b9}.state button{margin:8px 0 0;font-size:12px}.meta{font-size:11px;color:#87919d;margin-top:7px}dialog{border:0;border-radius:12px;max-width:95vw;width:860px;padding:16px}dialog::backdrop{background:#182335bb}dialog svg{width:100%;height:auto}dialog button{float:right;margin-bottom:12px}[hidden]{display:none!important}@media(max-width:480px){header{padding:14px 16px}main{padding:0 12px;margin-top:24px;gap:8px}.bubble{padding:12px}}
</style>
<header>图片回复 · 设计原型<p>复用既有聊天气泡，仅演示正文内的图片与状态；下列切换按钮不进入产品。</p><nav aria-label="演示状态"><button data-state="ready" aria-pressed="true">已就绪</button><button data-state="loading" aria-pressed="false">加载中</button><button data-state="error" aria-pressed="false">加载失败</button><button data-state="only" aria-pressed="false">纯图片</button></nav></header>
<main><div class="avatar">P</div><section class="column"><div class="name">plato · macbook-air</div><article id="reply" class="bubble"><p class="prose">这是当前页面的截图：</p><button class="picture" aria-label="放大页面截图"><svg role="img" aria-label="示例页面截图" viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="380" fill="#fff"/><rect width="640" height="40" fill="#e9edf3"/><circle cx="20" cy="20" r="5" fill="#d48484"/><circle cx="38" cy="20" r="5" fill="#d7bb77"/><circle cx="56" cy="20" r="5" fill="#7fb29a"/><rect y="40" width="120" height="340" fill="#f3f5f8"/><text x="145" y="90" font-size="22" fill="#344154">任务概览</text><rect x="145" y="115" width="460" height="70" rx="8" fill="#edf3fb"/><rect x="145" y="210" width="220" height="130" rx="8" fill="#f3f5f8"/><rect x="385" y="210" width="220" height="130" rx="8" fill="#f3f5f8"/><path d="M165 310L200 280L235 292L270 250L310 262L345 228" fill="none" stroke="#6190cf" stroke-width="5"/><text x="405" y="270" font-size="18" fill="#63778e">页面内容预览</text></svg></button><div class="state" id="loading" role="status" hidden>图片加载中…</div><div class="state error" id="error" role="status" hidden>图片未能展示：加载失败<br><button id="retry">重试加载</button></div><p class="prose">图中保留完整页面比例，点击图片可以放大查看。</p></article><div class="meta">刚刚</div></section></main>
<dialog aria-label="图片预览"><button id="close">关闭</button><div id="large"></div></dialog>
<script>
const pic=document.querySelector('.picture');const dialog=document.querySelector('dialog');function show(state){pic.hidden=state==='loading'||state==='error';document.querySelector('#loading').hidden=state!=='loading';document.querySelector('#error').hidden=state!=='error';document.querySelectorAll('.prose').forEach(p=>p.hidden=state==='only');document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)))}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>show(b.dataset.state));document.querySelector('#retry').onclick=()=>{show('loading');setTimeout(()=>show('ready'),600)};pic.onclick=()=>{document.querySelector('#large').replaceChildren(pic.querySelector('svg').cloneNode(true));dialog.showModal()};document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>pic.focus());
</script>
</html>
