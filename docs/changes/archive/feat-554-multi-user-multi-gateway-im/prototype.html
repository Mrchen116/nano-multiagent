function distillSources(){return conversations.filter(c=>distillIds.has(c.id)&&c.members.includes(me))}
function distillReason(c){
  const a=person(c.sourceAgent);
  if(c.runState==='running')return t("运行中");
  if(!a)return t("来源不可用");
  if(a.mode!=='single')return t("仅支持单 Thread 聊天");
  if(a.owner!==me)return t("来源 Agent 由{owner}管理",{owner:name(a.owner)});
  const first=distillSources()[0],node=first&&person(first.sourceAgent)?.node;
  return node&&node!==a.node?t("不同 Gateway"):'';
}

function prefillDistill(){

  else if(!a.online)distillError='Gateway 离线，恢复连接后可重试。';
  else if(!a.distillSkill||!a.skillView)distillError='开始前请先为执行 Agent 启用 conversation-skill-distiller 和 skill_view。';

    conversations.unshift(c);messages[c.id]=[];active=c.id;draft=prompt;distillMode=false;distillIds=new Set();modal=null;detail=true;drawer=false;filter='all';query='';render();toast(t("命令已预填，请检查并补充意图后发送。"));return;

 else if(modal==='agent-create'){body=`<div class="field"><label>${t("名称")}</label><input placeholder="${t("新 Agent")}"></div><div class="field"><label>${t("设备")}</label><select ${nodes.length?'':'disabled'}><option>${t("请选择在线设备")}</option>${nodes.filter(n=>owned.some(a=>a.node===n&&a.online)).map(n=>`<option ${n===createNode?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>${t("工作模式")}</label><select><option>${t("单 Thread")}</option><option>${t("全局")}</option></select></div><div class="field"><label>${t("工作目录")}</label><input placeholder="/workspace/new-agent"></div><p class="hint">${t("此处保留现有管理入口，完整表单和后台操作在正式 IM 中沿用。")}</p>`}
 else if(legacySection==='编辑账号'){body=`<div class="field"><label for="profile-name">${t("显示名称")}</label><input id="profile-name" value="${esc(name(me))}"></div><div class="field"><label for="profile-node">${t("默认设备")}</label><select id="profile-node"><option value="">${t("无默认设备")}</option>${nodes.map(n=>`<option ${profileDefaults[me]===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;footer=`<button class="btn primary" data-action="save-profile">${t("保存")}</button>`}
 else if(legacySection==='技能与工具'){body=`<p>${t("Skill 来源分组与工具选择")}</p><label class="scope-option"><input type="checkbox" data-agent-option="distillSkill" ${a.distillSkill?'checked':''}><span>${t("已启用蒸馏 Skill")}<small>conversation-skill-distiller</small></span></label><label class="scope-option"><input type="checkbox" data-agent-option="skillView" ${a.skillView?'checked':''}><span>${t("已启用 skill_view")}</span></label>`}

 else if(legacySection==='定时任务'){body=`<h3>HEARTBEAT.md</h3><pre>检查待办与已有工作进展。</pre><div class="management-links"><button class="btn" data-action="legacy" data-id="HEARTBEAT.md">HEARTBEAT.md ${t("预览")}</button><button class="btn" data-action="legacy" data-id="Cron">${t("新建定时任务")}</button></div>`}
 else {const desc={'系统策略':'Gateway 的资源与安全策略','模型与推理':'模型、备用模型与推理档位','提示词预览':'全部现有公开配置','运行诊断':'设备别名、连接状态与运行诊断'};body=`<p>${t(desc[legacySection]||legacySection)}</p><p class="hint">${t("此处保留现有管理入口，完整表单和后台操作在正式 IM 中沿用。")}</p>`}
 return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title">${t(heading)}</h2><button class="icon-btn" data-action="close-modal" aria-label="${t("关闭")}">${icon('close')}</button></header><div class="modal-body">${body}</div><footer class="modal-footer">${footer}</footer></section></div>`;
}
function removeMember(id){const c=conv();if(!c?.group||id===c.creator)return;c.members=c.members.filter(x=>x!==id);if(c.sourceAgent===id)c.sourceAgent=null;if(id===me){active=conversations.find(x=>x.members.includes(me))?.id;detail=false;drawer=false;draft=''}render()}
function direct(id){if(id===me){toast(t("这是你自己"));return}let c=conversations.find(c=>!c.group&&!c.purpose&&c.members.length===2&&c.members.includes(me)&&c.members.includes(id));if(!c){c={id:'new-'+counter++,title:name(id),members:[me,id],time:'刚刚'};conversations.unshift(c);messages[c.id]=[]}active=c.id;nav='chat';detail=true;modal=null;drawer=false;draft=drafts[me+':'+c.id]||'';query='';filter='all';render()}
function send(){let e=document.getElementById('message-input');let text=e?.value.trim();if(!text)return;const c=conv();messages[c.id].push({from:me,text,time:'刚刚'});c.time='刚刚';draft='';drafts[me+':'+active]='';mentionOpen=false;render();document.getElementById('messages')?.scrollTo(0,99999);const target=c.group?agents.find(a=>text.includes('@'+a.name)&&c.members.includes(a.id)):person(c.members.find(id=>id!==me));if(target?.kind==='agent'&&target.online){const cid=c.id;setTimeout(()=>{messages[cid].push({from:target.id,text:'收到，我会把这条要求纳入当前工作。',time:'刚刚',work:target.mode==='global'});if(nav==='chat'&&active===cid){saveDraft();render();document.getElementById('messages')?.scrollTo(0,99999)}},650)}document.getElementById('message-input')?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'change-guide':saveDraft();userMenuOpen=false;document.querySelector('.user-popover')?.remove();document.querySelector('[data-action="user-menu"]')?.setAttribute('aria-expanded','false');modal='change-guide';renderModal();break;case'legacy':saveDraft();userMenuOpen=false;if(id==='设备管理'){nav='nodes';detail=true;drawer=false;modal=null}else{legacySection=id;modal='legacy'}render();break;case'agent-create':saveDraft();createNode=b.dataset.node||'';modal='agent-create';renderModal();break;case'save-node':{const node=nodeProfiles[id];if(!node||!agents.some(a=>a.owner===me&&a.node===id))break;const value=document.getElementById('alias-'+node.id).value.trim();if(value){node.alias=value;render();toast(t('已保存'))}break}case'signout':userMenuOpen=false;modal='signout';render();break;case'rename-chat':saveDraft();modal='rename-chat';renderModal();break;case'save-chat-title':{const value=document.getElementById('rename-title').value.trim();if(value){conv().title=value;conv().customTitle=true;modal=null;render()}break}case'remove-member':saveDraft();removeMember(id);break;case'leave-group':removeMember(me);break;case'dissolve-dialog':modal='dissolve';renderModal();break;case'dissolve-confirm':{const c=conv();if(c?.creator===me){conversations=conversations.filter(x=>x.id!==c.id);active=conversations.find(x=>x.members.includes(me))?.id;modal=null;drawer=false;detail=false;draft='';render();toast(t('群聊已解散'))}break}case'save-profile':{const value=document.getElementById('profile-name').value.trim();if(value)person(me).name=value;profileDefaults[me]=document.getElementById('profile-node').value;modal=null;render();toast(t('已保存'));break}case'message-copy':copyMessage(id);break;case'message-fork':branchMessage(id);break;case'message-trace':{saveDraft();const key=active+':'+id;expandedMessages.has(key)?expandedMessages.delete(key):expandedMessages.add(key);render();break}case'slash-select':draft=id+' ';drafts[me+':'+active]=draft;render();document.getElementById('slash-menu')?.remove();document.getElementById('message-input')?.focus();break;case'distill-enter':enterDistill(id);break;case'distill-cancel':distillMode=false;distillIds=new Set();modal=null;render();break;case'distill-dialog':if(distillIds.size){distillAgent=distillSources()[0].sourceAgent;distillScope='agent';distillError='';modal='distill';renderModal()}break;case'distill-prefill':prefillDistill();break;case'user-menu':saveDraft();userMenuOpen=!userMenuOpen;render();break;case'language':saveDraft();language=id;localStorage.setItem('feat554_prototype_lang',language);userMenuOpen=false;render();break;case'nav':userMenuOpen=false;saveDraft();nav=b.dataset.nav;detail=['account','nodes'].includes(nav)||innerWidth>=768;query='';drawer=false;render();break;case'back':detail=false;drawer=false;render();break;case'account-detail':detail=true;render();break;case'chat':saveDraft();active=id;nav='chat';detail=true;draft=drafts[me+':'+id]||'';drawer=false;render();break;case'filter':filter=id;render();break;case'newchat':openModal('chat');break;case'newgroup':window.groupName='';openModal('group');break;case'invite':openModal('invite');break;case'close-modal':modal=null;renderModal();break;case'contact-filter':contactFilter=id;renderModal();break;case'select-contact':selected.has(id)?selected.delete(id):selected.add(id);renderModal();break;case'direct':direct(id);break;case'create-group':if(!selected.size)return;if(modal==='invite'){conv().members.push(...selected);toast(t("成员已添加"))}else{let title=window.groupName?.trim()||[me,...selected].map(name).join('、');let c={id:'group-'+counter++,title,members:[me,...selected],group:true,creator:me,time:'刚刚'};conversations.unshift(c);messages[c.id]=[];active=c.id;nav='chat';detail=true;filter='all';query='';draft=''}modal=null;render();break;case'members':saveDraft();drawer=!drawer;render();break;case'contact-profile':if(person(id)?.kind==='agent'){agentId=id;agentTab='about';nav='agents';detail=true;drawer=false;query='';render()}else if(id!==me)direct(id);break;case'agent':agentId=id;agentTab=person(id).mode==='global'?'work':person(id).owner===me?'settings':'about';child=false;detail=true;render();break;case'work':saveDraft();agentId=id;agentTab='work';nav='agents';detail=true;child=false;drawer=false;query='';render();break;case'agent-tab':agentTab=id;render();break;case'child':child=!child;render();if(child&&innerWidth<768)document.querySelector('.child-pane')?.scrollIntoView({behavior:'smooth'});break;case'turn':turnExpanded=!turnExpanded;render();break;case'source':if(conversations.find(c=>c.id===id)?.members.includes(me)){active=id;nav='chat';detail=true;draft=drafts[me+':'+id]||'';render()}else{modal='denied';renderModal()}break;case'approve':if(!perm&&conv()?.members.includes('muse')){perm={by:me,label:b.dataset.choice,status:'submitted'};toast(t('决定已接收，等待节点确认'));saveDraft();render();settlePermission()}break;case'file':modal='file';renderModal();break;case'attach':toast(t("附件上传沿用现有功能，此原型不上传文件"));break;case'mention-menu':saveDraft();mentionOpen=!mentionOpen;render();break;case'mention':draft+='@'+name(id)+' ';mentionOpen=false;render();document.getElementById('message-input')?.focus();break;case'send':send();break;case'bind':modal='bind';renderModal();break;case'save-agent':{let val=document.getElementById('agent-name').value.trim();if(!val){toast(t("请填写 Agent 名称"));break}person(agentId).name=val;person(agentId).instructions=document.getElementById('agent-role').value;toast(t("原型配置已保存"));render();break}case'offline':person('muse').online=!person('muse').online;document.getElementById('offline-toggle').textContent=person('muse').online?t("设备离线"):t("恢复设备");toast(person('muse').online?t("小王的工作站已恢复在线"):t("小王的工作站已离线"));saveDraft();render();settlePermission();break;case'reset':Object.entries(nodeProfiles).forEach(([node,profile])=>profile.alias=node);person('muse').online=true;document.getElementById('offline-toggle').textContent=t("设备离线");seed();me='chen';nav='chat';active='project';filter='all';query='';agentId='atlas';agentTab='work';detail=innerWidth>=768;drawer=false;child=false;modal=null;draft='';document.getElementById('identity').value=me;render();toast(t("演示已重置"));break}});
document.addEventListener('click',e=>{if(userMenuOpen&&!e.target.closest('.user-menu')){saveDraft();userMenuOpen=false;render()}});
document.addEventListener('input',e=>{if(e.target.id==='message-input'){draft=e.target.value;drafts[me+':'+active]=draft;resizeComposer();renderSlash()}if(e.target.id==='group-name')window.groupName=e.target.value;if(['chat-search','agent-search'].includes(e.target.id)){query=e.target.value;let id=e.target.id,pos=e.target.selectionStart;render();let input=document.getElementById(id);input.focus();try{input.setSelectionRange(pos,pos)}catch{}}if(e.target.id==='contact-search'){contactQuery=e.target.value;renderModal();document.getElementById('contact-search').focus()}});
document.addEventListener('input',e=>{const n=e.target.dataset.nodeAlias;if(!n)return;const card=e.target.closest('.node-card'),dirty=e.target.value.trim()!==nodeProfiles[n].alias;card.querySelector('[data-action="save-node"]').disabled=!dirty||!e.target.value.trim();card.querySelector('[data-node-save-status]').textContent=t(dirty?'有未保存的更改':'已保存全部更改')});
document.addEventListener('change',e=>{if(e.target.id==='review-toggle'){showReviewNotes=e.target.checked;document.body.classList.toggle('hide-review-notes',!showReviewNotes);return}if(e.target.dataset.agentOption){const a=person(agentId);if(a?.owner===me)a[e.target.dataset.agentOption]=e.target.checked;return}if(e.target.dataset.distillId){const c=conversations.find(c=>c.id===e.target.dataset.distillId);if(c&&!distillReason(c)){distillIds.has(c.id)?distillIds.delete(c.id):distillIds.add(c.id);render()}return}if(e.target.id==='distill-agent'){distillAgent=e.target.value;distillError='';renderModal()}if(e.target.name==='distill-scope'){distillScope=e.target.value;distillError='';renderModal()}if(e.target.id==='identity'){saveDraft();distillMode=false;distillIds=new Set();distillError='';me=e.target.value;active='project';nav='chat';query='';filter='all';drawer=false;modal=null;draft=drafts[me+':'+active]||'';detail=innerWidth>=768;render()}if(e.target.dataset.pref){pref(active)[e.target.dataset.pref]=e.target.checked;saveDraft();render()}});
document.addEventListener('keydown',e=>{if(e.target.id==='message-input'&&e.key==='ArrowDown'&&document.getElementById('slash-menu')){e.preventDefault();document.querySelector('#slash-menu button')?.focus();return}if(e.key==='Escape'){saveDraft();modal=null;mentionOpen=false;userMenuOpen=false;render();return}if(e.target.id==='message-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}if(e.key==='Tab'&&modal){let items=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not([tabindex="-1"]),.modal textarea,.modal select')];if(items.length){let first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
document.addEventListener('contextmenu',e=>{const row=e.target.closest('[data-action="chat"]');if(!row||distillMode)return;e.preventDefault();saveDraft();chatContext={id:row.dataset.id,x:Math.min(e.clientX,innerWidth-190),y:Math.min(e.clientY,innerHeight-60)};modal='chat-menu';renderModal()});
function messageGestureTarget(e){return !getSelection()?.toString()&&!e.target.closest('a,button,input,textarea,select,code,pre')?e.target.closest('.bubble')?.closest('[data-message-index]'):null}
document.addEventListener('contextmenu',e=>{const row=messageGestureTarget(e);if(row){e.preventDefault();openMessageMenu(row.dataset.messageIndex)}});
let holdTimer=null,holdPoint=null;
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const row=messageGestureTarget(e);if(!row)return;holdPoint={x:e.clientX,y:e.clientY};holdTimer=setTimeout(()=>{if(!getSelection()?.toString())openMessageMenu(row.dataset.messageIndex);holdTimer=null},500)});
document.addEventListener('pointermove',e=>{if(holdPoint&&Math.hypot(e.clientX-holdPoint.x,e.clientY-holdPoint.y)>10){clearTimeout(holdTimer);holdTimer=null}});
for(const event of ['pointerup','pointercancel'])document.addEventListener(event,()=>{clearTimeout(holdTimer);holdTimer=null;holdPoint=null});

document.addEventListener('click',e=>{if(modal==='chat-menu'&&!e.target.closest('.chat-context')){modal=null;renderModal()}});

render();
</script>
