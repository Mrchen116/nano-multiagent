 if(kind==='create'){out=tool({action:'create',target:'c_demo',title:value('#f-title'),description:value('#f-description'),mode:value('#f-mode'),request_key:req()});if($('#f-seed').checked){const root=out.root_node_id,mode=value('#f-mode');if(mode==='dag'){out=apply([{op:'add_task',client_ref:'A',container_id:root,title:'A 选择视频生成方案',mode:'explore'},{op:'add_task',client_ref:'B',container_id:root,title:'B 工程化选定方案'},{op:'add_task',client_ref:'C',container_id:root,title:'C 测试与试用'},{op:'add_dependency',from:'@A',to:'@B'},{op:'add_dependency',from:'@B',to:'@C'},{op:'add_task',client_ref:'X',container_id:'@A',title:'X 全生成式视频'},{op:'add_task',client_ref:'Y',container_id:'@A',title:'Y 纯模板拼装'}],'模拟：按已讨论的结构建图，未开始执行');}else{out=apply([{op:'add_task',client_ref:'X',container_id:root,title:'X 第一个候选方向'},{op:'add_task',client_ref:'Y',container_id:root,title:'Y 第二个候选方向'}],'模拟：记录初始候选方向');}}state.screen='tasks';state.scenario='';}
 if(kind==='query'){out=tool(value('#f-querymode')==='list'?{action:'list',query:value('#f-query')}:{action:'get',graph_id:g.graph_id,scope_id:state.scope});closeModal();render();openTool('logs');return;}
 if(kind==='add'){out=apply([{op:'add_task',client_ref:'new',container_id:s.id,title:value('#f-title'),description:value('#f-description'),mode:value('#f-mode'),...(value('#f-source')?{derived_from_id:value('#f-source')}:{})}],'讨论后新增节点');state.selected=out.created_refs.new;}
 if(kind==='update'){out=apply([{op:'update_task',node_id:value('#f-node'),patch:{status:value('#f-status'),result:value('#f-result')}}],value('#f-note'));state.selected=value('#f-node');}
 if(kind==='refine'){const id=value('#f-node'),m=value('#f-mode'),lines=value('#f-lines').split('\n').map(x=>x.trim()).filter(Boolean);if(!id||!lines.length)graphError('请选择未细分节点并填写内部任务','invalid_arguments');let ops=[{op:'update_task',node_id:id,patch:{mode:m}},...lines.map((t,i)=>({op:'add_task',client_ref:'step'+i,container_id:id,title:t}))];if(m==='dag')for(let i=1;i<lines.length;i++)ops.push({op:'add_dependency',from:'@step'+(i-1),to:'@step'+i});out=apply(ops,'讨论后继续细分，未启动执行');state.scope=id;state.selected=id;}
 if(kind==='relation'){out=apply(s.mode==='dag'?[{op:value('#f-operation'),from:value('#f-from'),to:value('#f-to')}]:[{op:'set_derivation',node_id:value('#f-node'),derived_from_id:value('#f-source')||null}],'按讨论调整关系');}
 if(kind==='select')out=apply([{op:'select_candidate',scope_id:s.id,node_id:value('#f-pick')||null,reason:value('#f-reason')}],'记录用户当前选择，不自动完成父任务');closeModal();persist();render();toast('模拟保存成功 · revision '+graph().revision+'；没有启动执行。');
 }catch(e){$('#formerror').innerHTML=`<div class="formerror">${esc(e.code||'invalid_arguments')}：${esc(e.message)}</div>`;}};}
$('#reset').onclick=()=>{if(confirm('重置此离线原型中的模拟修改？不会影响真实 nano。')){state=fresh();persist();render();}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(state.detailOpen){state.detailOpen=false;render();}}if(e.key==='Tab'&&$('.modal')){const els=[...$('.modal').querySelectorAll('button,input,select,textarea,[tabindex]')].filter(x=>!x.disabled);const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.nanoPrototype={getState:()=>clone(state),tool,inputApply:apply,reset:()=>{state=fresh();persist();render();},setScenario,render};
render();
</script>
</body>
</html>
