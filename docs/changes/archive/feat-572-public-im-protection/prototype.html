<style>
/* Current IM tokens, copied from frontend/src/styles/global.css. */
:root {
  --im-bg: #f7f9fb;

  --im-border-strong: #c2cfd7;
  --im-danger: #c44747;
  --im-warning: #aa6b1d;
  --im-success: #20835d;
  --im-shadow: 0 8px 24px -12px rgb(30 50 60 / 0.16);
  --im-shadow-strong: 0 18px 48px -16px rgb(30 50 60 / 0.22);

  --im-sidebar: #f5f8fa;
  --im-hover: #edf2f5;
  --im-accent-soft: #e5f3ef;
  --im-accent-border: #b9dbd2;
  --im-text-sub: #60717e;
  --im-overlay: rgb(26 43 54 / 0.24);
  --im-success-soft: #e7f5ec;
  --im-success-text: #286744;
  --im-user-bubble: #e5f3ef;
  --im-user-bubble-text: #23473e;
  --im-brand: #82b8af;
  --im-brand-mark: #193f39;
  --im-user-avatar: #d4e2df;
  --im-user-avatar-text: #355650;
  --im-group-avatar: #35464f;
  --im-group-avatar-text: #c5d8df;

  --im-font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --im-font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

:root {
  --accent:var(--im-accent); --soft:var(--im-accent-soft); --line:var(--im-border); --muted:var(--im-text-muted);
  --bg:var(--im-surface-2); --text:var(--im-text); --red:var(--im-danger);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px;
}
* { box-sizing:border-box }
body { margin:0; color:var(--text); font:14px/1.6 var(--im-font-sans); background:#fff }

.settings { display:flex; min-height:calc(100dvh - var(--chrome-height,112px)) }.settings-content { padding:32px; max-width:1000px; width:100%; min-width:0 }

.card { border:1px solid var(--line); padding:24px; border-radius:14px; background:white; margin-bottom:20px }

.link-button { color:var(--accent); border:0; padding:0; background:transparent; min-height:32px }.link-button:hover { background:transparent; text-decoration:underline }

.eyebrow { font-size:12px; color:var(--accent); letter-spacing:.8px }.badge { display:inline-block; background:var(--soft); color:var(--accent); padding:3px 9px; border-radius:5px; margin-bottom:16px; font-size:12px }

.node.active { border:2px solid var(--accent) }.node strong,.node small { display:block }.node strong { margin:12px 0 }.branch { display:grid; gap:28px }
.detail { width:275px; padding:24px; border-left:1px solid var(--line); overflow:auto }.detail h2 { margin:12px 0 }.detail h3 { color:var(--muted); font-size:12px; margin:24px 0 8px }.detail p { font-size:13px }.detail .actions { margin-top:24px }

.drawer .empty { padding:56px 8px }.drawer .empty h3 { font-size:14px; font-weight:500 }.drawer .empty p { font-size:12px }

/* Grounding: AppShell, NanoBrand, SettingsPageShell, BindConfirmPage and task-graphs.css. */
body { background:var(--im-bg) }
.top { height:48px; gap:24px; padding:0 16px; background:var(--im-topbar); color:var(--im-topbar-fg) }
.brand { display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; letter-spacing:.01em; white-space:nowrap }
.internal-badge { font-size:10px; font-weight:600; background:var(--im-surface-2); color:var(--im-text-muted); padding:2px 6px; border-radius:99px; letter-spacing:.04em }
.nav { flex:1; justify-content:center; gap:8px }.nav button { color:var(--im-text-muted); padding:4px 12px; min-height:30px; font-size:14px }.nav .selected { background:var(--im-accent-soft); color:var(--im-accent) }
.account-wrap { margin-left:0 }.primary { border:0 }.primary:hover { background:var(--im-accent-2) }
.card { background:var(--im-surface); border-radius:14px; box-shadow:var(--im-shadow) }
.settings { display:block; background:var(--im-bg) }.settings-content { margin:0 auto; max-width:1120px; padding:28px 24px }
.prototype-notes { background:#fffaf0; padding:8px 16px; border-bottom:1px solid #eee2c4; font-size:12px; color:#756345 }.prototype-notes summary { cursor:pointer; line-height:20px }.prototype-notes>div { max-width:1000px; margin-top:8px; line-height:1.8 }
.auth { grid-template-columns:minmax(0,1fr) 430px; width:min(1040px,calc(100% - 48px)); max-width:none; gap:80px; margin:0 auto; padding:56px 0 72px; min-height:calc(100dvh - var(--chrome-height,140px)) }
.auth>.card { padding:30px; border-radius:16px; box-shadow:var(--im-shadow-strong) }.auth-intro h1 { font-size:clamp(34px,4vw,50px); line-height:1.08; letter-spacing:-.045em }.auth .actions { flex-direction:column }.auth .actions>button { width:100%; min-height:40px }
.bind-page { width:min(576px,calc(100% - 40px)); margin:40px auto; padding:0 }
.bind-card { padding:28px; margin:0 }.bind-card h1 { font-size:24px; margin-bottom:24px; letter-spacing:-.4px }.bind-copy { color:var(--muted); line-height:1.8 }
.bind-device { display:flex; align-items:center; gap:12px; padding:16px; background:var(--im-surface-2); border-radius:10px; margin:20px 0 }.bind-device small { display:block; margin-top:4px }.bind-device strong { font-size:14px }
.bind-account { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:20px 0 }.bind-account strong,.bind-account small { display:block }.bind-account strong { margin-top:4px; overflow-wrap:anywhere; font-size:14px }.bind-account .link-button { flex:none; font-size:12px }
.bind-actions { display:flex; flex-direction:column; gap:8px; margin-top:24px }.bind-actions button { width:100%; min-height:44px; white-space:nowrap }.bind-actions .link-button { font-size:13px; font-weight:400 }

function menuIcon(name){return `<span class="im-user-menu-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${menuPaths[name]}</svg></span>`}
function identity(){const name=state.role==='admin'?(state.adminDisplayName||'小陈'):(state.displayName|| (state.username==='xiaolin'?'小林':state.username));return {name,initials:name.slice(0,2).toUpperCase(),id:state.role==='admin'?'u_demo_admin':'u_demo_member'}}
function languageOptions(){return `<div class="im-user-menu-language">${menuIcon('language')}<span class="im-user-menu-label grow">${t('shell.userMenu.language')}</span><span class="im-user-menu-lang-options">${btn('EN','language','',`data-locale="en" role="menuitemradio" aria-checked="${state.locale==='en'}"`)}<span class="im-user-menu-language-divider">|</span>${btn('中','language','',`data-locale="zh" role="menuitemradio" aria-checked="${state.locale==='zh'}"`)}</span></div>`}
function menuRow(page,icon,title,subtitle='',chevron=true){return btn(menuIcon(icon)+`<span class="im-user-menu-item-body"><span class="im-user-menu-label">${title}</span>${subtitle?`<small>${subtitle}</small>`:''}</span>${chevron?'<span class="im-user-menu-chevron-right" aria-hidden="true">›</span>':''}`,'nav','im-user-menu-item',`role="menuitem" data-page="${page}"`)}
function userMenu(){const u=identity();return btn(`<span class="im-user-menu-avatar">${esc(u.initials)}</span><span>${esc(u.name)}</span><span class="im-user-menu-chevron">▾</span>`,'menu','im-user-menu-trigger',`aria-haspopup="menu" aria-expanded="${state.menu}"`)+(state.menu?`<div class="im-user-menu-popover" role="menu"><div class="im-user-menu-identity"><span class="im-user-menu-avatar">${esc(u.initials)}</span><div class="grow"><strong>${esc(u.name)}</strong><small>${u.id}</small></div></div>${menuRow('account','account',t('shell.userMenu.account'),t('me.sections.accountSubtitle'),false)}${menuRow('devices','nodes',t('shell.userMenu.nodes'),`1 ${t('common.owned')} · 1 ${t('common.online')}`)}${menuRow('policies','policies',t('shell.userMenu.policies'))}${state.role==='admin'?menuRow('members','account',state.locale==='zh'?'公司成员':'Company members'):''}${languageOptions()}${btn(menuIcon('logout')+`<span class="grow">${t('shell.userMenu.signOut')}</span>`,'logout','im-user-menu-item im-user-menu-signout','role="menuitem"')}</div>`:'')}

state.policySaved={default_model:'codex_oauth:gpt-5.5',audit_level:'basic',max_turn_per_run:20,rate_limit_per_min:60,max_attachment_size_mb:20,retention_days:30};
state.policyDraft={...state.policySaved};state.policyError=false;
const policyFields=[['default_model','defaultModel'],['audit_level','auditLevel'],['max_turn_per_run','maxTurnPerRun'],['rate_limit_per_min','rateLimitPerMin'],['max_attachment_size_mb','maxAttachmentSizeMb'],['retention_days','retentionDays']];
function policyDirty(){return policyFields.some(([key])=>state.policySaved[key]!==state.policyDraft[key])}
function policyField([key,label]){const read=state.role!=='admin';return `<label>${t('settings.policies.fields.'+label)}${key==='audit_level'?`<select class="im-input" name="${key}" ${read?'disabled':''}>${options(['off','basic','strict'].map(v=>[v,t('settings.policies.fields.auditLevel'+v[0].toUpperCase()+v.slice(1))]),state.policyDraft[key])}</select>`:`<input class="im-input" name="${key}" type="${key==='default_model'?'text':'number'}" value="${esc(state.policyDraft[key])}" ${read?'readonly':''}>`}</label>`}
function policyFooter(){return state.role==='admin'?`<div class="policy-footer"><span id="policy-dirty">${policyDirty()?'● '+t('settings.policies.actions.unsavedChanges'):''}</span><div>${btn(t('settings.policies.actions.discard'),'policy-discard','im-btn im-btn-muted',`type="button" ${policyDirty()?'':'disabled'}`)}<button type="submit" class="im-btn im-btn-primary" id="policy-save" ${policyDirty()?'':'disabled'}>${t('settings.policies.actions.save')}</button></div></div>`:''}
function policies(){return `<section class="im-policies-screen"><header class="policy-mobile-head">${btn('‹','nav','','data-page="me" aria-label="Back"')}<h1>${t('settings.policies.title')}</h1></header><form class="im-policies-page" id="policy-form"><header><h1>${t('settings.policies.title')}</h1><p>${t('settings.policies.subtitle')}</p></header>${state.role==='admin'?'':`<p class="policy-readonly">${state.locale==='zh'?'只读 · 由公司管理员修改':'Read only · Managed by company administrators'}</p>`}${state.policyError?`<div class="policy-error" role="alert">${t('settings.policies.actions.saveFailed').replace('{{detail}}',state.locale==='zh'?'网络连接失败，请重试。':'Connection failed. Please retry.')}</div>`:''}<section class="policy-card">${policyFields.slice(0,2).map(policyField).join('')}</section><section class="policy-card policy-runtime">${policyFields.slice(2).map(policyField).join('')}</section>${policyFooter()}${storageStatus()}</form></section>`}
function wirePolicy(){const form=$('#policy-form');if(!form)return;form.addEventListener('input',e=>{if(state.role!=='admin'||!e.target.name)return;state.policyDraft[e.target.name]=e.target.type==='number'?Number(e.target.value):e.target.value;$('#policy-dirty').textContent=policyDirty()?'● '+t('settings.policies.actions.unsavedChanges'):'';form.querySelectorAll('.policy-footer button').forEach(b=>b.disabled=!policyDirty())});form.addEventListener('submit',e=>{e.preventDefault();if(state.role!=='admin'||!policyDirty())return;if(state.failNextPolicy){state.failNextPolicy=false;state.policyError=true}else{state.policySaved={...state.policyDraft};state.policyError=false}render()})}

function chrome(){const auth=['login','register','pending','suspended'].includes(state.page);$('#nav').innerHTML=auth?'':['chat','tasks','agents'].map((p,i)=>btn(['Chat','Tasks','Agents'][i],'nav',state.page===p?'selected':'',`data-page="${p}"`)).join('');$('#bottom').innerHTML=auth||state.page==='chat'&&!state.mobileList?'':['chat','tasks','agents','me'].map((p,i)=>btn(mobileIcons[p]+'<span>'+['Chat','Tasks','Agents','Me'][i]+'</span>','nav',state.page===p?'selected':'',`data-page="${p}"`)).join('');$('#bottom').classList.toggle('hidden',auth||state.page==='chat'&&!state.mobileList);$('#account').innerHTML=auth?'<small>中文</small>':userMenu();
let controls='';if(state.page==='chat')controls=`<label for="upload-mode">上传结果</label><select id="upload-mode">${options([['quota','账号空间已满'],['service','服务存储已满'],['large','单文件过大'],['network','网络失败'],['rate','上传频率限制'],['type','格式不支持'],['success','正常上传']],state.attachmentMode)}</select>${btn('演示：消息发送失败','simulate-send-failure')+btn('演示：上传冷却结束','end-upload-cooldown')}`;
else if(['me','account','members','devices','policies','agents'].includes(state.page))controls=`<label for="role">演示身份</label><select id="role">${options([['member','普通成员'],['admin','公司管理员']],state.role)}</select>${state.page==='members'?btn('演示：下一次操作失败','member-error'):state.page==='policies'&&state.role==='admin'?btn('演示：保存失败','policy-error'):''}`;
else if(state.page==='tasks')controls=`<label for="task-state">列表状态</label><select id="task-state">${options([['loaded','正常'],['empty','空列表'],['error','加载失败']],state.taskState)}</select>`;
else if(['login','register'].includes(state.page))controls=`<label for="login-mode">提交结果</label><select id="login-mode">${options([['normal','正常'],['cooldown','暂时冷却'],['invalid','凭据错误']],state.loginMode)}</select>`;
else if(state.page==='pending')controls=btn('演示：管理员已批准','grant');
else if(state.page==='bind')controls=`<label for="bind-state">状态</label><select id="bind-state">${options([['account','网页接收'],['local','等待本机'],['done','交接完成'],['expired','链接过期'],['interrupted','本机中断']],state.bind)}</select>${state.bind==='local'?btn('模拟本机确认','bind-complete'):state.bind==='interrupted'?btn('模拟本机恢复','bind-resume'):''}`;
if(state.page==='policies'&&state.role==='admin')controls+=`<label for="storage-state">容量状态</label><select id="storage-state">${options([['normal','正常'],['quota','账号额度已满'],['service','服务容量已满']],state.storageAlert||'normal')}</select>`;
$('#demo-state').innerHTML=controls;$('#journey').value=['chat','tasks','members','devices','policies','me','bind','login','pending','suspended'].includes(state.page)?state.page:state.page==='register'?'login':state.page==='bind'?'devices':'chat'}
function fileCard(file){const failures={quota:'暂时无法上传附件。',service:'暂时无法上传附件。',large:'文件超过当前单文件上限。请选择较小的文件。',network:'网络中断，文件未上传。可以重试。',rate:file.cooldownDone?'现在可以重试上传。':'上传过于频繁，请在 30 秒后重试。',type:'不支持此文件格式。请更换文件。'};const fail=file.status!=='success';return `<div class="file-chip ${fail?'failed':''}" data-file="${file.id}"><div class="chip-top"><strong>▧ ${esc(file.name)}</strong>${btn('×','remove-file','',`data-id="${file.id}" aria-label="移除 ${esc(file.name)}"`)}</div><small>${fail?'未上传':'已上传 · 待发送'}</small>${fail?`<p role="alert">${failures[file.status]}</p>`:''}${file.status==='network'?btn('重试上传','retry-file','',`data-id="${file.id}"`):file.status==='rate'?btn(file.cooldownDone?'重试上传':'30 秒后可重试','retry-file','',`data-id="${file.id}" ${file.cooldownDone?'':'disabled'}`):''}</div>`}
function chat(){const c=chats[state.chat];const history=state.messages[state.chat].map(m=>`<div class="message self"><span class="avatar">林</span><div><small>小林 · 刚刚</small><div class="bubble">${esc(m.text)}${m.files.map(f=>`<div class="file-in-message">▧ ${esc(f.name)}<small>已发送</small></div>`).join('')}</div></div></div>`).join('');return `<div class="workspace ${state.mobileList?'chat-list':''}"><aside class="rail"><h2>Chat</h2><p class="muted">群聊</p>${Object.entries(chats).map(([id,g])=>btn(`<strong>${g.title}</strong><small>${g.subtitle}</small>`,'open-chat',`row-button ${state.chat===id?'active':''}`,`data-chat="${id}"`)).join('')}</aside><section class="chat-main"><header class="pane-head">${btn('‹','chat-list','mobile-back','aria-label="返回聊天列表"')}<div><h1>${c.title}</h1><small>${c.subtitle}</small></div>${btn('任务','group-tasks','push','aria-label="查看本群任务"')}${btn('•••','group-info','', 'aria-label="群信息"')}</header><div class="messages"><div class="message"><span class="avatar">林</span><div><small>小林 · 14:12</small><div class="bubble">${c.text}</div></div></div><div class="message"><span class="avatar agent">Agent</span><div><small>${state.chat==='design'?'设计':'开发'} Agent · 14:13</small><div class="bubble">${state.chat==='delivery'?'收到，我先检查鉴权和附件接口，再更新联调进展。':state.chat==='planning'?'计划已记录，我会先跟进接口联调。':'好的，我们先把思路讨论清楚。'}</div></div></div>${history}</div><section class="composer" aria-label="消息输入区">${state.sendFailures[state.chat]?`<p class="inline-error" role="alert">发送失败，请重试。</p>`:''}<div class="chips">${state.files.filter(f=>f.chat===state.chat).map(fileCard).join('')}</div><textarea id="draft" aria-label="消息草稿" placeholder="发送消息，@ Agent 交办任务">${esc(state.drafts[state.chat])}</textarea><div class="composer-actions">${btn('＋ 附件','add-file','', 'aria-label="添加示例附件"')}<small>拖入或粘贴文件</small>${btn(state.sendFailures[state.chat]?'重试发送':'发送','send','primary',state.files.some(f=>f.chat===state.chat&&f.status!=='success')?'disabled':'')}</div>${state.files.some(f=>f.chat===state.chat&&f.status!=='success')?`<div class="actions">${btn('仅发送文字','send-text','',state.drafts[state.chat].trim()?'':'disabled')}<small>附件保留在草稿中，不随本次文字发送。</small></div>`:''}</section></section>${state.drawer?groupTasks():''}</div>`}
function groupTasks(){const c=chats[state.chat];const closeIcon='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>';return `<aside class="drawer" aria-label="本群任务"><div class="drawer-head"><h2>任务</h2>${btn(closeIcon,'close-drawer','icon-button','aria-label="关闭任务面板" title="关闭"')}</div><div class="group-task-list">${c.tasks.length?c.tasks.map(id=>btn(`<span class="task-row-heading"><strong>${nodes[id].title}</strong><svg class="task-row-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span>${id==='n1'?'':'<span class="task-row-parent">上线客户服务系统</span>'}<span class="task-row-meta"><span class="task-status ${nodes[id].status==='进行中'?'in-progress':''}">${nodes[id].status}</span><span>今天 14:20</span></span>`,'open-group-task','task-item',`data-node="${id}"`)).join(''):'<div class="empty"><h3>暂无任务</h3><p>在群里请 Agent 创建或更新任务。</p></div>'}</div></aside>`}

function taskPage(){const graph=state.graph==='service',n=nodes[state.node];const graphs=[['service','上线客户服务系统','进行中 · 3 个节点'],['private','整理客户访谈','待开始 · 1 个节点']].filter(([,title])=>title.includes(state.search));return `<div class="workspace tasks"><aside class="rail"><h2>Tasks</h2><p class="muted">公司全部任务</p><input id="task-search" aria-label="搜索公司任务" placeholder="搜索目标名称" value="${esc(state.search)}">${state.taskState==='loaded'?graphs.map(([id,title,sub])=>btn(`<strong>${title}</strong><small>${sub}</small>`,'select-graph',`row-button ${state.graph===id?'active':''}`,`data-graph="${id}"`)).join(''):''}${!graphs.length&&state.taskState==='loaded'?'<p>没有匹配的任务</p>':''}</aside><section class="task-main"><header class="pane-head"><div><h1>${state.taskState==='loaded'?(graph?'上线客户服务系统':'整理客户访谈'):'Tasks'}</h1></div>${state.taskOrigin?btn(`返回${chats[state.taskOrigin].title}`,'return-origin','push'):''}</header>${state.taskState!=='loaded'?`<div class="empty"><h2>${state.taskState==='error'?'暂时无法加载任务':'公司还没有任务'}</h2><p>${state.taskState==='error'?'请稍后重试。':'在任意聊天中请 Agent 创建任务后，可在这里查看。'}</p>${btn(state.taskState==='error'?'重新加载':'去聊天',state.taskState==='error'?'retry-tasks':'nav','',state.taskState==='error'?'':'data-page="chat"')}</div>`:`<div class="task-body"><div class="canvas"><p class="muted">${graph?'总目标 / 交付计划':'总目标'}</p><div class="graph">${graph?`${nodeButton('n1')}<div class="branch">${nodeButton('n2')}${nodeButton('n3')}</div>`:'<div class="node active"><small>n1 · 待开始</small><strong>整理客户访谈</strong><small>公司共享</small></div>'}</div></div><aside class="detail"><span class="tag">${graph?state.node:'n1'} · ${graph?n.status:'待开始'}</span><h2 style="margin-top:14px">${graph?n.title:'整理客户访谈'}</h2><p>${graph?n.body:'汇总访谈结论，整理下一步改进方向。'}</p><h3>最近修改</h3><p>${graph?n.agent:'研究 Agent'} · 今天 14:20</p><h3>来源聊天</h3>${graph?`${btn(chats[n.source].title+' ↗','source-chat','link-button',`data-chat="${n.source}"`)}`:'<p class="muted">受保护的来源聊天</p>'}<div class="actions">${btn('复制任务引用','copy-reference')}${graph?btn('回聊天讨论','discuss','primary'):''}</div></aside></div>`}</section></div>`}
function nodeButton(id){const n=nodes[id];return btn(`<small>${id} · ${n.status}</small><strong>${n.title}</strong><small>${state.taskOrigin&&chats[state.taskOrigin].tasks.includes(id)?'来自刚才群聊的任务活动':'公司共享'}</small>`,'select-node',`node ${state.node===id?'active':''}`,`data-node="${id}"`)}
function settings(content){return `<div class="settings"><section class="settings-content">${state.page==='me'?'':btn('‹ 返回','nav','mobile-back','data-page="me"')}${content}</section></div>`}

function me(){const u=identity();return `<section class="im-me-page">${btn(`<span class="profile-avatar">${esc(u.initials)}</span><span class="grow"><strong>${esc(u.name)}</strong><small>${u.id}</small></span><span class="im-user-menu-chevron-right">›</span>`,'nav','im-me-identity','data-page="account"')}<div class="im-me-group">${menuRow('devices','nodes',t('shell.userMenu.nodes'),`1 ${t('common.owned')} · 1 ${t('common.online')}`)}</div><div class="im-me-group">${menuRow('account','account',t('shell.userMenu.account'),t('me.sections.accountSubtitle'))}</div><div class="im-me-group">${menuRow('policies','policies',t('shell.userMenu.policies'))}</div>${state.role==='admin'?`<div class="im-me-group">${menuRow('members','account',state.locale==='zh'?'公司成员':'Company members')}</div>`:''}<div class="im-me-group">${languageOptions()}</div><div class="im-me-group">${btn(menuIcon('logout')+t('shell.userMenu.signOut'),'logout','im-user-menu-item im-user-menu-signout')}</div></section>`}
function account(){const u=identity();return `<section class="im-policies-screen"><header class="policy-mobile-head">${btn('‹','nav','','data-page="me" aria-label="Back"')}<h1>${t('settings.account.title')}</h1></header><form class="im-policies-page" id="account-form"><header><h1>${t('settings.account.title')}</h1><p>${t('settings.account.subtitle')}</p></header><section class="policy-card"><header><h2 class="profile-card-title">${t('settings.account.identity.heading')}</h2><p class="profile-card-subtitle">${t('settings.account.identity.subtitle')}</p></header><div class="profile-identity"><span class="profile-avatar">${esc(u.initials)}</span><div><strong>${esc(u.name)}</strong><small>${u.id}</small></div></div><div class="profile-grid"><label>${t('settings.account.identity.userId')}<input class="im-input" value="${u.id}" disabled></label><label>${t('settings.account.identity.displayName')}<input id="display-name" class="im-input" value="${esc(u.name)}" required minlength="1"></label></div></section><section class="policy-card"><header><h2 class="profile-card-title">${t('settings.account.defaults.heading')}</h2><p class="profile-card-subtitle">${t('settings.account.defaults.subtitle')}</p></header><div class="profile-device"><span class="tag">online</span><span class="grow"><strong>小林的笔记本</strong><small>node_demo</small></span><small>1 agent<br>v0.1.0</small></div><div class="profile-count"><span>${t('settings.account.defaults.ownedNodes')}</span><strong>1</strong></div></section><div class="policy-footer"><span id="account-dirty"></span><div>${btn(t('settings.account.actions.discard'),'account-discard','im-btn im-btn-muted','type="button" disabled')}<button class="im-btn im-btn-primary" type="submit" disabled>${t('settings.account.actions.saveAccount')}</button></div></div></form></section>`}
function wireAccount(){const form=$('#account-form');if(!form)return;$('#display-name').addEventListener('input',e=>{const dirty=e.target.value!==identity().name;$('#account-dirty').textContent=dirty?'● '+t('settings.account.actions.unsavedChanges'):'';form.querySelectorAll('.policy-footer button').forEach(b=>b.disabled=!dirty)});form.addEventListener('submit',e=>{e.preventDefault();const name=$('#display-name').value.trim();if(!name)return;if(state.role==='admin')state.adminDisplayName=name;else state.displayName=name;render()})}

function members(){if(state.role!=='admin')return settings('<h1>公司成员管理</h1><div class="notice">仅公司管理员可使用此入口。</div>');return settings(`<h1>公司成员</h1><p class="muted">批准同事加入，或停止其公司访问。</p>${state.memberError?'<div class="inline-error" role="alert">操作未成功，请重试。</div>':''}<section class="card"><h2>待批准 <span class="tag">${state.approved?0:1}</span></h2>${state.approved?'<p class="muted">暂时没有待批准的成员。</p>':`<div class="member"><span class="avatar">林</span><div class="grow"><strong>小林</strong><small>xiaolin · 刚刚注册</small></div>${btn('批准加入','approve','primary')}</div>`}</section><section class="card"><h2>公司成员</h2><div class="member"><span class="avatar">陈</span><div class="grow"><strong>你</strong><small>公司管理员</small></div><span class="tag">正常</span></div><div class="member"><span class="avatar">王</span><div class="grow"><strong>小王</strong><small>设计室共享电脑 · 2 个 Agent</small></div>${state.stopped?'<span class="tag">已停用</span>':btn('停用','suspend-dialog','danger')}</div>${state.approved?'<div class="member"><span class="avatar">林</span><div class="grow"><strong>小林</strong><small>公司成员</small></div><span class="tag">正常</span></div>':''}</section>`)}
function devices(){return settings(`<h1>设备</h1><div class="device-kpis">${[['1','设备'],['1','在线'],['0','离线'],[state.bindingCommitted?'2':'1','Agent']].map(([n,t])=>`<div><strong>${n}</strong><small>${t}</small></div>`).join('')}</div><section class="device-card"><header><span class="avatar">▣</span><div class="grow"><h2>${state.bindingCommitted?'设计室共享电脑':'小林的笔记本'}</h2><small>${state.bindingCommitted?'node_studio':'node_laptop'}</small></div><span class="tag">在线</span></header><div class="device-facts"><div><small>管理者</small><strong>${esc(state.username)}</strong></div><div><small>Agent</small><strong>${state.bindingCommitted?'开发 Agent、设计 Agent':'助手 Agent'}</strong></div></div></section>`)}
function bind(){const receiver=esc(state.username==='xiaolin'?'小林 · xiaolin':state.username);const pages={account:{title:'接收设备',body:`<div class="bind-device"><span class="avatar">▣</span><div><strong>设计室共享电脑</strong><small>开发 Agent · 设计 Agent</small></div></div><div class="bind-account"><div><small>接收账号</small><strong>${receiver}</strong></div>${btn('切换账号','bind-login','link-button')}</div><div class="warning">确认后，小王将失去此设备及全部 Agent 的管理权。配置和工作记录保留，私人聊天权限不移交。</div><div class="bind-actions">${btn('确认接收','bind-accept','primary')}${btn('取消','bind-cancel','link-button')}</div>`},local:{title:'等待电脑确认',body:`<p class="bind-copy">请回到设计室共享电脑，在终端核对并确认交接。</p><div class="bind-device"><span class="avatar">▣</span><div><strong>设计室共享电脑</strong><small>接收账号：${receiver}</small></div></div><p class="muted">完成后此页会自动更新。</p><div class="bind-actions">${btn('取消交接','bind-cancel','link-button')}</div>`},done:{title:'交接完成',body:`<p class="bind-copy">你现在可以管理这台设备及其全部 Agent。</p><div class="bind-device"><span class="avatar">▣</span><div><strong>设计室共享电脑</strong><small>管理者：${receiver}</small></div></div><div class="bind-actions">${btn('查看设备','nav','primary','data-page="devices"')}</div>`},expired:{title:'链接已过期',body:`<p class="bind-copy">请在原电脑重新发起交接，使用新的确认链接。</p><div class="bind-actions">${btn('返回设备','nav','','data-page="devices"')}</div>`},interrupted:{title:'等待电脑恢复连接',body:`<p class="bind-copy">请在原电脑恢复这次交接。连接恢复后，此页会继续更新结果。</p><div class="notice">当前结果尚未确认，请勿重复发起交接。</div>`}};const current=pages[state.bind]||pages.account;return `<section class="bind-page"><div class="card bind-card"><h1>${current.title}</h1>${current.body}</div></section>`}

function auth(){const page=state.page;const stopped=page==='suspended',pending=page==='pending',reg=page==='register';return `<div class="auth"><section class="auth-intro"><p class="eyebrow">PEOPLE · AGENTS · DEVICES</p><h1>让人与 Agent<br>在一起工作。</h1><p class="muted">连接团队、任务与每个人的电脑。</p></section><section class="card">${pending||stopped?`<span class="badge">${stopped?'公司访问已停止':'注册成功'}</span><h2>${stopped?'账号已停用':'等待管理员批准'}</h2><p>${stopped?'请联系公司管理员了解情况。':'管理员批准加入后，即可与同事和 Agent 一起工作。'}</p>${stopped?'<div class="warning">你管理的 Gateway 和 Agent 也已停止接入公司。记录与配置保留。</div>':''}<p class="muted">当前账号：${esc(state.username)}</p><div class="actions">${btn('刷新状态','refresh-membership','primary')}${btn('退出登录','logout')}</div>`:`<h2>${reg?'创建 Nano IM 账号':'登录 Nano IM'}</h2>${state.returnToBind?'<p class="notice">登录有效公司账号后继续设备交接。</p>':''}<form id="auth-form" ${state.loginMode!=='normal'?'aria-describedby="auth-feedback"':''}><div class="form-field"><label for="username">用户名</label><input id="username" autocomplete="username" required value="${esc(state.username)}"></div><div class="form-field"><label for="password">密码</label><input id="password" type="password" autocomplete="${reg?'new-password':'current-password'}" required value="${esc(state.password)}"></div>${state.loginMode==='cooldown'?'<p id="auth-feedback" class="form-feedback form-cooldown" role="alert">尝试次数较多，请在 3 分钟后重试。</p>':state.loginMode==='invalid'?'<p id="auth-feedback" class="form-feedback form-error" role="alert">用户名或密码不正确。</p>':''}<button type="submit" class="primary" ${state.loginMode==='cooldown'?'disabled':''}>${state.loginMode==='cooldown'?'稍后重试':reg?'注册':'登录'}</button></form><div class="auth-switch">${btn(reg?'已有账号，去登录':'没有账号？注册','nav','link-button',`data-page="${reg?'login':'register'}"`)}</div>${reg?'<p class="foot">注册后需要公司管理员批准。</p>':''}`}</section></div>`}
function renderScope(){const scope={
chat:['沿用聊天页；新增群内任务入口与附件异常反馈。','聊天布局和发送能力沿用现有 IM。示例群、消息和文件只是演示数据；黄色区域可模拟上传结果，不会进入产品。'],
tasks:['沿用 Tasks；仅扩大公司可见范围并承接群内跳转。','保留现有图层级、节点详情、搜索与引用。此处简化示例图，不要求据此重做整个任务页。'],
devices:['设备页沿用现有产品，不新增交接教程卡片。','此处只示意设备归属结果；现有别名编辑、状态、保存和创建 Agent 功能继续保留。交接从目标电脑本机发起；请在黄色旅程菜单选择“设备交接”查看新增网页，不把演示菜单当产品入口。'],
bind:['本次新增：接收账号确认、等待本机、交接结果。','真实前置路径：在目标电脑发起换绑 → 打开一次性链接 → 登录接收账号 → 网页确认 → 回原电脑终端确认。黄色状态菜单和模拟本机按钮仅用于演示；产品里没有远程“本机确认”按钮。'],
members:['本次新增：管理员批准及停用成员。','入口沿用桌面头像菜单、手机 Me；普通成员不显示该入口。页面复用现有独立设置页风格，不新建二级设置侧栏。'],
login:['沿用现有登录页；增量为冷却反馈。','品牌、认证框架与表单采用当前 IM 的样式基准；演示身份和提交结果不进入产品。'],
register:['沿用注册页；新增注册后的等待批准状态。','注册正常开放，不引入邀请制或外部账号登录。'],
pending:['本次新增：等待批准状态。','只显示本人状态，批准后进入原目标；模拟批准按钮属于演示控制。'],
suspended:['本次新增：停用状态。','只显示本人状态与接入影响，不泄漏公司内容。'],
policies:['保留现有策略表单；增加编辑权限与管理员容量告警。','六个字段、两张配置卡片、保存与放弃均沿用当前 PoliciesPage。这里显示演示数值，保存只影响原型。普通成员只读；新增存储状态仅管理员可见。'],
agents:['沿用 Agents，当前仅示意协作入口。','保留现有 Agent 列表、配置和 Work；此示例卡片不是整页替换方案。'],
account:['保留现有账号页。','沿用 AccountPage 的资料、设备卡片与保存操作；示例账号和设备仅用于演示。'],
me:['沿用账号 / Me 入口；管理员增加公司成员项。','桌面使用现有头像菜单，手机使用 Me，不新增设置二级导航。']};const [summary,detail]=scope[state.page]||scope.chat;$('#scope-summary').textContent='实施范围 · '+summary;$('#scope-detail').textContent=detail;}
function render(){document.body.dataset.screen=['login','register','pending','suspended'].includes(state.page)?'auth':'app';chrome();renderScope();app.innerHTML=state.page==='chat'?chat():state.page==='tasks'?taskPage():state.page==='me'?me():state.page==='account'?account():state.page==='members'?members():state.page==='devices'?devices():state.page==='bind'?bind():state.page==='agents'?settings(`<h1>Agents</h1><div class="card"><h2>开发 Agent</h2><p>设计室共享电脑 · 管理者：${state.bindingCommitted?esc(state.username):'小王'}</p>${btn('进入协作群','open-chat','','data-chat="delivery"')}</div>`):state.page==='policies'?policies():auth();wireInputs()}
function modal(body){$('#modal').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="操作确认">${body}</section></div>`;$('#modal button')?.focus()}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#modal').textContent){$('#modal').innerHTML='';return}if(state.drawer){state.drawer=false;render();document.querySelector('[data-action="group-tasks"]')?.focus()}else if(state.menu){state.menu=false;render();document.querySelector('[data-action="menu"]')?.focus()}});
let fileSeq=0;
function recordStorageAlert(status){if(['quota','service'].includes(status))state.storageAlert=status}
function storageStatus(){return state.role==='admin'?`<div class="card"><h2>附件存储状态</h2>${state.storageAlert?`<div class="warning" role="alert">${state.storageAlert==='service'?'服务附件容量已达上限':'小林的附件累计额度已达上限'}，相关新上传已暂停。文字聊天可继续。</div><p class="muted">${state.storageAlert==='service'?'服务附件用量：10 GiB / 10 GiB':'小林（xiaolin）附件用量：1 GiB / 1 GiB'}</p><p>请检查附件存储用量并处理容量限制。恢复容量后，上传自动恢复。</p>`:'<p>容量正常，没有待处理的容量告警。</p>'}</div>`:''}
function action(a,el){if(a==='nav'){if(el.dataset.page==='tasks'){state.taskOrigin=null;state.taskState='loaded'}go(el.dataset.page)}
else if(a==='account-discard'){render()}
else if(a==='language'){state.locale=el.dataset.locale;document.documentElement.lang=state.locale;state.menu=false;render()}
else if(a==='policy-discard'){state.policyDraft={...state.policySaved};state.policyError=false;render()}
else if(a==='policy-error'){state.failNextPolicy=true;toast('演示已设置：下一次保存失败，保留修改')}
else if(a==='menu'){state.menu=!state.menu;render()}else if(a==='logout'){state.returnToBind=false;state.password='';go('login')}
else if(a==='open-chat'){state.chat=el.dataset.chat;go('chat')}else if(a==='chat-list'){state.mobileList=true;render()}else if(a==='group-tasks'){state.drawer=true;render()}else if(a==='close-drawer'){state.drawer=false;render()}
else if(a==='group-info')modal(`<h2>${chats[state.chat].title}</h2><p>${chats[state.chat].subtitle}</p>${btn('关闭','close-modal')}`)
else if(a==='add-file'){recordStorageAlert(state.attachmentMode);state.files.push({id:++fileSeq,name:'接口说明.pdf',status:state.attachmentMode,chat:state.chat});render()}
else if(a==='remove-file'){state.files=state.files.filter(f=>f.id!==Number(el.dataset.id));render()}
else if(a==='retry-file'){recordStorageAlert(state.attachmentMode);state.files.find(f=>f.id===Number(el.dataset.id)).status=state.attachmentMode;render()}
else if(a==='end-upload-cooldown'){state.files.forEach(f=>{if(f.status==='rate')f.cooldownDone=true});render()}
else if(a==='simulate-send-failure'){state.failNextSend=true;toast('演示已设置：下一次发送失败，草稿将保留')}
else if(a==='send'||a==='send-text'){const textOnly=a==='send-text';if(textOnly&&!state.drafts[state.chat].trim())return;if(!textOnly&&state.files.some(f=>f.chat===state.chat&&f.status!=='success'))return;if(!state.drafts[state.chat].trim()&&!state.files.some(f=>f.chat===state.chat))return;if(state.failNextSend){state.failNextSend=false;state.sendFailures[state.chat]=true;render();return}state.messages[state.chat].push({text:state.drafts[state.chat],files:textOnly?[]:state.files.filter(f=>f.chat===state.chat)});if(!textOnly)state.files=state.files.filter(f=>f.chat!==state.chat);state.drafts[state.chat]='';state.sendFailures[state.chat]=false;render()}
else if(a==='open-group-task'){state.taskOrigin=state.chat;state.node=el.dataset.node;state.graph='service';state.taskState='loaded';go('tasks')}
else if(a==='return-origin'){state.chat=state.taskOrigin;go('chat');state.drawer=true;render()}
else if(a==='select-node'){state.node=el.dataset.node;render()}else if(a==='select-graph'){state.graph=el.dataset.graph;state.node='n1';render()}else if(a==='retry-tasks'){state.taskState='loaded';render()}
else if(a==='source-chat'||a==='discuss'){const c=a==='source-chat'?el.dataset.chat:nodes[state.node].source;if(a==='discuss')state.drafts[c]+=`${state.drafts[c]?'\n':''}[任务：${nodes[state.node].title}](tg_demo#${state.node})\n`;state.chat=c;go('chat')}
else if(a==='copy-reference'){modal(`<h2>任务引用</h2><input class="full" aria-label="任务引用" readonly value="${state.graph==='service'?'tg_demo#'+state.node:'tg_research#n1'}"><p class="muted">在聊天中发送给 Agent，继续讨论。</p>${btn('关闭','close-modal')}`);$('#modal input').select()}
else if(a==='member-error'){state.failNextMember=true;toast('演示已设置：下一次成员操作失败')}
else if(a==='approve'||a==='suspend-confirm'){if(state.failNextMember){state.failNextMember=false;state.memberError=true;$('#modal').innerHTML='';render();return}state.memberError=false;if(a==='approve')state.approved=true;else state.stopped=true;$('#modal').innerHTML='';render();toast(a==='approve'?'已批准小林加入公司':'小王及其设备已停止公司接入')}
else if(a==='suspend-dialog')modal(`<h2>停用小王？</h2><p>小王将不能进入公司 IM，其管理的设备和 Agent 也会停止接入公司。</p><div class="warning">设计室共享电脑 · 开发 Agent、设计 Agent<br>其他同事也将暂时无法使用这些 Agent。</div><p>历史、任务与配置保留，不会关闭电脑。</p><div class="actions">${btn('取消','close-modal')}${btn('确认停用','suspend-confirm','danger')}</div>`)
else if(a==='close-modal')$('#modal').innerHTML='';
else if(a==='transfer-guide'){state.bind='account';go('bind')}else if(a==='bind-account'){state.bind='account';render()}else if(a==='bind-accept'){state.bind='local';render()}else if(a==='bind-login'){state.returnToBind=true;state.loginMode='normal';state.password='';go('login')}
else if(a==='bind-cancel'){state.bind='account';state.returnToBind=false;go('devices');toast('已取消交接，原归属保持')}
else if(a==='bind-complete'||a==='bind-resume'){state.bind='done';state.bindingCommitted=true;state.returnToBind=false;render()}else if(a==='bind-expire'){state.bind='expired';render()}else if(a==='bind-interrupt'){state.bind='interrupted';render()}
else if(a==='grant'){state.approved=true;toast('演示：管理员已批准，点击刷新状态继续')}
else if(a==='refresh-membership'){if(state.page==='pending'&&state.approved){if(state.returnToBind){state.bind='account';go('bind')}else go('chat')}else toast(state.page==='pending'?'仍在等待批准':'账号仍处于停用状态')}
}
document.addEventListener('click',e=>{if(state.menu&&!e.target.closest('.account-wrap')){state.menu=false;render()}const el=e.target.closest('[data-action]');if(el&&!el.disabled)action(el.dataset.action,el)});
function wireInputs(){wirePolicy();wireAccount();$('#storage-state')?.addEventListener('change',e=>{state.storageAlert=e.target.value==='normal'?null:e.target.value;render()});$('#bind-state')?.addEventListener('change',e=>{state.bind=e.target.value;render()});$('#draft')?.addEventListener('input',e=>{state.drafts[state.chat]=e.target.value;const sendText=document.querySelector('[data-action="send-text"]');if(sendText)sendText.disabled=!e.target.value.trim()});$('#task-search')?.addEventListener('change',e=>{state.search=e.target.value;render()});$('#username')?.addEventListener('input',e=>state.username=e.target.value);$('#password')?.addEventListener('input',e=>state.password=e.target.value);$('#auth-form')?.addEventListener('submit',e=>{e.preventDefault();if(state.loginMode!=='normal')return;state.role='member';if(state.page==='register'){state.approved=false;go('pending')}else if(state.returnToBind){state.bind='account';go('bind')}else go('chat')});$('#upload-mode')?.addEventListener('change',e=>state.attachmentMode=e.target.value);$('#role')?.addEventListener('change',e=>{state.role=e.target.value;state.policyDraft={...state.policySaved};state.policyError=false;if(state.role==='member'&&state.page==='members')go('me');else render()});$('#task-state')?.addEventListener('change',e=>{state.taskState=e.target.value;render()});$('#login-mode')?.addEventListener('change',e=>{state.loginMode=e.target.value;render()})}
$('#journey').addEventListener('change',e=>{if(e.target.value==='members')state.role='admin';if(e.target.value==='bind')state.bind='account';if(e.target.value==='tasks'){state.taskOrigin=null;state.taskState='loaded'}go(e.target.value)});
render();
function measureChrome(){const height=Array.from(document.querySelectorAll('.demo,.prototype-notes,.top')).reduce((sum,e)=>sum+e.getBoundingClientRect().height,0);document.documentElement.style.setProperty('--chrome-height',height+'px')}
if(typeof ResizeObserver!=='undefined'){const observer=new ResizeObserver(measureChrome);document.querySelectorAll('.demo,.prototype-notes,.top').forEach(e=>observer.observe(e))}
