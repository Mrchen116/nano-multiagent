<aside><h1>Nano IM · 原生视觉重设计</h1><p>继承 Web 的深色正文、白色内容与克制青绿。重新安排手机的层级、密度和主操作。以下为设计演示，HTML 与示例数据不是 App 验收证据。</p><label>演示状态 <select id="state"><option value="normal">正常</option><option value="offline">离线</option><option value="conflict">保存冲突</option><option value="pending">等待确认</option></select></label><label>身份 <select id="role"><option value="admin">Owner / 管理员</option><option value="member">普通成员 / 非 Owner</option></select></label><label>宽度 <select id="width"><option>430</option><option>390</option><option>600</option></select></label></aside>
<div id="device"><div class="status"><span>9:41</span><span>▮▮▮　Wi-Fi　▰</span></div><header id="head"></header><main id="main"></main><div id="compose"></div><nav id="nav"></nav><div class="homebar"></div><div id="toast" role="status"></div></div><dialog id="dialog"></dialog>
<script>
const $=id=>document.getElementById(id);let stack=['chat'],tab='chat',draft='',approved=false;const admin=()=>$('role').value==='admin',mode=()=>$('state').value;
const button=(s,a,cl='')=>`<button class="${cl}" onclick="${a.replaceAll('&','&amp;').replaceAll('"','&quot;')}">${s}</button>`;
const row=(name,sub,to,icon='◇')=>`<button class="row" onclick="go('${to}')"><span class="avatar">${icon}</span><span class="text"><strong>${name}</strong><small>${sub}</small></span><span class="chev">›</span></button>`;
const card=s=>`<section class="card">${s}</section>`,pad=s=>card(`<div class="pad">${s}</div>`),note=(s,w=false)=>`<div class="note ${w?'warn':''}">${s}</div>`;
const field=(name,value='',type='text')=>`<label class="field">${name}${type==='area'?`<textarea>${value}</textarea>`:`<input type="${type}" value="${value}">`}</label>`;
const select=(name,values)=>`<label class="field">${name}<select>${values.split('|').map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const toggle=(name,checked=true)=>`<label class="toggle">${name}<input type="checkbox" ${checked?'checked':''}></label>`;
const save=()=>button('保存',"saveForm()",'primary');const info=()=>mode()==='offline'?note('连接中断。显示最后已知内容；恢复连接后更新。',true):'';
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
function confirmAction(title,desc,yes,action){$('dialog').innerHTML=`<h2>${title}</h2><p>${desc}</p><div class="toolbar">${button('取消',"$('dialog').close()")} ${button(yes,`$('dialog').close();${action}`,'danger')}</div>`;$('dialog').showModal()}
function saveForm(){if(mode()==='conflict'){toast('其他设备已更新。草稿已保留，请重读并核对。');return}if(mode()==='offline'){toast('未能连接，未确认保存。草稿保留。');return}toast(mode()==='pending'?'已提交，等待设备确认':'已保存（演示）')}
function go(p){stack.push(p);render()}function back(){stack.pop();render()}function home(t){tab=t;stack=[t];render()}

const icons={chat:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5A8.5 8.5 0 0 1 10.5 3h2a8.5 8.5 0 0 1 8.5 8.5Z"/>',tasks:'<rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M6 9v9h9M9 6h9v9"/>',agents:'<rect x="3" y="4" width="18" height="17" rx="5"/><path d="M12 1v3M8 10h.01M16 10h.01M8 15h8"/>',me:'<circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>',group:'<circle cx="9" cy="8" r="3"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M16 5a3 3 0 0 1 0 6M20 21v-3a6 6 0 0 0-3-5"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m6 12 4 4 8-8"/>'};
const icon=k=>`<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">${icons[k]||icons.chat}</svg>`;
const chatRow=(name,preview,time,avatar,style='',unread='')=>`<button class="row" onclick="go('conversation')"><span class="avatar ${style}">${avatar}</span><span class="text"><span class="chat-meta"><strong>${name}</strong><time>${time}</time></span><span class="chat-preview"><small>${preview}</small>${unread?`<span class="unread">${unread}</span>`:''}</span></span></button>`;

const screens={
chat:()=>['聊天',`<input class="search" placeholder="搜索聊天" aria-label="搜索聊天"><div class="tabs">${button('全部',"toast('全部聊天')",'active')}${button('真人',"toast('真人聊天')")}${button('Agent',"toast('Agent 聊天')")}${button('群聊',"toast('群聊')")}${button('协作网',"toast('协作网')")}</div>${card(chatRow('产品讨论','调研 Agent：第一版交互方案已整理好','09:41',icon('group'),'slate','2')+chatRow('日常助手','今天的计划和待办已更新','09:32','助','','1')+chatRow('林','好，我们下午再核对一下。','昨天','林','sand')+chatRow('代码助手','修改已完成，相关检查通过。','昨天','码','blue')+chatRow('设计讨论','收到，我来看看这个版本。','周六',icon('group'),'slate')+chatRow('调研 Agent','我把参考资料放在任务记录里了。','周五','研','lavender'))}`,button(icon('plus'),"go('contacts')")],
contacts:()=>['新建聊天',`<input placeholder="搜索公司联系人" aria-label="搜索公司联系人">${card(row('日常助手','Agent · owner 陈 · Mac mini','conversation','助')+row('林','公司成员','conversation','林'))}${button('选择成员创建群聊',"go('newgroup')",'primary')}`],
newgroup:()=>['新群聊',pad(field('群名称','项目讨论')+toggle('日常助手')+toggle('林'))+button('创建群聊',"go('conversation');toast('群聊已创建（演示）')",'primary')],
conversation:()=>['产品讨论',`${info()}<div class="by">你 · 09:35</div><div class="bubble mine">请整理原生 App 的关键交互。</div><div class="by">调研 Agent · Mini · 09:36</div><div class="bubble">已整理好方案。<br><b>聊天、任务、Agent、我的</b>保留原有结构；详情使用原生返回。<ul><li>附件原生选择和预览</li><li>任务节点回到聊天继续讨论</li></ul>${button('查看工具过程 · 2 次调用',"go('process')",'wide')}<small>1,248 tokens · 8.2 秒</small></div>${pad('<b>需要你的确认</b><p>调研 Agent 请求执行：读取项目目录</p>'+button(approved?'已提交，等待确认':'选择审批结果',"go('approval')",'wide'))}<div class="toolbar">${button('复制',"toast('正文已复制（演示）')")}${button('分支',"confirmAction('从此处建立分支？','将保留截至这条回复的历史。','建立分支',\"toast('分支已创建（演示）')\")")}${button('蒸馏 Skill',"go('distill')")}</div>`,button('•••',"go('chatinfo')")],
chatinfo:()=>['聊天详情',card(row('本群任务','计划与探索 · 查看活动','graph','▱')+row('群成员','你、林、调研 Agent','members','人'))+pad(field('聊天名称','产品讨论')+toggle('置顶',false)+toggle('静音',false))+save()+button('解散群聊',"confirmAction('解散产品讨论？','所有成员将失去此群入口，此操作无法撤销。','解散',\"home('chat');toast('群聊已解散（演示）')\")",'danger wide')],
members:()=>['群成员',card(row('林','成员 · 点击管理','member','林')+row('调研 Agent','Mini · 在线','agent','研'))+button('添加成员',"go('contacts')",'primary')],

function render(){const p=stack.at(-1),[title,body,action='']=screens[p]();$('head').innerHTML=(stack.length>1?button('‹','back()'):'')+`<h2>${title}</h2>`+action;$('device').className='screen-'+p;$('main').innerHTML=body;$('main').scrollTop=0;const root=['chat','tasks','agents','me'].includes(p);$('nav').style.display=root?'flex':'none';$('nav').innerHTML=[['chat',icon('chat'),'聊天'],['tasks',icon('tasks'),'任务'],['agents',icon('agents'),'Agent'],['me',icon('me'),'我的']].map(([id,icon,name])=>button(`<b>${icon}</b>${name}`,`home('${id}')`,tab===id?'active':'')).join('');$('compose').innerHTML=p==='conversation'?`<div class="composer">${button('＋',"go('attachment')")}<textarea aria-label="消息" placeholder="消息 / @提及 / 命令" oninput="draft=this.value"></textarea>${button('发送',"if(draft.trim()){toast('已发送（演示）');draft='';render()}")}</div>`:'';if(p==='conversation')$('compose').querySelector('textarea').value=draft;}

const params=new URLSearchParams(location.search);if(params.get('embed'))document.documentElement.classList.add('embed');const requested=params.get('screen');if(requested&&screens[requested]){stack=['chat','tasks','agents','me','login','register'].includes(requested)?[requested]:['chat',requested];if(['chat','tasks','agents','me'].includes(requested))tab=requested;}
$('state').onchange=render;$('role').onchange=render;$('width').onchange=()=>{$('device').style.width=`min(${$('width').value}px,100%)`};render();
