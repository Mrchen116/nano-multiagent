<main><div class="demo"><span>宿主结构原型 · 原生主体以官方组件实际渲染为准</span><label>演示状态 <select id="scenario"><option value="ready">已连接</option><option value="loading">首次加载</option><option value="offline">节点离线</option><option value="interrupted">更新中断</option><option value="empty">暂无执行</option><option value="denied">资格失效</option></select></label></div><div class="switch"><div class="tabs" role="tablist" aria-label="工作查看方式"><button data-mode="records" role="tab">工作记录</button><button data-mode="native" role="tab">原生轨迹</button></div><select class="execute" id="execution" aria-label="当前执行"><option value="main">主 Agent</option><option value="child">子 Agent · Order CSV aggregation task</option></select></div><div id="content"></div></main>
<script>
(()=>{const $=id=>document.getElementById(id);let mode='records',execution='main',scenario='ready';
function render(){document.querySelectorAll('[data-mode][role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));$('execution').hidden=mode==='records';if(mode==='records'){$('content').innerHTML='<section class="card"><h2>工作 <small>全局 · 实验</small></h2><p>跨聊天的主工作轨迹及关联执行</p></section><section class="card"><strong>主 Agent</strong><small> · 最新轮次在前</small>'+['结果交付','接收修订','订单汇总'].map(t=>'<details><summary>Inbox 唤醒 · '+t+' <small>已完成</small></summary><p>既有工作记录保持原样。</p><button data-open="main">查看原生轨迹</button></details>').join('')+'</section><section class="card">关联执行 · Order CSV aggregation task <button data-open="child">查看原生轨迹</button></section>';return;}const states={loading:['正在读取执行轨迹','从对应 Gateway 按需读取。'],offline:['节点离线，暂不可读取原生轨迹','已保存的工作记录仍可查看。'],empty:['暂无可查看的执行','查看不会创建或启动执行。'],denied:['访问资格已失效','当前账号的轨迹内容已清除。']};const state=states[scenario];$('content').innerHTML='<section class="native"><div class="head"><span>'+$('execution').selectedOptions[0].text+'</span><small>'+({ready:'已连接 · 实时更新',interrupted:'更新已中断',loading:'正在读取',offline:'节点离线',empty:'暂无执行',denied:'访问已失效'}[scenario])+' · 只读</small></div>'+(scenario==='interrupted'?'<div class="notice">更新已中断，已加载记录保留供检查。<button data-retry>重新连接</button></div>':'')+'<div class="host">'+(state?'<h3>'+state[0]+'</h3><p>'+state[1]+'</p>'+(scenario==='offline'?'<button data-retry>重新读取</button>':'')+'<button data-mode="records">返回工作记录</button>':'<h3>官方 DSH 轨迹组件挂载区</h3><p>时长 · 轮次 · 调用 · 搜索</p><p>输入／模型／工具三轨、完整事件表、原生类型化检查器</p><p>直接加载官方插件；本原型只审查新增宿主结构。</p><p>原生信息和交互的 must-match 见 design.md D2.1。</p>')+'</div></section>';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode)mode=b.dataset.mode;if(b.dataset.open){mode='native';execution=b.dataset.open;$('execution').value=execution;}if(b.hasAttribute('data-retry')){scenario='ready';$('scenario').value='ready';}render();});$('execution').onchange=e=>{execution=e.target.value;render();};$('scenario').onchange=e=>{scenario=e.target.value;mode='native';render();};render();})();
</script>
