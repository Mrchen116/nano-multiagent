let scope=null,collection='overview',query='',selected=null,view='progress',page='tasks',filter='',identity='member',visibility='public',dissolved=false,notes=[],detailOpen=false,next=42;
const n=id=>nodes.find(x=>x.id===id), children=id=>nodes.filter(x=>x.parent===id), esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');

function path(x){let a=[];for(let p=x.parent;p;p=n(p)?.parent)a.unshift(n(p).title);return a.join(' / ')}
function badge(x){return `<span class="badge ${x.status}">${statuses[x.status]}</span>`}
function summary(x){const kids=children(x.id);if(!kids.length)return '未拆分';const counts=Object.keys(statuses).map(s=>{const k=kids.filter(x=>x.status===s).length;return k?`${statuses[s]} ${k}`:''}).filter(Boolean);return `直属子任务 ${kids.length} · ${counts.join(' / ')}`}

function card(x){const kids=children(x.id);return `<article class="card ${selected===x.id&&detailOpen?'selected':''}"><button class="card-main" onclick="choose('${x.id}')" aria-label="查看任务：${esc(x.title)}"><div class="card-top"><span class="node-id">${scope===null?'发布协作群 · ':''}${x.id}</span>${x.status==='paused'?badge(x):''}</div><h3 title="${esc(x.title)}">${esc(x.title)}</h3>${collection==='assignee'&&x.parent?`<p class="card-path" title="${esc(path(x))}">${esc(path(x))}</p>`:''}<div class="owner-line"><span class="avatar ${x.assignee==='未分配'?'none':''}">${x.assignee==='未分配'?'–':esc(x.assignee.replace('Agent ',''))}</span>${esc(x.assignee)}</div>${childSummary(x)}</button>${x.mode!=='none'?`<button class="enter" onclick="enter('${x.id}')">${kids.length?`查看 ${kids.length} 项子任务`:x.mode==='explore'?'展开探索方向':'拆分子任务'}<span>↗</span></button>`:''}</article>`}

function sidebar(){return page==='chat'?chatSidebar():''}
function visibleTasks(){const list=collection==='assignee'?nodes.filter(x=>x.assignee===filter):scope?children(scope):nodes.filter(x=>!x.parent);return list.filter(x=>x.title.toLocaleLowerCase().includes(query.toLocaleLowerCase()))}
function searchTasks(value){query=value;render();const input=document.getElementById('taskSearch');input.focus();input.setSelectionRange(value.length,value.length)}
function taskHeader(){const x=n(scope);let trail=[];for(let q=x;q;q=n(q.parent))trail.unshift(q);const breadcrumb=scope?`<nav class="task-trail" aria-label="任务层级"><button onclick="overview()">任务总览</button>${trail.map((c,i)=>`<span>›</span>${i===trail.length-1?`<h1>${esc(c.title)}</h1>`:`<button onclick="enter('${c.id}')">${esc(c.title)}</button>`}`).join('')}</nav>`:`<nav class="collection-tabs" aria-label="任务范围"><button class="${collection==='overview'?'active':''}" onclick="overview()">任务总览</button><button class="${collection==='assignee'?'active':''}" onclick="assigneeView()">按负责人</button></nav>`;return `<header class="task-topbar">${breadcrumb}<div class="task-top-actions">${scope?`<button class="ghost" onclick="choose('${x.id}')">任务详情</button><button class="ghost task-group-link" onclick="page='chat';render()">发布协作群 ↗</button>`:''}<button class="primary" onclick="edit(null,${scope===null})" ${writable()?'':'disabled'}>${scope===null?'＋ 新建任务':'＋ 子任务'}</button></div></header>`}
function taskToolbar(){const x=n(scope);const count=visibleTasks().length;return `<div class="task-toolbar"><div class="scope-heading">${collection==='assignee'?`<details class="menu owner-filter"><summary><span class="avatar">${esc(filter.replace('Agent ',''))}</span>${esc(filter)}<span>⌄</span></summary><div class="menu-content">${people.map(p=>`<button onclick="filter='${p}';render()">${p}</button>`).join('')}</div></details><span class="scope-label">${count} 项任务 · 所有层级</span>`:scope?`${badge(x)}<span class="scope-divider"></span><span class="scope-label">${count} 项直属子任务</span><span class="scope-visibility">${visibility==='public'?'公司内公开':'私密群'}</span>`:`<span class="scope-label">${count} 个根任务</span><span class="scope-visibility">按任务自身状态分组</span>`}</div><div class="task-view-tools"><div class="task-search"><span>⌕</span><input id="taskSearch" value="${esc(query)}" placeholder="搜索${scope?'本层任务':'任务'}" aria-label="搜索任务" oninput="searchTasks(this.value)"></div>${scope?`<div class="segment"><button class="${view==='progress'?'active':''}" onclick="view='progress';render()">完成情况</button><button class="${view==='structure'?'active':''}" onclick="view='structure';render()">结构图</button></div>`:''}</div></div>`}
let loadedColumns={},columnState={},activeChatTitle='发布协作群',modalReturn=null;
const joinedGroups=new Set(['发布协作群']);
function simulateColumn(state){columnState.todo=state==='normal'?null:state;document.querySelector('.demo details').open=false;render()}
function retryColumn(key){const was=columnState[key];delete columnState[key];if(was==='error'){const k=[scope,collection,filter,query,key].join('|');loadedColumns[k]=(loadedColumns[k]||20)+20}render()}

function loadColumn(key,el){if(columnState[key])return;if(el.scrollHeight-el.scrollTop-el.clientHeight<100){const all=visibleTasks().filter(x=>inColumn(x,key));const k=[scope,collection,filter,query,key].join('|');if((loadedColumns[k]||20)<all.length){columnState[key]='loading';render();setTimeout(()=>{loadedColumns[k]=(loadedColumns[k]||20)+20;delete columnState[key];render()},350)}}}
function loadColumnSample(){for(let i=0;i<51;i++)nodes.push({id:'sample'+i,parent:null,title:'滚动样例 · 待办 '+(i+1),mode:'none',status:i===50?'paused':'todo',creator:'小王',assignee:'Agent A'});overview()}
function taskBoard(){const items=visibleTasks();return `<div class="board-scroll"><div class="board">${boardStates.map(key=>{const all=items.filter(x=>inColumn(x,key));const k=[scope,collection,filter,query,key].join('|');const state=columnState[key];const shown=state==='initial'?[]:scope?all:all.slice(0,loadedColumns[k]||20);let footer='';if(state==='initial'||state==='loading')footer='<p class="empty" role="status">'+(state==='initial'?'正在加载任务…':'正在加载更多…')+'</p>';else if(state==='error'||state==='refreshError')footer=`<div class="column-error" role="alert">${state==='error'?'更多任务加载失败':'刷新失败，已加载任务保留'}<button onclick="retryColumn('${key}')">重试</button></div>`;else if(all.length)footer=`<p class="empty" role="status">${shown.length<all.length?`已加载 ${shown.length} / 共 ${all.length} · 滚动继续`:`已显示全部 ${shown.length} 项`}</p>`;return `<section class="column" aria-label="${statuses[key]}任务"><h3><i class="dot ${key}"></i>${statuses[key]}<span class="count">${state==='initial'?'—':all.length}</span></h3><div class="column-body" onscroll="loadColumn('${key}',this)">${shown.map(card).join('')||(!state?'<p class="empty">暂无任务</p>':'')}${footer}</div></section>`}).join('')}</div></div>`}

function detail(){if(!detailOpen)return '';let x=n(selected);if(!x)return '';const mayClaim=writable()&&['未分配',actor()].includes(x.assignee)&&x.status!=='doing';return `<button class="detail-scrim" aria-label="关闭任务详情背景" onclick="closeDetail()"></button><aside class="detail" aria-label="任务详情"><div class="detail-top"><span>任务 · ${x.id}</span><button aria-label="关闭详情" onclick="detailOpen=false;render()">×</button></div><h2>${esc(x.title)}</h2>${badge(x)}${writable()?`<div class="detail-tools">${mayClaim?`<button class="primary" onclick="claim('${x.id}')">领取并开始</button>`:''}<button class="${mayClaim?'ghost':''}" onclick="edit('${x.id}')">编辑</button><details class="menu right"><summary aria-label="更多操作">···</summary><div class="menu-content"><button onclick="assign('${x.id}')">调整负责人</button>${canDelete(x)?`<button class="danger" onclick="removeTask('${x.id}')">删除任务及子树</button>`:''}</div></details></div>`:!member()&&!dissolved?'<div class="detail-tools"><button class="primary" onclick="join()">加入群聊后操作</button></div>':''}<div class="facts"><div class="fact"><span>负责人</span>${writable()?`<button onclick="assign('${x.id}')">${esc(x.assignee)} ⌄</button>`:`<b>${esc(x.assignee)}</b>`}</div><div class="fact"><span>创建者</span><b>${esc(x.creator)}</b></div><div class="fact"><span>所属群</span><button onclick="page='chat';render()">发布协作群 ↗</button></div></div><h3>描述</h3><p>${esc(x.description||'尚未填写描述')}</p><h3>结果</h3><p class="${x.result?'':'muted'}">${esc(x.result||'尚未记录结果')}</p>${children(x.id).length?`<h3>直属子任务</h3><p class="muted">${esc(summary(x))}</p>`:''}${x.mode!=='none'?`<button class="scope-link" onclick="enter('${x.id}')">查看${x.mode==='explore'?'探索':'下一层'}<span>↗</span></button>`:''}${dissolved?'<p class="muted" style="margin-top:20px">群已解散，仅供历史回看</p>':''}</aside>`}
function render(){const priorScroll=[...document.querySelectorAll('.column-body')].map(el=>el.scrollTop);const priorHorizontal=document.querySelector('.board-scroll')?.scrollLeft||0;const taskKey=[scope,collection,filter,query,view].join('|');if(taskKey!==lastTaskKey){loadedColumns={};columnState={}}document.body.classList.toggle('chat-mode',page==='chat');document.querySelector('.user').textContent=actor();document.getElementById('tasksNav').classList.toggle('active',page==='tasks');document.getElementById('chatNav').classList.toggle('active',page==='chat');document.getElementById('side').innerHTML=sidebar();if(scope&&!n(scope)){scope=null;selected=null;detailOpen=false}const unavailable=identity==='visitor'&&visibility==='private';if(unavailable){document.getElementById('main').innerHTML='<div class="section"><h1>无法访问此内容</h1><p>群或任务不存在，或你没有访问权限。</p></div>';document.getElementById('side').innerHTML='';return}let banners='';if(dissolved)banners+='<div class="hint">群已解散。任务与结果保留，未完成工作已关闭。</div>';if(!member()&&!dissolved)banners+='<div class="hint">可查看公开群内容。<button onclick="join()">加入群聊</button></div>';if(page==='chat'){document.getElementById('main').innerHTML=chatHeader()+banners+chatTimeline();if(notes.length){const timeline=document.querySelector('.im-timeline');timeline.scrollTop=timeline.scrollHeight}return}document.getElementById('main').innerHTML=taskHeader()+banners+taskToolbar()+`<div class="workspace"><section class="center">${view==='structure'&&scope?`<div class="graph">${visibleTasks().map(card).join('')||'<p>暂无子任务</p>'}</div><p class="muted graph-caption">示例连线；产品沿用已有依赖图与探索衍生布局。</p>`:taskBoard()}</section></div>${detail()}`;if(taskKey===lastTaskKey){document.querySelectorAll('.column-body').forEach((el,i)=>el.scrollTop=priorScroll[i]||0);const board=document.querySelector('.board-scroll');if(board)board.scrollLeft=priorHorizontal}lastTaskKey=taskKey}

const groupIcon='<span class="group-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="8" r="4"/><path d="M2 21v-3a8 8 0 0 1 16 0v3M16 4a4 4 0 0 1 0 8M19 14a7 7 0 0 1 3 7"/></svg></span>';
function chatSidebar(){return `<div class="chat-side-head"><div class="sidehead"><b>MESSAGES</b><details class="menu right"><summary aria-label="新建会话">＋</summary><div class="menu-content"><button onclick="show('<h2>新建聊天</h2><p>沿用现有联系人入口（背景能力）</p><button onclick=closeModal()>关闭</button>')">新建聊天</button><button onclick="newGroup()">新建群</button><button onclick="discoverGroups()">发现公开群</button></div></details></div><input class="search" aria-label="搜索会话" placeholder="搜索…"><div class="chat-filters"><button class="active">全部</button><button>联系人</button><button>Agent</button><button>群聊</button></div></div><button class="conversation-row" onclick="document.getElementById('side').classList.remove('open')">${groupIcon}<span class="conversation-info"><span class="row-title"><b>发布协作群</b><time>10:32</time></span><p>${notes.length?'刚刚有新变更':'发布清单已核对'}</p></span></button><div class="chat-side-foot">提炼技能</div>`}
function openPublicGroup(title){activeChatTitle=title;identity=joinedGroups.has(title)?'ordinary':'visitor';document.getElementById('actorMode').value=identity;document.getElementById('side').classList.remove('open');closeModal();page='chat';render()}
function discoverGroups(){const menu=document.querySelector('#side details');menu.open=false;menu.querySelector('summary').focus();show(`<header class="discovery-head"><h2>发现公开群</h2><button class="ghost" onclick="closeModal()">关闭</button></header><input placeholder="搜索公开群" aria-label="搜索公开群" oninput="document.querySelectorAll('.discovery-row').forEach(row=>row.hidden=!row.textContent.includes(this.value))"><div class="discovery-list">${['发布协作群','产品体验讨论','周计划'].map((title,i)=>`<button class="discovery-row" onclick="openPublicGroup('${title}')">${groupIcon}<span><b>${title}</b><small>${joinedGroups.has(title)?'已加入 · ':''}${i+3} 位成员</small></span><span>›</span></button>`).join('')}</div>`,true)}

function chatHeader(){return `<header class="im-chat-header"><button class="chat-back" aria-label="会话列表" onclick="document.getElementById('side').classList.add('open')">‹</button>${groupIcon}<div class="im-chat-title"><h1>${esc(activeChatTitle)}</h1><p><span class="members">${people.filter(p=>p!=='未分配').map(esc).join(' · ')}　</span>${visibility==='public'?'公司内公开':'私密群'}${dissolved?' · 已解散':!member()?' · 未加入':''}</p></div><span class="kind-chip">群聊</span><button aria-label="群设置" onclick="settings()">⚙ <span>设置</span></button><button onclick="page='tasks';render()">任务</button></header>`}
function bubble(who,text,time){return `<div class="im-bubble ${who==='小王'?'mine':''}">${who==='小王'?'':`<span class="bubble-avatar">${who.replace('Agent ','')}</span>`}<div class="bubble-body">${who==='小王'?'':`<div class="sender">${esc(who)}</div>`}<p class="bubble-text">${esc(text)}</p><time>${time}</time></div></div>`}
function eventRow(body,time){return `<div class="task-notice"><time class="notice-meta">${time}</time> ${body}</div>`}
function seededTimeline(){return `<div class="chat-date">今天 · 10 月 12 日</div>${bubble('小王','今天先把登录与发布说明收口，免密登录这轮先暂缓。','10:00')}${eventRow(`小王将 ${ref(n('n3'))} 分配给了 ${mention('Agent A')}。`,'10:02')}${bubble('Agent A','收到。我会先完成登录修复，再把测试结果放到对应任务里。','10:04')}${eventRow(`小王将 ${ref(n('n2'))} 从 ${mention('Agent A')} 改派给了 ${mention('Agent B')}。`,'10:10')}${eventRow(`小王将 ${ref(n('n6'))} 设为<span class="paused">暂缓</span>。${mention('Agent B')}`,'10:12')}${bubble('Agent B','我来接登录回归。用户引导也已整理好，请看任务中的结果。','10:20')}${eventRow(`Agent B 将 ${ref(n('n4'))} 设为<span class="in_review">待确认</span>。${mention('Agent B')} ${mention('Agent A')}`,'10:24')}${eventRow(`小王将 ${ref(n('n12'))} 分配给了 ${mention('小王')}。`,'10:28')}${eventRow(`Agent B 将 ${ref(n('n5'))} 设为<span class="done">已完成</span>。${mention('Agent A')}`,'10:32')}`}
const initialTimeline=seededTimeline();
let chatMessages=[];
function chatTimeline(){return `<section class="im-timeline" aria-label="群消息">${activeChatTitle==='发布协作群'?initialTimeline:eventRow(esc(activeChatTitle)+' · 公开群历史','今天')}${notes.map(t=>eventRow(t,'刚刚')).join('')}${chatMessages.map(t=>bubble('小王',t,'刚刚')).join('')}</section><form class="im-composer" onsubmit="sendChat(event)"><div class="im-composer-row"><textarea id="chatDraft" aria-label="消息" placeholder="${writable()?'发送消息…（输入 @ 提及成员）':dissolved?'群已解散，仅供历史回看':'加入群聊后发送消息'}" ${writable()?'':'disabled'} oninput="document.getElementById('sendChat').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();this.form.requestSubmit()}"></textarea><button class="send" id="sendChat" aria-label="发送" disabled>↑</button></div><small>Enter 发送 · Shift+Enter 换行 · @ 提及成员</small></form>`}
function sendChat(e){e.preventDefault();const input=document.getElementById('chatDraft');if(!writable()||!input.value.trim())return;chatMessages.push(input.value.trim());render();const timeline=document.querySelector('.im-timeline');timeline.scrollTop=timeline.scrollHeight}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3200)}
function show(content,dismiss=false){modalReturn=document.activeElement;document.getElementById('modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" ${dismiss?'onclick="if(event.target===this)closeModal()"':''}><section>${content}</section></div>`;document.querySelector('#modal input')?.focus()}function closeModal(){document.getElementById('modal').innerHTML='';modalReturn?.focus();modalReturn=null}
function mention(p){return p&&p!=='未分配'?`<span class="mention">@${esc(p)}</span>`:''}function ref(x){return `<button onclick="openNode('${x.id}')">「${esc(x.title)}」</button>`}
function assign(id){const x=n(id);show(`<h2>调整负责人</h2><p>${esc(x.title)}</p><label for="owner">所属群成员</label><select id="owner">${people.map(p=>`<option ${p===x.assignee?'selected':''}>${p}</option>`).join('')}</select><p class="muted">非成员需先加入发布协作群。</p><div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveAssign('${id}')">保存</button></div>`)}
function saveAssign(id){const x=n(id),old=x.assignee,value=document.getElementById('owner').value;if(old!==value){x.assignee=value;notes.push(value==='未分配'?`${identity==='member'?'小王':'小李'}取消了 ${ref(x)} 的负责人 ${mention(old)}。`:old==='未分配'?`${identity==='member'?'小王':'小李'}将 ${ref(x)} 分配给了 ${mention(value)}。`:`${identity==='member'?'小王':'小李'}将 ${ref(x)} 从 ${mention(old)} 改派给了 ${mention(value)}。`)}closeModal();render();toast('已保存，所属群已出现系统消息')}
function claim(id){const x=n(id);if(!writable()||!['未分配',actor()].includes(x.assignee))return;if(x.status==='done'){edit(id);claimTarget=id;document.getElementById('status').value='doing';document.getElementById('reason').focus();return}const old=x.assignee;x.assignee=actor();x.status='doing';if(old!==x.assignee)notes.push(`${esc(actor())}将 ${ref(x)} 分配给了 ${mention(x.assignee)}。`);render();toast('已领取，状态更新为进行中')}
function edit(id,root=false){conflictStage='';claimTarget=null;const x=n(id);show(`<h2>${x?'编辑任务':root?'新建大任务':'新建子任务'}</h2>${!x?(root?'<label for="taskGroup">所属群</label><select id="taskGroup"><option>发布协作群</option></select>':`<p class="muted">所属群：发布协作群 · 当前层：${esc(n(scope).title)}</p>`):''}<label for="title">标题</label><input id="title" value="${esc(x?.title||'')}"><label for="desc">描述</label><textarea id="desc">${esc(x?.description||'')}</textarea><label for="status">状态</label><select id="status">${Object.entries(statuses).map(([s,l])=>`<option value="${s}" ${x?.status===s?'selected':''}>${l}</option>`).join('')}</select>${!x?`<label for="mode">内部结构</label><select id="mode">${root?'':'<option value="none">不拆分</option>'}<option value="dag">计划依赖</option><option value="explore">探索方向</option></select><label for="owner">负责人</label><select id="owner">${people.map(p=>`<option>${p}</option>`).join('')}</select>`:''}<label for="result">结果</label><textarea id="result">${esc(x?.result||'')}</textarea><label for="reason">变更说明</label><input id="reason" placeholder="完成后恢复进行中时填写返工原因"><p id="error" class="notice"></p><div id="conflict"></div><div class="actions"><button onclick="closeModal()">取消</button><button id="saveTask" class="primary" onclick="saveEdit('${id||''}',${root})">保存</button></div>`)}
function saveEdit(id,root){let x=n(id),old=x?.status;const title=document.getElementById('title').value.trim(),status=document.getElementById('status').value;if(!title){document.getElementById('error').textContent='请填写标题';return}if(old==='done'&&status==='doing'&&!document.getElementById('reason').value.trim()){document.getElementById('error').textContent='请填写返工原因';return}if(x&&document.getElementById('conflictDemo').checked){document.getElementById('conflictDemo').checked=false;x.description='其他成员补充：需要覆盖重新登录与令牌续期。';conflictStage='needs-read';document.getElementById('saveTask').disabled=true;document.getElementById('conflict').innerHTML=`<div class="conflict"><h3>任务已被其他成员更新</h3><p>你的修改仍保留在上方表单中。先读取最新记录，再决定是否提交。</p><button onclick="readLatest('${id}')">读取最新记录</button></div>`;return}if(conflictStage==='needs-read')return;conflictStage='';if(x&&claimTarget===id&&status==='doing'){const prior=x.assignee;x.assignee=actor();if(prior!==x.assignee)notes.push(`${esc(actor())}将 ${ref(x)} 分配给了 ${mention(x.assignee)}。`)}claimTarget=null;if(!x){x={id:'n'+next++,parent:root?null:scope,title,mode:document.getElementById('mode').value,status,creator:identity==='ordinary'?'小李':'小王',assignee:document.getElementById('owner').value};nodes.push(x);if(x.assignee!=='未分配')notes.push(`${identity==='member'?'小王':'小李'}将 ${ref(x)} 分配给了 ${mention(x.assignee)}。`)}Object.assign(x,{title,status,description:document.getElementById('desc').value,result:document.getElementById('result').value});if(old&&old!==status){let targets=[];if(['paused','closed'].includes(status))targets=children(x.id).map(c=>c.assignee).filter(p=>p.startsWith('Agent'));else if(['in_review','done'].includes(status))targets=[x.creator,n(x.parent)?.assignee];if(['paused','closed','in_review','done'].includes(status))notes.push(`${identity==='member'?'小王':'小李'}将 ${ref(x)} 设为${statuses[status]}。${[...new Set(targets)].map(mention).filter(Boolean).join(' ')}`)}selected=x.id;if(root){scope=null;collection='overview';detailOpen=true;}closeModal();render();toast('任务已保存')}
function readLatest(id){const x=n(id);conflictStage='read';document.getElementById('conflict').innerHTML=`<div class="conflict"><h3>已读取最新记录</h3><p>最新描述：${esc(x.description)}</p><p>上方仍是你的草稿。可继续修改，确认后按最新版本重新提交。</p></div>`;const button=document.getElementById('saveTask');button.disabled=false;button.textContent='确认重试'}
function descendants(id){let set=new Set([id]);for(let i=0;i<8;i++)nodes.forEach(x=>{if(set.has(x.parent))set.add(x.id)});return set}
function removeTask(id){const x=n(id),ids=descendants(id);show(`<h2>删除任务及整个子树？</h2><p>${esc(x.title)}</p><p>将永久删除本任务及 ${ids.size-1} 个下属任务，包括其他成员创建或负责的任务。关闭任务可以保留记录。</p><div class="actions"><button onclick="closeModal()">取消</button><button class="danger" onclick="nodes=nodes.filter(x=>!descendants('${id}').has(x.id));selected=scope;closeModal();render()">删除 ${ids.size} 个任务</button></div>`)}
function join(){if(dissolved)return;joinedGroups.add(activeChatTitle);if(!people.includes('小李'))people.push('小李');identity='ordinary';document.getElementById('actorMode').value='ordinary';render();toast('已加入'+activeChatTitle+'，可领取和维护任务')}
function settings(){show(`<h2>群设置</h2><label>群名称</label><input value="发布协作群" disabled><label for="visibility">可见范围</label><select id="visibility" ${identity==='member'&&!dissolved?'':'disabled'}><option value="public" ${visibility==='public'?'selected':''}>公司内公开</option><option value="private" ${visibility==='private'?'selected':''}>私密 · 仅成员</option></select><p class="muted">仅已加入本群的公司管理员可更改范围。</p><div class="actions">${!dissolved&&identity==='member'?'<button class="danger" onclick="dissolveConfirm()">解散群聊</button>':''}<button onclick="closeModal()">关闭</button>${identity==='member'&&!dissolved?'<button class="primary" onclick="visibility=document.getElementById(\'visibility\').value;closeModal();render()">保存</button>':''}</div>`)}
function dissolveConfirm(){show('<h2>解散发布协作群？</h2><p>所有未完成任务将关闭，已完成任务与结果保留。原可见范围内仍可回看历史。</p><div class="actions"><button onclick="closeModal()">取消</button><button class="danger" onclick="dissolved=true;nodes.forEach(x=>{if(![\'done\',\'closed\'].includes(x.status))x.status=\'closed\'});closeModal();render()">解散群聊</button></div>')}
function newGroup(){show('<h2>新建群聊</h2><label for="groupName">群名称</label><input id="groupName" placeholder="填写群名称"><label for="groupVisibility">可见范围</label><select id="groupVisibility"><option>公司内公开</option><option>私密 · 仅成员</option></select><p class="muted">公开群允许公司成员查看并自行加入。</p><div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="if(document.getElementById(\'groupName\').value.trim()){closeModal();toast(\'已演示新建群表单，示例任务仍属于发布协作群\')}">创建</button></div>')}
document.getElementById('chatNav').onclick=()=>{page='chat';render()};document.getElementById('tasksNav').onclick=()=>{page='tasks';render()};document.getElementById('actorMode').onchange=e=>{identity=e.target.value;render()};document.getElementById('reset').onclick=()=>location.reload();document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modal').innerHTML)closeModal();else if(detailOpen)closeDetail()}});render();
</script></html>
