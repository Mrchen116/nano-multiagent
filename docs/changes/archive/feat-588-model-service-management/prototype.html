.tabs button{white-space:nowrap;flex:none}.actions .primary{background:#087c76;color:white}.editor h2{font-size:17px}.editor .field{margin:12px 0}.editor .field small{font-size:12px}</style><body><header><strong>nano IM</strong><nav><button onclick="setPage('chat')">聊天</button><button>助手</button><button onclick="$('menu').classList.toggle('hidden')">我的 ▾</button></nav><span class="identity">小林 · 个人空间</span></header><div id="menu" class="card hidden" style="position:absolute;right:18px;top:58px;z-index:2;padding:14px"><button class="link" onclick="$('menu').classList.add('hidden');setPage('settings')">模型服务</button></div><main class="page"><section id="title"><div class="top"><div><div class="eyebrow" id="eyebrow">电脑设置</div><h1 id="heading">模型服务</h1><p class="muted" id="subtitle">管理助手可用的 API 服务与模型。</p></div><button id="add" class="primary" onclick="edit(-1)">＋ 添加服务</button></div><div id="steps" class="steps hidden"><span>✓ 连接电脑</span><b>2 连接模型</b><span>3 创建助手</span><span>4 开始工作</span></div><div class="device"><span>▣</span><select aria-label="选择电脑"><option>MacBook Air · 这台电脑</option><option>工作室 Mac mini</option></select><span id="online" class="status">在线</span></div></section><div id="content"></div></main><aside class="demo"><b>设计原型 · 仅演示</b><span>沿用导航背景；新增 API 优先及常驻管理。以下为模拟状态：</span><button onclick="setPage('onboarding')">首次接入</button><button onclick="services=structuredClone(initialServices);setPage('settings')">已有服务</button><button onclick="showOffline()">电脑离线</button><button onclick="noComputer()">没有电脑</button><button onclick="showError('测试未通过。请检查地址、API Key 和模型后重试。原连接仍然可用。')">验证失败</button><button onclick="showError('配置已在另一页面更新。草稿已保留，请重新载入后核对修改。',true)">版本冲突</button></aside><script>
let page='settings',editing=-1,type='catalog',busy=false,conflict=false,services=[{name:'DeepSeek',source:'DeepSeek API',models:['deepseek-chat','deepseek-reasoner'],custom:false},{name:'团队模型服务',source:'自定义 API',models:['qwen3.5-35b-a3b','gpt-6-luna'],custom:true}],fresh=false;const initialServices=structuredClone(services);
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setPage(p){page=p;busy=false;conflict=false;fresh=p==='onboarding';if(fresh)services=[];else if(!services.length)services=structuredClone(initialServices);$('title').classList.remove('hidden');$('heading').textContent=fresh?'给助手接通一个模型':'模型服务';$('eyebrow').textContent=fresh?'从这里开始':'电脑设置';$('subtitle').textContent=fresh?'选择你使用的服务商，接通后就能创建助手。':'管理助手可用的 API 服务与模型。';$('steps').classList.toggle('hidden',!fresh);$('add').classList.toggle('hidden',fresh);$('online').textContent='在线';$('online').style.color='';if(fresh)edit(-1);else renderList()}
function renderList(){ $('content').innerHTML=`<div id="notice"></div><div class="card">${services.map((s,i)=>`<div class="service"><div class="service-info"><div class="icon">${esc(s.name[0])}</div><div><h3>${esc(s.name)}</h3><small>${esc(s.source)}</small><div class="tags">${s.models.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}</div></div></div><div class="actions"><button onclick="edit(${i})">编辑</button><button class="link danger" onclick="removeService(${i})">移除</button></div></div>`).join('')||'<div class="empty"><h2>还没有模型服务</h2><p class="muted">添加一个 API 服务，供这台电脑上的助手使用。</p><button class="primary" onclick="edit(-1)">添加服务</button></div>'}</div>${fresh?'<div class="footer"><span class="status">连接已验证</span><button class="primary" onclick="assistant()">继续创建助手 →</button></div>':'<p class="hint" style="margin-top:18px">在助手设置中选择要使用的模型。</p>'}`;}
function edit(i){editing=i;type=i>=0&&services[i].custom?'custom':'catalog';renderEditor()}
function renderEditor(){document.querySelector('.device select').disabled=true;const s=services[editing];$('add').classList.add('hidden');$('content').innerHTML=`<div class="card editor">${!fresh?'<button class="link" onclick="setPage(\'settings\')">← 模型服务</button>':''}<h2>${s?'编辑 '+esc(s.name):'添加模型服务'}</h2><p class="hint">${s?'修改后先测试连接，成功才会保存。':'填写 API Key 并选择模型，测试通过后即可使用。'}</p><div class="tabs"><button class="${type==='catalog'?'selected':''}" onclick="switchType('catalog')">内置服务商</button><button class="${type==='custom'?'selected':''}" onclick="switchType('custom')">自定义 API</button></div>${type==='catalog'?'<div class="field"><label for="provider">服务商</label><select id="provider" onchange="catalogChanged()"><option>DeepSeek</option><option>OpenAI</option><option>Anthropic</option><option>Google</option><option>Moonshot</option><option>Groq</option><option>Mistral</option></select><small>使用服务商默认地址与模型目录。</small></div>':`<div class="field"><label for="name">服务名称</label><input id="name" value="${s?esc(s.name):''}" placeholder="例如：团队模型服务"></div><div class="grid"><div class="field"><label for="url">API 地址</label><input id="url" value="${s?esc(s.url||'https://models.example.com/v1'):''}" placeholder="https://api.example.com/v1"></div><div class="field"><label for="protocol">协议</label><select id="protocol"><option>OpenAI Chat Completions</option><option>OpenAI Responses</option><option>Anthropic Messages</option></select></div></div>`}<div class="field"><label for="key">API Key${s?' · 已保存':''}</label><input id="key" type="password" autocomplete="off" placeholder="${s?'留空保留当前密钥':'粘贴 API Key'}"><small>密钥保存在 ${esc(document.querySelector('.device select').selectedOptions[0].textContent)}，保存后不再显示。</small></div><div class="subhead"><h3>模型</h3><button class="link" onclick="addModel()">＋ 添加模型</button></div><div class="hint">上游模型 ID / 显示名称（可选）</div><datalist id="catalog-models"><option value="deepseek-chat"><option value="deepseek-reasoner"></datalist><div id="models">${(s?s.models:type==='catalog'?['deepseek-chat']:['']).map(m=>modelRow(m)).join('')}</div><details><summary>高级设置</summary><div class="field"><label>API 地址覆盖（可选）</label><input placeholder="留空使用服务商默认地址"></div><p class="hint">每个模型可设置上下文窗口、最大输出与图片输入能力。</p></details><div id="notice"></div><div class="footer"><button id="cancel" onclick="cancel()">取消</button><button id="save" class="primary" onclick="save()">测试并保存</button></div>${fresh?'<div style="margin-top:24px"><small>使用 ChatGPT 订阅？</small> <button class="link" onclick="showError(\'订阅登录沿用现有授权流程，此原型不连接真实账号。\')">连接 Codex 账号 →</button></div>':''}</div>`;if(s)document.querySelector('.editor .tabs')?.remove();if(s&&type==='catalog'){$('provider').value=s.name;$('provider').disabled=true;$('provider').insertAdjacentHTML('afterend','<small>服务商创建后固定；更换服务商请添加新服务。</small>');}}
function catalogChanged(){if(editing>=0)return;const names={DeepSeek:['deepseek-chat','deepseek-reasoner'],OpenAI:['gpt-4.1','o3'],Anthropic:['claude-sonnet-4-5'],Google:['gemini-2.5-pro'],Moonshot:['kimi-k2'],Groq:['llama-3.3-70b-versatile'],Mistral:['mistral-large-latest']};const models=names[$('provider').value];$('catalog-models').innerHTML=models.map(m=>`<option value="${m}">`).join('');$('models').innerHTML=modelRow(models[0]);}
function modelRow(m){return `<div class="model"><input list="catalog-models" aria-label="模型 ID" value="${esc(m)}" placeholder="模型 ID"><input aria-label="模型显示名称" placeholder="显示名称（可选）"><button aria-label="移除模型" onclick="this.parentElement.remove()">×</button></div>`}
function addModel(){$('models').insertAdjacentHTML('beforeend',modelRow(''))}
function switchType(t){if(editing>=0){showError('服务类型在创建后固定。需要另一种连接时请添加服务。');return;}type=t;renderEditor()}
function showError(message,c=false){if(!$('save'))edit(0);busy=false;conflict=c;$('save').disabled=c;$('save').textContent='测试并保存';$('notice').innerHTML=`<div class="notice error" role="alert">${esc(message)}${c?'<br><button class="link" onclick="compareConflict()">查看电脑上的最新配置</button>':''}</div>`}
function compareConflict(){const latest={...services[editing],name:'团队共享服务（另一页面修改）',url:'https://new-api.example.com/v1',models:['gpt-6-luna']};services[editing]=latest;$('notice').innerHTML=`<div class="notice error"><b>电脑上的最新配置</b><div class="break">服务：${esc(latest.name)}<br>地址：${esc(latest.url)}<br>模型：${esc(latest.models.join('、'))}</div><p>上方表单仍是你的草稿。请选择要保留的修改。</p><button onclick="conflict=false;renderEditor()">使用电脑上的配置</button><br><button class="link" onclick="conflict=false;$('save').disabled=false;$('notice').innerHTML='<div class=notice>已核对最新版本，草稿保留。点击测试并保存以重新应用你的修改。</div>'">核对后重新应用我的修改</button></div>`}

function save(){if(busy||conflict)return;const inputs=[...document.querySelectorAll('#models .model input:first-child')],ms=inputs.map(e=>e.value.trim()).filter(Boolean);if(!ms.length)return showError('至少填写一个模型 ID。');if(editing<0&&!$('key').value)return showError('请填写 API Key。');busy=true;$('save').disabled=true;$('save').textContent='正在验证…';$('notice').innerHTML='<div class="notice" role="status">正在测试模型连接。原有服务继续可用。</div>';setTimeout(()=>{if(!busy)return;busy=false;const name=$('name')?.value||$('provider')?.value||services[editing]?.name||'新服务';const item={name,source:(type==='custom'?'OpenAI Chat Completions':name)+' · API Key 已保存',models:ms,custom:type==='custom'};if(editing<0)services.push(item);else services[editing]=item;$('add').classList.toggle('hidden',fresh);renderList();$('notice').innerHTML='<div class="notice" role="status">连接验证成功，已保存。</div>';},1200)}
function cancel(){if(busy){busy=false;showError('验证已取消，未保存修改。你可以调整后重试。')}else if(fresh){renderEditor()}else setPage('settings')}
function removeService(i){$('notice').innerHTML=i===0?'<div class="notice error" role="alert"><b>先为 2 个助手更换模型</b><br>日常助手使用 deepseek-chat；研究助手使用 deepseek-reasoner 作为备用。<br><button class="link" onclick="$(\'notice\').innerHTML=\'<div class=notice>真实产品将进入对应助手设置。</div>\'">前往助手设置 →</button></div>':`<div class="notice error">确定移除“${esc(services[i].name)}”？当前没有助手使用此服务。<br><button class="danger" onclick="services.splice(${i},1);renderList()">确认移除</button> <button onclick="$('notice').innerHTML=''">保留</button></div>`}
function showOffline(){$('online').textContent='离线';$('online').style.color='#907333';$('add').classList.add('hidden');if($('save')){$('save').disabled=true;$('notice').innerHTML='<div class="notice error">电脑暂时离线，你的草稿已保留。启动 Nano 后重新检查连接。<br><button class="link" onclick="restoreOnline()">重新检查连接</button></div>';return;}$('content').innerHTML='<div class="card empty"><h2>这台电脑暂时离线</h2><p class="muted">请在 MacBook Air 启动 Nano，连接后即可继续管理模型服务。</p><button class="primary" onclick="setPage(\'settings\')">重新检查连接</button> <button onclick="setPage(\'onboarding\')">查看连接指引</button></div>'}
function restoreOnline(){$('online').textContent='在线';$('online').style.color='';if(conflict){showError('电脑已重新连接，配置版本已有变化。请核对最新配置后保存。',true);return;}$('save').disabled=false;$('notice').innerHTML='<div class="notice">电脑已重新连接。草稿完整保留，可继续测试并保存。</div>'}

function noComputer(){$('add').classList.add('hidden');$('content').innerHTML='<div class="card empty"><h2>先连接运行助手的电脑</h2><p class="muted">模型连接和凭据保存在你选择的电脑上。</p><button class="primary" onclick="setPage(\'onboarding\')">连接电脑 →</button></div>'}
function assistant(){$('content').innerHTML='<div class="card editor"><h2>认识你的助手</h2><div class="field"><label>助手名字</label><input value="日常助手"></div><div class="field"><label>使用的模型</label><select><option>DeepSeek · deepseek-chat</option></select></div><button class="primary" onclick="chat()">创建助手并开始聊天 →</button></div>'}
function chat(){$('content').innerHTML='<div class="card"><h2>日常助手</h2><p class="muted">示例聊天背景，真实实现沿用当前聊天。</p><p>你好，能帮我做些什么？</p><div class="notice">我可以帮你处理日常事务、整理资料，并在你的电脑上完成工作。</div><button onclick="setPage(\'settings\')">管理模型服务</button></div>'}
