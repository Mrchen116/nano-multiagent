function band(){const [title,body,label,act,sym]=states[phase]||states.available;const busy=['requested','waiting','switching'].includes(phase);return `<div class="update-band ${['failed','rolled_back','recovery','incompatible'].includes(phase)?'amber':''} ${['source','legacy','unavailable','cancelled'].includes(phase)?'plain':''}" role="status"><span class="update-symbol">${icon(sym,busy&&sym==='update'?'spin':'')}</span><div class="update-copy"><p class="update-title">${title}</p><p class="update-description">${body}</p>${busy?`<div class="steps"><span class="${phase==='requested'?'current':'done'}">准备</span><span class="step-line"></span><span class="${phase==='waiting'?'current':phase==='switching'?'done':''}">等待空闲</span><span class="step-line"></span><span class="${phase==='switching'?'current':''}">切换</span></div>`:''}</div>${label?`<button class="btn ${['update','recover'].includes(act)?'primary':''}" data-action="${act}">${label}</button>`:''}</div>`}
function render(){const empty=['empty','loading','error'].includes(scene);$('#summary').textContent=scene==='empty'?'让助手在你的电脑上工作':empty?'你的电脑与助手':`2 台电脑 · ${['switching','recovery'].includes(phase)?'0':'1'} 台在线`;let html='';if(scene==='loading')html='<div aria-label="正在加载电脑" role="status"><div class="skeleton"></div><div class="skeleton"></div></div>';else if(['empty','error'].includes(scene))html=`<div class="empty"><div class="computer-icon">${icon(scene==='error'?'info':'laptop')}</div><h2>${scene==='empty'?'连接第一台电脑':'暂时无法读取电脑'}</h2><p>${scene==='empty'?'把 Nano 安装到电脑上，<br>你的助手就有了可以工作的地方。':'请检查网络连接，然后重新试一次。'}</p><button class="btn primary" data-action="${scene==='empty'?'connect':'refresh'}">${scene==='empty'?'连接电脑':'重试'}</button></div>`;else{if(scene==='stale')html='<div class="notice">'+icon('info')+'<span style="flex:1">刷新失败，以下是上次读取的状态。</span><button class="btn" data-action="refresh">重试</button></div>';html+=`<div class="list-label"><span>已连接的电脑</span><span>仅你可见</span></div><article class="device"><div class="device-main"><div class="computer-icon">${icon('laptop')}</div><div class="identity"><button class="name-button" data-action="detail" data-node="0" aria-label="查看${esc(name)}详情"><h2>${esc(name)}</h2></button><div class="metadata"><span class="status ${phase==='recovery'?'warn':''}"><i class="dot ${phase==='recovery'?'warn':''}"></i>${phase==='recovery'?'需要恢复':phase==='switching'?'更新中':'在线'}</span><span class="sep">·</span><span>${phase==='recovery'?'上次版本':'Nano'} ${phase==='succeeded'?'0.4.0':'0.3.0'}</span><span class="sep">·</span><span>1 个助手</span></div></div><button class="detail-link" data-action="detail" data-node="0" aria-label="查看${esc(name)}详情"><span>详情</span>${icon('chevron')}</button></div>${band()}</article><article class="device offline"><div class="device-main"><div class="computer-icon">${icon('desktop')}</div><div class="identity"><button class="name-button" data-action="detail" data-node="1" aria-label="查看家里的 Mac mini详情"><h2>家里的 Mac mini</h2></button><div class="metadata"><span class="status off"><i class="dot off"></i>离线</span><span class="sep">·</span><span>Nano 0.4.0</span><span class="sep">·</span><span>暂无助手</span></div></div><button class="detail-link" data-action="detail" data-node="1" aria-label="查看家里的 Mac mini详情"><span>详情</span>${icon('chevron')}</button></div><p class="offline-foot">上次在线于今天 07:32 · 打开电脑上的 Nano 即可重新连接</p></article>`;}$('#content').innerHTML=html;icons()}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3000)}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}function later(fn,ms){timers.push(setTimeout(fn,ms))}function setPhase(p){phase=p;render();if(drawer.open&&!editing&&!drawer.dataset.guide)details()}
function openPanel(title,body){$('#drawer-title').textContent=title;$('#drawer-body').innerHTML=body;if(!drawer.open){drawer.showModal();document.body.classList.add('body-lock')}icons()}
function details(){const offline=selected===1;const display=offline?'家里的 Mac mini':name;let content=`<div class="drawer-identity"><div class="computer-icon">${icon(offline?'desktop':'laptop')}</div><div><h3>${esc(display)}</h3><div class="metadata"><span class="status ${offline?'off':phase==='recovery'?'warn':''}"><i class="dot ${offline?'off':phase==='recovery'?'warn':''}"></i>${offline?'离线':phase==='recovery'?'需要恢复':phase==='switching'?'更新中':'在线'}</span></div></div></div>`;content+=editing?`<form id="rename-form" class="field"><label for="computer-name">电脑名称</label><input id="computer-name" maxlength="80" value="${esc(draft)}" autocomplete="off"><p class="form-error" role="alert">${formError}</p><div class="field-actions"><button type="button" class="btn" data-action="cancel-edit">取消</button><button class="btn primary" type="submit">保存名称</button></div></form>`:`<div class="detail-row"><span>电脑名称</span><button class="btn textbtn" data-action="rename" ${offline||['switching','recovery'].includes(phase)?'disabled':''}>重命名</button></div>`;if(offline)content+='<p class="drawer-note">请在这台电脑上打开 Nano。<br>重新连接后，就可以改名或创建助手。</p>';content+=`<div class="detail-row"><span>Nano 版本</span><span>${offline||phase==='succeeded'?'0.4.0':'0.3.0'}</span></div><div class="detail-row"><span>最后在线</span><span>${offline?'今天 07:32':phase==='recovery'?'今天 08:16（恢复前）':'刚刚'}</span></div><div class="section-title">在这台电脑上工作的助手</div>${offline?'<p class="subtitle">还没有助手</p>':'<div class="detail-row"><span style="display:flex;align-items:center;gap:10px;color:var(--ink)"><span class="avatar">工</span>工作助手</span><span>1 个助手</span></div>'}<button class="btn" style="margin-top:16px" data-action="create-agent" ${offline||['switching','recovery'].includes(phase)?'disabled':''}>${icon('plus')}创建助手</button>${!offline&&['switching','recovery'].includes(phase)?'<p class="subtitle">电脑恢复后可改名或创建助手。</p>':''}<details class="diagnostics"><summary>连接诊断</summary><div class="detail-row"><span>电脑 ID</span><code>computer-${offline?'87bea7e9':'macbook-demo'}</code></div><div class="detail-row"><span>最后心跳</span><span>2026-10-14 ${offline?'07:32:53':'08:16:20'}</span></div><div class="detail-row"><span>连接记录</span><code>${offline?'connection_closed':'已连接'}</code></div></details>`;openPanel('电脑详情',content)}
function guide(recovery=false){const fail=scene==='noinstaller';openPanel(recovery?'恢复与安装':'连接电脑',`<div class="instructions"><div class="computer-icon">${icon('laptop')}</div><h3 style="margin-top:22px">${recovery?'到这台电脑上继续':'让助手开始工作'}</h3><p>${recovery?`请在「${esc(name)}」上完成以下步骤。页面会在电脑恢复连接后更新状态。`:'在你想运行助手的电脑上安装 Nano，再用当前账号确认连接。'}</p>${recovery&&phase==='legacy'?'<div class="drawer-note">请先等待这台电脑上的任务结束，再执行安装。已有配置和工作文件会保留。</div>':''}${fail?'<div class="drawer-note">管理员尚未发布电脑端安装包，请稍后再试。</div>':`<div class="mode-tabs"><button class="${mode==='agent'?'selected':''}" data-action="mode-agent">交给本地 Agent</button><button class="${mode==='manual'?'selected':''}" data-action="mode-manual">自己安装</button></div><ol><li>${mode==='agent'?'打开电脑上的 Codex 或 Claude Code。':'打开这台电脑上的终端。'}</li><li>${mode==='agent'?'复制说明，发给 Agent 完成安装。':'粘贴安装命令，按提示完成安装。'}</li><li>在浏览器确认绑定，回到电脑列表。</li></ol><pre class="command">${mode==='agent'?'请帮我安装 Nano，并连接当前账号的服务。保留已有配置、凭据和工作文件；需要确认时由我操作。':'安装命令由当前服务提供。'}</pre><button class="btn primary" data-action="copy-guide">${icon('copy')}${mode==='agent'?'复制安装说明':'复制安装命令'}</button><p class="bridge-note">原型不提供可执行命令。产品复用当前服务的安装指引，不要求用户填写服务地址。</p>`}<p style="margin-top:24px;font-size:12px">支持 macOS / Linux，Windows 可在 WSL 中运行。</p></div>`);drawer.dataset.guide=recovery?'recovery':'connect'}
function closeDrawer(){drawer.close();document.body.classList.remove('body-lock');editing=false;delete drawer.dataset.guide}drawer.addEventListener('cancel',()=>{editing=false;document.body.classList.remove('body-lock')});drawer.addEventListener('close',()=>document.body.classList.remove('body-lock'));
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const act=b.dataset.action;if(act==='detail'){selected=Number(b.dataset.node);editing=false;details()}if(act==='close')closeDrawer();if(act==='rename'){editing=true;draft=name;formError='';details();$('#computer-name').focus();$('#computer-name').select()}if(act==='cancel-edit'){editing=false;details()}if(act==='update'){$('#toast').hidden=true;clearTimers();setPhase('requested');later(()=>setPhase('waiting'),2500);later(()=>{if(phase==='waiting'){setPhase('switching');later(()=>setPhase('succeeded'),4000)}},10000)}if(act==='finish'&&phase==='waiting'){clearTimers();setPhase('switching');later(()=>setPhase('succeeded'),4000);$('#demo').open=false}if(act==='cancel'){clearTimers();setPhase('cancelled');toast('已取消，电脑继续使用当前版本')}if(act==='recover'){selected=0;guide(true)}if(act==='connect')guide(false);if(act==='refresh'){scene='available';phase='available';$('#scene').value=scene;render();toast('已重新读取电脑状态')}if(act.startsWith('mode-')){mode=act==='mode-agent'?'agent':'manual';guide(drawer.dataset.guide==='recovery')}if(act==='copy-guide')toast('仅演示：正式产品会复制当前服务的安装指引');if(act==='create-agent')openPanel('创建助手',`<div class="instructions"><h3>在「${esc(name)}」上创建助手</h3><p>此入口在真实产品中进入现有创建页，并预选这台电脑。本原型不重做助手设置。</p><button class="btn" style="margin-top:24px" data-action="back-detail">返回电脑详情</button></div>`);if(act==='back-detail')details()});
document.addEventListener('input',e=>{if(e.target.id==='computer-name')draft=e.target.value});document.addEventListener('submit',e=>{if(e.target.id!=='rename-form')return;e.preventDefault();if(!draft.trim()){formError='请输入电脑名称';details();$('#computer-name').focus();return}if(scene==='saveerror'){formError='暂时无法保存，请稍后重试。输入已保留。';details();return}name=draft.trim();editing=false;render();details();toast('电脑名称已更新')});
$('#scene').addEventListener('change',e=>{clearTimers();scene=e.target.value;phase=states[scene]?scene:'available';name=scene==='long'?'JdeMacBook-Air-3.local · 家里用于研究和日常工作的电脑':'我的 MacBook';$('#demo').open=false;if(drawer.open)closeDrawer();render()});render();
</script></body></html>
