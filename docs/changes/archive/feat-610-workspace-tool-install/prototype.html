<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace 插件管理 · 设计草稿</title><style>body{margin:0;background:#f5f6f8;color:#233039;font:14px system-ui}main{max-width:830px;margin:35px auto;padding:20px}aside{font-size:12px;color:#65717b;margin-bottom:20px}header,article,.scope{background:white;border:1px solid #dde3e7;border-radius:14px;padding:22px;margin-bottom:14px}h1{font-size:24px;margin:0}h2{font-size:19px}p{line-height:1.7;color:#67747b}nav{display:flex;flex-wrap:wrap;gap:24px;margin-top:22px}nav b{color:#087f75}article>div{display:flex;justify-content:space-between;gap:15px}h3{margin:0 0 5px}button{border:1px solid #cbd5db;background:white;padding:8px 16px;border-radius:9px;cursor:pointer}button[role=switch][aria-checked=true]{background:#087f75;color:white;border-color:#087f75}.state{color:#087f75;font-size:12px}details{margin-top:18px;font-size:12px;color:#637079}summary{cursor:pointer}code{overflow-wrap:anywhere}.danger{color:#b54545}.confirm{padding:12px;background:#fff6f3;border-radius:8px}.scope{background:#edf6f5;color:#41635e}.empty{padding:28px;text-align:center}button:disabled{opacity:.5;cursor:wait}@media(max-width:500px){main{padding:12px;margin:8px auto}header,article,.scope{padding:16px}nav{gap:16px}}</style><main><aside>现有 Agent 页背景 + 本次新增插件页签。仅演示，未连接后端；视觉未验证。</aside><header><h1>E2E 助手</h1><p>测试电脑 · 在线</p><nav><span>概览</span><span>配置</span><span>通道</span><span>技能</span><b>插件</b><span>会话</span></nav></header><h2>Workspace 插件</h2><p>助手创建或安装的扩展。开关会停用整个插件，安装包保留。</p><div class="scope">这些操作影响共享此 workspace 的所有 Agent。工具调用仍受各 Agent 的工具权限控制。<br><code>…/workspaces/e2e</code></div><section id="cards"></section><aside><button onclick="document.getElementById('notice').textContent='暂时无法读取插件。电脑重新连接后请刷新。'">演示读取失败</button> <button onclick="location.reload()">重置演示</button><p id="notice"></p></aside></main><script>
const cards=document.getElementById('cards');for(const [name,description,pkg,entry] of [['每月报销汇总','按月份汇总金额，分类展示报销费用。','expense-summary','expense_summary'],['报销报告格式','在报告中自动列出统计口径和待确认项目，不新增工具。','expense-report-style','report-style']]){const card=document.createElement('article');card.innerHTML=`<div><section><h3>${name}</h3><span class="state">已启用</span></section><button type="button" role="switch" aria-checked="true" aria-label="${name}">开启</button></div><p>${description}</p><details><summary>插件详情</summary><p><code>${pkg}</code> · v1.0.0<br>插件条目：${entry}</p><button type="button" class="danger">卸载插件</button><section class="confirm" hidden><p>卸载“${name}”？共享此 workspace 的 Agent 都将停止使用。源码和工作文件保留。</p><button class="yes">确认卸载</button> <button class="cancel">取消</button></section></details>`;cards.append(card);const toggle=card.querySelector('[role=switch]');toggle.onclick=()=>{toggle.disabled=true;card.querySelector('.state').textContent='等待空闲后应用…';setTimeout(()=>{const on=toggle.getAttribute('aria-checked')!=='true';toggle.setAttribute('aria-checked',on);toggle.textContent=on?'开启':'关闭';card.querySelector('.state').textContent=on?'已启用':'已停用';toggle.disabled=false},1200)};card.querySelector('.danger').onclick=()=>card.querySelector('.confirm').hidden=false;card.querySelector('.cancel').onclick=()=>card.querySelector('.confirm').hidden=true;card.querySelector('.yes').onclick=()=>{card.remove();if(!cards.children.length)cards.innerHTML='<article class="empty"><h3>还没有插件</h3><p>回到聊天告诉助手：“把每月报销统计做成可复用插件。”</p></article>'}}
</script></html>
