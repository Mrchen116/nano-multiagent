<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PA · Global + IntelligentUI</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#253332;background:#fff}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #d8dfdc;background:#fff;border-radius:7px;padding:8px 12px;color:inherit}button:hover{background:#f3f6f5}header{height:48px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:28px;padding:0 20px}header strong{margin-right:12px}header span{color:#64746d}.app{height:calc(100dvh - 48px);display:grid;grid-template-columns:262px 1fr}aside{background:#f7f8f7;border-right:1px solid #e3e7e5;padding:15px 10px}.contact{display:block;border:0;width:100%;padding:15px;text-align:left;margin:5px 0}.contact.active{background:#e7efec}.contact small{display:block;margin-top:7px;color:#708078}main{min-width:0;display:flex;flex-direction:column}.head{padding:16px 24px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.head small{display:block;color:#75827b;margin-top:5px}.messages{flex:1;overflow:auto;padding:25px max(24px,calc((100% - 800px)/2))}p{line-height:1.8}.me{margin-left:20%;background:#eaf3ee;border-radius:10px;padding:12px 16px}.card{border:1px solid #dce4df;border-radius:10px;padding:20px;margin:15px 0}.card textarea{width:100%;min-height:105px;resize:vertical;border:1px solid #cbd7cf;border-radius:7px;padding:12px;line-height:1.7;margin:12px 0}.muted{color:#6c7a73;font-size:12px}.primary{background:#28665c;color:white}.composer{padding:16px 24px;border-top:1px solid #eee;display:flex;gap:10px}.composer textarea{flex:1;padding:12px;border:1px solid #dce4df;border-radius:8px;resize:none}dialog{border:1px solid #ddd;border-radius:12px;width:430px;max-width:92vw;padding:24px}dialog::backdrop{background:#0004}label{display:block;margin:15px 0}input[type=text]{display:block;width:100%;padding:9px;margin-top:8px;border:1px solid #ccc;border-radius:7px}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.mobile-back{display:none}@media(max-width:767px){.app{grid-template-columns:1fr}aside{display:none}header{gap:20px;padding:0 14px}.messages{padding:18px}.head{padding:14px}.composer{padding:12px}.mobile-back{display:inline-block}.me{margin-left:10%}}</style>
<header><strong>nano IM</strong><span>聊天</span><span>任务</span><span>智能体</span><span style="margin-left:auto">原型 · 合成数据</span></header>
<div class="app"><aside><button class="contact active" onclick="openPA()">✦ 小航 <small>我的个人助手</small></button><button class="contact" onclick="openPeer()">林悦<small>下周演示安排</small></button><button class="contact">产品协作群<small>材料准备</small></button></aside><main><div class="head"><button class="mobile-back" onclick="peer?openPA():openPeer()">返回聊天</button><div><strong id="title">小航</strong><small id="subtitle">你的个人助手</small></div><button onclick="settings.showModal()">设置</button></div><section class="messages" id="messages"></section><div class="composer"><textarea id="compose" rows="2" placeholder="发消息…"></textarea><button class="primary" onclick="send()">发送</button></div></main></div>
<dialog id="settings"><h3>个人助手</h3><p class="muted">在聊天里交代目标、纠正偏好或调整来源。</p><label>名字<input id="name" type="text" value="小航"></label><button onclick="status.textContent='使用现有 Agent 设置配置模型、指令、工具和 IntelligentUI。'">模型、指令与能力配置</button><details style="margin-top:20px"><summary>不让助手查看的聊天</summary><label><input id="exclude" type="checkbox" onchange="status.textContent=this.checked?'已停止访问产品协作群。后续消息和历史查询均受限制。':'已恢复产品协作群访问。'"> 产品协作群</label><p class="muted">不会清空已有聊天、记忆或成果，不承诺遗忘已经读到的内容。</p></details><p id="status" role="status"></p><div class="footer"><button onclick="document.querySelector('aside .contact').firstChild.textContent='✦ '+document.getElementById('name').value+' ';settings.close();openPA()">完成</button></div></dialog>
<script>
let peer=false,composers={pa:'',peer:''},draft='可以，周四 15:00 演示。我会提前把材料发给你。',sent=false;
function saveComposer(){composers[peer?'peer':'pa']=compose.value;const editor=document.getElementById('draft');if(editor)draft=editor.value}
function openPA(){saveComposer();peer=false;title.textContent=document.getElementById('name').value;subtitle.textContent='你的个人助手';messages.innerHTML='<p class="me">演示现在协调到哪了？帮我准备给林悦的回复。</p><p>你之前和林悦约的是周三；她后来直接告诉我周四更合适。你刚刚也回复了“改周四吧”。我已按最新安排整理。</p><p class="muted">来源：你与林悦的聊天 · 林悦与小航的聊天</p><div class="card"><strong>给林悦的回复草稿</strong><p class="muted">编辑后带回原聊天，由你发送。你已在原聊天回复，草稿可能过时，请核对后采用。</p><textarea id="draft"></textarea><button class="primary" onclick="useDraft()">在原聊天使用</button></div><p>材料还差一页。我会继续准备；如果需要等人或定时检查，会使用现有任务和提醒工具安排。</p>';document.getElementById('draft').value=draft;compose.value=composers.pa}
function openPeer(){saveComposer();peer=true;title.textContent='林悦';subtitle.textContent='私聊';messages.innerHTML='<p>林悦：周三下午可以演示吗？</p><p class="me">改成周四吧。</p>'+(sent?'<p class="me"></p>':'');if(sent)messages.lastChild.textContent=draft;compose.value=composers.peer}
function useDraft(){draft=document.getElementById('draft').value;openPeer();if(compose.value.trim()&&compose.value!==draft){if(!confirm('原聊天已有未发送内容。是否用这份回复替换？'))return}compose.value=draft;composers.peer=draft;compose.focus()}
function send(){if(!compose.value.trim())return;if(peer){draft=compose.value;sent=true;compose.value='';openPeer()}else{const p=document.createElement('p');p.className='me';p.textContent=compose.value;messages.append(p);compose.value=''}}
openPA();
</script></html>
