<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交互回复 · 通用探索原型</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#203f44;background:#f7faf9;font:15px/1.65 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #c6d9d3;border-radius:9px;padding:8px 13px;background:white;color:#28564c}button:hover{background:#edf7f3}button:focus-visible,input:focus-visible{outline:3px solid #91c8b7;outline-offset:2px}.demo{padding:7px 18px;background:#fcf1da;font-size:12px;color:#735d36}header{height:54px;display:flex;gap:40px;align-items:center;padding:0 24px;border-bottom:1px solid #dce8e4;background:#fff}.app{display:grid;grid-template-columns:220px 1fr;height:calc(100dvh - 88px)}aside{padding:26px 16px;border-right:1px solid #dce8e4}aside small{letter-spacing:2px;color:#78918b}aside p{padding:14px;border-radius:9px;background:#e3f1eb}.chat{display:flex;flex-direction:column;min-height:0;min-width:0}.title{padding:12px 26px;background:#fff;border-bottom:1px solid #e1eae6}.title small{color:#7d948c;margin-left:10px}.history{overflow:auto;flex:1;padding:22px 28px}.request{margin:0 0 22px auto;padding:11px 16px;border-radius:14px;background:#e2f1e9;width:max-content;max-width:95%}.reply{max-width:720px}.name{font-size:12px;color:#718a82;margin-bottom:7px}.intro{margin:0 0 16px}.card{padding:22px;background:#fff;border:1px solid #d6e5de;border-radius:16px;box-shadow:0 4px 16px #315c4105}h2{margin:0 0 5px;font-size:21px}h3{font-size:14px;margin:18px 0 7px}.muted{color:#728a81;font-size:13px}.tabs{display:flex;gap:7px;margin:18px 0 10px}.tabs button[aria-selected=true]{background:#207962;color:white;border-color:#207962}.track{margin:18px 0 10px;background:#eef6f2;height:56px;border-radius:9px;position:relative;border-bottom:2px solid #cedfd5}.dot{position:absolute;width:22px;height:22px;top:16px;background:#22815f;border-radius:50%;left:0;transition:left .15s}.ends{display:flex;justify-content:space-between;font-size:11px;color:#6b877b}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric{background:#f3f8f5;padding:11px;border-radius:9px}.metric span{display:block;font-size:12px;color:#6c8379}.metric b{font-size:19px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px}.controls label{display:block;font-size:13px}input[type=range]{width:100%;accent-color:#247f61}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.explain{padding:13px;background:#f5f8ec;border-radius:9px;margin:14px 0;color:#4e6342;font-size:14px}.ask{border-top:1px solid #e3ece7;margin-top:18px;padding-top:15px}.primary{color:white;background:#207962;border-color:#207962}.primary:hover{background:#17644f}.status{font-size:12px;color:#6b8178;margin:7px 0 0}.follow{padding:12px 16px;margin:18px 0;border-left:3px solid #6aab8d;background:#eaf4ed;border-radius:6px;max-width:720px}.composer{padding:12px 22px;border-top:1px solid #dde9e2;background:white}.composer input{padding:11px 14px;border:1px solid #b9d0c3;border-radius:10px;width:100%}.chip{font-size:12px;color:#49735e;margin:0 0 6px}.chip button{border:0;padding:0 7px}.hide{display:none}@media(max-width:900px){.app{grid-template-columns:180px 1fr}.history{padding:18px}.card{padding:18px}.controls{grid-template-columns:1fr;gap:9px}}@media(max-width:600px){header{height:46px;padding:0 14px;font-size:13px;gap:24px}.app{display:block;height:calc(100dvh - 99px)}aside{display:none}.demo{font-size:11px;padding:5px 12px;min-height:53px}.chat{height:100%}.title{padding:10px 14px}.history{padding:16px 11px}.card{padding:15px;border-radius:12px}.request{font-size:14px}.metrics{gap:6px}.metric{padding:8px}.metric b{font-size:17px}.actions button{flex:1}.ask button{width:100%}.composer{padding:10px 12px}h2{font-size:19px}}
</style>
<div class="demo">设计原型：沿用聊天背景；本次修改为可持续探索、多种本地动作与继续提问。内容仅演示，未连接模型或后端。</div>
<header><b>✓ nano IM</b><span>Chat</span><span>Tasks</span><span>Agents</span></header>
<div class="app"><aside><small>MESSAGES</small><p>✦ 小航<br><small>你的助手</small></p></aside><div class="chat"><div class="title"><b>小航</b><small>在线</small></div><main class="history" id="history"><div class="request">匀速运动和加速运动有什么区别？</div><section class="reply"><div class="name">小航</div><p class="intro">匀速时，相同时间走过的距离相同；加速时，后面每一秒走得更远。你可以改变时间，观察这两种运动的区别。</p><div class="card"><h2>每一秒，走了多远？</h2><div class="muted">切换运动方式，观察时间、速度和距离的关系</div><div class="tabs" role="tablist"><button role="tab" id="accelerating" aria-selected="true">匀加速</button><button role="tab" id="constant" aria-selected="false">匀速</button></div><div class="track"><div class="dot" id="dot"></div></div><div class="ends"><span>起点</span><span>100 米</span></div><div class="metrics"><div class="metric"><span>经过时间</span><b id="timeValue">2 秒</b></div><div class="metric"><span>当前速度</span><b id="speed">4 米/秒</b></div><div class="metric"><span>累计距离</span><b id="distance">4 米</b></div></div><div class="controls"><label>经过时间<input type="range" id="time" min="0" max="5" step="1" value="2" aria-label="经过时间"></label><label><span id="parameterName">加速度</span>：<b id="parameterValue">2 米/秒²</b><input type="range" id="parameter" min="1" max="8" value="2" aria-label="运动参数"></label></div><div class="actions"><button id="previous">上一秒</button><button id="next">下一秒</button><button id="reset">重置</button></div><div class="explain" id="explain"></div><div class="ask"><button class="primary" id="ask">解释当前结果</button><p class="status" id="status">可直接改变参数，或把当前结果交给小航进一步解释。</p></div></div></section><div id="followups"></div></main><footer class="composer"><div id="chip" class="chip hide">附带当前探索状态 <button id="detach" aria-label="取消附带状态">×</button></div><input id="message" aria-label="给小航发消息" placeholder="继续提问…"></footer></div></div>
<script>
const $=id=>document.getElementById(id);let mode='accelerating',count=0;function values(){let t=+$('time').value,p=+$('parameter').value;return {t,p,v:mode==='constant'?p:p*t,s:mode==='constant'?p*t:p*t*t/2}}
function update(touched=true){const {t,p,v,s}=values();$('accelerating').setAttribute('aria-selected',String(mode==='accelerating'));$('constant').setAttribute('aria-selected',String(mode==='constant'));$('timeValue').textContent=t+' 秒';$('speed').textContent=v+' 米/秒';$('distance').textContent=s+' 米';$('parameterName').textContent=mode==='constant'?'速度':'加速度';$('parameterValue').textContent=p+(mode==='constant'?' 米/秒':' 米/秒²');$('dot').style.left='calc('+Math.min(100,s)+'% - '+Math.min(22,s/100*22)+'px)';$('explain').textContent=mode==='constant'?`速度始终是 ${p} 米/秒，每多走 1 秒，就多走 ${p} 米。`:`经过 ${t} 秒，速度增加到 ${v} 米/秒。之后的每一秒，会比前一秒走得更远。`;$('previous').disabled=t===0;$('next').disabled=t===5;if(touched)$('chip').classList.remove('hide')}
$('time').oninput=()=>update();$('parameter').oninput=()=>update();$('accelerating').onclick=()=>{mode='accelerating';update()};$('constant').onclick=()=>{mode='constant';update()};$('next').onclick=()=>{$('time').value=Math.min(5,+$('time').value+1);update()};$('previous').onclick=()=>{$('time').value=Math.max(0,+$('time').value-1);update()};$('reset').onclick=()=>{mode='accelerating';$('time').value=2;$('parameter').value=2;update()};$('detach').onclick=()=>$('chip').classList.add('hide');function send(text){const {t,v,s}=values();const p=document.createElement('p');p.className='follow';p.textContent=`${text} · ${mode==='constant'?'匀速':'匀加速'}，${t} 秒，${v} 米/秒，${s} 米。`; $('followups').append(p);$('status').textContent='请求已保存，等待小航回复。你可以继续探索。';$('chip').classList.add('hide');count++;} $('ask').onclick=()=>send('解释当前结果');$('message').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){send(e.target.value);e.target.value=''}};update(false);
</script></html>
