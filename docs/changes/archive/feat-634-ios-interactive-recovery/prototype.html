<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>feat-634 · 原生交互与发送恢复</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#edf1f0;color:#172c29}aside{max-width:950px;margin:0 auto 24px;color:#536764}main{max-width:390px;margin:auto;background:white;border-radius:28px;overflow:hidden;box-shadow:0 12px 60px #183f2b18}.bar{padding:22px;border-bottom:1px solid #edf1ef;font-weight:650}.chat{padding:18px}.stamp{font-size:12px;color:#71817e;margin-bottom:10px}.bubble{background:#f6f8f7;border:1px solid #e6ebe8;border-radius:16px;padding:16px}h2{font-size:22px;line-height:1.4;margin:8px 0 12px}p{line-height:1.65;margin:8px 0}.small{font-size:13px;color:#61746e}.controls{padding:16px;background:#edf4f0;border-radius:12px;margin:18px 0}label{font-size:14px;font-weight:600;display:block;margin-bottom:10px}input{font:inherit;max-width:100%;accent-color:#267969}input[type=number]{width:100%;border:1px solid #cbd9d2;border-radius:8px;padding:10px;background:white}.result{font-size:28px;font-weight:700;color:#236a58;margin:14px 0}.graph{display:flex;gap:18px;align-items:flex-end;height:125px;border-bottom:1px solid #9aada5;padding:0 20px;margin:15px 0 8px}.graph span{width:45px;min-height:5px;background:#67a28c;border-radius:6px 6px 0 0}button{font:inherit;background:#227767;color:white;border:0;border-radius:11px;padding:13px 18px;cursor:pointer;min-height:44px}button.secondary{background:#e9f1ec;color:#235e50}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.composer{padding:16px;border-top:1px solid #e6ebe8}.composer input{border:1px solid #dce5df;border-radius:12px;padding:13px;width:100%;background:#fafcfb}.notice{padding:12px;background:#f6f2e6;border-radius:10px;font-size:13px;margin-top:12px}.demo{max-width:600px;margin:25px auto;display:flex;gap:12px;flex-wrap:wrap}.demo button{background:#dce8e0;color:#345a4a}#receipt{display:none;background:#eaf4ed;border-radius:10px;padding:12px;margin-top:14px}body.large main{font-size:21px}body.large h2{font-size:27px}@media(max-width:500px){body{padding:12px}main{border-radius:18px;width:100%}}
</style><aside>现有界面背景：原生聊天气泡、底部输入区。新增：气泡内可操作内容与恢复提示。本页仅演示设计，不接服务端。</aside><main><div class="bar">‹　我的 Agent</div><div class="chat"><div class="stamp">Agent · 刚刚</div><article class="bubble"><p class="small">调节阅读时间，看看一周能积累多少。</p><h2>把每天的一点时间，变成一周的进步</h2><div class="controls"><label for="minutes">每天阅读（分钟）</label><input id="minutes" type="number" min="0" max="120" value="20" oninput="update()"></div><div class="result" id="weekly">140 分钟 / 周</div><div class="graph"><span id="bar1" style="height:16px"></span><span id="bar3" style="height:48px"></span><span id="bar7" style="height:112px"></span></div><p class="small">第 1 天　　　　第 3 天　　　　第 7 天</p><p class="small">按每天相同时间计算。图中表示时间投入，不代表阅读效果。</p><div class="actions" id="actions"><button onclick="document.getElementById('receipt').style.display='block'">按当前选择帮我安排</button><button class="secondary" onclick="minutes.value=20;update()">恢复默认</button></div><div id="receipt" role="status">请求已发送，Agent 将在聊天中回复。</div><p id="readonly" class="small" hidden>历史回复，仅供阅读</p></article></div><div class="composer"><div id="recovery" class="notice" hidden>正在核对上次发送…<button class="secondary" onclick="this.parentElement.textContent='已找到原消息，聊天记录已恢复。'">重试核对</button></div><div id="conflict" class="notice" hidden>其他设备已更新这张卡片<button class="secondary" onclick="minutes.value=30;update();this.parentElement.hidden=true">读取最新</button></div><input value="稍后请提醒我" placeholder="发送消息…" aria-label="聊天输入"></div></main><div class="demo" aria-label="仅演示控制"><button onclick="document.getElementById('recovery').hidden=false">演示发送未知</button><button onclick="document.getElementById('actions').hidden=true;document.getElementById('readonly').hidden=false">演示只读历史</button><button onclick="document.getElementById('conflict').hidden=false">演示草稿冲突</button><button onclick="document.body.classList.toggle('large')">大字体</button></div><script>function update(){let n=Math.max(0,Math.min(120,Number(minutes.value)||0));weekly.textContent=n*7+' 分钟 / 周';for(let d of [1,3,7])document.getElementById('bar'+d).style.height=Math.max(3,n*d*.8)+'px'}</script></html>
