<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feature 联动 · 设计原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8edf0;color:#243139;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #63b9ad;outline-offset:3px}.demo{padding:14px 24px;background:#203b40;color:white;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.demo label{display:flex;align-items:center;gap:7px}.demo select,.demo button{padding:5px 9px;border:0;border-radius:5px}.demo small{opacity:.75}.shell{width:1440px;max-width:100%;margin:18px auto;container-type:inline-size;background:#f8fafb;min-height:930px;box-shadow:0 4px 24px #24313912}.app{display:grid;grid-template-columns:240px minmax(0,1fr)}aside{background:#eff4f4;padding:24px 18px;border-right:1px solid #e1e8e8}.logo{font-size:20px;font-weight:700;margin-bottom:28px}.nav{padding:12px 14px;border-radius:8px}.nav.active{background:#dcece9;color:#157467}main{padding:30px 44px 48px;min-width:0}.top{display:flex;align-items:center;gap:14px}.avatar{display:grid;place-items:center;background:#e1f1ed;color:#18806f;width:48px;height:48px;border-radius:15px;font-size:23px}.identity{flex:1}.identity h1{font-size:22px;margin:0}.muted{color:#77868b;font-size:12px}.save{border:0;border-radius:8px;background:#147e70;color:white;padding:9px 20px;white-space:nowrap}.tabs{display:flex;gap:30px;border-bottom:1px solid #dde5e6;margin:22px 0}.tabs span{padding:9px 0;color:#7c898e}.tabs .selected{color:#177d70;border-bottom:2px solid}.panel{background:white;border:1px solid #e0e6e7;border-radius:12px;margin:18px 0;padding:22px}h2{font-size:16px;margin:0 0 4px}.sub{color:#7c898e;margin:0 0 16px;font-size:13px}.features{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feature{border:1px solid #e1e7e7;border-radius:9px;padding:14px;display:flex;align-items:center;gap:12px;min-height:88px;background:white;text-align:left;color:inherit}.feature[aria-checked=true]{border-color:#a7d3c8;background:#f6fbf9}.feature .copy{flex:1}.feature b{font-size:14px;display:block}.feature small{display:block;color:#7b878a;font-size:12px;margin-top:3px}.toggle{width:32px;height:19px;border-radius:20px;background:#cdd5d7;position:relative;flex-shrink:0}.toggle:after{content:"";width:15px;height:15px;position:absolute;left:2px;top:2px;background:white;border-radius:50%;box-shadow:0 1px 2px #0002}.feature[aria-checked=true] .toggle{background:#198775}.feature[aria-checked=true] .toggle:after{left:15px}.choices{display:flex;gap:9px;flex-wrap:wrap}.chip{border:1px solid #dce4e6;background:#fff;color:#66777d;border-radius:7px;padding:7px 11px;font-size:12px;overflow-wrap:anywhere}.chip[aria-checked=true]{background:#e8f5f0;border-color:#9bcebd;color:#14715d}.chip .check{display:inline-block;width:17px}.toast{position:fixed;z-index:1000;width:max-content;max-width:min(320px,calc(100vw - 32px));background:#303638;color:#fff;padding:8px 12px;border-radius:7px;font-size:13px;font-weight:400;line-height:1.5;box-shadow:0 4px 16px #17212624;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s}.toast.show{opacity:1;visibility:visible}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.text-button{background:none;border:0;color:#15816e;font-size:12px;padding:4px}.ios-only{display:none}.ios{max-width:390px;background:#f2f2f7}.ios .app{display:block}.ios aside,.ios .tabs,.ios .avatar,.ios .identity .muted{display:none}.ios main{padding:16px}.ios .identity h1{font-size:17px;text-align:center}.ios .top{position:sticky;top:0;background:#f2f2f7;z-index:2;padding:6px 0 14px;gap:8px}.ios .ios-only{display:block;color:#16816f}.ios .save{padding:5px;background:none;color:#16816f}.ios .panel{padding:14px 16px;border:0;border-radius:12px}.ios h2{font-size:14px}.ios .features{display:block}.ios .feature{padding:12px 0;border:0;border-bottom:1px solid #e5e5ea;border-radius:0;width:100%;min-height:63px;background:white}.ios .feature:last-child{border:0}.ios .feature small{font-size:11px}.ios .toggle{width:42px;height:25px}.ios .toggle:after{width:21px;height:21px}.ios .feature[aria-checked=true] .toggle:after{left:19px}.ios .choices{display:block}.ios .chip{display:flex;justify-content:space-between;flex-direction:row-reverse;border:0;border-bottom:1px solid #e5e5ea;border-radius:0;width:100%;padding:10px 0;background:white;color:#243139;font-size:14px}.ios .chip .check{color:#16816f}.ios .sub{font-size:12px}
@container (max-width:900px){.app{grid-template-columns:180px minmax(0,1fr)}main{padding:24px}.features{grid-template-columns:1fr}.panel{padding:18px}}
@container (max-width:550px){.app{display:block}aside{display:none}main{padding:20px 16px}.identity h1{font-size:19px}.panel{padding:16px}.tabs{gap:24px}.feature{min-height:80px}.chip{padding:7px 8px}.save{padding:8px 14px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none;transform:none}}
</style>
<div class="demo"><strong>设计演示</strong><label>画布 <select id="canvas"><option value="1440">Web 1440</option><option value="768">Web 768</option><option value="390">Web 390</option><option value="ios">iOS 意图</option></select></label><label><input id="tasks" type="checkbox">doing / waiting</label><label><input id="schedules" type="checkbox">生效的定时安排</label><label><input id="busy" type="checkbox">维护 / 心跳在途</label><label><input id="race" type="checkbox">保存前新增 Task</label><button id="reset">恢复默认</button><small>仅本地草稿，不连接产品</small></div>
<div class="shell" id="shell"><div class="app"><aside><div class="logo">nano</div><div class="nav">聊天</div><div class="nav">任务</div><div class="nav active">Agents</div><div class="nav">电脑</div></aside><main><div class="top"><span class="ios-only">‹ 返回</span><div class="avatar">N</div><div class="identity"><h1>Nano Assistant</h1><div class="muted">个人 Agent · Mac mini</div></div><button class="save" id="save">保存</button></div><div class="tabs"><span class="selected">配置</span><span>渠道</span><span>插件</span></div><section class="panel"><h2>运行特性</h2><p class="sub">选择 Agent 在工作中使用的能力</p><div class="features" id="features"></div></section><section class="panel"><div class="section-heading"><h2>工具</h2><button class="text-button" id="clear-tools">取消选择</button></div><p class="sub">设置 Agent 可调用的工具</p><div class="choices" id="tools"></div></section><section class="panel"><div class="section-heading"><h2>Skills</h2><button class="text-button" id="clear-skills">取消选择</button></div><p class="sub">内置 Skills</p><div class="choices" id="skills"></div></section><div class="muted" id="saved">有未保存的更改</div></main></div></div>
<div class="toast" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
const defs={intelligent_ui:{name:'交互式回复',desc:'通过卡片与交互内容呈现结果',tools:['send_message','skill'],skills:['nano-interactive-ui']},task_graph:{name:'任务图',desc:'保存计划、持续推进与等待复查',tools:['task_graph'],features:['cron_scheduling']},memory_curation:{name:'记忆维护',desc:'记住偏好并维护长期记忆',tools:['memory','read']},skill_creation:{name:'Skill 创建',desc:'沉淀经验并维护可复用技能',tools:['skill_manage','skill','read']},cron_scheduling:{name:'Cron 定时调度',desc:'创建、管理与执行定时安排',tools:['schedule_create','schedule_list','schedule_update','schedule_delete','schedule_run','schedule_history']},heartbeat:{name:'Heartbeat 心跳',desc:'按节律检查需要关注的事项',tools:['read']}};
const fixed=['inbox','conversations','send_message','subagent','personal_sources','notes','history','new_context','get_context_remaining'];
const allTools=[...new Set([...fixed,'read','write','edit','bash','skill','task_graph','memory','skill_manage',...defs.cron_scheduling.tools])];
const allSkills=['nano-interactive-ui','nano-product'];let state, saved, timer;
const $=id=>document.getElementById(id);
function enable(s,key){s.features.add(key);for(const f of defs[key].features||[])enable(s,f);for(const t of defs[key].tools)s.tools.add(t);for(const k of defs[key].skills||[])s.skills.add(k)}
function needed(s,kind,key){return Object.keys(defs).filter(f=>s.features.has(f)&&(defs[f][kind]||[]).includes(key))}
function copy(s){return {features:new Set(s.features),tools:new Set(s.tools),skills:new Set(s.skills)}}
function hideFeedback(){clearTimeout(timer);$('feedback').classList.remove('show')}
function toast(kind,msg){
  clearTimeout(timer);
  const t=$('feedback'),trigger=document.activeElement;
  t.textContent=msg;
  const anchor=(trigger?.querySelector('.toggle')||trigger||$('save')).getBoundingClientRect();
  const margin=16,gap=8,screen=$('shell').getBoundingClientRect();
  const left=Math.max(0,screen.left)+margin,right=Math.min(innerWidth,screen.right)-margin;
  t.style.maxWidth=Math.min(320,right-left)+'px';
  const box=t.getBoundingClientRect();
  const x=Math.max(left,Math.min(anchor.left+anchor.width/2-box.width/2,right-box.width));
  const above=anchor.top-box.height-gap;
  t.style.left=x+'px';
  t.style.top=(above>=margin?above:Math.min(anchor.bottom+gap,innerHeight-box.height-margin))+'px';
  t.classList.add('show');
  timer=setTimeout(hideFeedback,2000);
}
addEventListener('scroll',hideFeedback,true);
addEventListener('resize',hideFeedback);

function guard(key){if(key==='task_graph'&&$('tasks').checked)return '还有进行中或等待中的任务，请先暂停或结束这些任务，再关闭 Task';if(key==='cron_scheduling'&&$('schedules').checked)return '还有生效中的定时安排，请先删除这些安排，再关闭 Cron';if(['memory_curation','skill_creation','heartbeat'].includes(key)&&$('busy').checked)return key==='heartbeat'?'心跳工作尚未结束，请稍后再关闭':'维护工作尚未结束，请稍后再关闭';return null}
function change(kind,key){hideFeedback();const s=copy(state),on=s[kind].has(key),where={features:'feature',tools:'tool',skills:'skill'}[kind];if(on){const users=needed(s,kind,key);if(users.length)return toast(where,users.length===1?'请先关闭「'+defs[users[0]].name+'」':'请先关闭使用此项的功能，再调整此项');if(kind==='tools'&&fixed.includes(key))return toast(where,'这是当前运行模式的基础能力，需保持开启');if(kind==='features'){const why=guard(key);if(why)return toast(where,why)}s[kind].delete(key);if(kind==='features')for(const k of ['tools','skills'])for(const n of defs[key][k]||[])if(!needed(s,k,n).length&&!(k==='tools'&&fixed.includes(n)))s[k].delete(n)}else if(kind==='features')enable(s,key);else s[kind].add(key);state=s;render()}
function render(){for(const kind of ['features','tools','skills']){const root=$(kind);if(!root.children.length){const names=kind==='features'?Object.keys(defs):kind==='tools'?allTools:allSkills;for(const key of names){const b=document.createElement('button');b.type='button';b.dataset.key=key;b.setAttribute('role',kind==='features'?'switch':'checkbox');b.setAttribute('aria-label',kind==='features'?defs[key].name:key);b.className=kind==='features'?'feature':'chip';b.innerHTML=kind==='features'?'<span class="copy"><b>'+defs[key].name+'</b><small>'+defs[key].desc+'</small></span><span class="toggle"></span>':'<span class="check"></span>'+key;b.onclick=()=>change(kind,key);root.append(b)}}for(const b of root.children){if(!b.dataset.key)continue;const on=state[kind].has(b.dataset.key);b.setAttribute('aria-checked',on);if(kind!=='features')b.querySelector('.check').textContent=on?'✓':''}}$('saved').textContent='有未保存的更改'}
function reset(){hideFeedback();state={features:new Set(),tools:new Set([...fixed,'write','edit','bash']),skills:new Set(['nano-product'])};for(const f of ['intelligent_ui','task_graph','memory_curation','skill_creation'])enable(state,f);saved=copy(state);render();$('saved').textContent='已载入示例配置'}
for(const kind of ['tools','skills'])$('clear-'+kind).onclick=()=>{let blocked=false;for(const k of [...state[kind]]){if(needed(state,kind,k).length||(kind==='tools'&&fixed.includes(k)))blocked=true;else state[kind].delete(k)}render();if(blocked)toast(kind==='tools'?'tool':'skill','已保留当前功能需要的能力，其余选择已取消')};
$('save').onclick=()=>{if($('race').checked&&saved.features.has('task_graph')&&!state.features.has('task_graph')){enable(state,'task_graph');render();toast('feature','刚有任务进入执行或等待，Task 已保持开启；其他编辑已保留');return}saved=copy(state);$('saved').textContent='已保存示例配置';toast('feature','已保存')};$('reset').onclick=reset;$('canvas').onchange=()=>{hideFeedback();const v=$('canvas').value;$('shell').classList.toggle('ios',v==='ios');$('shell').style.width=(v==='ios'?'390':v)+'px'};reset();
</script></html>
