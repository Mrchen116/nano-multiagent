<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>聊天搜索原型</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#22313e;background:#f6f8f9}header{height:64px;background:white;border-bottom:1px solid #dbe2e6;padding:20px 24px;font-weight:700}.layout{display:flex;height:calc(100vh - 64px)}aside{width:360px;background:#f5f7f8;border-right:1px solid #dbe2e6;overflow:auto}.head{padding:20px 16px 12px;position:sticky;top:0;background:#f5f7f8}.label{font-size:12px;font-weight:700;letter-spacing:.1em;color:#687a89}.search{width:100%;padding:12px;border:1px solid #cbd5d9;border-radius:9px;margin:16px 0}.tabs{display:flex;justify-content:space-between;color:#607282;font-weight:600}.tabs span:first-child{color:#08766d}.section{padding:12px 20px 5px;font-size:12px;color:#71818e}.row{display:block;width:100%;text-align:left;padding:12px 20px;border:0;border-bottom:1px solid #e5eaed;background:transparent;color:inherit;cursor:pointer}.row:hover{background:#e8f3f0}.title{font-weight:650}.meta{float:right;font-size:12px;color:#71818e}.snippet{display:block;margin-top:5px;color:#5a6c79;line-height:1.45}.more{margin:12px 20px;color:#08766d;border:0;background:none;cursor:pointer}main{flex:1;display:grid;place-items:center;color:#82909b}.hint{padding:8px 20px;color:#71818e;font-size:12px}@media(max-width:600px){aside{width:100%;border:0}main{display:none}}
</style>
<header>✓ &nbsp; nano IM <span style="float:right;color:#08766d">Chat　　<span style="color:#667789">Tasks　　Agents</span></span></header><div class="layout"><aside><div class="head"><span class="label">MESSAGES</span><input class="search" aria-label="搜索" value="发布"><div class="tabs"><span>All</span><span>People</span><span>Agent</span><span>Group</span></div></div><button class="row"><span class="title">✦　个人助手</span><span class="snippet">　　个人助手 · 持续替你跟进</span></button><div class="section">会话</div><button class="row"><span class="title">产品发布群</span><span class="meta">昨天</span><span class="snippet">小李：发布计划更新了</span></button><div class="section">聊天记录</div><div id="results"><button class="row" onclick="document.querySelector('main').textContent='已打开产品讨论群，定位到原消息'"><span class="title">产品讨论群</span><span class="meta">10月29日</span><span class="snippet">小李：周四发布方案已经确认，我们按这个时间推进。</span></button><button class="row" onclick="document.querySelector('main').textContent='已打开设计协作，定位到原消息'"><span class="title">设计协作</span><span class="meta">10月24日</span><span class="snippet">小王：先整理发布所需的图片和文案。</span></button><button class="more" onclick="this.textContent='没有更多结果'">加载更多</button></div><div class="hint">仅搜索已同步的聊天记录</div><hr><div class="hint">仅演示：<button onclick="document.querySelector('#results').innerHTML='<div class=hint>正在搜索…</div>'">加载</button> <button onclick="document.querySelector('#results').innerHTML='<div class=hint>没有匹配的聊天记录</div>'">空结果</button> <button onclick="document.querySelector('#results').innerHTML='<div class=hint>搜索失败 <button onclick=location.reload()>重试</button></div>'">失败</button></div></aside><main>现有聊天详情区域</main></div></html>
