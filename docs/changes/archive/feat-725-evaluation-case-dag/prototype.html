<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>评测 Case 原型</title><style>body{margin:0;font:15px/1.7 system-ui;color:#243544;background:#f3f6f8}header{padding:20px 28px;background:white;border-bottom:1px solid #d9e2e8}main{display:grid;grid-template-columns:190px 1fr 340px;height:calc(100vh - 84px)}nav,article,section{padding:20px;overflow:auto}nav{border-right:1px solid #d9e2e8}button{display:block;font:inherit;padding:9px 12px;border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer;width:100%;color:inherit}button:hover,.active{background:#dcebf2;color:#165f79}h1{font-size:19px;margin:0}h2{font-size:16px;margin:8px 0}small{color:#687e8b}.node{background:white;border:1px solid #cbdbe4;border-left:4px solid #3a7c94;margin:0 auto;width:290px;padding:12px;border-radius:8px}.arrow{text-align:center;font-size:23px;color:#8296a1}article{background:white;border-left:1px solid #d9e2e8}p{white-space:pre-wrap}.tag{font-size:12px;color:#537382}.filters{display:flex;gap:8px;margin-bottom:22px}.filters button{width:auto;background:white;border:1px solid #dbe5eb}@media(max-width:800px){main{grid-template-columns:130px 1fr;height:auto}article{grid-column:1/-1}.node{width:230px}}</style><header><h1>能力评测 <small>交互原型 · 尚未运行</small></h1></header><main><nav id="nav"></nav><section><h2 id="suite">内部协作 · GC-01</h2><div class="filters"><select id="task" aria-label="任务筛选"><option>全部任务</option><option>iOS</option><option>Computer use</option></select><button id="fail">演示前置缺失</button></div><div id="graph"></div><div id="other"></div></section><article id="detail"></article></main><style>.node{display:block;width:95%;text-align:left;margin:7px auto}.node.active{background:#dcebf2}.blocked{opacity:.55;border-style:dashed}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 system-ui}.hidden{display:none!important}select{font:inherit;padding:8px;background:white;border:1px solid #d9e2e8;border-radius:6px}#other button{border:1px solid #d9e2e8;margin:10px 0}main{grid-template-columns:180px minmax(300px,1fr) 390px}@media(max-width:800px){main{display:block;height:auto}nav{display:flex;gap:8px;overflow:auto;padding:8px}nav button{white-space:nowrap;width:auto}section{max-height:45vh}article{border-top:1px solid #d9e2e8}}</style><script>const nodes=[{"id":"U04","task":"iOS","type":"用户 → 主 Agent","title":"商业 IM 体验目标","text":"总结来说就是现在ios上体验比普通的商业im差很多，帮我把这些问题都找出来","after":[],"source":"12:58 c9872aa1","checks":"原话和可读材料交给实际执行者。"},{"id":"D01","task":"iOS","type":"观察主 Agent 派工","title":"整体 iOS 诊断","text":"等待主 Agent 真正派出整体诊断工作。","after":["U04"],"source":"实际子会话收件","checks":"核查职责、原话、可读附件与判断备注。"},{"id":"S11","task":"iOS","type":"子 Agent → 主 Agent","title":"路线图与两个待决事项","text":"iOS 商业 IM 目标态的只读分析已完成，下面是代码核对结果和建议的路线图。未修改仓库，未在真机验证。\n\n**三条症状**。首屏先等登录恢复和 `/sync`，列表没有本地快照可以先显示（`ChatStore.swift`）。发送 pending 直接锁住输入区，且气泡等服务端响应才合并（`ConversationView.swift`、`ChatStore.swift`）。已读只由消息行进入视口触发，服务端会无条件覆盖读边界，没有跨端读事件（`ChatStore.swift`、`apps/im-server/src/messaging.ts`）。还有每次事件触发重拉、回前台重新同步、网络错误落到登录页、缺媒体缓存和没接上的消息搜索。\n\n**建议拆成九个 unit**。先做本地消息库和冷启动首绘，打开 App 先看到上次内容，网络只做校正。这是发送、已读等多个体验目标的共同底座。之后是发送内核、已读单调与多端收敛、连接韧性、增量同步、后台刷新与本地提醒。媒体缓存、消息搜索和阅读细节可以并行。按用户已经给出的范围排除付费 APNs，只保留后台机会性拉取、本地通知和角标。App 被杀或未运行时的即时提醒无保证，免费签名的后台能力仍需真机验证。\n\n**两项需要你带给用户决定**。\n\n1. 已经点了发送、结果未知的消息，是否允许网络恢复后自动补发？现在的契约只核对，不自动重发。建议对已点发送的消息允许自动补发，以同一个幂等键对账。用户没点发送的草稿始终不自动发。这个对外契约变更要由用户确认。\n2. 现有 bugfix-713 是否缩小范围，只保留 discard 后恢复会话的未读、预览和时间？建议保留这项独立修复，启动和发送交给本地库与发送内核，已读归进多端收敛。此前批准的 713 范围更大，需要用户同意缩小。\n\n其余是工程建议，可按目标取舍。存储推荐 GRDB，保持 iOS 26；Web 同批回归，`/sync` 默认仍全量；不做对方已读回执；本地保留最近 N 页，媒体缓存 500MB 且可清理；后台提醒默认开启，只显示会话名不显示正文。确认两项范围后可以推进 713 与本地库首文档。\n","after":["D01"],"source":"14:52:16 7274b1c5 历史回报清洗版","checks":"实际读到回报，改变发送契约和 713 范围要问用户。"},{"id":"Q11","task":"iOS","type":"观察主 Agent → 用户","title":"公开询问两项决定","text":"真实 IM 出现自动补发和 713 瘦身两个问题后，才触发用户批准。","after":["S11"],"source":"实际根模型请求与 IM 公开消息","checks":"公开提问晚于收到子 Agent 回报，取舍和选项指代明确。"},{"id":"U05e","task":"iOS","type":"用户 → 主 Agent","title":"同意两项决定","text":"这两个点我都同意。\n\n“我按默认定下的（想改就说）：存储用 GRDB（工程里已有 swift-markdown 这个 SPM 依赖先例，纯手写 SQLite 封装也行但规模上调）；最低版本保持 iOS 26；Web 在同一批 unit 里一起回归，但 /sync 默认行为保持全量；不做\"对方已读\"回执；消息保留最近 N 页 + 媒体缓存 500MB 上限、设置页可清理；后台提醒默认开、只显示会话名不显示正文。”\n这个你按商业APP的设计去做就行\n","after":["Q11"],"source":"14:59:41 d22d18f3","checks":"原话和已确认范围交给实际负责者。"},{"id":"U05a","task":"Computer use","type":"用户 → 主 Agent","title":"macOS 开源方案调研","text":"同时，我们现在agent没有computer use的能力，帮我去找开源的computer use的项目，我想做到平替codex的computer use能力在mac系统的效果","after":[],"source":"15:07 dc290ea1","checks":"保持开源、macOS 和效果目标，执行者自主查证。"},{"id":"U01","task":"iOS","type":"用户 → 主 Agent","title":"进入卡顿 · 附原图","text":"我们的ios进去为啥会卡一会，相反，微信不会这样。","after":[],"source":"12:50 ffb8c48f","checks":"执行者同时收到原话和可打开的原图。","attachment":"iOS Chats 原图 ffb8c48fc73049a9a9b290151f4cd495.png，运行时从私有归档读取。"}];let broken=false;
function show(n){document.querySelectorAll('[data-node]').forEach(b=>b.classList.toggle('active',b.dataset.node===n.id));const d=document.querySelector('#detail');d.replaceChildren();for(const [tag,t] of [['small',n.id+' · '+n.type],['h2',n.title],['pre',n.text],['h2','前置条件'],['p',n.after.length?n.after.join(' → '):'独立输入'],['h2','来源'],['p',n.source],['h2','固定检查'],['p',n.checks],['p',n.attachment||'本消息无附件']]){const e=document.createElement(tag);e.textContent=t;d.append(e)}}
function draw(){const g=document.querySelector('#graph');g.replaceChildren();const f=document.querySelector('#task').value;g.style.display='grid';g.style.gridTemplateColumns=f==='全部任务'?'1fr 1fr':'1fr';g.style.gap='12px';const lanes={};for(const task of ['iOS','Computer use']){if(f!=='全部任务'&&f!==task)continue;const lane=document.createElement('div');const heading=document.createElement('h2');heading.textContent=task+(task==='Computer use'?' · 独立旁支':'');lane.append(heading);g.append(lane);lanes[task]=lane}for(const n of nodes.filter(n=>f==='全部任务'||n.task===f)){const lane=lanes[n.task];if(n.after.length){const a=document.createElement('div');a.className='arrow';a.textContent=n.after.join('、')+' ↓ 成功前置';lane.append(a)}const b=document.createElement('button');b.className='node'+(broken&&['Q11','U05e'].includes(n.id)?' blocked':'');b.dataset.node=n.id;b.textContent=n.id+' · '+n.task+' · '+n.type+' — '+n.title+(broken&&n.id==='Q11'?' · 未触发':broken&&n.id==='U05e'?' · 阻断':'');b.onclick=()=>show(n);lane.append(b)}}
document.querySelector('#task').onchange=draw;document.querySelector('#fail').onclick=()=>{broken=!broken;draw()};
for(const name of ['Memory','Intelligent UI','Spec/design alignment','内部协作']){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{document.querySelector('#suite').textContent=name;const coord=name==='内部协作';document.querySelector('#graph').classList.toggle('hidden',!coord);document.querySelector('.filters').classList.toggle('hidden',!coord);const o=document.querySelector('#other');o.classList.toggle('hidden',coord);o.replaceChildren();if(!coord){for(const title of name==='Memory'?['synthetic-city · 记忆更新']:name==='Intelligent UI'?['酒店卡片','广告看板','会议确认','广告分析']:['H01 · 消息交互','H02 · 工具审批','P01 · 跨节点迁移']){const c=document.createElement('button');c.textContent=title;c.onclick=()=>{document.querySelector('#detail').textContent=title+' · 原型材料占位。真实页面加载原有 suite 案例、输入、判定和已有实验入口。'};o.append(c)}}};document.querySelector('#nav').append(b)}draw();show(nodes[2]);</script></html>
