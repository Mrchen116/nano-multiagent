<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>feat-785 · PA 主动性闭环与渐进式目标图交互原型</title>
  <style>
    :root {
      --im-bg: #f7f8fa;
      --im-surface: #ffffff;
      --im-surface-2: #f2f4f0;
      --im-topbar: #f5f5f8;
      --im-hover: #edf2ec;
      --im-accent: #6b43d8;
      --im-accent-2: #5732bf;
      --im-accent-fg: #ffffff;
      --im-accent-soft: #eee7fc;
      --im-accent-border: #d1bff3;
      --im-butter: #fff0b5;
      --im-butter-ink: #5f4810;
      --im-mint: #ddefe5;
      --im-mint-ink: #2a5a43;
      --im-user-bubble: #e3efe5;
      --im-user-bubble-text: #394c40;
      --im-text: #30313d;
      --im-text-muted: #68736b;
      --im-border: #e0e5de;
      --im-border-strong: #bec9bf;
      --im-warning: #9a6116;
      --im-warning-soft: #fdf3e1;
      --im-success: #20835d;
      --im-success-soft: #e7f5ec;
      --im-success-text: #286744;
      --im-shadow-strong: 0 18px 48px -16px rgb(48 32 73 / 0.18);
      --im-font-sans: "Helvetica Neue", "PingFang SC", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #e9ece8;
      color: var(--im-text);
      font-family: var(--im-font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .demo-chrome {
      background: #22232c;
      color: #f3f4f6;
      padding: 8px 14px;
      border-bottom: 1px solid #383a47;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
    }
    .demo-chrome-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .demo-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 11px;
    }
    .demo-tag--bg { background: #373946; color: #d4d7e3; }
    .demo-tag--new { background: #6b43d8; color: #fff; }
    .demo-tag--sim { background: #4b3d1c; color: #ffe59e; }
    .demo-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .demo-btn {
      appearance: none;
      border: 1px solid #484b5c;
      background: #2d2f3b;
      color: #e6e8f0;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11.5px;
      cursor: pointer;
    }
    .demo-btn[aria-pressed="true"] {
      background: #eee7fc;
      color: #3d2194;
      border-color: #c8b2f8;
      font-weight: 600;
    }

    .stage-wrap {
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .product-frame {
      background: var(--im-bg);
      border: 1px solid var(--im-border-strong);
      border-radius: 14px;
      box-shadow: var(--im-shadow-strong);
      overflow: hidden;
      position: relative;
      width: 1240px;
      height: 780px;
      display: flex;
    }
    .product-frame--mobile {
      width: 390px;
      height: 740px;
      border-radius: 26px;
      border-width: 2px;
      flex-direction: column;
    }

    .im-rail {
      width: 86px;
      background: var(--im-topbar);
      border-right: 1px solid var(--im-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px 16px;
      gap: 24px;
      flex-shrink: 0;
    }
    .im-brand {
      width: 46px;
      height: 46px;
      border-radius: 16px 16px 16px 5px;
      background: var(--im-butter);
      color: var(--im-accent);
      font-weight: 800;
      font-size: 20px;
      display: grid;
      place-items: center;
      box-shadow: 0 3px 10px rgb(107 67 216 / 0.08);
    }
    .im-rail-nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      flex: 1;
    }
    .im-rail-item {
      position: relative;
      width: 100%;
      min-height: 62px;
      padding: 8px 4px;
      border-radius: 14px;
      border: 0;
      background: transparent;
      color: #59685e;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.15s, color 0.15s;
    }
    .im-rail-item:hover { background: rgb(255 255 255 / 0.65); }
    .im-rail-item--active {
      background: #ffffff;
      color: var(--im-accent);
      box-shadow: 0 2px 6px rgb(41 53 47 / 0.07);
    }
    .im-rail-item svg { width: 22px; height: 22px; }
    .im-rail-badge {
      position: absolute;
      top: 6px;
      right: 10px;
      min-width: 17px;
      height: 17px;
      font-size: 10.5px;
      font-weight: 700;
      background: var(--im-accent);
      color: #fff;
      border-radius: 999px;
      padding: 0 5px;
      line-height: 17px;
    }
    .im-rail-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffe8c9;
      color: #795839;
      font-size: 13px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    .im-bottombar {
      height: 58px;
      background: var(--im-surface);
      border-top: 1px solid var(--im-border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      flex-shrink: 0;
    }
    .im-bottombar button {
      border: 0;
      background: transparent;
      color: var(--im-text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .im-bottombar-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 26px;
      border-radius: 10px;
    }
    .im-bottombar-icon svg { width: 20px; height: 20px; }
    .im-bottombar button.is-active { color: var(--im-text); font-weight: 700; }
    .im-bottombar button.is-active .im-bottombar-icon { background: var(--im-butter); color: var(--im-text); }

    .workspace {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--im-bg);
      overflow-y: auto;
    }

    .topbar {
      background: var(--im-surface);
      border-bottom: 1px solid #e8ece6;
      padding: 12px 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .product-frame--mobile .topbar { padding: 10px 14px; gap: 8px; }
    .topbar-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .topbar-title {
      margin: 0;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: var(--im-text);
    }

    /* Warm, playful pill segmented switch */
    .scope-tabs {
      display: inline-flex;
      background: #eff2ee;
      border-radius: 999px;
      padding: 3.5px;
      gap: 3px;
    }
    .scope-tab {
      border: 0;
      background: transparent;
      color: #5d6860;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }
    .scope-tab:hover:not(.is-active) {
      color: var(--im-text);
      background: rgb(255 255 255 / 0.55);
    }
    .scope-tab.is-active {
      background: #ffffff;
      color: var(--im-accent);
      font-weight: 700;
      box-shadow: 0 2px 8px rgb(48 32 73 / 0.08);
    }
    .scope-tab-count {
      display: inline-grid;
      place-items: center;
      min-width: 19px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgb(48 49 61 / 0.07);
      color: inherit;
    }
    .scope-tab.is-active .scope-tab-count {
      background: var(--im-accent-soft);
      color: var(--im-accent);
    }
    .scope-tab-count--butter {
      background: var(--im-butter) !important;
      color: var(--im-butter-ink) !important;
    }

    /* Custom friendly pill popovers & soft search (NO raw native <select>) */
    .menu-anchor { position: relative; display: inline-flex; }
    .pill-select-btn {
      appearance: none;
      border: 1px solid transparent;
      background: #f1f4f0;
      color: var(--im-text);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .pill-select-btn:hover, .pill-select-btn[aria-expanded="true"] {
      background: #e8ede7;
      border-color: #d6dfd4;
    }
    .pill-select-btn--butter {
      background: #fff3bf;
      color: #644b08;
    }
    .pill-select-btn--butter:hover, .pill-select-btn--butter[aria-expanded="true"] {
      background: #ffeb99;
      border-color: #ebd06b;
    }
    .pill-select-btn--mint {
      background: #dff3e8;
      color: #21573b;
    }
    .pill-select-btn--mint:hover, .pill-select-btn--mint[aria-expanded="true"] {
      background: #cfecdc;
      border-color: #b1dec6;
    }
    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--im-accent);
    }
    .popover-menu {
      position: absolute;
      top: calc(100% + 7px);
      left: 0;
      min-width: 210px;
      background: #ffffff;
      border: 1px solid #e3dfee;
      border-radius: 15px;
      padding: 6px;
      box-shadow: 0 12px 32px rgb(48 32 73 / 0.14);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .popover-menu--right { left: auto; right: 0; }
    .popover-option {
      appearance: none;
      border: 0;
      background: transparent;
      border-radius: 10px;
      padding: 8px 11px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--im-text);
      font-size: 12.5px;
      font-weight: 600;
    }
    .popover-option:hover { background: #f5f2fc; }
    .popover-option.is-selected { color: var(--im-accent); background: #f7f4fe; }
    .popover-option small { display: block; font-size: 11px; font-weight: 400; color: var(--im-text-muted); margin-top: 1px; }

    .search-shell {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .search-shell svg {
      position: absolute;
      left: 11px;
      width: 14px;
      height: 14px;
      color: #828d85;
      pointer-events: none;
    }
    .search-input {
      width: 196px;
      border: 1.5px solid transparent;
      background: #f1f4f0;
      border-radius: 999px;
      padding: 6.5px 12px 6.5px 31px;
      font-size: 12.5px;
      color: var(--im-text);
      outline: none;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .search-input::placeholder { color: #848f87; }
    .search-input:hover { background: #ebefe9; }
    .search-input:focus {
      background: #ffffff;
      border-color: var(--im-accent-border);
      box-shadow: 0 0 0 3px var(--im-accent-soft);
    }

    /* Friendly, cushioned pill buttons */
    .btn {
      appearance: none;
      border: 0;
      background: #f1f4f0;
      color: #36403a;
      border-radius: 999px;
      padding: 6.5px 13px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      line-height: 1.3;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.14s ease, transform 0.1s ease, box-shadow 0.14s ease;
    }
    .btn:hover:not(:disabled) { background: #e5ebe4; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.48; cursor: not-allowed; }
    .btn--primary {
      background: var(--im-accent);
      color: var(--im-accent-fg);
      box-shadow: 0 3px 10px rgb(107 67 216 / 0.22);
    }
    .btn--primary:hover:not(:disabled) {
      background: var(--im-accent-2);
      box-shadow: 0 4px 12px rgb(107 67 216 / 0.3);
    }
    .btn--stash {
      background: #f6f2e4;
      color: #5c5236;
    }
    .btn--stash:hover:not(:disabled) { background: #eee7ce; }
    .btn--ghost {
      background: transparent;
      color: var(--im-text-muted);
      padding: 6.5px 10px;
    }
    .btn--ghost:hover:not(:disabled) {
      background: #eef1ed;
      color: var(--im-text);
    }
    .btn--soft {
      background: var(--im-accent-soft);
      color: var(--im-accent);
    }
    .btn--soft:hover:not(:disabled) { background: #e3d7fb; }

    /* Plush conversational quick-jot bar */
    .quick-create {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--im-surface);
      border: 1.5px solid #e4e9e2;
      border-radius: 18px;
      padding: 7px 8px 7px 9px;
      align-items: center;
      box-shadow: 0 8px 22px -14px rgb(48 32 73 / 0.14);
      transition: border-color 0.16s, box-shadow 0.16s;
    }
    .quick-create:focus-within {
      border-color: var(--im-accent-border);
      box-shadow: 0 8px 24px -10px rgb(107 67 216 / 0.16), 0 0 0 3px var(--im-accent-soft);
    }
    .quick-create input {
      flex: 1;
      border: 0;
      outline: none;
      font-size: 13.5px;
      background: transparent;
      color: var(--im-text);
      min-width: 130px;
      padding: 4px 4px;
    }
    .quick-create input::placeholder { color: #87928a; }

    .focus-body {
      padding: 15px 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1040px;
    }
    .product-frame--mobile .focus-body {
      padding: 11px 14px 20px;
      gap: 13px;
    }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px 10px;
      margin-bottom: 7px;
    }
    .section-title {
      margin: 0;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--im-text);
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .count-pill {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--im-surface-2);
      color: var(--im-text-muted);
    }
    .count-pill--butter { background: var(--im-butter); color: var(--im-butter-ink); }
    .section-sub { font-size: 12px; color: var(--im-text-muted); }

    .stack-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .focus-card {
      background: var(--im-surface);
      border: 1px solid var(--im-border);
      border-radius: 13px;
      padding: 12px 15px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
    }
    .focus-card:hover {
      border-color: var(--im-accent-border);
      box-shadow: 0 6px 18px -12px rgb(48 32 73 / 0.14);
    }
    .focus-card.is-selected {
      border-color: var(--im-accent);
      box-shadow: 0 0 0 3px var(--im-accent-soft);
    }
    .focus-card--proposal { border-left: 3.5px solid #dfa928; }
    .focus-card--stashed {
      background: #fafbf9;
      border-style: dashed;
    }

    /* Right-side Task Detail Drawer (Mobile Bottom Sheet) */
    .task-drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgb(24 28 36 / 0.20);
      display: flex;
      justify-content: flex-end;
      z-index: 24;
    }
    .product-frame--mobile .task-drawer-backdrop {
      align-items: flex-end;
    }
    .task-drawer {
      width: 452px;
      max-width: 92%;
      height: 100%;
      background: var(--im-surface);
      border-left: 1px solid var(--im-border);
      box-shadow: -14px 0 38px rgb(36 28 58 / 0.14);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .product-frame--mobile .task-drawer {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 85%;
      border-left: 0;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -12px 36px rgb(36 28 58 / 0.18);
    }
    .task-drawer-head {
      padding: 15px 18px 13px;
      border-bottom: 1px solid #ebeee9;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .task-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 15px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .drawer-section {
      background: var(--im-bg);
      border: 1px solid #e7ebe5;
      border-radius: 13px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--im-text);
    }
    .drawer-section--butter {
      background: #fffcf0;
      border-color: #efe0a6;
    }
    .drawer-section--wait {
      background: #fffaf2;
      border-color: #f0d7ac;
    }
    .drawer-section--draft {
      background: #faf8ff;
      border-color: #e1d6fa;
    }
    .drawer-section-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--im-text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .drawer-section ul, .drawer-section ol {
      margin: 2px 0 0;
      padding-left: 18px;
    }
    .drawer-section li { margin-bottom: 3px; }
    .task-drawer-foot {
      padding: 12px 18px;
      border-top: 1px solid #ebeee9;
      background: var(--im-surface);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .product-frame--mobile .focus-card {
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
    }
    .card-main { min-width: 0; flex: 1; }
    .goal-crumb {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--im-accent);
      font-weight: 600;
      background: var(--im-accent-soft);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      border: 0;
      cursor: pointer;
      text-align: left;
    }
    .goal-crumb--idea { background: var(--im-surface-2); color: var(--im-text-muted); font-weight: 600; }
    .goal-crumb--team { background: var(--im-surface-2); color: #396250; font-weight: 600; }
    .card-title {
      margin: 0 0 2px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--im-text);
    }
    .card-desc { margin: 0; font-size: 12px; color: var(--im-text-muted); }
    .card-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px 12px;
      margin-top: 6px;
      font-size: 11.5px;
      color: var(--im-text-muted);
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .product-frame--mobile .card-actions {
      width: 100%;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .calm-zero {
      background: var(--im-surface);
      border: 1px solid var(--im-border);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 12.5px;
      color: var(--im-text-muted);
    }

    /* Stashed & Completed Drawer */
    .stash-drawer {
      background: var(--im-surface-2);
      border: 1px solid var(--im-border);
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stash-drawer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;

    function applyPreset(stateId) {
      store.helpOpen = false;
      store.openMenu = "";
      store.selectedTaskId = "";
      if (stateId === "focus-detail") {
        store.focusLens = "actions";
        store.inboxTab = "proposed";
        store.proposals.p_bot.status = "proposed";
        store.proposals.p_demo_next.status = "proposed";
        store.proposals.p_family_bot.status = "backlog";
        store.scope = "mine";
        store.doneDrawerOpen = false;
        store.selectedTaskId = "active_demo";
        store.toast = "";
      } else if (stateId === "focus-triaged") {
        store.focusLens = "actions";
        store.inboxTab = "proposed";
        store.proposals.p_bot.status = "doing";
        store.proposals.p_demo_next.status = "todo";
        store.proposals.p_family_bot.status = "backlog";
        store.doneDrawerOpen = false;
        store.toast = "已批准开工：调研「自媒体 Bot」主流平台发布限制";
      } else if (stateId === "focus-stashed") {
        store.focusLens = "actions";
        store.inboxTab = "stashed";
        store.proposals.p_bot.status = "backlog";
        store.proposals.p_demo_next.status = "todo";
        store.proposals.p_family_bot.status = "backlog";
        store.doneDrawerOpen = false;
        store.toast = "已收进「先存着」：调研「自媒体 Bot」主流平台发布限制";
      } else if (stateId === "goals-web") {
        store.focusLens = "goals";

        store.doneDrawerOpen = false;
        store.toast = "";
      } else if (stateId === "focus-help") {

        store.inboxTab = "proposed";
        store.proposals.p_bot.status = "proposed";
        store.proposals.p_demo_next.status = "proposed";
        store.proposals.p_family_bot.status = "backlog";
        store.scope = "mine";
        store.doneDrawerOpen = false;
        store.helpOpen = true;
        store.toast = "";

        store.scope = "mine";

        store.toast = "";
      }
    }

    function approveProposal(id) {
      const item = store.proposals[id];
      if (!item) return;
      if (item.prereqBlocked) {
        item.status = "todo";
        store.toast = `已批准立项（转入待办，等阶段 3 完成）：${item.title}`;
      } else {
        item.status = "doing";
        store.toast = `已批准开工（转入推进中）：${item.title}`;
      }
      render();
    }

    function triage(id, nextStatus) {
      const item = store.proposals[id];
      if (!item) return;
      item.status = nextStatus;
      store.toast = nextStatus === "backlog"
        ? `已收进旁边「先存着」（平时免催促）：${item.title}`
        : `已关闭：${item.title}`;
      if (nextStatus === "closed") {
        store.completedHistory.unshift({ title: item.title, crumb: item.crumb, status: "closed" });
      }
      render();
    }

    function activateStashed(id) {
      const item = store.proposals[id];
      if (!item) return;
      item.status = "todo";
      store.toast = `已提上日程（进入下方进行中 · 待办）：${item.title}`;
      render();
    }

      return Object.values(store.proposals).filter((p) => p.status === "proposed");

    function findTaskById(id) {
      if (!id) return null;
      if (store.proposals[id]) return store.proposals[id];
      if (store.fixedTasks[id]) return store.fixedTasks[id];
      const doneHit = store.completedHistory.find((h) => h.id === id);
      if (doneHit) return doneHit;
      const addedHit = store.singleCardsAdded.find((c) => c.id === id);
      if (addedHit) {
        return {
          id: addedHit.id,
          crumb: `单卡 · ${addedHit.chat}`,
          crumbKind: addedHit.chat === "小助私聊" ? "idea" : "team",
          title: addedHit.title,
          assignee: "J",
          status: "todo",
          detailWhyHtml: "",
          resultHtml: "",
          createdMeta: `刚刚随手记入（${addedHit.chat}）`
        };
      }
      return null;
    }

                <div class="bubble">
                  <div>早，J！今天状态怎么样？咱们来对齐一下你今天的计划。</div>
                  <div style="margin-top:5px">昨晚日记里你提到这周想推 <strong>把 Nano 打磨成熟并推出去 › 录 3 分钟 Demo</strong>。如果你今天打算开这一块，我顺手替你理了 3 个候选真实镜头供你挑（①晚间聊日记静默理脉络 → ②早间 5 秒翻牌 → ③点开长线目标全景）；另外昨晚提到的新点子先立了 1 张待拍板卡：</div>

                  <div class="embed-list">
                    <div class="embed-task">
                      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                        <span class="goal-crumb goal-crumb--idea" style="margin:0">单卡 · 小助私聊</span>
                        ${statusBadge(pBot.status)}
                      </div>
                      <div style="font-weight:700;font-size:13px">${pBot.title}</div>
                      <div style="font-size:11.5px;color:var(--im-text-muted)">${pBot.rationale}</div>
                      ${pBot.status === "proposed" ? `
                        <div style="display:flex;gap:6px;margin-top:3px">
                          <button class="btn btn--primary" onclick="approveProposal('p_bot')">批准开工</button>
                          <button class="btn" onclick="triage('p_bot','backlog')">先存着</button>
                          <button class="btn btn--ghost" onclick="triage('p_bot','closed')">关闭</button>
                        </div>
                      ` : pBot.status === "backlog" ? `
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">
                          <span style="font-size:11.5px;color:var(--im-text-muted)">已收进任务页「先存着」，平时免催促</span>
                          <button class="btn btn--ghost" onclick="setState('${isMobile ? 'focus-mobile' : 'focus-stashed'}')">去查看</button>
                        </div>
                      ` : `
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">
                          <span style="font-size:11.5px;color:var(--im-success-text)">已批准开工，小助正在推进</span>
                          <button class="btn btn--ghost" onclick="setState('${isMobile ? 'focus-mobile' : 'focus-triaged'}')">去任务查看</button>
                        </div>
                      `}
                    </div>
                  </div>

                  <div style="margin-top:6px">你今天自己想重点定哪一两件事？跟我说一声，我帮你记进晨间计划里。</div>
                </div>

                <div class="bubble bubble--user">
                  今天上午先看你那份骨架把 Demo 三个镜头定下来，下午录第一版；家里老人的事记个背景就行，以后不用主动给我立任务卡。
                </div>
              </div>

              <div class="composer-bar">
                <input value="" placeholder="发消息给小助…" aria-label="聊天输入框" />
                <button class="btn btn--primary">发送</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderSettings(isOffline) {
      const dirty = store.proactiveDraft !== store.proactiveSaved;
      return `
        <div class="workspace">
          <div class="topbar">
            <div class="topbar-title-group">
              <button class="btn btn--ghost" onclick="setState('ios-chat')">‹ 个人助手设置</button>
              <h1 class="topbar-title" style="font-size:15px">运行设置</h1>
            </div>
            <button class="btn btn--primary" ${isOffline || !dirty ? "disabled" : ""} onclick="store.proactiveSaved=store.proactiveDraft;store.toast='已保存运行设置';render()">保存</button>
          </div>

          <div class="settings-body">
            ${isOffline ? `
              <div class="offline-banner" role="status">
                <span>所属电脑当前不可达，以下为上次保存的设置（只读）；恢复连接后刷新可修改。</span>
                <button class="btn" onclick="setState('settings-online')">重试刷新</button>
              </div>
            ` : `
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--im-text-muted)">
                <span>所属电脑：Mac mini · 在线</span>
              </div>
            `}

            <div class="settings-card">
              <div style="font-size:12px;font-weight:700;color:var(--im-text-muted)">运行特性（与任务图依赖联动）</div>

              <div class="toggle-row">
                <div>
                  <div style="font-weight:700;font-size:14px">主动筹划</div>
                  <div style="font-size:12px;color:var(--im-text-muted);margin-top:2px">
                    在对话安静后静默复盘目标进展、建立「待拍板」提议卡，并在合适时机（如早间对齐）按需提供准备要点或触达。关闭后停止对话安静后的自动复盘与提议立卡；你明确交办的任务与自行设定的定时提醒照常运行。
                  </div>
                </div>
                <button
                  class="switch"
                  role="switch"
                  aria-label="主动筹划"
                  aria-checked="${store.proactiveDraft}"
                  ${isOffline ? "disabled" : ""}
                  onclick="store.proactiveDraft=!store.proactiveDraft;render()"
                ></button>
              </div>

              <div class="toggle-row" style="padding-top:8px;border-top:1px solid var(--im-border)">
                <div>
                  <div style="font-weight:700;font-size:13.5px">任务图</div>
                  <div style="font-size:12px;color:var(--im-text-muted)">承载单卡事项与长线目标脉络（主动筹划开启时需保持启用）</div>
                </div>
                <button
                  class="switch"
                  role="switch"
                  aria-label="任务图"
                  aria-checked="true"
                  ${isOffline ? "disabled" : ""}
                  onclick="if(store.proactiveDraft){store.toast='请先关闭「主动筹划」再关闭任务图';render();}"
                ></button>
              </div>
            </div>

            <div class="settings-card">
              <div class="toggle-row">
                <div>
                  <div style="font-weight:700;font-size:13.5px">Dreaming · 自动整理记忆</div>
                  <div style="font-size:12px;color:var(--im-text-muted)">夜间沉淀长期背景与主动沟通分寸规则</div>
                </div>
                <button class="switch" role="switch" aria-checked="true" ${isOffline ? "disabled" : ""}></button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      renderControls();
      const stage = document.getElementById("stage");
      const prevWs = stage.querySelector(".workspace");
      const prevScrollTop = prevWs && lastRenderedState === currentState ? prevWs.scrollTop : 0;
      lastRenderedState = currentState;

      const isMobile = ["focus-mobile", "ios-goal", "ios-chat", "settings-online", "settings-offline"].includes(currentState);
      const isIOS = currentState.startsWith("ios-") || currentState.startsWith("settings-");

      let bodyHTML = "";
      let activeTab = "tasks";

      if (["focus-web", "focus-detail", "goals-web", "focus-help", "focus-triaged", "focus-stashed"].includes(currentState)) {
        bodyHTML = renderFocusDesk(false);
        activeTab = "tasks";
      } else if (currentState === "focus-mobile") {
        bodyHTML = renderFocusDesk(true);
        activeTab = "tasks";
      } else if (currentState === "goal-web") {
        bodyHTML = renderGoalWeb();
        activeTab = "tasks";
      } else if (currentState === "ios-goal") {
        bodyHTML = renderIOSGoal();
        activeTab = "tasks";
      } else if (currentState === "chat-web") {
        bodyHTML = renderChat(false);
        activeTab = "chat";
      } else if (currentState === "ios-chat") {
        bodyHTML = renderChat(true);
        activeTab = "chat";
      } else if (currentState === "settings-online") {
        bodyHTML = renderSettings(false);
        activeTab = "agents";
      } else if (currentState === "settings-offline") {
        bodyHTML = renderSettings(true);
        activeTab = "agents";
      }

      const hideBottomBar = currentState === "ios-chat";
      stage.innerHTML = `
        <div class="product-frame ${isMobile ? 'product-frame--mobile' : ''}">
          ${isMobile ? "" : renderLeftRail(activeTab)}
          ${bodyHTML}
          ${isMobile && !hideBottomBar ? renderBottomBar(activeTab, isIOS) : ""}
          ${renderTaskDetailDrawer(isMobile)}
          ${renderStatusHelpModal()}
          ${store.toast ? `<div class="floating-toast" role="status">${store.toast}</div>` : ""}
        </div>
      `;

      const nextWs = stage.querySelector(".workspace");
      if (nextWs) {
        if (pendingScrollToDrawer) {
          pendingScrollToDrawer = false;
          nextWs.scrollTop = nextWs.scrollHeight;
        } else if (prevScrollTop > 0) {
          nextWs.scrollTop = prevScrollTop;
        }
      }
    }

    render();
  </script>
</body>
</html>
