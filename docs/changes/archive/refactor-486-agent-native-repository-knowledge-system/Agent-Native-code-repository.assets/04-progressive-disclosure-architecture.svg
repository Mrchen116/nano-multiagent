<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc" data-palette="article-guide">
  <title id="title">Agent-Native 仓库知识的渐进加载结构</title>
  <desc id="desc">图中从当前任务出发，依次展示自动加载的根级指令、负责路由的文档地图、按任务加载的深层知识，以及显式引用、自主搜索、选择性上下文和验证后归并路径。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1a1a1a; }
      .title { font-size: 32px; font-weight: 760; }
      .subtitle { font-size: 17px; fill: #6b6b6b; }
      .panel-title { font-size: 22px; font-weight: 720; }
      .badge { font-size: 13px; font-weight: 720; }
      .item { font-size: 16px; }
      .item-strong { font-size: 16px; font-weight: 680; }
      .small { font-size: 14px; fill: #6b6b6b; }
      .tiny { font-size: 13px; fill: #6b6b6b; }
      .principle { font-size: 16px; font-weight: 650; }
      .task { fill: #f5ecdb; stroke: #a07020; stroke-width: 2.3; }
      .root { fill: #e6eef0; stroke: #2a6470; stroke-width: 2.2; }
      .map { fill: #e6eef0; stroke: #2a6470; stroke-width: 2.2; }
      .deep { fill: #f5f1ea; stroke: #9ab8be; stroke-width: 2; }
      .current { fill: #ecf0e6; stroke: #4a6f3a; stroke-width: 1.8; }
      .active { fill: #f5ebe6; stroke: #8b3a2f; stroke-width: 1.8; }
      .history { fill: #f5f1ea; stroke: #e6e3dc; stroke-width: 1.8; }
      .code { fill: #e6eef0; stroke: #2a6470; stroke-width: 1.8; }
      .evidence { fill: #f5ecdb; stroke: #a07020; stroke-width: 1.8; }
      .tray { fill: #f5f1ea; stroke: #6b6b6b; stroke-width: 2; }
      .promotion { fill: #ecf0e6; stroke: #4a6f3a; stroke-width: 2; }
      .check { fill: #a07020; stroke: #ffffff; stroke-width: 2; }
      .arrow { stroke: #2a6470; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .selected { stroke: #a07020; stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
      .search { stroke: #2a6470; stroke-width: 2.3; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrowBlue); }
      .feedback { stroke: #4a6f3a; stroke-width: 2.4; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrowGreen); }
      .muted-line { stroke: #e6e3dc; stroke-width: 1.7; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2a6470"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a07020"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2a6470"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4a6f3a"/></marker>
  </defs>

  <rect width="1800" height="1100" fill="#ffffff"/>
  <text x="48" y="54" class="title">按加载时机组织知识：短入口、明确路由、按需深入</text>
  <text x="48" y="84" class="subtitle">重要知识必须从已知入口可达，但只有与当前任务相关的正文才进入上下文；自主搜索负责直达与补漏。</text>

  <!-- Timing axis -->
  <path d="M335 118 H1708" class="arrow"/>
  <text x="335" y="105" class="small">固定上下文最小</text>
  <text x="1708" y="105" text-anchor="end" class="small">信息更深、相关性更具体</text>

  <!-- Current task -->
  <rect x="48" y="178" width="220" height="146" rx="18" class="task"/>
  <rect x="72" y="198" width="92" height="28" rx="14" fill="#a07020"/>
  <text x="118" y="217" text-anchor="middle" class="badge" fill="#ffffff">当前任务</text>
  <text x="72" y="257" class="item-strong">具体目标</text>
  <text x="72" y="283" class="small">尚未提供文件名</text>
  <text x="72" y="307" class="small">Agent 自主决定探索路径</text>

  <!-- Root instruction -->
  <rect x="330" y="142" width="350" height="406" rx="20" class="root"/>
  <rect x="354" y="162" width="126" height="28" rx="14" fill="#2a6470"/>
  <text x="417" y="181" text-anchor="middle" class="badge" fill="#ffffff">每个 session</text>
  <text x="354" y="226" class="panel-title">① 自动加载：根级指令</text>
  <text x="354" y="254" class="small">探索开始前必须知道，固定占用上下文。</text>
  <line x1="354" y1="274" x2="656" y2="274" class="muted-line"/>
  <text x="366" y="311" class="item">• 仓库定位与粗粒度地图</text>
  <text x="366" y="350" class="item">• 全仓架构和安全红线</text>
  <text x="366" y="389" class="item">• 顶层文档地图的第一跳</text>
  <text x="366" y="428" class="item">• 开工前的流程选择</text>
  <text x="366" y="467" class="item">• 无法自然发现的关键入口</text>
  <rect x="354" y="493" width="302" height="34" rx="10" fill="#f5f1ea"/>
  <text x="505" y="516" text-anchor="middle" class="small">只保存结论与入口，不复制下层正文</text>

  <!-- Docs map -->
  <rect x="740" y="142" width="400" height="478" rx="20" class="map"/>
  <rect x="764" y="162" width="144" height="28" rx="14" fill="#2a6470"/>
  <text x="836" y="181" text-anchor="middle" class="badge" fill="#ffffff">任务相关时读取</text>
  <text x="764" y="226" class="panel-title">② 路由加载：文档地图</text>
  <text x="764" y="254" class="small">回答“有哪些知识、现在应该去哪里”。</text>
  <line x1="764" y1="274" x2="1116" y2="274" class="muted-line"/>
  <text x="776" y="311" class="item">• 文档链接与一句话摘要</text>
  <text x="776" y="350" class="item">• 任务 → 领域入口映射</text>
  <text x="776" y="389" class="item">• 各类事实的权威位置</text>
  <text x="776" y="428" class="item">• current / proposed / history / research</text>
  <text x="776" y="467" class="item">• 领域 index 与页面间引用</text>
  <rect x="764" y="497" width="352" height="96" rx="12" fill="#ffffff" stroke="#9ab8be" stroke-width="1.3"/>
  <text x="784" y="525" class="item-strong">地图的输出</text>
  <text x="784" y="552" class="small">候选来源 + 读取理由 + 状态与权威边界</text>
  <text x="784" y="576" class="small">不规定僵硬的通读顺序</text>

  <!-- Deep knowledge -->
  <rect x="1200" y="142" width="552" height="620" rx="20" class="deep"/>
  <rect x="1224" y="162" width="156" height="28" rx="14" fill="#6b6b6b"/>
  <text x="1302" y="181" text-anchor="middle" class="badge" fill="#ffffff">回答具体问题时</text>
  <text x="1224" y="226" class="panel-title">③ 深度加载：权威正文与工程事实</text>
  <text x="1224" y="254" class="small">按任务选择，状态决定它能回答什么。</text>

  <rect x="1224" y="282" width="504" height="76" rx="13" class="current"/>
  <rect x="1242" y="299" width="78" height="24" rx="12" fill="#4a6f3a"/><text x="1281" y="316" text-anchor="middle" class="badge" fill="#ffffff">CURRENT</text>
  <text x="1340" y="315" class="item-strong">当前契约与操作事实</text>
  <text x="1242" y="343" class="small">产品原则、架构、current specs、runbook</text>
  <circle cx="1694" cy="320" r="14" class="check"/><text x="1694" y="326" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">✓</text>

  <rect x="1224" y="370" width="504" height="76" rx="13" class="active"/>
  <rect x="1242" y="387" width="78" height="24" rx="12" fill="#8b3a2f"/><text x="1281" y="404" text-anchor="middle" class="badge" fill="#ffffff">ACTIVE</text>
  <text x="1340" y="403" class="item-strong">正在发生的变化</text>
  <text x="1242" y="431" class="small">spec、design、plan、progress、未决问题</text>

  <rect x="1224" y="458" width="504" height="76" rx="13" class="history"/>
  <rect x="1242" y="475" width="98" height="24" rx="12" fill="#6b6b6b"/><text x="1291" y="492" text-anchor="middle" class="badge" fill="#ffffff">MEMORY</text>
  <text x="1360" y="491" class="item-strong">原因、历史与研究输入</text>
  <text x="1242" y="519" class="small">ADR、completed change、incident、retro、research</text>

  <rect x="1224" y="546" width="504" height="76" rx="13" class="code"/>
  <rect x="1242" y="563" width="72" height="24" rx="12" fill="#2a6470"/><text x="1278" y="580" text-anchor="middle" class="badge" fill="#ffffff">CODE</text>
  <text x="1334" y="579" class="item-strong">实现事实</text>
  <text x="1242" y="607" class="small">代码、类型、schema、配置、migration</text>
  <circle cx="1694" cy="584" r="14" class="check"/><text x="1694" y="590" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">✓</text>

  <rect x="1224" y="634" width="504" height="104" rx="13" class="evidence"/>
  <rect x="1242" y="651" width="92" height="24" rx="12" fill="#a07020"/><text x="1288" y="668" text-anchor="middle" class="badge" fill="#ffffff">EVIDENCE</text>
  <text x="1354" y="667" class="item-strong">观察与验证结果</text>
  <text x="1242" y="695" class="small">tests、CI、runtime state、日志、trace、截图</text>
  <text x="1242" y="720" class="small">证明某次结果，不自动成为长期规范</text>
  <circle cx="1694" cy="686" r="14" class="check"/><text x="1694" y="692" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">✓</text>

  <!-- Explicit routes -->
  <path d="M268 246 H322" class="arrow"/>
  <text x="295" y="232" text-anchor="middle" class="tiny">起点</text>
  <path d="M680 334 H732" class="arrow"/>
  <text x="706" y="319" text-anchor="middle" class="tiny">第一跳</text>
  <path d="M1140 380 H1192" class="arrow"/>
  <text x="1166" y="365" text-anchor="middle" class="tiny">按地图选择</text>

  <!-- Autonomous search shortcut -->
  <path d="M158 324 C180 720 780 720 1188 590" class="search"/>
  <rect x="610" y="676" width="242" height="34" rx="17" fill="#e6eef0" stroke="#9ab8be" stroke-width="1.2"/>
  <text x="731" y="699" text-anchor="middle" class="small">自主搜索：直达代码、历史并补漏</text>

  <!-- Selected context tray -->
  <rect x="330" y="760" width="810" height="196" rx="20" class="tray"/>
  <text x="354" y="797" class="panel-title">本次任务实际进入上下文的最小集合</text>
  <text x="354" y="825" class="small">示例：修改一个已经定义的行为，只选择 current contract、相关代码和验证入口。</text>
  <rect x="354" y="850" width="218" height="74" rx="12" class="current"/>
  <text x="463" y="879" text-anchor="middle" class="item-strong">相关 current contract</text>
  <text x="463" y="905" text-anchor="middle" class="small">应该怎样</text>
  <rect x="592" y="850" width="218" height="74" rx="12" class="code"/>
  <text x="701" y="879" text-anchor="middle" class="item-strong">相关代码与 schema</text>
  <text x="701" y="905" text-anchor="middle" class="small">现在如何实现</text>
  <rect x="830" y="850" width="286" height="74" rx="12" class="evidence"/>
  <text x="973" y="879" text-anchor="middle" class="item-strong">相关测试与运行证据</text>
  <text x="973" y="905" text-anchor="middle" class="small">修改是否成立</text>

  <path d="M1200 744 C1168 744 1176 818 1130 850" class="selected"/>
  <text x="1173" y="790" text-anchor="middle" class="tiny">选入本次上下文</text>

  <!-- Promotion -->
  <rect x="1200" y="800" width="552" height="156" rx="20" class="promotion"/>
  <text x="1224" y="837" class="panel-title">验证后的知识更新</text>
  <text x="1224" y="871" class="item">ACTIVE + EVIDENCE 通过实现与门禁</text>
  <path d="M1240 896 H1465" class="feedback"/>
  <text x="1352" y="889" text-anchor="middle" class="tiny">promotion</text>
  <rect x="1480" y="871" width="238" height="48" rx="12" class="current"/>
  <text x="1599" y="901" text-anchor="middle" class="item-strong">更新 CURRENT</text>
  <text x="1224" y="939" class="small">任务材料随后冻结为历史；未经验证的方案不能提前覆盖当前事实。</text>

  <!-- Bottom principles -->
  <rect x="48" y="990" width="1704" height="72" rx="18" fill="#f5f1ea" stroke="#e6e3dc" stroke-width="1.5"/>
  <text x="120" y="1034" class="principle">① 重要知识从根入口可达</text>
  <text x="520" y="1034" class="principle">② 正文只在相关时加载</text>
  <text x="900" y="1034" class="principle">③ 搜索负责直达与补漏</text>
  <text x="1260" y="1034" class="principle">④ 状态与权威防止误用</text>
</svg>
