<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">计划变更与运行发现的知识写回闭环</title>
  <desc id="desc">上半部分展示当前事实经过变更目标、活动工作、实现和验证后归并为新事实并冻结历史；下半部分展示失败和纠正经过根因确认、选择长期载体和验证后，写入正确位置、缩小范围或不保留。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1a1a1a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #6b6b6b; }
      .lane { font-size: 20px; font-weight: 700; }
      .box-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; fill: #6b6b6b; }
      .badge { font-size: 13px; font-weight: 700; }
      .formula { font-size: 18px; font-weight: 700; }
      .arrow { stroke: #8b3a2f; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #4a6f3a; stroke-width: 2.4; fill: none; marker-end: url(#arrowGreen); }
      .branch { stroke: #a07020; stroke-width: 2.2; fill: none; marker-end: url(#arrowGold); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b3a2f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a6f3a"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a07020"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="40" y="50" class="title">知识写回不是“补一篇文档”，而是两个受验证的生命周期</text>
  <text x="40" y="82" class="subtitle">计划中的变化和运行中的发现有不同起点，但都必须先确认事实、选择正确载体，并在验证后进入长期知识。</text>

  <!-- Planned change lane -->
  <rect x="35" y="112" width="1130" height="286" rx="18" fill="#f5f1ea" stroke="#e6e3dc" stroke-width="2"/>
  <rect x="55" y="132" width="146" height="30" rx="15" fill="#8b3a2f"/>
  <text x="128" y="152" text-anchor="middle" class="badge" fill="#ffffff">计划中的变化</text>
  <text x="225" y="154" class="lane">从 current 写增量，验证后再 promotion</text>

  <rect x="65" y="200" width="150" height="104" rx="12" fill="#ecf0e6" stroke="#a8c0a0" stroke-width="2"/>
  <text x="140" y="232" text-anchor="middle" class="box-title" fill="#4a6f3a">当前事实</text>
  <text x="140" y="260" text-anchor="middle" class="body">contract · code</text>
  <text x="140" y="282" text-anchor="middle" class="body">runbook · config</text>

  <rect x="255" y="200" width="150" height="104" rx="12" fill="#f5ebe6" stroke="#c9a89e" stroke-width="2"/>
  <text x="330" y="232" text-anchor="middle" class="box-title" fill="#8b3a2f">变更目标</text>
  <text x="330" y="260" text-anchor="middle" class="body">只描述增量</text>
  <text x="330" y="282" text-anchor="middle" class="body">尚未成为 current</text>

  <rect x="445" y="200" width="150" height="104" rx="12" fill="#f5ebe6" stroke="#c9a89e" stroke-width="2"/>
  <text x="520" y="232" text-anchor="middle" class="box-title" fill="#8b3a2f">活动工作</text>
  <text x="520" y="260" text-anchor="middle" class="body">进度 · 决定 · 发现</text>
  <text x="520" y="282" text-anchor="middle" class="body">未决问题</text>

  <rect x="635" y="200" width="170" height="104" rx="12" fill="#e6eef0" stroke="#9ab8be" stroke-width="2"/>
  <text x="720" y="232" text-anchor="middle" class="box-title" fill="#2a6470">实现</text>
  <text x="720" y="260" text-anchor="middle" class="body">代码 · schema · 配置</text>
  <text x="720" y="282" text-anchor="middle" class="body">生成内容</text>

  <rect x="845" y="200" width="150" height="104" rx="12" fill="#f5ecdb" stroke="#d4a86a" stroke-width="2"/>
  <text x="920" y="232" text-anchor="middle" class="box-title" fill="#a07020">验证门</text>
  <text x="920" y="260" text-anchor="middle" class="body">tests · CI</text>
  <text x="920" y="282" text-anchor="middle" class="body">runtime evidence</text>

  <rect x="1035" y="182" width="100" height="78" rx="12" fill="#ecf0e6" stroke="#a8c0a0" stroke-width="2"/>
  <text x="1085" y="214" text-anchor="middle" class="box-title" fill="#4a6f3a">新 current</text>
  <text x="1085" y="238" text-anchor="middle" class="body">归并事实</text>
  <rect x="1035" y="278" width="100" height="78" rx="12" fill="#ffffff" stroke="#e6e3dc" stroke-width="2"/>
  <text x="1085" y="310" text-anchor="middle" class="box-title" fill="#6b6b6b">历史</text>
  <text x="1085" y="334" text-anchor="middle" class="body">冻结理由</text>

  <path d="M215 252 H247" class="arrow"/>
  <path d="M405 252 H437" class="arrow"/>
  <path d="M595 252 H627" class="arrow"/>
  <path d="M805 252 H837" class="arrow"/>
  <path d="M995 236 H1027" class="feedback"/>
  <path d="M995 268 C1014 268 1014 316 1027 316" class="branch"/>

  <rect x="255" y="330" width="740" height="42" rx="10" fill="#ffffff" stroke="#e6e3dc"/>
  <text x="625" y="357" text-anchor="middle" class="formula" fill="#8b3a2f">accepted ≠ implemented ≠ current 已经更新</text>

  <!-- Learning lane -->
  <rect x="35" y="430" width="1130" height="336" rx="18" fill="#ffffff" stroke="#e6e3dc" stroke-width="2"/>
  <rect x="55" y="450" width="146" height="30" rx="15" fill="#a07020"/>
  <text x="128" y="470" text-anchor="middle" class="badge" fill="#ffffff">运行中的发现</text>
  <text x="225" y="472" class="lane">失败与纠正先成为候选信息，再决定是否长期保留</text>

  <rect x="65" y="525" width="170" height="104" rx="12" fill="#f5ecdb" stroke="#d4a86a" stroke-width="2"/>
  <text x="150" y="557" text-anchor="middle" class="box-title" fill="#a07020">失败、纠正或发现</text>
  <text x="150" y="585" text-anchor="middle" class="body">一次事件只证明</text>
  <text x="150" y="607" text-anchor="middle" class="body">“这次发生过”</text>

  <rect x="280" y="525" width="170" height="104" rx="12" fill="#e6eef0" stroke="#9ab8be" stroke-width="2"/>
  <text x="365" y="557" text-anchor="middle" class="box-title" fill="#2a6470">确认根因与范围</text>
  <text x="365" y="585" text-anchor="middle" class="body">是否重复？后果多大？</text>
  <text x="365" y="607" text-anchor="middle" class="body">现有权威是否已覆盖？</text>

  <rect x="495" y="508" width="220" height="138" rx="12" fill="#e6eef0" stroke="#9ab8be" stroke-width="2"/>
  <text x="605" y="540" text-anchor="middle" class="box-title" fill="#2a6470">选择真正的长期载体</text>
  <text x="515" y="570" class="body">• 意图与边界 → contract / runbook</text>
  <text x="515" y="594" class="body">• 可机械判断 → test / CI / permission</text>
  <text x="515" y="618" class="body">• 偶发事实 → evidence / task record</text>

  <rect x="760" y="525" width="150" height="104" rx="12" fill="#f5ecdb" stroke="#d4a86a" stroke-width="2"/>
  <text x="835" y="557" text-anchor="middle" class="box-title" fill="#a07020">建立验证</text>
  <text x="835" y="585" text-anchor="middle" class="body">后续任务能否检查</text>
  <text x="835" y="607" text-anchor="middle" class="body">规则是否仍然有效</text>

  <rect x="955" y="508" width="180" height="138" rx="12" fill="#ecf0e6" stroke="#a8c0a0" stroke-width="2"/>
  <text x="1045" y="540" text-anchor="middle" class="box-title" fill="#4a6f3a">处理结果</text>
  <text x="975" y="570" class="body">• 写入正确位置</text>
  <text x="975" y="594" class="body">• 缩小作用域</text>
  <text x="975" y="618" class="body">• 已覆盖或无净值：不保留</text>

  <path d="M235 577 H272" class="branch"/>
  <path d="M450 577 H487" class="branch"/>
  <path d="M715 577 H752" class="branch"/>
  <path d="M910 577 H947" class="feedback"/>

  <path d="M1045 646 V664" class="feedback"/>
  <rect x="660" y="672" width="475" height="46" rx="10" fill="#ecf0e6" stroke="#a8c0a0"/>
  <text x="897" y="700" text-anchor="middle" class="body" fill="#4a6f3a">经验证后写入 current、workflow、skill、test 或 gate</text>

  <rect x="65" y="728" width="1070" height="28" rx="8" fill="#f5f1ea"/>
  <text x="600" y="747" text-anchor="middle" class="body">不要把每句“下次注意”都追加到根级指令；位置与强度必须匹配根因。</text>
</svg>
