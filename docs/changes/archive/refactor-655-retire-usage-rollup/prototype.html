<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work 记录同步状态 · refactor-655</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#202327;font:14px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1020px;margin:32px auto;padding:0 20px}header,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:22px;font-weight:600}h2{font-size:16px;font-weight:600;margin:0}button,select{font:inherit;padding:7px 12px;background:white;border:1px solid #d9dde1;border-radius:7px}button[aria-selected=true]{background:#edf0f3;font-weight:600}.toolbar{flex-wrap:wrap;border-bottom:1px solid #dedfe3;padding:14px 0}.muted,small{color:#6c727a}.notice{background:#f0f4f8;border-left:3px solid #768b9e;padding:10px 13px;border-radius:4px}.usage,.turn{background:white;border:1px solid #e2e5e8;border-radius:9px;padding:18px;margin-top:16px}.number{font-size:23px;font-weight:600;margin:6px 0}.row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.tools{margin-top:14px;border-top:1px solid #eee;padding-top:12px}.tag{font-size:12px;color:#636b74;background:#f0f2f4;padding:3px 8px;border-radius:5px}p{margin:8px 0}.design{font-size:12px;margin:24px 0;color:#707880}@media(max-width:600px){main{margin:16px auto;padding:0 14px}.toolbar{align-items:flex-start}.usage,.turn{padding:14px}header{align-items:flex-start;flex-direction:column}}
</style><main><header><h1>Agent 工作记录</h1><label>原型状态 <select id="state"><option value="catching_up">正在补齐</option><option value="unknown">最新进度未确认</option><option value="current">已同步</option><option value="offline">节点离线</option></select></label></header><div class="toolbar"><div><button aria-selected="true">工作记录</button> <button>原生轨迹</button></div><span id="execution" class="muted">主 Agent · 运行中</span></div><p id="notice" class="notice" role="status"></p><section class="usage"><small>最近已报告的主上下文</small><div class="number">31,001 <small>tokens</small></div><div class="row"><span>输出 1 · 缓存命中 1,000</span><small>新统计尚未报告时沿用最近轮次</small></div></section><h2 style="margin-top:24px">主 Agent</h2><small>最新轮次在前 · 轮次内部按实际顺序</small><article class="turn"><div class="row"><strong>检查工作记录</strong><span class="tag">运行中</span></div><p>正在核对主任务和子任务的执行结果。</p><div class="tools"><div class="row"><span>read · 工作记录</span><span class="tag">已完成</span></div><p class="muted">工具参数与结果沿用现有展开方式</p><div class="row"><span>委派 · 子 Agent 检查</span><button>查看子执行 →</button></div></div></article><button style="margin-top:16px">更早轮次</button><p class="design">局部设计原型：仅新增状态说明；既有工作记录、工具参数/结果、分页与原生轨迹不重新设计。iOS 将同一提示放在现有状态说明区。</p></main><script>const state=document.getElementById('state'),notice=document.getElementById('notice');function render(){const text={catching_up:'工作记录正在补齐，当前显示已保存内容。',unknown:'当前显示已保存记录，最新进度尚未确认。',current:'',offline:'节点离线，正在显示已保存记录。活动执行状态未知，授权暂不可处理。'}[state.value];notice.textContent=text;notice.hidden=!text;document.getElementById('execution').textContent=state.value==='offline'?'主 Agent · 状态未知':'主 Agent · 运行中'}state.onchange=render;render();</script></html>
