0.14_180)] border-[oklch(0.75_0.12_180)]\">send_message\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"interrupt_agent\" aria-pressed=\"false\" title=\"Ask a subagent to stop its current work. This call returns without waiting for it to stop. You can continue a direct child's conversation later with send_message. Subagents it started will keep running.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">interrupt_agent\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"list_agents\" aria-pressed=\"false\" title=\"List subagents you started, with their ids, labels, and status. running means it is working; inactive means it is not currently working. You will be notified when a subagent finishes; there is no need to keep checking its status. Use send_message to continue the conversation.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">list_agents\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"get_goal\" aria-pressed=\"false\" title=\"Read the current session goal, including the id and revision that update_goal requires.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">get_goal\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"create_goal\" aria-pressed=\"false\" title=\"Create a persisted goal that keeps this session working across automatic continuation rounds. Use it when the direct human request is a long-running objective, even if the user did not say &quot;goal&quot;; not for single-turn work.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">create_goal\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"update_goal\" aria-pressed=\"false\" title=\"Update the current goal.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">update_goal\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"read\" aria-pressed=\"true\" title=\"Read a UTF-8 text file and return line-numbered content.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.93_0.08_180)] text-[oklch(0.35_0.14_180)] border-[oklch(0.75_0.12_180)]\">read\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"write\" aria-pressed=\"true\" title=\"Create or fully replace a UTF-8 text file.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.93_0.08_180)] text-[oklch(0.35_0.14_180)] border-[oklch(0.75_0.12_180)]\">write\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"edit\" aria-pressed=\"true\" title=\"Edit an existing UTF-8 text file by replacing literal text.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.93_0.08_180)] text-[oklch(0.35_0.14_180)] border-[oklch(0.75_0.12_180)]\">edit\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"subagent\" aria-pressed=\"false\" title=\"Delegate a self-contained task to a subagent (a separate agent that works in its own context) to offload focused, independent work — research, a scoped implementation, an analysis — so it does not consume this conversation's context. The subagent returns its result, not its intermediate steps. It runs in the background by default and returns a subagent id you can continue with `send_message`; you are notified when the run settles.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">subagent\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"subagent_fork\" aria-pressed=\"false\" title=\"Delegate a task to a subagent that inherits this conversation: a child agent seeded with all completed turns so far (it does not see the current in-flight turn). Use this when the subtask builds on this conversation's context — a follow-up analysis, a review, a continuation — without consuming this conversation's context for the work itself. You receive its result, not its intermediate steps. This call waits for the result by default.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">subagent_fork\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"bash\" aria-pressed=\"true\" title=\"Execute a bash command (`bash -c`) and return its stdout/stderr. Each call runs in a fresh shell; pass `workdir` instead of using `cd`. Managed `$DSH_*` variables expose current harness environment facts. Long output is truncated to its tail; the full output is saved to a file whose path is reported when available. Provide `description` before `command` in the arguments. Before any delete or move, verify that the resolved absolute target path is the intended one; never run it against a computed path you have not checked. An unset variable expands to an empty string, so guard variables in such paths with `${VAR:?}`. Commands may run under a file sandbox; a blocked file operation is reported as `[sandbox: file access denied under &lt;mode&gt; mode]`, a policy denial: do not retry another way.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.93_0.08_180)] text-[oklch(0.35_0.14_180)] border-[oklch(0.75_0.12_180)]\">bash\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"read_image\" aria-pressed=\"false\" title=\"Read a PNG/JPEG/WebP/GIF file and return the image itself. Large images are downscaled automatically; do not install image libraries or create thumbnails to inspect an image.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">read_image\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"web_fetch\" aria-pressed=\"true\" title=\"Fetch the content of a specific HTTP(S) URL and return it decoded to text. Optionally extract or summarize the page using prompt.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.93_0.08_180)] text-[oklch(0.35_0.14_180)] border-[oklch(0.75_0.12_180)]\">web_fetch\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"workflow\" aria-pressed=\"false\" title=\"Only launch a Workflow when the human explicitly requests multi-agent orchestration or an application reminder confirms Ultracode is on. A trusted human +500k or +2m sets the shared parent/child output-token target for this logical turn. Run JavaScript orchestration in the background. Provide meta {name,description} and script (top-level await and return), or name/scriptPath, or resumeFromRunId. Primitives: await agent(prompt,{label?,phase?,provider?,model?,reasoningEffort?,schema?}); await parallel([()=&gt;agent(...)]); await pipeline(items,...stages), stages get (previous,item,index) and advance independently; await phase(title); await log(text); await workflow(nameOrPath,args) allows one nesting level; await budget.spent()/remaining() (null means unlimited). Omit reasoningEffort to inherit the parent selection; never invent an unsupported effort. Child failure returns null; inspect action read calls[].error for its diagnostic before retrying. Host/cap errors fail the workflow. parallel preserves input order. A child cannot launch agents or workflows. Max 8 concurrent and 1000 total agents, 4096 items per combinator. Returns runId immediately; use action read/control to inspect, pause/resume/stop or restart_child/stop_child by ordinal. Resume of a terminal run creates a new run and reuses its matching completed prefix; completed side effects are not undone. Saving definitions uses action save with project/personal scope.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">workflow\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"conversations\" aria-pressed=\"true\" title=\"Discover joined or public conversations, inspect members, read or search history, create a group, or join a public group as yourself. Root main Agent only. Public read access does not imply membership or write access.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.93_0.08_180)] text-[oklch(0.35_0.14_180)] border-[oklch(0.75_0.12_180)]\">conversations\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"memory\" aria-pressed=\"false\" title=\"Save compact durable facts. Use target=user for personal information and cross-cutting preferences. Use target=memory for environment facts, paths, and project conventions. Keep task procedures and task-specific preferences in the Skill that owns the task, when enabled. Store each complete rule in one place. Before writing, read the current .nanoassistant/memory/USER.md and MEMORY.md under this workspace in full; the inherited snapshot may be stale after background maintenance. Treat a file as empty only when read confirms it does not exist. If a read is denied, fails for another reason, or is incomplete, skip the write. Replace corrected facts in place; do not append duplicates. Preserve project identity; do not merge facts about distinct projects. Keep entries short because storage is limited. Use add, replace or remove; old_text identifies the existing entry. Do not save temporary progress, pending approvals, or deferred Skill edits; skip a deferred change instead of moving it into Memory. Do not infer lasting preferences from a one-off request. Honor a request to defer maintenance or only acknowledge this turn. Sending a reply does not start a background review: later tool calls in the same execution are still foreground work. Do not bypass a disabled maintenance tool.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">memory\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"skill_manage\" aria-pressed=\"false\" title=\"Create or maintain persistent Skills for recurring task types. Each call performs one action. Use list to discover Skills. Use skill to load instructions. Use read to inspect the complete SKILL.md, including its YAML frontmatter, before replacing it. Use read for supporting files when available. Prefer patch for a local correction. Edit replaces the whole SKILL.md. Create and edit require a complete document with matching YAML name and description.\n\nUse write_file or remove_file for supporting files under references/, templates/, scripts/, or assets/. Write only within the selected agent or global scope. This tool cannot delete a whole Skill. Separate calls do not form a transaction. A later failure does not undo an earlier successful call. Check the actual state and report partial results accurately.\n\nWrite lessons, not logs: imperative rule + why, no PR numbers/dates/incident narration, one rule per lesson, references/ named by topic (extend before adding).\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">skill_manage\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"task_graph\" aria-pressed=\"false\" title=\"Query or maintain durable task graphs in IM; doing responsibility keeps the owning Agent working through native execution. Use list/get to read, create to make only a root goal, apply to atomically change nodes and relationships, and delete to remove a graph or subtree. To save a multi-step plan, first create without operations, then apply using the returned graph_id, root_node_id and revision. Supply only the fields documented for the chosen action.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">task_graph\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"plugin_manager\" aria-pressed=\"false\" title=\"Create, install and manage standard DSH plugins in this configured workspace. For plugin development/configuration/debugging, load nano-plugin-development with the skill tool when available; respect disabled Skills. describe_api(topic: tool, prompt, service, events, compaction) returns current public API documentation paths and Nano support boundaries; read the relevant declarations before coding. list_bundles returns installed state and profileDir. install_bundle(target: local bundle directory or package spec), set_bundle(target: bundle name, enabled), remove_bundle(target: bundle name) manage persistent workspace bundles. Changes affect every Agent sharing this workspace; new independent tool names become available without editing static allowlists. Package replacement retains native restart-required semantics; toggling a bundle is not an online code-upgrade guarantee. Verify application and actual business behavior; failed or restart-required is not live success. Never edit installed package files, runtime.json or the host profile. Workspace plugins are trusted local code, not an OS sandbox. approvedBuilds only after explicit user approval for pending build scripts.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">plugin_manager\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"schedule_run\" aria-pressed=\"false\" title=\"Immediately run an existing active schedule in this same main Session. Acceptance is not completion; use schedule_history for its actual result.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">schedule_run\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"schedule_history\" aria-pressed=\"false\" title=\"Read actual schedule execution history, distinguishing timed and manual admission, native turn result, and public delivery.\" class=\"px-[11px] py-[4px] rounded-full text-[12px] font-semibold font-mono border transition-colors bg-[oklch(0.96_0.005_240)] text-[oklch(0.50_0.01_240)] border-[oklch(0.91_0.005_240)] hover:bg-[oklch(0.94_0.005_240)]\">schedule_history\u003c/button>\u003cbutton type=\"button\" data-pill-name=\"schedule_create\" aria-pressed=\"false\" title=\"Create a reminder in the current session that delivers prompt when it becomes due. Supply exactly one timing parameter: after_seconds, at, every_secon <script>
const ui=JSON.parse(document.getElementById('current-ui').textContent),product=document.getElementById('product');
const labels={overview:'概览',config:'配置',channels:'通道',skills:'技能',plugins:'插件',sessions:'会话'};
let section='config',state='online',dirty=false,versionConflict=false,modal=null,emptyChannel=false;
let savedFields={},draftFields={},draftPills={},savedPills={},channelInputs={};
let isMobile=matchMedia('(max-width:767px)').matches;
const offline=()=>['offline','empty','pending'].includes(state),readonly=()=>!['online','version'].includes(state);
const $=(s,root=document)=>root.querySelector(s),$$=(s,root=document)=>[...root.querySelectorAll(s)];
const val=x=>x.type==='checkbox'||x.type==='radio'?x.checked:x.value;
const key=(x,i)=>x.id||x.name||'control-'+i;
const button=(text,root=document)=>$$('button',root).find(x=>x.textContent.trim()===text);
function remember(){if(section!=='config')return;$$('.im-agent-panel-body input,.im-agent-panel-body select,.im-agent-panel-body textarea').forEach((x,i)=>draftFields[key(x,i)]=val(x));$$('[data-pill-name]').forEach(x=>draftPills[x.closest('[role=group]')?.getAttribute('aria-label')+':'+x.dataset.pillName]=x.getAttribute('aria-pressed'));}
function hydrate(){if(section!=='config')return;$$('.im-agent-panel-body input,.im-agent-panel-body select,.im-agent-panel-body textarea').forEach((x,i)=>{const k=key(x,i);if(k in draftFields){if(x.type==='checkbox'||x.type==='radio')x.checked=draftFields[k];else x.value=draftFields[k]}});const pills=$$('[data-pill-name]'),on=pills.find(x=>x.getAttribute('aria-pressed')==='true')?.className,off=pills.find(x=>x.getAttribute('aria-pressed')==='false')?.className;pills.forEach(x=>{let v=draftPills[x.closest('[role=group]')?.getAttribute('aria-label')+':'+x.dataset.pillName];if(v){x.setAttribute('aria-pressed',v);x.className=v==='true'?on:off}});}
function changed(){dirty=true;remember();update();}
function changeSection(next){remember();section=next;render();}
function render(){
 product.innerHTML=ui[isMobile?'mobile':'desktop'];
 const body=$('.im-agent-panel-body');body.outerHTML=ui[section==='channels'&&emptyChannel?'channelsEmpty':section];
 const nav=$('nav[aria-label="Agent 详情分区"]');
 $$('button',nav).forEach(x=>{const selected=x.textContent===labels[section];x.setAttribute('aria-pressed',selected);x.className=selected?'border-0 border-b-2 bg-transparent px-4 py-3 text-[13px] font-semibold border-[var(--im-accent)] text-[var(--im-accent)]':'border-0 border-b-2 bg-transparent px-4 py-3 text-[13px] font-semibold border-transparent text-slate-500 hover:text-slate-900';x.onclick=()=>changeSection(Object.keys(labels).find(k=>labels[k]===x.textContent));});
 $('.im-agent-footer').hidden=section!=='config';$$('.im-agent-header-actions button[type=submit]').forEach(x=>x.hidden=section!=='config');
 $$('a').filter(x=>!x.closest('#modal-host')).forEach(x=>x.onclick=e=>e.preventDefault());
 hydrate();if(!Object.keys(savedFields).length){remember();savedFields=structuredClone(draftFields);savedPills=structuredClone(draftPills)}
 const f=$('form[data-testid="agent-detail"]');f.onsubmit=e=>{e.preventDefault();if(readonly()||versionConflict||!dirty)return;remember();savedFields=structuredClone(draftFields);savedPills=structuredClone(draftPills);dirty=false;update()};
 $$('.im-agent-panel-body input,.im-agent-panel-body select,.im-agent-panel-body textarea').forEach(x=>{x.dataset.originalDisabled=x.disabled?'true':'false';x.oninput=changed});
 $$('.im-agent-panel-body button').forEach(x=>x.dataset.originalDisabled=x.disabled?'true':'false');
 $$('[data-pill-name]').forEach(x=>x.onclick=()=>{if(readonly())return;const next=x.getAttribute('aria-pressed')!=='true';const peer=$$('[data-pill-name]').find(y=>y.getAttribute('aria-pressed')===String(next));if(peer)x.className=peer.className;x.setAttribute('aria-pressed',String(next));changed()});
 if(section==='channels'){$$('button',$('.im-agent-panel-body')).forEach(x=>{let t=x.textContent.trim();if(t.includes('添加通道'))x.onclick=()=>openModal('addProvider');else if(t==='编辑')x.onclick=()=>openModal('edit');else if(t==='停用')x.onclick=()=>openModal('disable');else if(t==='删除')x.onclick=()=>openModal('delete');else if(t==='重新连接')x.onclick=()=>{state='pending';update()}})}
 const stats=button('查看技能统计')||button('View skill statistics');if(stats)stats.onclick=()=>changeSection('skills');const plugins=button('管理插件');if(plugins)plugins.onclick=()=>changeSection('plugins');
 update();
}
function discard(){const unresolved=versionConflict&&readonly();draftFields=structuredClone(savedFields);draftPills=structuredClone(savedPills);if(versionConflict&&!readonly()){draftFields['display-name']='E2E Agent（最新名称）';savedFields=structuredClone(draftFields)}dirty=false;versionConflict=unresolved;if(state==='version')state='online';render();}
function statusText(){return ({offline:'所属电脑已离线，显示最后确认的信息，暂时无法修改配置或获取最新运行状态。',refreshing:'电脑已连接，正在更新配置与能力。完成前暂不可操作；草稿不会自动提交。',empty:'所属电脑已离线。已保存配置仍可查看；尚未取得的节点信息暂时无法获取。',error:'电脑在线，但当前信息获取失败。已保留最后确认内容，请重试获取。',version:'配置已在其他地方更新，草稿已保留。请使用“放弃修改”载入最新配置后重新编辑；当前草稿不会覆盖新版本。',pending:'电脑已离线，先前提交的结果待确认。恢复后会继续确认，请勿重复提交。'})[state]||'';}
function update(){
 $('#demo-state').value=state;
 const body=$('.im-agent-panel-body');$('[data-offline-status]',body)?.remove();
