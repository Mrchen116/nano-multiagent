function config(){return `

 ${dirty?`<p class="help">已保存的一组值：${e(initialDraft.model)} · ${e(initialDraft.effort)}；上方为当前草稿。</p>`:""}<details><summary>备用模型 · 已配置 1 项</summary><div class="readonly-value" style="margin-top:9px">deepseek:deepseek-v4-flash</div><p class="help">${locked()?'离线时不能调整备用列表。':'原型仅展示已保存顺序；在线编辑沿用现有控件。'}</p></details></section>

function channels(){return `<div class="section-title" style="margin-top:20px"><div><h2 style="font-size:17px;margin:0">外部渠道</h2><p class="sub">管理助手在其他应用中的入口</p></div><button class="primary" data-modal="add" ${attr()}>添加渠道</button></div>
 <section class="card"><div class="channel-top"><div class="channel-title"><div class="channel-icon">飞</div><div><h2>${e(savedChannel.name)}</h2><span class="muted">飞书 · 已配置为启用</span></div></div><span class="tag ${state==='online'?'good':''}">${state==='online'?'已连接':state==='refreshing'?'正在确认连接状态':'最后已知：已连接'}</span></div><dl class="facts"><dt>App ID</dt><dd>cli_demo_product</dd><dt>App Secret</dt><dd>已配置 · 不可读取</dd><dt>最后收到状态</dt><dd>${time}</dd><dt>连接说明</dt><dd>${state==='online'?'连接正常，可以使用。':'当前连接情况待确认。电脑失联不代表飞书连接已经停止。'}</dd></dl><div class="actions"><button data-modal="edit" ${attr()}>编辑</button><button data-modal="reconnect" ${attr()}>重新连接</button><button data-modal="disable" ${attr()}>停用</button><button data-modal="delete" class="danger" ${attr()}>删除</button></div>${locked()?'<p class="help">需要电脑恢复连接并完成状态更新后才能操作。</p>':''}<details><summary>查看最后一次诊断</summary><p>最后检查：消息接收和发送权限齐全。当前权限状态待重新确认。</p></details></section>
 ${state==='pending'?'<section class="card"><h2>上一项操作仍待确认</h2><p class="sub">离线前提交的渠道变更尚未收到最终结果。恢复后会继续确认，不需要重新保存。</p><span class="tag pending">结果待确认</span></section>':''}`}
function others(){
 if(state==='empty')return `<section class="card"><h2>${{skills:'Skills 使用统计',plugins:'插件',work:'工作记录'}[tab]}</h2><div class="unknown" style="margin-top:16px"><strong>暂时无法获取${tab==='plugins'?'插件信息':tab==='skills'?'使用统计':'节点最新运行状态'}</strong>尚无已同步的节点信息，恢复连接后再获取。</div></section>`;
 if(tab==='plugins')return `<section class="card"><div class="section-title"><h2>插件</h2><span class="tag">${locked()?'最后确认的信息':'当前信息'}</span></div><p class="sub">节点信息最后同步：${time}</p><div class="record"><div class="section-title"><strong>产品知识库</strong><button role="switch" aria-checked="true" data-change ${attr()}>已启用</button></div><p>v1.2 · 查询产品资料与需求记录</p><details><summary>查看详情</summary><p>包含工具：search_product_docs</p><button class="danger" data-modal="uninstall" ${attr()}>卸载插件</button></details></div></section>`;
 if(tab==='skills')return `<section class="card"><h2>Skills 使用统计</h2><p class="sub">${locked()?'最后同步：'+time:'当前已取得的使用记录'}</p><div class="record"><strong>需求澄清</strong><p>使用 12 次 · 最近使用：今天 16:30</p></div><div class="record"><strong>体验检查</strong><p>使用 8 次 · 最近使用：今天 15:20</p></div></section>`;
 return `<section class="card"><h2>工作记录</h2><p class="sub">已同步的记录仍可阅读。${offline()?'当前是否仍在执行无法确认。':''}</p><div class="record"><strong>整理离线配置页的体验问题</strong><p>16:40 · 最后报告：正在检查配置界面</p><details><summary>展开已同步过程</summary><p>已确认模型和推理强度的展示应保持一致，下一步核对 Features 与工具区域。</p></details></div><h2 style="margin-top:20px">定时任务</h2><div class="record"><div class="section-title"><strong>每天整理产品反馈</strong><button class="danger" data-modal="job-delete" ${attr()}>删除任务</button></div><p>每天 18:00 · ${locked()?'最后已知任务，当前调度情况无法确认':'已启用'}</p></div></section>`;
}
function showModal(){
 if(!modal){document.querySelector('#modal-root').innerHTML='';return;}
 let edit=['add','edit'].includes(modal),title=({add:'添加飞书渠道',edit:'编辑飞书渠道',disable:'停用飞书渠道？',delete:'删除飞书渠道？',reconnect:'重新连接飞书？',uninstall:'卸载插件？','job-delete':'删除定时任务？'})[modal];
 document.querySelector('#modal-root').innerHTML=`<div class="overlay"><section role="dialog" aria-modal="true" aria-labelledby="dialog-title" class="dialog"><h2 id="dialog-title">${title}</h2>${locked()?'<div class="banner"><div><strong>电脑暂时不可操作</strong><p>已保留输入，恢复连接并完成更新后才能提交。</p></div></div>':''}${edit?`<div class="field"><label for="channel-name">渠道名称</label><input id="channel-name" value="${e(channelDraft.name)}" ${attr()}></div><div class="field"><label for="app-id">App ID</label><input id="app-id" value="${e(channelDraft.appId)}" ${attr()}></div><div class="field"><label for="secret">${modal==='edit'?'替换 App Secret（留空保留原值）':'App Secret'}</label><input id="secret" type="password" value="${e(channelDraft.secret)}" autocomplete="off" ${attr()}></div>`:'<p>操作只在提交后执行。未确认前不会改变当前配置或运行状态。</p>'}<div class="dialog-footer"><button id="close-modal">取消</button><button id="confirm-modal" class="primary" ${attr()}>${edit?'保存并连接':'确认操作'}</button></div></section></div>`;
 document.querySelector('#close-modal').onclick=()=>{modal=null;showModal()};
 document.querySelectorAll('#modal-root input').forEach(x=>x.oninput=()=>{channelDraft[x.id==='channel-name'?'name':x.id==='app-id'?'appId':'secret']=x.value});
 document.querySelector('#confirm-modal').onclick=()=>{modal=null;state='pending';render()};
}
function versionReview(){
 if(!versionPending||!latestDraft)return '';
 const fields=[['name','名称'],['prompt','专属指令'],['model','模型'],['effort','推理强度']].filter(([k])=>draft[k]!==latestDraft[k]||(['model','effort'].includes(k)&&(draft.model!==latestDraft.model||draft.effort!==latestDraft.effort)));
 return `<section class="card" aria-label="核对配置变化"><h2>核对配置变化</h2><p class="sub">仅将你相对开始编辑时主动改过的字段保留；其他字段采用最新配置。此处确认不会提交。</p>${fields.map(([k,label])=>`<div class="conflict-row"><strong>${label}</strong><div class="conflict-values"><div><small>你的草稿${draft[k]===initialDraft[k]?' · 未修改':' · 已修改'}</small><p>${e(draft[k])}</p></div><div><small>服务端最新配置</small><p>${e(latestDraft[k])}</p></div></div></div>`).join('')}<div class="actions" style="margin-top:16px"><button id="use-latest" ${locked()?'disabled':''}>采用最新配置，放弃草稿</button><button id="keep-mine" ${locked()?'disabled':''}>已核对，保留我的修改</button></div></section>`;
}
function render(){
 document.querySelector('#demo-state').value=state;
 document.querySelector('#node-label').textContent=offline()?'· 离线':'· 在线';
 document.querySelectorAll('.node-dot').forEach(x=>x.classList.toggle('online',!offline()));
 document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
 document.querySelector('#status').innerHTML=notice();
 document.querySelector('#draft-status').innerHTML=dirty?'<div class="draft-note">有未保存的草稿。'+(locked()?'已保留输入，恢复后由你决定是否保存。':'请检查后手动保存。')+'</div>':'';
 document.querySelector('#content').innerHTML=tab==='config'?versionReview()+config():tab==='channels'?channels():others();
 document.querySelector('#footer-text').textContent=state==='pending'?'先前提交的结果待确认':locked()?'只读查看 · 暂不可保存':dirty?'有未保存的更改':savedNotice?'配置已保存':'没有未保存的更改';
 document.querySelector('#discard').hidden=!dirty;
 ['header-save','footer-save'].forEach(id=>{let b=document.getElementById(id);b.disabled=locked()||versionPending||!dirty||(state==='conflict'&&draft.effort==='high');b.hidden=tab!=='config';b.onclick=()=>{initialDraft=structuredClone(draft);extraDraft={};dirty=false;savedNotice=true;state='online';render()}});
 document.querySelector('#discard').onclick=()=>{dirty=false;draft=structuredClone(latestDraft||initialDraft);initialDraft=structuredClone(draft);versionPending=false;latestDraft=null;extraDraft={};if(['conflict','version'].includes(state))state='online';render()};
 const useLatest=document.getElementById('use-latest');if(useLatest)useLatest.onclick=()=>document.querySelector('#discard').click();
 const keepMine=document.getElementById('keep-mine');if(keepMine)keepMine.onclick=()=>{const merged=structuredClone(latestDraft);for(const k of Object.keys(draft))if(draft[k]!==initialDraft[k])merged[k]=draft[k];if(draft.model!==initialDraft.model||draft.effort!==initialDraft.effort){merged.model=draft.model;merged.effort=draft.effort}initialDraft=structuredClone(latestDraft);draft=merged;latestDraft=null;versionPending=false;dirty=true;state='online';render()};
 document.querySelectorAll('[data-modal]').forEach(x=>x.onclick=()=>{modal=x.dataset.modal;showModal()});
 document.querySelectorAll('[data-change],[data-toggle]').forEach((x,i)=>{const k='choice'+i;if(extraDraft[k]!==undefined){if(x.type==='checkbox')x.checked=extraDraft[k];else x.classList.toggle('off',extraDraft[k])}x.onclick=()=>{dirty=true;savedNotice=false;document.querySelector('#draft-status').innerHTML='<div class="draft-note">有未保存的草稿，请检查后手动保存。</div>';document.querySelector('#footer-text').textContent='有未保存的更改';document.querySelector('#discard').hidden=false;['header-save','footer-save'].forEach(id=>document.getElementById(id).disabled=versionPending||(state==='conflict'&&draft.effort==='high'));if(x.dataset.toggle!==undefined)x.classList.toggle('off');extraDraft[k]=x.type==='checkbox'?x.checked:x.classList.contains('off')}});
 for(const [id,key] of [['name','name'],['prompt','prompt'],['model','model'],['effort','effort']]){let x=document.getElementById(id);if(x)x.oninput=()=>{draft[key]=x.value;dirty=true;savedNotice=false;document.querySelector('#draft-status').innerHTML='<div class="draft-note">有未保存的草稿，请检查后手动保存。</div>';document.querySelector('#discard').hidden=false;['header-save','footer-save'].forEach(id=>document.getElementById(id).disabled=locked()||versionPending||(state==='conflict'&&draft.effort==='high'))}}
 let retry=document.querySelector('#retry-read');if(retry)retry.onclick=()=>{state='refreshing';render()};
 let preview=document.querySelector('[data-preview]');if(preview)preview.onclick=()=>{preview.textContent='预览已更新（演示）'};
 showModal();
}
document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()});
document.querySelector('#demo-state').onchange=x=>{state=x.target.value;if(state==='conflict')dirty=true;if(state==='version'){if(!dirty){draft.name='P · 产品与体验（我的修改）';dirty=true}latestDraft={...initialDraft,name:'P · 产品研究（另一处修改）',prompt:'负责产品研究与需求评审。每次输出附上可核对的依据。'};versionPending=true}render()};
document.querySelector('#demo-draft').onclick=()=>{draft.name='P · 产品与体验（新名称）';dirty=true;state='offline';render()};
document.querySelector('#demo-resolve').onclick=()=>{state='online';savedNotice=true;render()};
document.querySelector('#open-records').onclick=()=>{tab='work';render()};
render();
</script>
</body></html>
