<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>feat-451 原型：聊天页分页与微体验</title>
  <style>
    :root {
      --im-accent: oklch(0.52 0.14 180);
      --im-accent-fg: oklch(0.99 0 0);
      --im-text: oklch(0.21 0.012 240);
      --im-text-muted: oklch(0.5 0.012 240);
      --im-border: oklch(0.9 0.008 240);
      --im-font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--im-font-sans);
      background: oklch(0.98 0.005 240);
      color: var(--im-text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar (dark, matching real app) ─────────────────────── */
    .sidebar {
      width: 262px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid oklch(0.29 0.010 240);
      background: oklch(0.24 0.012 240);
    }
    .sidebar-header {
      padding: 14px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 0;
      flex-shrink: 0;
    }
    .sidebar-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .sidebar-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: oklch(0.55 0.01 240);
    }
    .sidebar-new-group {
      background: oklch(0.30 0.012 240);
      border: none;
      border-radius: 8px;
      height: 36px;
      padding: 0 12px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }
    .sidebar-search {
      width: 100%;
      border: 1px solid oklch(0.33 0.010 240);
      border-radius: 10px;
      background: oklch(0.29 0.010 240);
      padding: 8px 12px;
      font: inherit;
      font-size: 0.8rem;
      color: oklch(0.85 0.01 240);
    }
    .sidebar-search::placeholder { color: oklch(0.50 0.01 240); }
    .sidebar-filters {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
    }
    .sidebar-filter {
      background: oklch(0.30 0.010 240);
      border: 0;
      border-radius: 99px;
      padding: 5px 12px;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      color: oklch(0.55 0.01 240);
      cursor: pointer;
      white-space: nowrap;
    }
    .sidebar-filter.active {
      background: var(--im-accent);
      color: #fff;
    }
    .sidebar-list {
      list-style: none;
      padding: 4px 8px 12px;
      margin: 0;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .sidebar-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.5rem 0.5rem;
      border: 0;
      border-radius: 0.6rem;
      background: transparent;
      font: inherit;
      text-align: left;
      cursor: pointer;
      min-height: 52px;
    }
    .sidebar-row:hover { background: oklch(0.28 0.012 240); }
    .sidebar-row.active {
      background: oklch(0.31 0.015 240);
      outline: 1px solid oklch(0.40 0.08 180);
    }
    .sidebar-row-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; font-weight: 600;
      flex-shrink: 0;
    }
    .sidebar-row-body { flex: 1; min-width: 0; }
    .sidebar-row-title-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .sidebar-row-title {
      font-size: 0.875rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: oklch(0.88 0.01 240);
    }
    .sidebar-row-time {
      font-size: 0.7rem;
      color: oklch(0.50 0.01 240);
      flex-shrink: 0;
    }
    .sidebar-row-preview {
      font-size: 0.78rem;
      color: oklch(0.55 0.01 240);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 1px;
    }

    /* ── Chat pane ─────────────────────────────────────────────── */
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: oklch(0.93 0.007 240);
    }
    .header {
      padding: 11px 20px;
      background: oklch(0.96 0.005 240);
      border-bottom: 1px solid var(--im-border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .header h2 { margin: 0; font-size: 14.5px; font-weight: 700; }
    .header button {
      background: transparent; border: 0; font-size: 1.2rem;
      color: var(--im-text-muted); cursor: pointer;
    }
    .header-meta {
      font-size: 0.7rem;
      color: var(--im-text-muted);
      margin-top: 1px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .history-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 0;
      color: var(--im-text-muted);
      font-size: 0.8rem;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--im-border);
      border-top-color: var(--im-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Bubbles ───────────────────────────────────────────────── */
    .bubble-wrap {
      display: flex;
      flex-direction: row;
      gap: 10px;
      max-width: 72%;
      align-self: flex-start;
    }
    .bubble-wrap.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 12px; font-weight: 600;
      flex-shrink: 0;
    }
    .bubble {
      padding: 9px 13px;
      border-radius: 1rem;
      font-size: 0.875rem;
      line-height: 1.5;
      position: relative;
      user-select: text;
    }
    .bubble.user {
      background: var(--im-accent);
      color: var(--im-accent-fg);
      border-radius: 1rem 1rem 0.25rem 1rem;
    }
    .bubble.agent {
      background: oklch(0.91 0.007 240);
      border-radius: 1rem 1rem 1rem 0.25rem;
    }
    .bubble small {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: var(--im-text-muted);
    }

    /* ── Composer ──────────────────────────────────────────────── */
    .composer {
      padding: 0.6rem 0.75rem;
      background: oklch(0.96 0.005 240);
      border-top: 1px solid var(--im-border);
      display: flex;
      align-items: flex-end;
      gap: 0.4rem;
      flex-shrink: 0;
    }
    .composer textarea {
      flex: 1;
      border: 1px solid var(--im-border);
      border-radius: 0.6rem;
      background: oklch(0.965 0.006 240);
      padding: 0.5rem 0.75rem;
      font: inherit;
      font-size: 0.9rem;
      color: var(--im-text);
      resize: none;
      min-height: 2.5rem;
      max-height: 8.5rem;
      overflow-y: auto;
      line-height: 1.4;
    }
    .composer button {
      width: 38px; height: 38px;
      border: 0; border-radius: 0.6rem;
      background: var(--im-accent); color: var(--im-accent-fg);
      cursor: pointer; flex-shrink: 0;
    }

    /* ── Context menu (compact, OS-like) ───────────────────────── */
    .context-menu {
      position: absolute;
      background: rgba(255, 255, 255, 0.98);
      border: 0.5px solid oklch(0.82 0.01 240);
      border-radius: 6px;
      box-shadow: 0 3px 16px oklch(0.15 0.01 240 / 0.2), 0 1px 2px oklch(0.15 0.01 240 / 0.08);
      padding: 2px;
      z-index: 100;
      display: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .context-menu.visible { display: block; }
    .context-menu-group {
      padding: 2px;
    }
    .context-menu-group + .context-menu-group {
      border-top: 0.5px solid oklch(0.88 0.01 240);
      margin: 0 2px;
      padding: 2px;
    }
    .context-menu button {
      display: block;
      width: 100%;
      padding: 2px 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      line-height: 17px;
      color: var(--im-text);
      transition: background 0.08s ease;
    }
    .context-menu button:hover {
      background: var(--im-accent);
      color: #fff;
    }

    /* ── Toast ─────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      left: 16px; top: 16px;
      background: oklch(0.21 0.012 240); color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: none; }

    /* ── Demo controls ─────────────────────────────────────────── */
    .demo-controls {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 50;
    }
    .demo-controls button {
      padding: 5px 10px;
      border: 1px solid var(--im-border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 11px;
      color: var(--im-text-muted);
      white-space: nowrap;
    }
    .demo-controls button:hover { background: var(--im-accent); color: #fff; border-color: var(--im-accent); }

    @media (max-width: 767px) {
      .sidebar { display: none; }
      .demo-controls { right: 8px; bottom: 8px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-row">
        <span class="sidebar-title">消息</span>
        <button class="sidebar-new-group">+ 群聊</button>
      </div>
      <input class="sidebar-search" type="text" placeholder="搜索…" />
      <div class="sidebar-filters">
        <button class="sidebar-filter active">全部</button>
        <button class="sidebar-filter">Agent</button>
        <button class="sidebar-filter">群聊</button>
      </div>
    </div>
    <div class="sidebar-list">
      <div class="sidebar-row active">
        <span class="sidebar-row-avatar" style="background:#4f46e5">Pl</span>
        <div class="sidebar-row-body">
          <div class="sidebar-row-title-line">
            <span class="sidebar-row-title">Planner</span>
            <span class="sidebar-row-time">09:14</span>
          </div>
          <div class="sidebar-row-preview">收到，正在处理。</div>
        </div>
      </div>
      <div class="sidebar-row">
        <span class="sidebar-row-avatar" style="background:#059669">SC</span>
        <div class="sidebar-row-body">
          <div class="sidebar-row-title-line">
            <span class="sidebar-row-title">Sprint Crew</span>
            <span class="sidebar-row-time">昨天</span>
          </div>
          <div class="sidebar-row-preview">@Planner 怎么看？</div>
        </div>
      </div>
      <div class="sidebar-row">
        <span class="sidebar-row-avatar" style="background:#d97706">Cd</span>
        <div class="sidebar-row-body">
          <div class="sidebar-row-title-line">
            <span class="sidebar-row-title">Coder</span>
            <span class="sidebar-row-time">周三</span>
          </div>
          <div class="sidebar-row-preview">测试跑通了。</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="pane">
    <header class="header">
      <button>‹</button>
      <div>
        <h2>Planner</h2>
        <div class="header-meta">Planner</div>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="history-status" id="loading">
        <span class="spinner"></span>
        <span>正在加载更早的消息…</span>
      </div>
      <div class="history-status" id="no-more" style="display:none">
        <span>没有更多消息了</span>
      </div>
      <div id="seed"></div>
    </section>

    <form class="composer" id="composerForm">
      <textarea id="input" rows="1" placeholder="给 Planner 发消息…"></textarea>
      <button type="submit" aria-label="Send">↑</button>
    </form>
  </main>

  <div class="context-menu" id="menu">
    <div class="context-menu-group">
      <button id="copyBtn">复制</button>
    </div>
    <div class="context-menu-group">
      <button id="forkBtn">fork</button>
    </div>
  </div>

  <div class="toast" id="toast">已复制</div>

  <div class="demo-controls">
    <button id="loadOlder">↑ 加载更早</button>
    <button id="newMsg">+ 新消息</button>
    <button id="reset">重置</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const loadingEl = document.getElementById('loading');
    const noMoreEl = document.getElementById('no-more');
    const menu = document.getElementById('menu');
    const toast = document.getElementById('toast');
    const input = document.getElementById('input');
    const form = document.getElementById('composerForm');
    let loadedCount = 0;
    let hasMore = true;

    function seedMessages() {
      const seed = document.getElementById('seed');
      const texts = [
        "第 1 轮讨论：先确定分页接口。",
        "好，我已经在看后端返回的 next_before_message_id。",
        "那前端用 useInfiniteQuery 还是手动 cursor？",
        "手动维护更轻，reducer 里加 prepend_history。",
        "自动滚底策略要改，不能每次 messages 变化都滚。",
        "对，只在最后一条 id 变化或已在底部时滚。",
        "移动端 Enter 发送也要修。",
        "还有 composer 自动增高。",
        "复制/fork 统一进长按菜单。",
        "我先把 prototype 跑通。"
      ];
      for (let i = 0; i < 25; i++) {
        const isUser = i % 3 === 1;
        const wrap = document.createElement('div');
        wrap.className = `bubble-wrap ${isUser ? 'user' : 'agent'}`;
        const mm = 8 + Math.floor(i / 6);
        const ss = (i * 13) % 60;
        const time = `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
        if (isUser) {
          wrap.innerHTML = `<div class="bubble user" data-id="seed-${i}">${texts[i % texts.length]}<small>${time}</small></div>`;
        } else {
          wrap.innerHTML = `<span class="avatar" style="background:#4f46e5">Pl</span><div class="bubble agent" data-id="seed-${i}">${texts[i % texts.length]}<small>${time}</small></div>`;
        }
        seed.appendChild(wrap);
      }
      scrollToBottom();
    }

    function isNearBottom() {
      return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
    }
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    messagesEl.addEventListener('scroll', () => {
      if (messagesEl.scrollTop < 100 && hasMore && loadingEl.style.display !== 'flex') {
        loadingEl.style.display = 'flex';
        setTimeout(() => {
          loadingEl.style.display = 'none';
          loadedCount++;
          if (loadedCount >= 2) {
            hasMore = false;
            noMoreEl.style.display = 'flex';
            return;
          }
          const anchor = messagesEl.querySelector('.bubble-wrap');
          const wrap = document.createElement('div');
          wrap.className = 'bubble-wrap agent';
          wrap.innerHTML = `
            <span class="avatar" style="background:#4f46e5">Pl</span>
            <div class="bubble agent" data-id="older-${loadedCount}">更早的历史消息 #${loadedCount}（模拟）<small>09:${10 - loadedCount}</small></div>`;
          messagesEl.insertBefore(wrap, loadingEl.nextSibling);
          if (anchor) {
            messagesEl.scrollTop = anchor.offsetTop - 20;
          }
        }, 800);
      }
    });

    let longPressTimer = null;
    let activeBubble = null;
    let touchStartX = 0, touchStartY = 0;

    function showMenu(x, y, bubble) {
      activeBubble = bubble;
      const isAgent = bubble.classList.contains('agent');
      document.getElementById('forkBtn').parentElement.style.display = isAgent ? 'block' : 'none';
      menu.style.left = Math.min(x, window.innerWidth - 120) + 'px';
      menu.style.top = Math.min(y, window.innerHeight - 80) + 'px';
      menu.classList.add('visible');
    }

    messagesEl.addEventListener('contextmenu', (e) => {
      const bubble = e.target.closest('.bubble');
      if (!bubble) return;
      e.preventDefault();
      showMenu(e.clientX, e.clientY, bubble);
    });

    messagesEl.addEventListener('touchstart', (e) => {
      const bubble = e.target.closest('.bubble');
      if (!bubble) return;
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      longPressTimer = setTimeout(() => {
        showMenu(touchStartX, touchStartY, bubble);
      }, 600);
    }, { passive: true });

    messagesEl.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (Math.abs(t.clientX - touchStartX) > 10 || Math.abs(t.clientY - touchStartY) > 10) {
        clearTimeout(longPressTimer);
      }
    }, { passive: true });

    messagesEl.addEventListener('touchend', () => clearTimeout(longPressTimer));

    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target)) menu.classList.remove('visible');
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      if (activeBubble) {
        const text = activeBubble.childNodes[0].textContent.trim();
        navigator.clipboard.writeText(text).then(() => {
          toast.textContent = '已复制';
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 1200);
        });
      }
      menu.classList.remove('visible');
    });

    document.getElementById('forkBtn').addEventListener('click', () => {
      toast.textContent = '已 fork 出分支单聊';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1200);
      menu.classList.remove('visible');
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 136) + 'px';
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.dispatchEvent(new Event('submit'));
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap user';
      wrap.innerHTML = `<div class="bubble user">${text.replace(/\n/g, '<br>')}<small>刚刚</small></div>`;
      messagesEl.appendChild(wrap);
      input.value = '';
      input.style.height = 'auto';
      scrollToBottom();
    });

    document.getElementById('loadOlder').addEventListener('click', () => {
      messagesEl.scrollTop = 0;
      messagesEl.dispatchEvent(new Event('scroll'));
    });

    document.getElementById('newMsg').addEventListener('click', () => {
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap agent';
      wrap.innerHTML = `
        <span class="avatar" style="background:#4f46e5">Pl</span>
        <div class="bubble agent">新消息 #${Date.now()} 到达<small>刚刚</small></div>`;
      messagesEl.appendChild(wrap);
      if (isNearBottom()) scrollToBottom();
    });

    document.getElementById('reset').addEventListener('click', () => location.reload());

    seedMessages();
  </script>
</body>
</html>
