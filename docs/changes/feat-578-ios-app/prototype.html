r{width:42px;height:42px;border-radius:14px;background:#e2f0ef;display:grid;place-items:center;color:#137e80;font-size:18px;flex-shrink:0}.chev{color:#9cabb0}.badge{font-size:11px;color:#16806d;background:#e5f5ec;border-radius:6px;padding:4px 6px}.muted,small{color:#75878d;line-height:1.6}h3{font-size:13px;color:#72858e;margin:22px 6px 8px;font-weight:500}h3:first-child{margin-top:0}.primary{background:#07838a;color:white;width:100%;font-weight:600}.danger{color:#b54747}.wide{width:100%;text-align:left}.note{border:1px solid #dce8e9;border-radius:12px;background:#edf6f5;padding:13px;font-size:13px;line-height:1.6;margin-bottom:14px}.warn{background:#fff3df;border-color:#eddcb8;color:#8c631c}.field{display:grid;gap:7px;margin:0 0 16px;font-size:13px;color:#5a7078}.field:last-child{margin-bottom:0}input,select,textarea{border:1px solid #d7e1e4;background:#fff;color:#243b44;border-radius:9px;padding:11px;width:100%;min-height:44px}textarea{resize:vertical;min-height:84px}aside select{width:auto}aside label{display:inline-flex;align-items:center;white-space:nowrap;gap:6px}.toggle{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 0}.toggle input{width:22px;min-height:24px;accent-color:#06848a}.bubble{background:white;border:1px solid #e0e8ea;border-radius:16px;padding:14px;margin:10px 0;line-height:1.65}.bubble.mine{margin-left:50px;background:#ddf1ee;border:0}.by{font-size:12px;color:#73888d;margin-top:18px}.code{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3f4;padding:12px;border-radius:9px;font:12px ui-monospace,monospace}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.toolbar button{background:#eef4f4}#compose{flex-shrink:0}.composer{border-top:1px solid #dce4e7;background:#fff;padding:10px;display:flex;gap:6px;align-items:end}.composer textarea{min-height:44px;max-height:120px;padding:10px;flex:1}.composer button{background:#07838a;color:#fff}.graph{display:grid;justify-items:center;gap:0;padding:18px;background:#f7fafb}.node{border:1px solid #abd4d1;background:white;border-radius:11px;min-width:210px;text-align:left;padding:14px}.edge{height:27px;border-left:2px solid #95b9ba}.tabs{display:flex;gap:5px;margin-bottom:16px}.tabs button{flex:1;background:#e8eeee;padding:7px;font-size:13px}.tabs .active{background:white;box-shadow:0 1px 5px #192f3c18}dialog{border:1px solid #d5e0e3;border-radius:20px;max-width:350px;padding:24px;line-height:1.6}dialog::backdrop{background:#122b3f65}.homebar{width:110px;height:4px;background:#31444d;border-radius:4px;align-self:center;margin:7px}#toast{position:absolute;left:24px;right:24px;bottom:90px;background:#24464c;color:white;border-radius:12px;padding:12px;display:none;z-index:2}#device{position:relative}@media(max-width:500px){aside{margin:12px auto;font-size:12px}aside h1{font-size:18px}#device{border-radius:0;border-inline:0;margin:0;height:820px;max-height:none;box-shadow:none}main{padding:16px 14px}}@media(prefers-reduced-motion:no-preference){.row:hover{background:#f6faf9}}

<aside><h1>Nano IM · 完整原生 iOS 方案</h1><p>本次新增：全部产品页面改用原生导航与控件。继承：现有四入口、功能分组与权限含义。仅演示：以下数据、状态和操作结果；HTML 不是 App。</p><label>演示状态 <select id="state"><option value="normal">正常</option><option value="offline">离线</option><option value="conflict">保存冲突</option><option value="pending">等待确认</option></select></label><label>身份 <select id="role"><option value="admin">Owner / 管理员</option><option value="member">普通成员 / 非 Owner</option></select></label><label>宽度 <select id="width"><option>430</option><option>390</option><option>600</option></select></label></aside>
<div id="device"><div class="status"><span>9:41</span><span>▮▮▮　Wi-Fi　▰</span></div><header id="head"></header><main id="main"></main><div id="compose"></div><nav id="nav"></nav><div class="homebar"></div><div id="toast" role="status"></div></div><dialog id="dialog"></dialog>
<script>
const $=id=>document.getElementById(id);let stack=['chat'],tab='chat',draft='',approved=false;const admin=()=>$('role').value==='admin',mode=()=>$('state').value;
const button=(s,a,cl='')=>`<button class="${cl}" onclick="${a.replaceAll('&','&amp;').replaceAll('"','&quot;')}">${s}</button>`;
const row=(name,sub,to,icon='◇')=>`<button class="row" onclick="go('${to}')"><span class="avatar">${icon}</span><span class="text"><strong>${name}</strong><small>${sub}</small></span><span class="chev">›</span></button>`;
const card=s=>`<section class="card">${s}</section>`,pad=s=>card(`<div class="pad">${s}</div>`),note=(s,w=false)=>`<div class="note ${w?'warn':''}">${s}</div>`;
const field=(name,value='',type='text')=>`<label class="field">${name}${type==='area'?`<textarea>${value}</textarea>`:`<input type="${type}" value="${value}">`}</label>`;
const select=(name,values)=>`<label class="field">${name}<select>${values.split('|').map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const toggle=(name,checked=true)=>`<label class="toggle">${name}<input type="checkbox" ${checked?'checked':''}></label>`;
const save=()=>button('保存',"saveForm()",'primary');const info=()=>mode()==='offline'?note('连接中断。显示最后已知内容；恢复连接后更新。',true):'';
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
function confirmAction(title,desc,yes,action){$('dialog').innerHTML=`<h2>${title}</h2><p>${desc}</p><div class="toolbar">${button('取消',"$('dialog').close()")} ${button(yes,`$('dialog').close();${action}`,'danger')}</div>`;$('dialog').showModal()}
function saveForm(){if(mode()==='conflict'){toast('其他设备已更新。草稿已保留，请重读并核对。');return}if(mode()==='offline'){toast('未能连接，未确认保存。草稿保留。');return}toast(mode()==='pending'?'已提交，等待设备确认':'已保存（演示）')}
function go(p){stack.push(p);render()}function back(){stack.pop();render()}function home(t){tab=t;stack=[t];render()}
const screens={
chat:()=>['聊天',`<input placeholder="搜索聊天或联系人" aria-label="搜索聊天或联系人"><div class="tabs" style="margin-top:14px">${button('全部',"toast('全部聊天')",'active')}${button('真人',"toast('显示真人私聊')")}${button('Agent',"toast('显示 Agent 私聊')")}${button('群聊',"toast('显示群聊')")}${button('协作网',"toast('显示 Agent network 聊天')")}</div>${card(row('产品讨论','调研 Agent · 已整理好第一版方案','conversation','研')+row('日常助手','Mini · 在线 · 1 条未读','conversation','助'))}${note('置顶和静音可在聊天详情中管理。')}`,button('＋',"go('contacts')")],
contacts:()=>['新建聊天',`<input placeholder="搜索公司联系人" aria-label="搜索公司联系人">${card(row('日常助手','Agent · owner 陈 · Mac mini','conversation','助')+row('林','公司成员','conversation','林'))}${button('选择成员创建群聊',"go('newgroup')",'primary')}`],
newgroup:()=>['新群聊',pad(field('群名称','项目讨论')+toggle('日常助手')+toggle('林'))+button('创建群聊',"go('conversation');toast('群聊已创建（演示）')",'primary')],
conversation:()=>['产品讨论',`${info()}<div class="by">你 · 09:35</div><div class="bubble mine">请整理原生 App 的关键交互。</div><div class="by">调研 Agent · Mini · 09:36</div><div class="bubble">已整理好方案。<br><b>聊天、任务、Agent、我的</b>保留原有结构；详情使用原生返回。<ul><li>附件原生选择和预览</li><li>任务节点回到聊天继续讨论</li></ul>${button('查看工具过程 · 2 次调用',"go('process')",'wide')}<small>1,248 tokens · 8.2 秒</small></div>${pad('<b>需要你的确认</b><p>调研 Agent 请求执行：读取项目目录</p>'+button(approved?'已提交，等待确认':'选择审批结果',"go('approval')",'wide'))}<div class="toolbar">${button('复制',"toast('正文已复制（演示）')")}${button('分支',"confirmAction('从此处建立分支？','将保留截至这条回复的历史。','建立分支',\"toast('分支已创建（演示）')\")")}${button('蒸馏 Skill',"go('distill')")}</div>`,button('•••',"go('chatinfo')")],
chatinfo:()=>['聊天详情',card(row('本群任务','计划与探索 · 查看活动','graph','▱')+row('群成员','你、林、调研 Agent','members','人'))+pad(field('聊天名称','产品讨论')+toggle('置顶',false)+toggle('静音',false))+save()+button('解散群聊',"confirmAction('解散产品讨论？','所有成员将失去此群入口，此操作无法撤销。','解散',\"home('chat');toast('群聊已解散（演示）')\")",'danger wide')],
members:()=>['群成员',card(row('林','成员 · 点击管理','member','林')+row('调研 Agent','Mini · 在线','agent','研'))+button('添加成员',"go('contacts')",'primary')],
member:()=>['成员管理',pad('<b>林</b><p>公司成员</p>')+button('从群聊移除',"confirmAction('移除林？','该成员将不能继续访问此群。','移除',\"back();toast('已移除（演示）')\")",'danger wide')],
process:()=>['回复过程',card(row('read_file · 完成','09:36:01 · 读取产品文档','tool','✓')+row('子任务返回 · 完成','交互分析 · 查看返回内容','child','↳'))+pad('<h3>思考摘要</h3><p>正在核对现有入口与管理范围。</p><h3>运行统计</h3><p>输入 924 / 输出 324 tokens<br>耗时 8.2 秒</p>')],
tool:()=>['工具明细',pad('<b>read_file · 已完成</b><h3>参数</h3><pre class="code">{"path":"README.md"}</pre><h3>结果</h3><pre class="code">Nano IM 产品使用说明…</pre>')],
approval:()=>['权限请求',note('此决定由调研 Agent 所在设备执行；提交后等待实际确认。')+pad('<b>读取项目目录</b><pre class="code">ls ./docs</pre>'+field('原因（可选）',''))+button('本次允许',"approved=true;back();toast('已提交，等待确认')",'primary')+button('拒绝',"approved=true;back();toast('已提交拒绝，等待确认')",'danger wide')],
distill:()=>['蒸馏 Skill',pad(select('来源会话','产品讨论|日常助手')+select('执行 Agent','调研 Agent · Mini')+select('作用域','当前 Agent|当前 Gateway 共享'))+note('跨设备来源不支持直接蒸馏。生成后先核对草稿。')+button('生成待发草稿',"draft='请从产品讨论中提炼可复用 Skill。';back();toast('已追加草稿，尚未发送')",'primary')],
tasks:()=>['任务',`<input placeholder="搜索公司任务" aria-label="搜索公司任务"><div style="height:16px"></div>${card(row('原生 App 方案','计划 · 2 / 3 已完成','graph','▱')+row('交互方案探索','探索 · 2 个候选','explore','◇'))}`],
graph:()=>['原生 App 方案',note('计划 · 2 / 3 已完成')+card('<div class="graph"><button class="node" onclick="go(\'node\')">✓ 需求对齐<br><small>已完成</small></button><div class="edge"></div><button class="node" onclick="go(\'node\')">◷ 原生交互设计<br><small>进行中 · 调研 Agent</small></button><div class="edge"></div><button class="node" onclick="go(\'node\')">○ 真机验证<br><small>等待前置</small></button></div>')],
explore:()=>['交互方案探索',card(row('方案 A：原生导航','候选 · 保留四入口','node','A')+row('方案 B：独立工作台','候选 · 尚未选定','node','B'))],
node:()=>['原生交互设计',pad('<span class="badge">进行中</span><h2>核对关键旅程</h2><p>聊天、任务回聊、Agent Work 和管理。</p><h3>前置 / 后续</h3><p>需求对齐 → 本节点 → 真机验证</p><h3>变更说明</h3><p>首版扩展为 Web 全部管理功能。</p>')+card(row('子任务','2 个子节点','graph','↳'))+button('回到产品讨论并引用',"draft+=(draft?'\\n':'')+'[任务：原生交互设计] ';tab='chat';stack=['chat','conversation'];render()",'primary')],
agents:()=>['Agent',card(row('调研 Agent','陈 · Mini · 全局模式 · 实验 · 在线','agent','研')+row('日常助手','林 · MacBook · 单 Thread','publicagent','助')),button('＋',"go('create')")],
agent:()=>['调研 Agent',pad('<span class="badge">在线 · Mini</span><h2>调研 Agent</h2><p>全局模式 · 实验 · owner 陈<br>负责项目调研与实现。</p>')+card(row('工作记录','主执行、子执行与审批','work','▤')+(admin()?row('配置','模型、指令与能力','config','⚙')+row('心跳与定时任务','频率、活跃时段与任务','heartbeat','◷')+row('Skills 使用','来源、统计与健康','skills','◇')+row('外部通道','飞书 · 已连接','channels','↗'):'')+row('会话','当前无独立会话管理；请查看工作记录','sessions','▤'))+button('发消息',"tab='chat';stack=['chat','conversation'];render()",'primary')],
publicagent:()=>['日常助手',note('林的 Agent · 单 Thread。每个聊天使用独立上下文。')+button('发消息',"tab='chat';stack=['chat','conversation'];render()",'primary')],
work:()=>['工作记录',info()+card(row('原生 App 方案','主执行 · 进行中 · 3 轮','turn','▤')+row('交互分析','子执行 · 已完成 · parent: 原生 App 方案','child','↳'))],
turn:()=>['主执行 · 第 3 轮',pad('<b>核对管理入口</b><p>全部管理功能已加入范围。</p><small>2 次工具调用 · 1,248 tokens · 8.2 秒</small>')+card(row('交互分析','子执行返回','child','↳')+row('权限请求','等待处理','approval','!')+row('过程明细','工具与结果','process','▤'))+button('加载更早轮次',"toast('已加载第 2 轮（演示）')",'wide')],
child:()=>['子执行 · 交互分析',pad('<span class="badge">已完成</span><h2>交互分析</h2><p>建议保留四入口，复杂配置拆为原生分组表单。</p><small>子任务完成，不代表主任务已结束。</small>')+card(row('主执行','回到原生 App 方案','turn','↰')+row('过程明细','1 次工具调用','process','▤'))],
create:()=>['创建 Agent',pad(field('Agent ID','research')+field('名称','调研 Agent')+select('节点','Mac mini · 在线|MacBook · 离线')+select('工作模式','单 Thread|全局模式 · 实验')+select('Workspace','使用默认目录|自定义已有目录')+field('自定义路径（使用已有目录需确认）',''))+pad(select('主模型','节点提供的模型 A|节点提供的模型 B')+toggle('启用工具')+toggle('默认发现 Skills'))+card(row('提示词预览','核对当前草稿','prompt','▤'))+button('创建 Agent',"confirmAction('确认创建 Agent？','请核对设备、模式与目录。使用已有目录时将访问该目录内容。','创建',\"go('agent');toast('已创建（演示）')\")",'primary')],
config:()=>['配置',info()+(mode()==='conflict'?note('配置已被其他设备修改。当前草稿保留。'+button('重读并核对',"toast('已载入最新版本供核对；草稿保留')"),true):'')+(mode()==='pending'?note('已提交，等待设备确认；当前暂不能重复保存。',true):'')+pad(field('名称','调研 Agent')+field('描述','负责项目调研与实现。','area')+select('主模型','模型 A|模型 B')+select('推理强度','high|medium|low')+field('有序备用模型','模型 B, 模型 C')+select('群回复策略','按提及|每条消息都回复|不回复'))+card(row('指令与能力','Custom Instructions、工具与 Skills','capabilities','⚙')+row('提示词预览','当前稳定配置与草稿','prompt','▤'))+note('工作模式与 workspace 创建后不可修改。')+(mode()==='pending'?'':save())],
capabilities:()=>['指令与能力',pad(field('Custom Instructions','先核实事实，再给出结论。','area')+toggle('工具：bash')+toggle('工具：read_file')+select('Skills 选择','默认发现|显式选择（可为空）')+toggle('research · 项目来源')+toggle('任务图')+toggle('记忆整理')+toggle('Skill 创建'))+note('能力列表来自此 Agent 的实际 Gateway；不可用项显示原因。')+save()],
prompt:()=>['提示词预览',note('包含当前稳定配置与能力选择；运行时消息上下文不在此预览中。')+pad('<pre class="code">角色：调研 Agent\n工作模式：全局\nCustom Instructions：\n先核实事实，再给出结论。\n\n工具：bash、read_file\nSkills：默认发现</pre>')],

heartbeatfile:()=>['HEARTBEAT.md',pad('<pre class="code">检查今日待办。\n仅在需要用户处理时提醒。</pre>')],
cron:()=>['定时任务',info()+card(row('每日摘要','每天 09:00 · 下次运行明天','cronjob','◷'))],
cronjob:()=>['每日摘要',pad('<b>每天 09:00</b><p>整理今日待办并发送摘要。</p><small>上次运行：已完成</small>')+button('删除定时任务',"confirmAction('删除每日摘要？','此定时任务将停止运行，操作无法撤销。','删除',\"back();toast('已删除（演示）')\")",'danger wide')],

install:()=>['安装与续签',pad('<h3>日常维护</h3><p>Mac mini 运行 AltServer，手机与其同网。打开 AltStore 检查此 App 的实际到期日并刷新。</p><h3>刷新失败</h3><p>检查 Mini 登录会话、AltServer 和同网连接；必要时 USB 连接后再刷新。</p><h3>签名过期</h3><p>保持同一账号与 App 标识，使用 AltServer 恢复 AltStore，再刷新本 App。不要先删除 App。</p>')+note('免费签名通常 7 天到期。自动刷新不保证成功；本页不代表实际续签状态。')],

};
function render(){const p=stack.at(-1),[title,body,action='']=screens[p]();$('head').innerHTML=(stack.length>1?button('‹ 返回','back()'):'')+`<h2>${title}</h2>`+action;$('main').innerHTML=body;$('main').scrollTop=0;const root=['chat','tasks','agents','me'].includes(p);$('nav').style.display=root?'flex':'none';$('nav').innerHTML=[['chat','☏','聊天'],['tasks','▱','任务'],['agents','◇','Agent'],['me','○','我的']].map(([id,icon,name])=>button(`<b>${icon}</b>${name}`,`home('${id}')`,tab===id?'active':'')).join('');$('compose').innerHTML=p==='conversation'?`<div class="composer">${button('＋',"go('attachment')")}<textarea aria-label="消息" placeholder="消息 / @提及 / 命令" oninput="draft=this.value"></textarea>${button('发送',"if(draft.trim()){toast('已发送（演示）');draft='';render()}")}</div>`:'';if(p==='conversation')$('compose').querySelector('textarea').value=draft;}
screens.attachment=()=>['添加附件',card(row('照片图库','系统照片选择器','preview','▧')+row('文件','系统文件选择器','preview','▤'))+note('此处仅演示附件路径；真实 App 使用系统选择器。')];screens.preview=()=>['附件预览',pad('<h2>方案.pdf</h2><p>246 KB · 已准备上传</p>')+button('加入待发消息',"draft+=(draft?'\\n':'')+'[附件：方案.pdf] ';stack=stack.filter(x=>!['attachment','preview'].includes(x));render()",'primary')+button('分享 / 保存',"toast('真实 App 调起系统分享面板')",'wide')];
$('state').onchange=render;$('role').onchange=render;$('width').onchange=()=>{$('device').style.width=`min(${$('width').value}px,100%)`};render();
</script></html>
