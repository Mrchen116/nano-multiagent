<div class="demo"><span>feat-584 设计原型 · 沿用产品导航 · 本次调整任务视图与协作操作 · 示例数据，无后端。</span><details><summary>演示状态</summary><div class="demo-panel"><label>当前身份 <select id="actorMode"><option value="member">小王 · 群成员／管理员</option><option value="visitor">小李 · 公开群访客</option><option value="ordinary">小李 · 普通成员</option></select></label><label><input type="checkbox" id="conflictDemo"> 下次编辑模拟版本冲突</label><button id="reset">重置演示</button></div></details></div>

<script>
const statuses={todo:'待办',doing:'进行中',in_review:'待确认',done:'已完成',paused:'暂缓',closed:'已关闭'};
const people=['未分配','小王','Agent A','Agent B'];
let nodes=[{id:'n1',parent:null,title:'公开发布准备',mode:'dag',status:'doing',creator:'Agent A',assignee:'Agent A',result:''},{id:'n2',parent:'n1',title:'修复登录失败',mode:'dag',status:'doing',creator:'Agent A',assignee:'Agent A',result:''},{id:'n3',parent:'n1',title:'整理发布说明',mode:'none',status:'todo',creator:'小王',assignee:'未分配',result:''},{id:'n4',parent:'n1',title:'确认用户引导',mode:'none',status:'in_review',creator:'Agent B',assignee:'小王',result:'已整理三步引导，等待确认。'},{id:'n5',parent:'n1',title:'核对发布清单',mode:'none',status:'done',creator:'Agent A',assignee:'Agent B',result:'清单已逐项核对。'},{id:'n6',parent:'n1',title:'探索免密登录方向',mode:'explore',status:'paused',creator:'Agent A',assignee:'Agent B',result:'暂缓，先处理当前登录问题。'},{id:'n7',parent:'n1',title:'旧版登录方案',mode:'none',status:'closed',creator:'Agent A',assignee:'未分配',result:'不继续采用此方向。'},{id:'n8',parent:'n2',title:'复现登录失败',mode:'none',status:'done',creator:'Agent A',assignee:'Agent B',result:'已定位刷新令牌边界。'},{id:'n9',parent:'n2',title:'验证修复后的登录',mode:'none',status:'todo',creator:'Agent A',assignee:'Agent B',result:''},{id:'n10',parent:'n6',title:'验证邮件链接方案',mode:'dag',status:'todo',creator:'Agent A',assignee:'Agent B',result:''}];
let scope='n1',selected=null,view='progress',page='tasks',filter='',identity='member',visibility='public',dissolved=false,notes=[],detailOpen=false,next=11;
const n=id=>nodes.find(x=>x.id===id), children=id=>nodes.filter(x=>x.parent===id), esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const actor=()=>identity==='member'?'小王':'小李';
const boardStates=['todo','doing','in_review','done','closed'], inColumn=(x,key)=>key==='todo'?['todo','paused'].includes(x.status):x.status===key;
let conflictStage='',claimTarget=null;
const member=()=>identity!=='visitor', writable=()=>member()&&!dissolved, canDelete=x=>writable()&&(identity==='member'||x.creator==='小李');
function path(x){let a=[];for(let p=x.parent;p;p=n(p)?.parent)a.unshift(n(p).title);return a.join(' / ')}
function badge(x){return `<span class="badge ${x.status}">${statuses[x.status]}</span>`}
function summary(x){const kids=children(x.id);if(!kids.length)return '未拆分';const counts=Object.keys(statuses).map(s=>{const k=kids.filter(x=>x.status===s).length;return k?`${statuses[s]} ${k}`:''}).filter(Boolean);return `直属子任务 ${kids.length} · ${counts.join(' / ')}`}
function card(x){return `<article class="card ${selected===x.id&&detailOpen?'selected':''}"><button class="card-main" onclick="choose('${x.id}')"><div class="card-top"><span class="node-id">${x.id}</span>${badge(x)}</div><h3>${esc(x.title)}</h3><div class="owner-line"><span class="avatar ${x.assignee==='未分配'?'none':''}">${x.assignee==='未分配'?'–':esc(x.assignee.replace('Agent ',''))}</span>${esc(x.assignee)}</div>${children(x.id).length?`<p class="subsummary">${esc(summary(x))}</p>`:''}</button>${x.mode!=='none'?`<button class="enter" onclick="enter('${x.id}')">${x.mode==='explore'?'查看探索':'查看子任务'}<span>↗</span></button>`:''}</article>`}
function choose(id){selected=id;detailOpen=true;render()}function enter(id){scope=id;selected=id;detailOpen=false;page='tasks';filter='';render()}function openNode(id){const x=n(id);scope=x.parent||id;selected=id;detailOpen=true;page='tasks';render()}
function sidebar(){if(page==='chat')return `<div class="sidehead"><b>聊天</b><button aria-label="新建群" onclick="newGroup()">＋</button></div><button class="item active" onclick="page='chat';render()"><b>发布协作群</b><small>${visibility==='public'?'公司内公开':'私密群'}${dissolved?' · 已解散':''}</small></button>`;return `<div class="sidehead"><b>任务</b><button aria-label="新建大任务" onclick="edit(null,true)" ${writable()?'':'disabled'}>＋</button></div><input class="search" placeholder="搜索任务…" aria-label="搜索任务" oninput="toast('搜索沿用现有能力，原型可按负责人筛选')"><details class="menu"><summary>${filter?esc(filter):'全部负责人'} <span class="muted">⌄</span></summary><div class="menu-content"><button onclick="filter='';render()">全部负责人</button>${people.map(p=>`<button onclick="filter='${p}';render()">${p}</button>`).join('')}</div></details><p class="sidecaption">${filter?'直接负责 · 所有层级':'全部任务'}</p>${(filter?nodes.filter(x=>x.assignee===filter):nodes.filter(x=>!x.parent)).map(x=>`<button class="item ${selected===x.id||scope===x.id?'active':''}" onclick="${filter?`openNode('${x.id}')`:`enter('${x.id}')`}"><b>${esc(x.title)}</b><small>发布协作群${path(x)?' / '+esc(path(x)):''}</small></button>`).join('')}`}
function detail(){if(!detailOpen)return '';let x=n(selected);if(!x)return '';const mayClaim=writable()&&['未分配',actor()].includes(x.assignee)&&x.status!=='doing';return `<aside class="detail"><div class="detail-top"><span>任务 · ${x.id}</span><button aria-label="关闭详情" onclick="detailOpen=false;render()">×</button></div><h2>${esc(x.title)}</h2>${badge(x)}${writable()?`<div class="detail-tools">${mayClaim?`<button class="primary" onclick="claim('${x.id}')">领取并开始</button>`:''}<button class="${mayClaim?'ghost':''}" onclick="edit('${x.id}')">编辑</button><details class="menu right"><summary aria-label="更多操作">···</summary><div class="menu-content"><button onclick="assign('${x.id}')">调整负责人</button>${canDelete(x)?`<button class="danger" onclick="removeTask('${x.id}')">删除任务及子树</button>`:''}</div></details></div>`:!member()&&!dissolved?'<div class="detail-tools"><button class="primary" onclick="join()">加入群聊后操作</button></div>':''}<div class="facts"><div class="fact"><span>负责人</span>${writable()?`<button onclick="assign('${x.id}')">${esc(x.assignee)} ⌄</button>`:`<b>${esc(x.assignee)}</b>`}</div><div class="fact"><span>创建者</span><b>${esc(x.creator)}</b></div><div class="fact"><span>所属群</span><button onclick="page='chat';render()">发布协作群 ↗</button></div></div><h3>描述</h3><p>${esc(x.description||'为公开发布完成当前工作。')}</p><h3>结果</h3><p class="${x.result?'':'muted'}">${esc(x.result||'尚未记录结果')}</p>${children(x.id).length?`<h3>直属子任务</h3><p class="muted">${esc(summary(x))}</p>`:''}${x.mode!=='none'?`<button class="scope-link" onclick="enter('${x.id}')">查看${x.mode==='explore'?'探索':'下一层'}<span>↗</span></button>`:''}${dissolved?'<p class="muted" style="margin-top:20px">群已解散，仅供历史回看</p>':''}</aside>`}
function render(){document.querySelector('.user').textContent=identity==='member'?'小王':'小李';document.getElementById('tasksNav').classList.toggle('active',page==='tasks');document.getElementById('chatNav').classList.toggle('active',page==='chat');document.getElementById('side').innerHTML=sidebar();let x=n(scope);if(!x){scope=nodes[0]?.id;selected=scope;x=n(scope)}const unavailable=identity==='visitor'&&visibility==='private';if(unavailable){document.getElementById('main').innerHTML='<div class="section"><h1>无法访问此内容</h1><p>群或任务不存在，或你没有访问权限。</p></div>';document.getElementById('side').innerHTML='';return}let head=`<header class="header"><div><div class="title-row"><h1>${page==='chat'?'发布协作群':x?.title||'任务'}</h1>${page==='tasks'&&x?`<button class="ghost title-detail" onclick="choose('${x.id}')">详情</button>`:''}</div><p class="muted">${visibility==='public'?'公司内公开':'私密群'} · ${member()?'已加入':'尚未加入'}${dissolved?' · 已解散':''}</p></div><div class="actions"><button class="mobile-goals" onclick="document.getElementById('side').classList.toggle('open')">任务列表</button><button class="ghost" onclick="page=page==='chat'?'tasks':'chat';render()">${page==='chat'?'任务':'发布协作群 ↗'}</button>${page==='chat'?'<button onclick="settings()">群设置</button>':''}</div></header>`;if(dissolved)head+='<div class="hint">群已解散。任务与结果保留，未完成工作已关闭。</div>';if(!member()&&!dissolved)head+='<div class="hint">可查看公开群内容。<button onclick="join()">加入群聊</button></div>';if(page==='chat'){document.getElementById('main').innerHTML=head+`<section class="section"><div class="groupbar"><h2>发布协作群</h2><small>${people.filter(p=>p!=='未分配').map(esc).join(' · ')}</small><button onclick="newGroup()">新建群聊</button></div><div class="chatline"><b>小王</b><p>我们在这里协调公开发布的准备工作。</p></div>${notes.map(t=>`<div class="chatline"><small>系统</small><p>${t}</p></div>`).join('')}${!notes.length?'<div class="chatline muted">调整任务负责人或提交结果后，系统消息会出现在此处。</div>':''}<div class="composer"><input placeholder="发送消息…" ${writable()?'':'disabled'}><button ${writable()?'':'disabled'} onclick="toast('普通聊天为现有界面背景')">发送</button></div></section>`;return}if(!x){document.getElementById('main').innerHTML=head+'<div class="section">暂无任务</div>';return}let crumbs=[];for(let p=x;p;p=n(p.parent))crumbs.unshift(p);document.getElementById('main').innerHTML=head+`<div class="crumbs"><span>Tasks</span>${crumbs.map(c=>`<span>›</span><button onclick="enter('${c.id}')">${esc(c.title)}</button>`).join('')}</div><div class="workspace"><section class="center"><div class="toolbar"><p class="scope-meta">${esc(summary(x))}</p><div class="actions"><div class="segment"><button class="${view==='structure'?'active':''}" onclick="view='structure';render()">结构图</button><button class="${view==='progress'?'active':''}" onclick="view='progress';render()">完成情况</button></div><button class="primary" onclick="edit(null,false)" ${writable()?'':'disabled'}>＋ 子任务</button></div></div>${view==='progress'?`<div class="board-scroll"><div class="board">${boardStates.map(s=>`<section class="column"><h3><i class="dot ${s}"></i>${statuses[s]}<span class="count">${children(scope).filter(x=>inColumn(x,s)).length}</span></h3>${children(scope).filter(x=>inColumn(x,s)).map(card).join('')||'<p class="empty">暂无任务</p>'}</section>`).join('')}</div></div>`:`<div class="graph">${children(scope).map(card).join('')||'<p>暂无子任务</p>'}</div><p class="muted" style="padding:14px 20px">原型连线仅示意；真实产品沿用已有依赖图与探索衍生布局。</p>`}</section>${detail()}</div>`}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3200)}
function show(content){document.getElementById('modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><section>${content}</section></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}
function mention(p){return p&&p!=='未分配'?`<span class="mention">@${esc(p)}</span>`:''}function ref(x){return `<button onclick="openNode('${x.id}')">「${esc(x.title)}」</button>`}
function assign(id){const x=n(id);show(`<h2>调整负责人</h2><p>${esc(x.title)}</p><label for="owner">所属群成员</label><select id="owner">${people.map(p=>`<option ${p===x.assignee?'selected':''}>${p}</option>`).join('')}</select><p class="muted">非成员需先加入发布协作群。</p><div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveAssign('${id}')">保存</button></div>`)}
function saveAssign(id){const x=n(id),old=x.assignee,value=document.getElementById('owner').value;if(old!==value){x.assignee=value;notes.push(value==='未分配'?`${identity==='member'?'小王':'小李'}取消了 ${ref(x)} 的负责人 ${mention(old)}。`:old==='未分配'?`${identity==='member'?'小王':'小李'}将 ${ref(x)} 分配给了 ${mention(value)}。`:`${identity==='member'?'小王':'小李'}将 ${ref(x)} 从 ${mention(old)} 改派给了 ${mention(value)}。`)}closeModal();render();toast('已保存，所属群已出现系统消息')}
function claim(id){const x=n(id);if(!writable()||!['未分配',actor()].includes(x.assignee))return;if(x.status==='done'){edit(id);claimTarget=id;document.getElementById('status').value='doing';document.getElementById('reason').focus();return}const old=x.assignee;x.assignee=actor();x.status='doing';if(old!==x.assignee)notes.push(`${esc(actor())}将 ${ref(x)} 分配给了 ${mention(x.assignee)}。`);render();toast('已领取，状态更新为进行中')}
function edit(id,root=false){conflictStage='';claimTarget=null;const x=n(id);show(`<h2>${x?'编辑任务':root?'新建大任务':'新建子任务'}</h2>${!x?`<p class="muted">所属群：发布协作群${root?'':' · 当前层：'+esc(n(scope).title)}</p>`:''}<label for="title">标题</label><input id="title" value="${esc(x?.title||'')}"><label for="desc">描述</label><textarea id="desc">${esc(x?.description||'')}</textarea><label for="status">状态</label><select id="status">${Object.entries(statuses).map(([s,l])=>`<option value="${s}" ${x?.status===s?'selected':''}>${l}</option>`).join('')}</select>${!x?`<label for="mode">内部结构</label><select id="mode">${root?'':'<option value="none">不拆分</option>'}<option value="dag">计划依赖</option><option value="explore">探索方向</option></select><label for="owner">负责人</label><select id="owner">${people.map(p=>`<option>${p}</option>`).join('')}</select>`:''}<label for="result">结果</label><textarea id="result">${esc(x?.result||'')}</textarea><label for="reason">变更说明</label><input id="reason" placeholder="完成后恢复进行中时填写返工原因"><p id="error" class="notice"></p><div id="conflict"></div><div class="actions"><button onclick="closeModal()">取消</button><button id="saveTask" class="primary" onclick="saveEdit('${id||''}',${root})">保存</button></div>`)}
function saveEdit(id,root){let x=n(id),old=x?.status;const title=document.getElementById('title').value.trim(),status=document.getElementById('status').value;if(!title){document.getElementById('error').textContent='请填写标题';return}if(old==='done'&&status==='doing'&&!document.getElementById('reason').value.trim()){document.getElementById('error').textContent='请填写返工原因';return}if(x&&document.getElementById('conflictDemo').checked){document.getElementById('conflictDemo').checked=false;x.description='其他成员补充：需要覆盖重新登录与令牌续期。';conflictStage='needs-read';document.getElementById('saveTask').disabled=true;document.getElementById('conflict').innerHTML=`<div class="conflict"><h3>任务已被其他成员更新</h3><p>你的修改仍保留在上方表单中。先读取最新记录，再决定是否提交。</p><button onclick="readLatest('${id}')">读取最新记录</button></div>`;return}if(conflictStage==='needs-read')return;conflictStage='';if(x&&claimTarget===id&&status==='doing'){const prior=x.assignee;x.assignee=actor();if(prior!==x.assignee)notes.push(`${esc(actor())}将 ${ref(x)} 分配给了 ${mention(x.assignee)}。`)}claimTarget=null;if(!x){x={id:'n'+next++,parent:root?null:scope,title,mode:document.getElementById('mode').value,status,creator:identity==='ordinary'?'小李':'小王',assignee:document.getElementById('owner').value};nodes.push(x);if(x.assignee!=='未分配')notes.push(`${identity==='member'?'小王':'小李'}将 ${ref(x)} 分配给了 ${mention(x.assignee)}。`)}Object.assign(x,{title,status,description:document.getElementById('desc').value,result:document.getElementById('result').value});if(old&&old!==status){let targets=[];if(['paused','closed'].includes(status))targets=children(x.id).map(c=>c.assignee).filter(p=>p.startsWith('Agent'));else if(['in_review','done'].includes(status))targets=[x.creator,n(x.parent)?.assignee];if(['paused','closed','in_review','done'].includes(status))notes.push(`${identity==='member'?'小王':'小李'}将 ${ref(x)} 设为${statuses[status]}。${[...new Set(targets)].map(mention).filter(Boolean).join(' ')}`)}selected=x.id;if(root)scope=x.id;closeModal();render();toast('任务已保存')}
function readLatest(id){const x=n(id);conflictStage='read';document.getElementById('conflict').innerHTML=`<div class="conflict"><h3>已读取最新记录</h3><p>最新描述：${esc(x.description)}</p><p>上方仍是你的草稿。可继续修改，确认后按最新版本重新提交。</p></div>`;const button=document.getElementById('saveTask');button.disabled=false;button.textContent='确认重试'}
function descendants(id){let set=new Set([id]);for(let i=0;i<8;i++)nodes.forEach(x=>{if(set.has(x.parent))set.add(x.id)});return set}
function removeTask(id){const x=n(id),ids=descendants(id);show(`<h2>删除任务及整个子树？</h2><p>${esc(x.title)}</p><p>将永久删除本任务及 ${ids.size-1} 个下属任务，包括其他成员创建或负责的任务。关闭任务可以保留记录。</p><div class="actions"><button onclick="closeModal()">取消</button><button class="danger" onclick="nodes=nodes.filter(x=>!descendants('${id}').has(x.id));selected=scope;closeModal();render()">删除 ${ids.size} 个任务</button></div>`)}
function join(){if(dissolved)return;if(!people.includes('小李'))people.push('小李');identity='ordinary';document.getElementById('actorMode').value='ordinary';render();toast('已加入发布协作群，可领取和维护任务')}
function settings(){show(`<h2>群设置</h2><label>群名称</label><input value="发布协作群" disabled><label for="visibility">可见范围</label><select id="visibility" ${identity==='member'&&!dissolved?'':'disabled'}><option value="public" ${visibility==='public'?'selected':''}>公司内公开</option><option value="private" ${visibility==='private'?'selected':''}>私密 · 仅成员</option></select><p class="muted">仅已加入本群的公司管理员可更改范围。</p><div class="actions">${!dissolved&&identity==='member'?'<button class="danger" onclick="dissolveConfirm()">解散群聊</button>':''}<button onclick="closeModal()">关闭</button>${identity==='member'&&!dissolved?'<button class="primary" onclick="visibility=document.getElementById(\'visibility\').value;closeModal();render()">保存</button>':''}</div>`)}
function dissolveConfirm(){show('<h2>解散发布协作群？</h2><p>所有未完成任务将关闭，已完成任务与结果保留。原可见范围内仍可回看历史。</p><div class="actions"><button onclick="closeModal()">取消</button><button class="danger" onclick="dissolved=true;nodes.forEach(x=>{if(![\'done\',\'closed\'].includes(x.status))x.status=\'closed\'});closeModal();render()">解散群聊</button></div>')}
function newGroup(){show('<h2>新建群聊</h2><label for="groupName">群名称</label><input id="groupName" placeholder="填写群名称"><label for="groupVisibility">可见范围</label><select id="groupVisibility"><option>公司内公开</option><option>私密 · 仅成员</option></select><p class="muted">公开群允许公司成员查看并自行加入。</p><div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="if(document.getElementById(\'groupName\').value.trim()){closeModal();toast(\'已演示新建群表单，示例任务仍属于发布协作群\')}">创建</button></div>')}
document.getElementById('chatNav').onclick=()=>{page='chat';render()};document.getElementById('tasksNav').onclick=()=>{page='tasks';render()};document.getElementById('actorMode').onchange=e=>{identity=e.target.value;render()};document.getElementById('reset').onclick=()=>location.reload();render();
</script></html>
