<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nano · 你的第一个助手</title>
<style>
:root{color-scheme:light;--ink:#243440;--muted:#60717e;--teal:#0f766e;--line:#e2e8ed;--soft:#e5f3ef}*{box-sizing:border-box}body{margin:0;background:#f7f9fb;color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8ac8bd;outline-offset:3px}header{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px}.brand{font-weight:800;font-size:19px;display:flex;gap:10px;align-items:center}.mark{background:#8bbdb4;border-radius:7px;width:25px;height:25px;display:grid;place-items:center;color:#193f39}.account{font-size:13px;color:var(--muted)}main{max-width:1072px;margin:56px auto;padding:0 32px}.intro{margin-bottom:32px}.eyebrow{color:var(--teal);font-size:12px;font-weight:700;letter-spacing:.13em}.intro h1{font-size:32px;line-height:1.3;margin:8px 0 12px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted);max-width:640px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:38px}.steps{list-style:none;padding:0;margin:8px 0}.steps li{display:flex;align-items:center;gap:12px;color:var(--muted);padding:11px 0}.steps b{border:1px solid var(--line);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:12px;background:white}.steps .active{color:var(--teal);font-weight:700}.steps .active b,.steps .done b{background:var(--teal);color:white;border-color:var(--teal)}.aside-note{color:var(--muted);font-size:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 10px 28px -22px #193f39}.card h2{font-size:24px;margin:0 0 6px;letter-spacing:-.025em}.sub{color:var(--muted);margin:0 0 24px;font-size:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}.choice{background:white;text-align:left;border:1px solid var(--line);border-radius:12px;padding:18px;color:var(--ink)}.choice strong{display:block;font-size:15px}.choice small{display:block;color:var(--muted);margin-top:6px;line-height:1.5}.choice.selected{border-color:var(--teal);background:#f2f9f6;box-shadow:0 0 0 1px var(--teal)}.chip{display:inline-block;border-radius:5px;background:var(--soft);color:var(--teal);padding:1px 7px;font-size:11px;margin-bottom:8px}.instructions{background:#f6f8fa;border:1px solid var(--line);border-radius:10px;padding:16px;font-size:13px}.instructions p{margin:0 0 12px}.command{font:12px/1.65 ui-monospace,monospace;overflow-wrap:anywhere;display:block}.primary,.secondary{border:0;border-radius:8px;padding:11px 18px;font-weight:650}.primary{background:var(--teal);color:white}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.copy{margin-top:14px;width:100%}.status{margin:22px 0 0;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#b7c5cb;flex-shrink:0}.status.ok{color:var(--teal)}.status.ok .dot{background:var(--teal)}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:23px;margin-top:23px;border-top:1px solid var(--line)}.hint{font-size:12px;color:var(--muted)}label{display:block;font-size:13px;font-weight:600;margin:18px 0 7px}input,textarea,select{border:1px solid #c2cfd7;border-radius:8px;padding:11px 12px;width:100%;background:white;color:var(--ink)}textarea{resize:vertical;min-height:94px}.detail{font-size:12px;color:var(--muted);margin-top:5px}.model-row{display:flex;gap:12px;align-items:center;padding:17px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.model-icon{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--teal);font-weight:700}.grow{flex:1}.model-row strong,.model-row small{display:block}.model-row small{color:var(--muted);font-size:12px}.link{background:none;border:0;padding:0;color:var(--teal);font-size:13px}.preview{background:#f6f8fa;border-radius:10px;padding:16px;margin-top:22px;display:flex;gap:12px;font-size:13px}.preview p{margin:0;color:var(--muted)}.chat{display:flex;flex-direction:column;gap:20px}.bubble{padding:15px 18px;border-radius:12px;max-width:90%;background:#f3f6f8}.bubble.user{align-self:flex-end;background:var(--soft)}.demo{border-top:1px dashed #bccdd0;padding:15px 28px;background:#eef3f6;color:#60717e;font-size:12px;display:flex;align-items:center;flex-wrap:wrap;gap:12px}.demo button{font-size:12px;padding:5px 10px}.demo-label{font-weight:700}.error{color:#ad4040;background:#fff4f4;border-radius:8px;padding:12px;font-size:13px}.hidden{display:none!important}@media(max-width:760px){header{padding:0 20px}main{margin:26px auto;padding:0 18px}.intro h1{font-size:27px}.layout{display:block}.steps{display:flex;justify-content:space-between;margin:0 0 22px}.steps li{display:block;text-align:center;font-size:11px;padding:0}.steps b{margin:0 auto 7px}.aside-note{display:none}.card{padding:23px}.choices{grid-template-columns:1fr}.choice{padding:14px}.footer{align-items:flex-start}.footer .primary{white-space:nowrap}.model-row{flex-wrap:wrap}.intro{margin-bottom:22px}} 
.chat-mode .intro,.chat-mode .aside-note{display:none}.chat-mode main{max-width:1400px;margin:24px auto}.chat-mode .layout{grid-template-columns:180px minmax(0,1fr)}.chat-mode .card{min-height:650px}.chat-mode .steps{background:#eef4f6;border-radius:12px;padding:16px}.chat-mode .steps li{padding:14px 0}@media(max-width:760px){.chat-mode .layout{display:block}.chat-mode .steps{display:none}.chat-mode .card{min-height:600px}}
</style>
<header><div class="brand"><span class="mark">✓</span> nano</div><span class="account">小林的个人空间 · <button class="link" onclick="team=true;render()">加入团队</button> · 中 / EN</span></header>
<main><div class="intro"><span class="eyebrow">从这里开始</span><h1>让你的第一个助手，准备好工作。</h1><p>服务已经为你准备好了。连接自己的电脑，选好模型，告诉助手你想做什么。</p></div><div class="layout"><aside><ol class="steps" id="steps"></ol><p class="aside-note">你的助手在自己的电脑上工作。<br>只有你能管理它和它的文件。<br><br>进度会自动保留，随时可以回来继续。</p></aside><section class="card" id="card"></section></div></main>
<div class="demo"><span class="demo-label">设计原型 · 仅演示</span><span>沿用现有浅色/青绿设计；新增连续引导。下方模拟电脑与网络事件，不属于产品。</span><button class="secondary" onclick="connected=true;render()">模拟电脑已连接</button><button class="secondary" onclick="failed=!failed;render()">切换连接失败</button><button class="secondary" onclick="source='none';step=1;api=false;render()">模拟无现成连接</button><button class="secondary" onclick="source='proxy';step=1;api=false;render()">模拟发现代理</button><button class="secondary" onclick="source='codex';step=1;api=false;render()">模拟发现 Codex</button><button class="secondary" onclick="verify()">模拟授权完成</button><button class="secondary" onclick="step=0;connected=false;failed=true;render()">模拟电脑离线</button><button class="secondary" onclick="step=0;connected=false;failed=false;render()">重置</button></div>
<script>
let step=0,method='agent',connected=false,failed=false,api=false,verified=false,purpose='日常助理',name='小助理',goal='帮我整理资料、安排计划，持续跟进重要的事。',source='codex',oauth=false,service='OpenAI',team=false,joined=false,created=false,chatOpen=false,messages=[];
const purposes={'日常助理':['帮我整理资料、安排计划，持续跟进重要的事。','帮我把这周最重要的目标整理成一份可执行计划。先问我三个必要的问题。'],'资料研究':['帮我查找资料、比较证据，形成有来源的研究结论。','我想了解一个新领域。先问清我的研究问题和用途，再帮我制定查证计划。'],'编程搭档':['帮我理解项目、拆解需求，验证每次修改的结果。','我想推进一个项目。先问我项目位置、目标和当前阻碍，帮我确定第一步。'],'自己定义':['围绕我的目标，先澄清必要信息，再一起推进。','请围绕我给你的目标，先问三个最必要的问题，再安排第一步。']};
const titles=['连接电脑','连接模型','认识你的助手','开始第一件事'];
const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function next(){step++;render()}
function choose(p){purpose=p;goal=purposes[p][0];render()}
function verify(){verified=!failed;oauth=false;render()}
function send(){const input=document.getElementById('message');if(!input.value.trim())return;messages.push(input.value);render()}
function render(){document.body.classList.toggle('chat-mode',chatOpen&&!team);document.getElementById('steps').innerHTML=titles.map((t,i)=>`<li class="${i===step?'active':i<step?'done':''}"><b>${i<step?'✓':i+1}</b>${t}</li>`).join('');let html='';
if(team){html=`<h2>加入团队</h2><p class="sub">你的个人助手已属于你自己的空间。加入团队后才能看见团队成员和共享助手，个人历史仍只属于你。</p>${joined?'<div class="status ok">申请已提交，等待管理员批准。期间你可以继续个人设置。</div>':'<button class="primary" onclick="joined=true;render()">申请加入此服务的团队</button>'}<div class="footer"><button class="link" onclick="team=false;render()">← 继续个人设置</button></div>`;}
else if(step===0){html=`<h2>把这台电脑接进来</h2><p class="sub">选择你习惯的方式。两种方式都会把电脑连接到当前个人空间。</p><div class="choices"><button class="choice ${method==='agent'?'selected':''}" onclick="method='agent';render()"><span class="chip">已有本地 Agent？推荐</span><strong>交给本地 Agent</strong><small>复制一段说明，让 Codex、Claude Code 等帮你安装。</small></button><button class="choice ${method==='manual'?'selected':''}" onclick="method='manual';render()"><span class="chip">一条命令</span><strong>自己动手安装</strong><small>在电脑终端粘贴运行，按提示确认连接。</small></button></div><div class="instructions"><p>${method==='agent'?'把下面这段说明发给你电脑上的 Agent：':'在要运行助手的电脑上打开终端，粘贴下面的命令：'}</p><code class="command">${method==='agent'?'请帮我安装 Nano 电脑端并连接 https://im.example.com。运行该服务的安装器：https://im.example.com/install.sh。保留已有配置与文件，安装后打开浏览器让我确认电脑绑定。不要索取或上传我的账号密码、模型密钥。':'curl -fsSL https://im.example.com/install.sh -o /tmp/nano-install.sh && bash /tmp/nano-install.sh'}</code><button class="secondary copy" onclick="this.innerText='已复制，请到电脑上继续'">${method==='agent'?'复制安装说明':'复制安装命令'}</button></div><p class="detail">支持 macOS / Linux。Windows 请在 WSL 中运行。无需安装 IM 服务。</p><div class="status ${connected?'ok':''}"><span class="dot"></span>${connected?'MacBook 已连接到你的个人空间':'等待电脑连接… 安装完成后会自动更新'}</div>${failed?'<p class="error">电脑暂时离线。请在电脑上重跑上方安装命令；已有身份和文件会保留，重新上线后可继续。</p>':''}${connected?'<div class="footer"><span class="hint">连接成功，接下来选择模型。</span><button class="primary" onclick="next()">继续 →</button></div>':''}`;}
else if(step===1){html=`<h2>给助手接通一个模型</h2><p class="sub">正在配置 MacBook 上的助手。优先使用你已经拥有的连接。</p>`;
if(!api){html+=source==='none'?'<p class="instructions">没有发现现成连接。可以连接 Codex 账号，或填写 API Key。</p>':source==='proxy'?'<div class="model-row"><div class="model-icon">P</div><div class="grow"><strong>本机模型代理</strong><small>127.0.0.1:4000 · 已发现，尚未验证</small></div><button class="primary" onclick="verify()">使用并测试</button></div>':'';
if(source!=='proxy')html+=`<div class="model-row"><div class="model-icon">C</div><div class="grow"><strong>Codex</strong><small>${source==='codex'?'检测到本机 Codex · 为 Nano 登录一次':'用你的 Codex 账号连接'}</small></div><button class="primary" onclick="oauth=true;render()">连接 Codex 账号</button></div>`;
if(oauth)html+='<div class="instructions"><strong>在授权页输入一次性代码</strong><p>ABCD-1234</p><a href="https://auth.openai.com/codex/device" target="_blank" rel="noreferrer">打开 Codex 授权页 ↗</a><p>等待你在授权页完成登录。完成后会自动验证模型。</p><button class="link" onclick="oauth=false;render()">取消此次登录</button></div>';
html+='<p class="detail">凭据留在这台电脑，保存后不会回显。无需复制本机登录文件。</p><button class="link" style="margin-top:20px" onclick="api=true;render()">使用 API Key 或自定义服务 →</button>';
}else{html+=`<label for="service">模型服务</label><select id="service" onchange="service=this.value;render()">${['OpenAI','DeepSeek','Anthropic','自定义兼容服务'].map(s=>`<option ${s===service?'selected':''}>${s}</option>`).join('')}</select>${service==='自定义兼容服务'?'<label for="protocol">服务协议</label><select id="protocol"><option>OpenAI Chat Completions</option><option>Anthropic Messages</option><option>OpenAI Responses</option></select><label for="endpoint">服务地址</label><input id="endpoint" placeholder="https://api.example.com/v1">':''}<label for="key">API Key${service==='自定义兼容服务'?'（本机免密代理可留空）':''}</label><input id="key" type="password" placeholder="粘贴你的 API Key"><p class="detail">安全保存到这台电脑，之后不会回显。</p><label for="model">模型</label><input id="model" placeholder="填写该服务提供的模型 ID"><div style="margin-top:16px"><button class="primary" onclick="verify()">测试连接</button> <button class="link" onclick="api=false;render()">返回发现的连接</button></div>`;}
html+=`${failed?'<p class="error">连接未通过。请检查登录状态、地址、模型或 Key，然后重试；电脑绑定已保留。</p>':''}${verified?'<div class="status ok"><span class="dot"></span>模型已通过请求验证（原型模拟）</div>':''}<div class="footer"><button class="link" onclick="step=0;render()">← 返回</button><button class="primary" ${!verified?'disabled style="opacity:.45"':''} onclick="next()">继续 →</button></div>`;}
else if(step===2){html=`<h2>你想让助手帮你做什么？</h2><p class="sub">先从一个方向开始。名字和目标之后都可以修改。</p><div class="choices">${Object.keys(purposes).map(p=>`<button class="choice ${purpose===p?'selected':''}" onclick="choose('${p}')"><strong>${p}</strong><small>${p==='日常助理'?'计划、整理与跟进':p==='资料研究'?'阅读、调研与归纳':p==='编程搭档'?'理解项目、开发与排障':'按你的工作方式来'}</small></button>`).join('')}</div><label for="name">给助手起个名字</label><input id="name" value="${escape(name)}" oninput="name=this.value"><label for="goal">告诉它你的目标</label><textarea id="goal" oninput="goal=this.value">${escape(goal)}</textarea><div class="preview"><div class="model-icon">✓</div><div><strong>在 MacBook 上工作</strong><p>工作文件保存在：</p><code class="command">/Users/lin/.nanoassistant/connections/6b8e/workspaces/assistant-a18d</code><p>这是助手的独立文件夹。处理其他文件时，再把位置告诉它。</p></div></div>${failed?'<p class="error">电脑尚未确认创建结果。名称和目标已保留，点击重试会核对同一助手，不会重复创建。</p>':''}<div class="footer"><button class="link" onclick="step=1;render()">← 返回</button><button class="primary" onclick="if(!failed){created=true;next()}else{render()}">${failed?'核对并重试':'创建我的助手 →'}</button></div>`;}
else{html=`<p class="eyebrow">${chatOpen?'聊天 · '+escape(name):'助手已创建'}</p><h2>${chatOpen?'一起开始工作':escape(name)+'已准备好'}</h2><p class="sub">目标：${escape(goal)}</p>${!chatOpen?'<p>接下来进入和助手的真实聊天。你可以使用建议，也可以输入自己的任务。</p><button class="primary" onclick="chatOpen=true;render()">开始第一件事 →</button>':`<div class="chat"><p class="detail">MacBook · 在线 · 个人聊天</p>${messages.map(m=>`<div class="bubble user">${escape(m)}</div><div class="bubble"><small>示例模型回复（仅原型）</small><br>我们先明确目标、时间与已有资料，再确定第一步。你希望先完成什么？</div>`).join('')}${messages.length?'':`<button class="choice" onclick="document.getElementById('message').value=purposes[purpose][1]"><strong>从你的用途开始 →</strong><small>${escape(purposes[purpose][1])}</small></button>`}<label for="message">给 ${escape(name)} 发消息</label><textarea id="message" placeholder="输入你现在想做的事"></textarea><button class="primary" onclick="send()">发送</button></div><p class="detail">可继续对话；完整产品使用既有聊天侧栏、消息流与输入框。</p>`}`;}
if(chatOpen&&!team)document.getElementById('steps').innerHTML='<li class=active>聊天</li><li>小助理</li><li>任务</li><li>助手与设备</li>';document.getElementById('card').innerHTML=html;}
render();
</script></html>
