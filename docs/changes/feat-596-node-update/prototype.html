<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nano 电脑更新 · 体验原型</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#192126;background:#edf0f2;font:14px/1.55 system-ui,-apple-system,sans-serif}button,a,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid #d1d8dc;border-radius:8px;padding:8px 14px;background:white;color:#253438;font-weight:600}button:disabled{cursor:default;opacity:.55}a{color:#267d72;text-decoration:none}header{height:48px;background:white;border-bottom:1px solid #dbe0e3;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-weight:800}.nav{display:flex;gap:30px}.demo{background:#fffaf0;border-bottom:1px solid #e6ddc9;padding:9px 28px;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.demo select,.demo button{font-size:12px;padding:4px 8px}.demo b{color:#735b23}.page{padding:24px 28px;max-width:1360px;margin:auto}h1{font-size:22px;margin:0}p{margin:4px 0 14px;color:#687378}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.kpi{border:1px solid #d1d8dc;background:white;border-radius:10px;padding:12px 14px}.kpi b{font-size:24px;display:block}.kpi span{font-size:12px;color:#69777d}.card{border:1px solid #d1d8dc;border-radius:14px;background:white;overflow:hidden}.cardhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #d1d8dc;gap:14px}.identity{display:flex;align-items:center;gap:12px;min-width:0}.icon{width:38px;height:38px;display:grid;place-items:center;background:#d9f4dc;border-radius:10px;flex-shrink:0}.name{font-weight:800;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.pill{font-size:11px;padding:1px 8px;background:#dcf6de;border:1px solid #a5dba8;border-radius:20px;color:#256339}.id{font:11px ui-monospace,monospace;color:#748086}.count{text-align:right;white-space:nowrap;font-size:12px}.content{padding:16px 18px}.update{border:1px solid #d4e5e1;border-radius:10px;background:#f6faf9;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:22px;margin-bottom:18px}.update h2{margin:0 0 5px;font-size:15px}.update p{font-size:13px;margin:3px 0;max-width:720px}.version{font-size:12px;color:#687378;margin-left:8px;font-weight:400}.primary{background:#28877b;color:white;border-color:#28877b}.muted{color:#647379;font-size:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:13px}.form label{font-weight:600}.form input,.snapshot{border:1px solid #d6dce0;border-radius:8px;padding:10px;width:100%;margin-top:4px}.snapshot{background:#edf0f2;font:12px ui-monospace,monospace;color:#647078}.footer{display:flex;justify-content:space-between;border-top:1px solid #e4e8eb;margin-top:14px;padding-top:10px;align-items:center}.footer button{font-size:12px;padding:6px 10px}.footer span{font-size:12px;color:#819097}.chat{margin:20px 0 0;max-width:900px;border:1px solid #d1d8dc;border-radius:14px;overflow:hidden;background:white}.chathead{padding:14px 18px;border-bottom:1px solid #e2e7e9;display:flex;align-items:center;justify-content:space-between;gap:10px}.chip{font-size:12px;background:#f0f6f4;padding:4px 10px;border-radius:20px;display:inline-flex;gap:8px}.messages{padding:18px;min-height:170px;display:flex;flex-direction:column;gap:12px}.bubble{padding:10px 14px;border-radius:12px;background:#eff3f5;align-self:flex-start;max-width:85%}.user{background:#e3f3ee;align-self:flex-end}.queued{font-size:11px;color:#6c7c81;display:block;margin-top:4px}.composer{display:flex;padding:12px 18px;border-top:1px solid #e2e7e9;gap:10px}.composer input{flex:1;min-width:0;border:1px solid #d4dce0;border-radius:9px;padding:10px}.gone{display:none!important}.restore{margin-top:9px;display:block;font-size:12px}.label{font-size:11px;letter-spacing:.03em;color:#7b8282;margin:16px 0 6px}.error{border-color:#edd9c2;background:#fffaf4}#node{scroll-margin-top:20px}
@media(max-width:640px){header{padding:0 14px}.nav{gap:15px;font-size:12px}.demo{padding:9px 14px}.page{padding:16px 14px}.kpis{grid-template-columns:repeat(2,1fr)}.update{align-items:stretch;flex-direction:column;gap:12px;padding:14px}.update button{align-self:flex-start}.form{grid-template-columns:1fr}.version{display:block;margin:3px 0 0}.cardhead{padding:14px}.content{padding:14px}.count{display:none}.chathead{align-items:flex-start;flex-direction:column}.footer{gap:10px;flex-wrap:wrap}h1{font-size:19px}}
</style>
<header><span class="brand">✓ nano IM</span><nav class="nav"><a href="#chat">聊天</a><a href="#node">电脑</a><span>助手</span></nav><span>林同学</span></header>
<div class="demo"><b>设计原型 · 非真实运行</b><span>背景沿用电脑卡片；新增更新区域与聊天提示</span><label>演示状态 <select id="states"><option value="available">有新版本</option><option value="downloading">下载中</option><option value="waiting">等待任务</option><option value="switching">切换中</option><option value="succeeded">已更新</option><option value="failed">下载失败</option><option value="rolled_back">已恢复原版</option><option value="recovery_required">需要恢复</option><option value="offline">电脑离线</option><option value="legacy">旧版过渡</option><option value="unmanaged">源码运行</option><option value="unpublished">尚无发布</option></select></label><button id="finish">模拟当前任务结束</button></div>
<main class="page"><h1>电脑</h1><p>管理你的电脑和在上面工作的助手。</p><div class="kpis"><div class="kpi"><b>1</b><span>全部电脑</span></div><div class="kpi"><b>1</b><span>在线</span></div><div class="kpi"><b>0</b><span>离线</span></div><div class="kpi"><b>2</b><span>助手</span></div></div>
<section class="card" id="node"><div class="cardhead"><div class="identity"><span class="icon">▣</span><div><div class="name">我的 MacBook <span class="pill" id="presence">在线</span></div><div class="id">computer-macbook</div></div></div><div class="count"><b>2</b><br>助手</div></div><div class="content"><div class="update" id="update"><div><h2><span id="title">有新版本</span><span class="version" id="version">0.2.0 → 0.3.0</span></h2><p id="details"></p><p id="hint"></p><a class="restore gone" id="restore" href="#">查看恢复方法</a></div><button class="primary" id="action">更新</button></div><div class="form"><label>电脑名称<input value="我的 MacBook"></label><div><b>运行状态</b><div class="snapshot">最近连接　刚刚<br>已安装版本　<span id="installed">0.2.0</span></div></div></div><div class="footer"><span>更改已保存</span><div><button>新建助手</button> <button disabled>保存</button></div></div></div></section>
<p class="label">聊天上下文 · 同一台电脑</p><section class="chat" id="chat"><div class="chathead"><strong>研究助手</strong><a class="chip" id="chip" href="#node">我的 MacBook <span id="chipstate">有新版本 ↗</span></a></div><div class="messages" id="messages"><div class="bubble user">整理一下今天的项目进展。</div><div class="bubble">正在整理最近的记录，稍后把进展和待办一起发给你。</div></div><form class="composer" id="composer"><input id="message" placeholder="发送消息…" aria-label="发送消息"><button class="primary">发送</button></form></section></main>
<script>
let state='available',timer;const $=id=>document.getElementById(id);const text={available:['有新版本','改进任务进度展示，并修复电脑重连问题。','更新时助手会短暂暂停，聊天和文件都会保留。','更新'],downloading:['正在下载','助手可以继续工作，你也可以关闭这个页面。','下载完成后将在当前任务结束后更新。','取消本次更新'],installing:['正在准备更新','助手可以继续工作。','正在检查新版本。','取消本次更新'],waiting:['等待任务结束','更新已准备好，当前任务结束后会继续。','不会强行中断正在进行的工作。','取消本次更新'],switching:['正在更新','电脑即将恢复，你可以继续发送消息。','消息会等待更新完成后处理。',''],succeeded:['已更新','电脑已连接，助手可以继续工作。','',''],failed:['更新未完成','下载失败，当前版本仍可继续使用。','检查网络后重试。','重试'],rolled_back:['更新未完成，已恢复原版本','助手仍可继续使用，聊天和文件都已保留。','','重试'],recovery_required:['需要恢复电脑','新版本未能启动，原版本也尚未恢复。','已有聊天和文件保留，请在这台电脑上运行恢复命令。','查看恢复方法'],offline:['电脑上线后可更新','在这台电脑上打开 Nano 后，再回来更新。','','更新'],legacy:['启用按钮更新','这台电脑需要完成一次升级，以后即可在这里点击更新。','请先结束正在执行的任务，再在该电脑运行安装命令。','查看升级方法'],unmanaged:['按原部署方式更新','这台电脑由源码运行，请使用原有部署流程更新。','',''],unpublished:['暂无可安装的新版本','服务尚未发布可安装的版本。','','']};function render(next){state=next;const v=text[state];$('title').textContent=v[0];$('details').textContent=v[1];$('hint').textContent=v[2];$('action').textContent=v[3];$('action').classList.toggle('gone',!v[3]);$('action').disabled=state==='offline';$('update').classList.toggle('error',['failed','rolled_back','recovery_required'].includes(state));$('version').textContent=state==='succeeded'?'0.3.0':['legacy','unmanaged','unpublished'].includes(state)?'':'0.2.0 → 0.3.0';$('installed').textContent=state==='succeeded'?'0.3.0':'0.2.0';$('presence').textContent=state==='switching'?'正在更新':state==='offline'||state==='recovery_required'?'离线':'在线';$('chipstate').textContent=state==='switching'?'正在更新':state==='succeeded'?'在线':['downloading','waiting','installing'].includes(state)?'更新中':state==='offline'?'离线':state==='recovery_required'?'电脑需要恢复 ↗':'有新版本 ↗';$('states').value=state;for(const e of document.querySelectorAll('.queued'))e.textContent=state==='recovery_required'?'电脑恢复后继续处理，无需重发':state==='switching'?'等待电脑更新完成':['succeeded','rolled_back','available'].includes(state)?'已送达':e.textContent;}
$('states').onchange=e=>{clearTimeout(timer);render(e.target.value)};$('action').onclick=()=>{clearTimeout(timer);if(['downloading','waiting','installing'].includes(state)){render('available');return}if(['legacy','recovery_required'].includes(state)){alert('演示：此处显示当前服务的一次性安装命令与“交给本机 Agent”说明。');return}render('downloading');timer=setTimeout(()=>render('waiting'),1200)};$('finish').onclick=()=>{if(state!=='waiting')return;render('switching');timer=setTimeout(()=>{render('succeeded');for(const e of document.querySelectorAll('.queued'))e.textContent='已送达';const b=document.createElement('div');b.className='bubble';b.textContent='电脑已更新，我继续处理你刚才的消息。';$('messages').append(b)},2500)};$('composer').onsubmit=e=>{e.preventDefault();const input=$('message');if(!input.value.trim())return;const b=document.createElement('div');b.className='bubble user';b.textContent=input.value;if(state==='switching'){const s=document.createElement('span');s.className='queued';s.textContent='等待电脑更新完成';b.append(s)}$('messages').append(b);input.value=''};render(state);
</script></html>
