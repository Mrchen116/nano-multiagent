<!doctype html>
<html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>feat-604 · 账号与策略体验原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fb;color:#243440;font:14px/1.65 system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select,summary{outline-offset:4px}button,a{cursor:pointer}a{color:#0f766e;text-decoration:none}button{border:1px solid #c2cfd7;border-radius:8px;min-height:40px;padding:8px 16px;background:white;color:inherit}button:disabled{opacity:.45;cursor:default}.primary{background:#0f766e;border-color:#0f766e;color:white}input,select{width:100%;min-height:44px;border:1px solid #c2cfd7;border-radius:8px;background:white;padding:10px 12px;color:inherit}h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-1px;font-weight:650}h2{font-size:17px;font-weight:650}h3{font-size:14px;font-weight:600}small,.muted{color:#60717e}.demo{padding:12px 24px;background:#243440;color:white;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}.demo select{color:#243440;width:auto;min-height:32px;padding:3px 6px}.demo button{min-height:32px;padding:3px 12px}.demo button{color:#243440}.capacity-heading button{flex-shrink:0;white-space:nowrap}.demo small{color:#c5d4dd}.shell{padding:17px 28px;background:white;border-bottom:1px solid #e2e8ed;display:flex;justify-content:space-between;font-weight:600}.shell span{color:#60717e;font-size:13px}main{max-width:960px;padding:36px 28px 48px;margin:auto}.back{font-size:13px;margin-bottom:20px;display:inline-block;color:#60717e}.heading{margin-bottom:28px}.heading p{margin-top:7px;color:#60717e}.card{background:white;border:1px solid #e2e8ed;border-radius:14px;margin:0 0 20px;overflow:hidden}.section{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,2.1fr);gap:28px;padding:26px}.section>header p{font-size:13px;color:#60717e;margin-top:7px}.identity{display:flex;gap:14px;align-items:center;margin-bottom:24px}.avatar{width:52px;height:52px;border-radius:50%;background:#d4e2df;color:#355650;display:grid;place-items:center;font-size:19px;font-weight:650;flex-shrink:0}.identity strong{display:block;font-size:18px;overflow-wrap:anywhere}.identity small{display:block}.field{display:block;font-size:13px;font-weight:550;margin-bottom:20px}.field input,.field select{display:block;margin-top:7px;font-weight:400}.field small{display:block;font-size:12px;font-weight:400;margin-top:6px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #e2e8ed}.row:first-child{padding-top:0}.row:last-child{border-bottom:0;padding-bottom:0}.row p{font-size:13px;color:#60717e;margin-top:5px}.badge{display:inline-flex;background:#e5f3ef;color:#115e59;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:600}.row .badge{margin-left:8px}.note{font-size:13px;color:#60717e;padding:14px 16px;border-radius:9px;background:#f3f6f8;line-height:1.8;margin:14px 0}.note strong{display:block;color:#243440}.capacity{padding:26px}.capacity-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.big{font-size:26px;font-weight:650;letter-spacing:-.7px}.bar{height:8px;border-radius:8px;background:#edf2f5;margin:14px 0;overflow:hidden}.bar i{display:block;background:#0f766e;height:100%;width:68%;border-radius:8px}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:#60717e}.stats strong{color:#243440;display:block;font-size:14px;font-weight:550}.capacity details{margin-top:20px;border-top:1px solid #e2e8ed;padding-top:16px}summary{cursor:pointer;font-size:13px;color:#60717e}.group-title{margin:30px 0 12px}.group-title p{color:#60717e;font-size:13px;margin-top:5px}.save{position:sticky;bottom:0;z-index:2;background:#fff;border:1px solid #e2e8ed;border-radius:10px;box-shadow:0 -5px 16px #24344005;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.save span{font-size:12px;color:#60717e}.save div{display:flex;gap:8px}.notice{padding:12px 14px;margin-bottom:18px;border-radius:8px;font-size:13px;background:#e7f5ec;color:#286744}.notice.error{background:#fff1ef;color:#963d35}.details{font-size:12px;margin-top:20px;border-top:1px solid #e2e8ed;padding-top:16px}.details dl{display:grid;grid-template-columns:100px 1fr;gap:9px;overflow-wrap:anywhere}dt{color:#60717e}dd{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.readonly{display:block;margin-top:7px;font-size:15px;font-weight:500;overflow-wrap:anywhere}.preview-mobile{width:390px;margin:24px auto;border:1px solid #c2cfd7;border-radius:20px;overflow:hidden}.preview-narrow{width:320px}.preview-mobile main{padding:24px 18px}.preview-mobile .section{grid-template-columns:1fr;gap:20px;padding:20px}.preview-mobile h1{font-size:26px}.preview-mobile .grid{grid-template-columns:1fr;gap:0}.preview-mobile .capacity{padding:20px}.preview-mobile .row{align-items:flex-start;flex-wrap:wrap}.preview-mobile button{min-height:44px}.preview-mobile .save{flex-wrap:wrap}.preview-mobile .save div{margin-left:auto}.preview-mobile .shell{padding:15px 18px}
@media(max-width:680px){main{padding:24px 18px}.section{grid-template-columns:1fr;gap:20px;padding:20px}.grid{grid-template-columns:1fr;gap:0}.capacity{padding:20px}h1{font-size:26px}.row{flex-wrap:wrap}.save{flex-wrap:wrap}button{min-height:44px}.demo{padding:12px}.preview-mobile{max-width:100%;margin:0 auto}}
</style>
<div class="demo"><strong>设计原型 · 仅演示</strong><small>顶栏沿用现有背景；两页为本次重设计。关联入口仅说明去向。</small><button onclick="currentPage='account';render()">账号</button><button onclick="currentPage='policies';render()">策略</button><select aria-label="演示宽度" onchange="demoWidth=this.value;render()"><option value="desktop">桌面</option><option value="mobile">390px 手机</option><option value="narrow">320px 窄屏</option></select><select aria-label="演示身份" onchange="demoRole=this.value;render()"><option value="admin">管理员</option><option value="member">普通成员</option></select><select aria-label="演示资格" onchange="team=this.value;render()"><option value="active">已加入团队</option><option value="none">未加入</option><option value="pending">待批准</option><option value="suspended">已停用</option></select><label><input id="fail" type="checkbox" style="width:auto;min-height:auto">模拟保存失败</label></div>
<div id="viewport"></div>
<script>
let currentPage='account',demoWidth='desktop',demoRole='admin',team='active',dirty=false;
const fields=[['default_model','默认模型','codex_oauth:gpt-5.5','记录默认模型名称；实际助手模型仍在助手设置中管理。'],['max_turn_per_run','单次运行轮次','14','记录期望的单次运行轮次上限。'],['audit_level','审计级别','基础','记录期望的审计详细程度。'],['rate_limit_per_min','每分钟消息数','45','记录期望的每用户每分钟消息上限。'],['max_attachment_size_mb','单个附件大小（MB）','15','记录期望值；不决定实际上传限制。'],['retention_days','消息留存（天）','30','记录期望留存时长；不会据此自动删除消息。']];
function field(f){return `<label class="field">${f[1]}${demoRole==='admin'?f[0]==='audit_level'?'<select><option>关闭</option><option selected>基础</option><option>严格</option></select>':`<input required ${f[0]==='default_model'?'':'type="number" min="1" step="1"'} value="${f[2]}">`:`<span class="readonly">${f[2]}</span>`}<small>${f[3]}</small></label>`}
function section(title,sub,body){return `<section class="card section"><header><h2>${title}</h2><p>${sub}</p></header><div>${body}</div></section>`}
function footer(){return '<footer class="save"><span id="status">尚未修改</span><div><button type="button" id="discard" disabled onclick="render()">放弃修改</button><button class="primary" id="save" disabled>保存修改</button></div></footer>'}
function render(){dirty=false;let body='';if(currentPage==='account'){const state={active:demoRole==='admin'?'管理员':'已加入',none:'未加入',pending:'等待批准',suspended:'资格已停用'}[team];body=`<form onsubmit="submitDraft(event)">${section('个人资料','让团队和助手知道如何称呼你。',`<div class="identity"><span class="avatar">AC</span><div><strong>Alex Chen</strong><small>@alex</small></div></div><label class="field">显示名<input required value="Alex Chen"><small>显示在聊天、任务和成员列表中。</small></label><details class="details"><summary>账号详情</summary><dl><dt>用户 ID</dt><dd>user-example-01</dd><dt>加入时间</dt><dd>2026年6月29日</dd></dl></details>`)}${footer()}</form>${section('空间与团队','个人空间和团队资格各自独立。',`<div class="row"><div><h3>个人空间 <span class="badge">可用</span></h3><p>你的私人聊天、助手和电脑仅按各自权限共享。</p></div></div><div class="row"><div><h3>团队 <span class="badge">${state}</span></h3><p>${team==='active'?'可以访问团队共享内容。':team==='none'?'需要协作时再申请加入，个人空间无需审批。':team==='pending'?'正在等待管理员批准，个人空间仍可使用。':'团队访问已停用，个人空间仍可使用。'}</p></div>${team!=='active'||demoRole==='admin'?`<a href="#" onclick="destination(event,'现有团队资格或成员管理页面')">${team==='active'?'管理成员':team==='none'?'申请加入':'查看资格'} →</a>`:''}</div>`)}${section('关联管理','在专属页面管理电脑。','<div class="row"><div><h3>我的电脑</h3><p>已连接 2 台电脑</p></div><a href="#" onclick="destination(event,\'现有电脑管理页\')">管理电脑 →</a></div>')}`}
else{body=(demoRole==='admin'?`<section class="card capacity"><div class="capacity-heading"><div><h2>附件存储</h2><p class="muted">当前实际用量，与下方预设分开管理。</p></div><button onclick="document.getElementById('feedback').innerHTML='<p class=notice>用量已更新。</p>'">刷新</button></div><div class="big">6.8 GB <small style="font-size:13px;font-weight:400">/ 10 GB 已占用</small></div><div class="bar"><i></i></div><div class="stats"><span>已用<strong>6.5 GB</strong></span><span>上传中<strong>300 MB</strong></span><span>剩余<strong>3.2 GB</strong></span></div><details><summary>成员用量 · 2 人</summary><div class="row"><div><h3>Alex Chen</h3><p>已用 620 MB · 上传中 0 B · 上限 1 GB</p></div><span class="badge">可上传</span></div><div class="row"><div><h3>林晓 · 产品与设计</h3><p>已用 980 MB · 上传中 44 MB · 上限 1 GB</p></div><span class="badge">已满</span></div></details></section>`:'<p class="note">你可以查看团队预设。仅团队管理员可以修改。</p>')+`<div class="group-title"><h2>策略预设</h2><p>保存的是预设值，尚未接入执行。</p></div><p class="note"><strong>这些预设目前不会改变实际运行</strong>模型、轮次、审计、限流、附件大小和留存预设只保存记录。实际模型请前往 <a href="#" onclick="destination(event,'现有模型服务页')">模型服务 →</a>，实际存储限制以服务配置为准。</p><form onsubmit="submitDraft(event)">${section('运行预设','模型与运行轮次。',fields.slice(0,2).map(field).join(''))}${section('安全预设','审计和消息频率。',fields.slice(2,4).map(field).join(''))}${section('附件与留存','上传大小和历史保留。',fields.slice(4).map(field).join(''))}${demoRole==='admin'?footer():''}</form>`}
document.getElementById('viewport').className=demoWidth==='desktop'?'':`preview-mobile ${demoWidth==='narrow'?'preview-narrow':''}`;document.getElementById('viewport').innerHTML=`<div class="shell">✓ nano IM <span>聊天　任务　智能体</span></div><main><a class="back" href="#" onclick="destination(event,'现有我的账号页')">‹ 我的账号</a><header class="heading"><h1>${currentPage==='account'?'账号':'策略'}</h1><p>${currentPage==='account'?'管理个人资料，了解你的空间与团队资格。':'查看实际存储状态，维护团队策略预设。'}</p></header><div id="feedback" role="status"></div>${body}</main>`;document.querySelectorAll('form input,form select').forEach(i=>i.oninput=()=>{dirty=true;document.getElementById('status').textContent='有未保存的修改';document.getElementById('save').disabled=false;document.getElementById('discard').disabled=false;document.getElementById('feedback').innerHTML=''})}
function submitDraft(e){e.preventDefault();if(document.getElementById('fail').checked){document.getElementById('feedback').innerHTML='<p class="notice error" role="alert">保存失败。修改已保留，请重试。</p>';return}document.getElementById('feedback').innerHTML='<p class="notice">修改已保存。</p>';document.getElementById('status').textContent='已保存';document.getElementById('save').disabled=true;document.getElementById('discard').disabled=true}
function destination(e,name){e.preventDefault();document.getElementById('feedback').innerHTML=`<p class="notice">仅演示：此入口前往${name}。</p>`}render();
</script></html>
