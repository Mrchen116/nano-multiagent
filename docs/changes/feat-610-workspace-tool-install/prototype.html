<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>feat-610 工具状态局部原型</title><style>body{font:15px system-ui;color:#173b37;background:#f5f7f7;margin:24px}main{max-width:760px;margin:auto}section{background:white;border:1px solid #d8e3e1;border-radius:16px;padding:20px;margin:20px 0}p{color:#627875;font-size:13px;line-height:1.7}button,.pill{padding:6px 12px;border-radius:20px;border:1px solid #91c8b9;background:#e4f4ec;color:#215f50;display:inline-block;font:13px system-ui}article{margin-top:12px;padding:14px;border:1px solid #dce5e3;border-radius:12px}article b{font:600 13px monospace}small{margin-left:12px;color:#26765b}label{display:block;margin:16px 0}</style><main><h1>局部原型 · Agent 工具区</h1><p>现有Access & Model容器背景；本次增量为静态名单下的workspace自动工具状态。其他配置不模拟。</p><section><h2>Access & Model</h2><p>Keep allowlists minimal.</p><h3>Tool Allowlist</h3><span class="pill">read</span> <span class="pill">write</span> <button id="manager" onclick="toggle()">plugin_manager · 已选</button><h3>Workspace tools</h3><p>自动管理，无需添加白名单。要停用或移除，请在聊天中告诉助手。</p><article><b>expense_summary</b><small id="status">已启用</small><p>按月份汇总报销记录、分类小计和总计。</p></article><p>说明：按钮切换仅演示保存管理能力后由服务返回的两个状态，不模拟真实后端。</p></section></main><script>let enabled=true;function toggle(){enabled=!enabled;document.getElementById('manager').textContent='plugin_manager · '+(enabled?'已选':'未选');document.getElementById('status').textContent=enabled?'已启用':'不可用';}</script></html>
