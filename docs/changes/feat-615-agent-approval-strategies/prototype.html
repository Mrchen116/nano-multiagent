</style><div class="demo">设计原型 · 身份、导航与相邻配置为现有界面背景；新增审批策略可操作；保存仅为演示。<label><input type="checkbox" id="fail"> 模拟节点离线</label></div>
<header><strong>✓ nano IM</strong><span>聊天　任务　<strong>智能体</strong></span></header><div class="shell"><aside class="rail"><small>AGENTS</small><p>个人助手</p><div>研究助手</div></aside><div class="main"><div class="head"><div class="top"><div><h1 class="title">个人助手</h1><p class="sub">personal-agent · 测试节点</p></div><button id="saveTop" class="primary" disabled>无改动</button></div><nav class="tabs"><span>工作</span><span>概览</span><b>配置</b><span>通道</span><span>技能</span><span>插件</span></nav></div><main><section class="card"><h2>身份</h2><p class="hint">向用户与其他 Agent 展示的名称与用途。</p><div class="grid"><div><label>Agent ID</label><input value="personal-agent" disabled></div><div><label>显示名</label><input value="个人助手" readonly></div></div></section><section class="card"><h2>行为</h2><p class="hint">调整该 Agent 的说话方式与能力。</p><label for="mode">审批策略</label><select id="mode" aria-describedby="modeHelp"><option value="">跟随节点</option><option value="cc">CC</option><option value="codex">Codex</option></select><p class="hint" id="modeHelp">沿用节点已有的自动审批设置。</p><p class="hint">保存后从下一轮任务生效，当前任务继续使用原策略。</p><label for="instructions">自定义补充指令</label><textarea id="instructions" readonly>帮助我维护笔记和推进日常任务；保留事实依据，完成后汇报结果。</textarea><p class="hint">叠加在标准提示词之上；留空即用标准提示词。</p></section><section class="card"><h2>访问与模型</h2><div class="grid"><div><label>默认模型</label><input value="GPT-6.1 Sol" readonly></div><div><label>推理强度</label><input value="低" readonly></div></div><p class="hint">现有工具与技能配置在产品中保持。</p></section><div class="footer"><span id="status" class="status" role="status">无改动</span><div><button id="discard" hidden>放弃更改</button> <button id="save" class="primary" disabled>保存 Agent</button></div></div></main></div></div><script>
const mode=document.getElementById('mode'),status=document.getElementById('status'),save=document.getElementById('save'),topSave=document.getElementById('saveTop'),discard=document.getElementById('discard');let saved='';const copy={'':'沿用节点已有的自动审批设置。',cc:'工作区内普通文件编辑快速放行，其他操作按 CC 规则审查。',codex:'结合操作风险、用户授权和工具结果审查，必要时只读核实现场。'};function render(){const dirty=mode.value!==saved;document.getElementById('modeHelp').textContent=copy[mode.value];save.disabled=topSave.disabled=!dirty;topSave.textContent=dirty?'保存 Agent':'无改动';discard.hidden=!dirty;status.className='status';status.textContent=dirty?'有未保存的更改':'无改动'}mode.onchange=render;discard.onclick=()=>{mode.value=saved;render()};function submit(){if(document.getElementById('fail').checked){status.className='status error';status.textContent='节点离线，尚未保存。连接恢复后重试。';return}saved=mode.value;render();status.textContent='已保存，将从下一轮任务生效。'}save.onclick=topSave.onclick=submit;
