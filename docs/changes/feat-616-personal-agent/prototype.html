function save(){const aq=document.querySelector('#action-query');if(aq&&aq.value!==s.action.query){s.action.query=aq.value;s.action.revision++;s.action.status='draft';}const picked=document.querySelector('#task-result-selection');if(picked)s.action.resultSelected=picked.checked;
 const compose=document.querySelector('#compose');if(compose){if(s.perspective==='owner')s.drafts[s.chat]=compose.value;else s.externalDrafts[externalKey()]=compose.value;}
 const reply=document.querySelector('#reply-text');if(reply)s.replyDrafts[s.replyTarget]=reply.value;
 const name=document.querySelector('#rename-input');if(name)s.nameDraft=name.value;
 const task=document.querySelector('#task-result');if(task)s.task.proposed=task.value;
 const release=document.querySelector('#release-text');if(release)s.requests[s.showRelease].text=release.value;
 const setupName=document.querySelector('#setup-name');if(setupName)s.setup.name=setupName.value;
 const goal=document.querySelector('#setup-goal');if(goal)s.setup.goal=goal.value;
}
function displayName(){return s.hasPA?s.name:'设置个人助手';}
function isObserving(){return s.online&&!s.paused&&s.cleanup!=='pending'&&s.hasPA;}
function sourceActive(id){const x=s.sources[id];return x.available&&!x.excluded&&!s.cleaned;}
function avatar(kind='pa',label='✦'){return `<span class="avatar ${kind}" aria-hidden="true">${E(label)}</span>`;}
function button(text,action,style='',disabled=false){return `<button class="btn ${style}" onclick="${action}" ${disabled?'disabled':''}>${text}</button>`;}
function message(who,html,opts={}){return `<article class="message ${opts.user?'user-message':''}">${opts.user?'':avatar(opts.pa?'pa':'',opts.pa?'✦':Array.from(who)[0])}<div class="message-body"><div class="sender">${E(who)}${opts.role?` <span class="pill neutral">${E(opts.role)}</span>`:''}</div><div class="bubble">${html}</div>${opts.menu||''}<div class="time">${opts.time||'09:42'}</div></div></article>`;}
function setNotice(text){s.notice=text;}
function openChat(id){save();if(!s.hasPA&&id==='assistant'){startSetup(false);return;}s.page='chat';s.chat=id;s.list=false;s.panel=null;s.notice='';render();}
function goPage(page){save();if(page==='personal'){openChat('assistant');return;}s.page=page;s.panel=null;s.notice='';s.list=page==='chat';if(page==='chat')s.chat='lin';render();}
function backToList(){save();s.page='chat';s.list=true;s.panel=null;s.notice='';render();}
function openPanel(panel){save();if(panel==='contacts'){s.contactDraft=[...s.blocked];s.contactExpected=s.contactRevision;}s.panel=panel;s.notice='';if(panel==='name'){s.nameDraft=s.name;s.nameError='';}if(panel==='scope'){s.scopeDraft=new Set(Object.keys(s.sources).filter(id=>s.sources[id].excluded));s.scopeDirty=false;}if(panel==='task-review')s.task.expectedRevision=s.task.revision;render();focusPanel();}
function closePanel(){save();s.panel=null;s.notice='';render();}
function focusPanel(){const heading=document.querySelector('.panel h2');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true});}}
function rename(){save();const value=s.nameDraft.trim();if(!value){s.nameError='请填写一个名字，不能只有空格。';render();return;}const oldName=s.name;s.name=value;s.nameError='';s.groupMembers=s.groupMembers.map(x=>x===oldName?value:x);s.panel=null;s.notice='名字已更新。';render();}
function cancelRename(){s.nameDraft=s.name;s.nameError='';closePanel();}
function startSetup(existing=false){save();s.page='setup';s.panel=null;s.list=false;s.setup.existing=existing;s.perspective='owner';render();}
function setupNext(){save();const value=s.setup.name.trim();if(!value){s.setup.error='先给你的个人助手起个名字。';render();return;}s.setup.name=value;s.setup.error='';s.setup.step='observe';render();}
function setupBack(){save();s.setup.step='name';s.setup.error='';render();}
function exitSetup(){save();s.page='chat';s.chat='lin';s.list=false;s.notice='设置草稿已保留，你可以稍后继续。';render();}
function createPA(){save();if(s.hasPA){s.page='chat';s.chat='assistant';s.list=false;s.notice='已找到你的个人助手，继续原来的私聊。';render();return;}if(s.setup.submitted){s.setup.step='pending';render();return;}s.setup.submitted=true;s.setup.operation='create-demo-'+(++sequence);s.setup.step='creating';render();later(()=>{if(s.setup.unknownNext||!s.online){s.setup.step='pending';s.setup.unknownNext=false;render();}else completeCreate();});}
function completeCreate(){if(!s.setup.operation)return;s.setup.createdCount=1;s.hasPA=true;s.name=s.setup.name.trim();s.paused=!s.setup.observe;for(const id of Object.keys(s.sources))s.sources[id].excluded=s.setup.excluded.includes(id);s.setup.step='complete';s.groupMembers=['林悦','陈同学',s.name];render();}
function retryCreate(){if(!s.online){s.notice='电脑还未重新连接，创建结果暂时无法确认。';render();return;}s.setup.step='creating';s.notice='';render();later(completeCreate);}
function enterCreated(){s.page='chat';s.chat='assistant';s.list=false;s.panel=null;s.drafts.assistant=s.setup.goal?`我最近想推进：${s.setup.goal}`:'';s.notice=s.setup.goal?'第一条消息已放入输入框，请你确认后发送。':'';render();}
function prepareReply(id){save();if(!sourceActive(id)){s.notice='来源目前不可用，不能继续使用之前的内容。';render();return;}s.replyTarget=id;if(!s.replyDrafts[id])s.replyDrafts[id]=id==='lin'?'我先核对周三下午的安排，确认后回复你。':'材料收到了，我会先核对内容，再确认最终演示版本。';s.panel='reply';s.notice='';render();focusPanel();}
function applyReply(mode='check'){save();const id=s.replyTarget;if(!sourceActive(id)){s.panel='source-unavailable';render();return;}if(mode==='check'&&(s.drafts[id].trim()||s.attachments[id].length)){s.panel='draft-conflict';render();return;}s.undo={chat:id,text:s.drafts[id]};s.drafts[id]=mode==='append'?[s.drafts[id],s.replyDrafts[id]].filter(Boolean).join('\n\n'):s.replyDrafts[id];s.undo.applied=s.drafts[id];s.page='chat';s.chat=id;s.list=false;s.panel=null;s.notice='已放入输入框，尚未发送。已有附件保留。';render();}
function undoDraft(){save();if(s.undo&&s.drafts[s.undo.chat]===s.undo.applied){s.drafts[s.undo.chat]=s.undo.text;s.notice='已恢复之前的草稿。';s.undo=null;}else s.notice='草稿已有新的修改，未覆盖你的输入。';render();}
function sourceMenu(id){return `<details class="message-menu"><summary aria-label="消息操作">•••</summary><div class="menu">${button('帮我回复',`prepareReply('${id}')`)}${button('查看关联任务',"openPanel('task')")}</div></details>`;}
function sendOwner(){save();if(!s.drafts[s.chat]?.trim()||s.delivery)return;if(s.chat!=='assistant'&&!s.sources[s.chat].available)return;if(s.chat==='assistant'&&!s.online){s.notice='电脑离线，消息保留在输入框。';render();return;}const item={id:'msg-'+(++sequence),chat:s.chat,text:s.drafts[s.chat],by:'你'};s.delivery={...item,status:'sending'};s.notice='正在发送…';render();later(()=>{if(s.nextUnknown){s.nextUnknown=false;s.delivery.status='unknown';s.notice='发送结果暂未确认，正在核对这一次提交。';render();}else finishDelivery();});}
function finishDelivery(){if(!s.delivery)return;const item=s.delivery;if(!s.sent.some(x=>x.id===item.id))s.sent.push(item);s.drafts[item.chat]='';if(s.sources[item.chat]){s.sources[item.chat].actualHandled=true;if(isObserving()&&!s.sources[item.chat].excluded)s.sources[item.chat].handled=true;}s.delivery=null;s.notice='已发送。';render();}
function reconcile(){for(const x of Object.values(s.sources)){if(x.available&&!x.excluded){x.handled=x.actualHandled;if(!s.cleaned&&x.pending)x.observed=true;x.pending=false;}}s.checkedAt='09:45';}
function pauseObservation(){save();s.paused=true;s.notice='观察已暂停。此前记录保留，不继续检查新消息或产生主动提醒。';render();}
function openResume(){save();s.panel='resume';render();focusPanel();}
function resumeObservation(){const mode=document.querySelector('input[name="resume-mode"]:checked')?.value||'catchup';if(!s.online||s.cleanup==='pending')return;s.paused=false;s.cleaned=false;if(mode==='catchup')reconcile();else for(const x of Object.values(s.sources)){x.pending=false;x.observed=false;x.handled=false;}s.panel='scope';s.scopeDraft=new Set(Object.keys(s.sources).filter(id=>s.sources[id].excluded));s.notice=mode==='catchup'?'已恢复。先核对积压消息的最新状态，只提醒仍需你处理的事。':'已恢复，仅观察现在之后的新消息。之前的未处理建议不会重新提醒。';render();}
function changeScope(id,exclude){exclude?s.scopeDraft.add(id):s.scopeDraft.delete(id);s.scopeDirty=true;}
function saveScope(){save();if(!s.online){s.notice='电脑离线，范围修改仍是草稿，尚未生效。';render();return;}const newlyExcluded=Object.keys(s.sources).filter(id=>s.scopeDraft.has(id)&&!s.sources[id].excluded);for(const id of Object.keys(s.sources))s.sources[id].excluded=s.scopeDraft.has(id);s.scopeDirty=false;s.notice='观察范围已保存。';if(newlyExcluded.length){s.cleanup='pending';s.notice='已停止读取排除的来源，正在清理相关缓存与未发送建议。';for(const id of newlyExcluded){s.sources[id].observed=false;delete s.replyDrafts[id];}if(!s.cleanupHold)later(finishCleanup,800);}render();}
function confirmClean(){save();s.paused=true;s.cleanup='pending';s.cleaned=true;for(const x of Object.values(s.sources))x.observed=false;s.replyDrafts={};for(const r of Object.values(s.requests)){if(r.status==='waiting'||r.status==='sending')r.status='invalid';}s.panel='scope';s.scopeDraft=new Set(Object.keys(s.sources).filter(id=>s.sources[id].excluded));s.notice='观察已暂停；缓存清理仍在进行，完成前不会恢复读取。';render();if(!s.cleanupHold&&s.online)later(finishCleanup,850);}
function finishCleanup(){if(s.cleanup!=='pending')return;s.cleanup='done';s.cleanupHold=false;s.notice='PA 观察缓存与未发送建议已清理，旧上下文已停用。原聊天、任务、已发消息与本机历史日志仍保留。';render();}
function taskReview(){save();if(!s.task.available){s.panel='task';render();return;}s.task.expectedRevision=s.task.revision;s.panel='task-review';render();focusPanel();}
function writeTask(){save();if(!s.task.available||!sourceActive('team')){s.task.writeState='unavailable';s.panel='task';render();return;}if(s.task.expectedRevision!==s.task.revision||s.task.status==='已关闭'){s.task.writeState='conflict';s.panel='task-conflict';render();return;}if(!s.online){s.notice='电脑离线，结果草稿保留，尚未写回。';render();return;}s.task.writeState='writing';render();later(()=>{if(!s.task.available||!sourceActive('team')){s.task.writeState='unavailable';s.panel='task';}else if(s.task.expectedRevision!==s.task.revision){s.task.writeState='conflict';s.panel='task-conflict';}else{s.task.result=s.task.proposed;s.task.status='待确认';s.task.revision++;s.task.writeState='written';s.task.history.push({by:s.name,text:'经陈同学确认，补充结果并将状态改为待确认。'});s.panel='task';s.notice='已写回原任务，负责人仍是你；产品协作群已产生一条待确认系统通知。';}render();});}
function externalKey(){return s.perspective==='group'?'group':s.perspective==='agent'?'agent':'dm';}
function requestFor(key){return s.requests[key];}
function requesterLabel(key){return key==='agent'?'研究 Agent · Agent':'林悦 · 公司成员';}
function destinationLabel(key){return key==='group'?'演示协作群':`${key==='agent'?'研究 Agent':'林悦'}与${s.name}的私聊`;}
function recipientText(key){return key==='group'?s.groupMembers.join('、'):(key==='agent'?'研究 Agent':'林悦');}
function requestExternal(key){const r=requestFor(key);if(s.blocked.includes(key)||r.contactRevoked||r.requested)return;r.requested=true;r.status='waiting';r.text=exactSlots;}
function externalSend(){save();const key=externalKey();let r=requestFor(key);if(s.blocked.includes(key)){s.notice='此会话暂时无法联系个人助手，消息未发送。';render();return;}const value=s.externalDrafts[key].trim();if(!value)return;if(r.contactRevoked&&!['sending','unknown'].includes(r.status)){const old=r;r=newRequest(key);r.version=old.version+1;r.messages=old.messages;r.audienceRevision=old.audienceRevision;r.requestId='request-'+(++sequence);r.requested=false;r.status='idle';s.requests[key]=r;}r.messages.push({by:r.sender,text:value});s.externalDrafts[key]='';if(r.status==='unknown'){r.pendingIncoming=[...(r.pendingIncoming||[]),{text:value,sender:r.sender}];r.messages.push({by:'pa',text:'上一条回复的送达结果仍待核对，这条新请求尚未处理。'});render();return;}if(r.status==='sent'){r.followup=true;r.messages.push({by:'pa',text:'这次只确认了可用时段。其他安排需要另行征得陈同学同意。'});}else{requestExternal(key);r.messages.push({by:'pa',text:'我会请陈同学确认可分享的时段，确认后在这里回复你。'});}render();}
function reviewRelease(key){save();s.showRelease=key;const r=requestFor(key);r.reviewVersion=r.version;r.approvedRevision=r.audienceRevision;s.panel='release';s.notice='';render();focusPanel();}
function refreshRelease(){const r=requestFor(s.showRelease);if(!s.releaseSource||r.contactRevoked||s.blocked.includes(r.kind))return;r.status='waiting';r.expires=false;r.reviewVersion=r.version;r.approvedRevision=r.audienceRevision;s.notice='已按当前资料和收件人重新准备，请核对后再确认。';render();}
function releaseInvalid(r){return r.contactRevoked||s.blocked.includes(r.kind)||!s.releaseSource||r.expires||r.reviewVersion!==r.version||r.approvedRevision!==r.audienceRevision||r.status==='invalid';}
function approveRelease(){save();const r=requestFor(s.showRelease);if(releaseInvalid(r)){s.notice='资料或收件人已有变化，未发送。请重新核对。';render();return;}if(!r.text.trim()){s.notice='回复内容不能为空。';render();return;}if(!s.online){s.notice='电脑离线，这份回复尚未发送。';render();return;}r.status='sending';r.deliveredText=r.text;r.deliveredRecipients=recipientText(s.showRelease);r.deliveredDestination=destinationLabel(s.showRelease);r.deliveryId=r.deliveryId||'release-'+(++sequence);s.notice='已确认，正在回复原聊天。';render();const key=s.showRelease,submittedRequest=r,submittedDelivery=r.deliveryId;later(()=>{const current=requestFor(key);if(current!==submittedRequest||current.deliveryId!==submittedDelivery)return;if(releaseInvalid(current)){current.status='invalid';s.notice='发送前信息发生变化，已停止发送。';render();}else if(s.nextUnknown){s.nextUnknown=false;current.status='unknown';s.notice='对外发送结果尚未确认，先核对这一次投递。';render();}else finishRelease(key);});}
function finishRelease(key){const r=requestFor(key);if(r.status!=='sending'&&r.status!=='unknown')return;r.status='sent';if(!r.messages.some(x=>x.id===r.deliveryId))r.messages.push({by:'pa',text:r.deliveredText,id:r.deliveryId});s.notice='已核实原聊天投递。';if(r.pendingIncoming?.length&&!s.blocked.includes(key)){const fresh=newRequest(key);fresh.requested=true;fresh.status='waiting';fresh.version=r.version+1;fresh.audienceRevision=r.audienceRevision;fresh.messages=r.messages;fresh.requestId='request-'+(++sequence);fresh.incomingSnapshot=r.pendingIncoming;fresh.receipts=[...(r.receipts||[]),{id:r.deliveryId,text:r.deliveredText}];s.requests[key]=fresh;s.notice='旧投递已核实；期间收到的新请求已单独等待确认，未复用旧许可。';}render();}
function declineRelease(){const r=requestFor(s.showRelease);r.status='declined';s.panel=null;s.notice='未分享私人资料。';render();}
function topbar(){const owner=s.perspective==='owner';return `<header class="top"><div class="brand"><span class="mark">✓</span>nano IM</div><nav class="tabs" aria-label="主导航">${owner?`<button class="tab ${s.chat==='assistant'&&s.page==='chat'?'active':''}" onclick="goPage('personal')" title="${E(displayName())} · 个人助手"><span aria-hidden="true">✦ </span><span class="tab-name">${E(displayName())}</span><small> · 个人助手</small></button>`:''}<button class="tab ${s.page==='chat'&&s.chat!=='assistant'||!owner?'active':''}" onclick="${owner?"goPage('chat')":"externalList()"}">聊天</button>${owner?`<button class="tab ${s.page==='tasks'?'active':''}" onclick="goPage('tasks')">任务</button><button class="tab ${s.page==='agents'?'active':''}" onclick="goPage('agents')">智能体</button>`:'<span class="tab">任务</span><span class="tab">智能体</span>'}</nav><span class="account">${owner?'陈同学':s.perspective==='agent'?'研究 Agent':'林悦'}</span></header>`;}
function bottomNav(){if(s.perspective!=='owner')return '';return `<nav class="bottom" aria-label="主导航"><button onclick="goPage('personal')" title="${E(displayName())} · 个人助手"><span class="navicon">✦</span><span class="navlabel">${E(displayName())}</span></button><button class="${s.page==='chat'?'active':''}" onclick="goPage('chat')"><span class="navicon">◻</span><span class="navlabel">聊天</span></button><button class="${s.page==='tasks'?'active':''}" onclick="goPage('tasks')"><span class="navicon">▤</span><span class="navlabel">任务</span></button><button class="${s.page==='agents'?'active':''}" onclick="goPage('agents')"><span class="navicon">◇</span><span class="navlabel">智能体</span></button><button class="${s.page==='me'?'active':''}" onclick="goPage('me')"><span class="navicon">○</span><span class="navlabel">我</span></button></nav>`;}
function sideItem(id,title,preview,kind='',label='✦'){return `<button class="sideitem ${s.chat===id&&!s.list?'active':''}" onclick="openChat('${id}')">${avatar(kind,label)}<span class="grow"><strong class="ellipsis" title="${E(title)}">${E(title)}</strong><small class="ellipsis">${E(preview)}</small></span></button>`;}
function sidebar(){return `<aside class="sidebar" aria-label="聊天列表"><div class="sidehead">消息</div><div class="search" aria-hidden="true">搜索聊天…</div><div class="filters"><strong>全部</strong><span>人</span><span>Agent</span><span>群聊</span></div>${s.hasPA?sideItem('assistant',s.name,'个人助手 · 与你的专属私聊','pa'):''}${Object.keys(s.sources).filter(id=>s.sources[id].available).map(id=>sideItem(id,s.sources[id].name,s.sources[id].text,id==='team'?'group':'',s.sources[id].avatar)).join('')}</aside>`;}
function observationStatus(){if(!s.online)return '电脑离线 · 最后检查 09:40';if(s.cleanup==='pending')return s.paused?'已停止读取 · 清理尚未完成':'新消息同步中 · 自动分析等待重建';if(s.paused)return '观察已暂停';return s.history==='partial'?'持续观察中 · 近 30 天历史回看进行中':'持续观察中 · 近 30 天历史回看已完成';}
function observationBar(){return `<div class="observation-bar"><span class="state-dot ${s.paused||!s.online?'paused':''}"></span><span>${observationStatus()}</span><button class="link" onclick="openPanel('scope')">范围与进度</button></div>`;}
function proactiveMessages(){let html='';if(!s.cleaned){for(const id of ['lin','agent']){const x=s.sources[id];if(!x.observed)continue;if(!x.available){html+=message(s.name,'<p>一条建议的来源已无法访问。</p><p class="muted small">我已停止使用相关内容，旧建议不能继续应用。</p>',{pa:true});continue;}if(x.excluded)continue;html+=message(s.name,`<p>${x.handled?'你已经回复了这件事，我不会再提醒你待回复。':id==='lin'?'林悦在等你确认周三的演示时间，今天 17 点前需要答复。我先准备了一份回复，等你核对。':'研究 Agent 的材料已经准备好，与你今天到期的演示任务有关。我整理了提纲和还需你确认的内容。'}</p>${x.handled?'<p class="muted small">关联任务仍保留当前状态，不会因为回复了消息就自动完成。</p>':s.paused||!s.online?'<p class="muted small">这是暂停或断线前的记录；目前没有继续检查源聊天。</p>':`<div class="actions">${button(id==='lin'?'查看回复草稿':'查看准备结果',id==='lin'?"prepareReply('lin')":"openPanel('task')",'primary')}</div>`}<div class="source-label">来自${x.kind==='群'?'群聊':'你与'+E(x.name)+'的私聊'} · ${x.kind}消息</div><button class="link" onclick="openChat('${id}')">查看来源消息</button>`,{pa:true});}}
 html+=message(s.name,`<p>演示前还可以补一份公开检查清单，或者把已确认的提纲做成演示页面。</p><div class="actions">${button('查看搜索资料范围',"openAction('search')")}${button('查看页面制作任务',"openAction('task')")}</div>`,{pa:true}); const ready=Object.entries(s.requests).filter(([,r])=>r.requested&&r.status!=='idle');for(const [key,r] of ready){let text='';if(r.status==='sent')text=`<p>我已把你确认的时段回复给${E(r.deliveredRecipients||recipientText(key))}。</p><div class="receipt prewrap">${E(r.deliveredText)}</div><button class="link" onclick="reviewRelease('${key}')">查看回复记录</button>${r.followup?'<p class="muted small">对方又询问其他安排。上次许可只包含时段，我没有继续分享。</p>':''}`;else if(r.status==='unknown')text=`<p>原投递的结果尚未确认，联系屏蔽不撤回已提交消息。</p><div class="actions">${button('核对原投递结果',`reviewRelease('${key}')`,'primary')}</div>`;else if(r.contactRevoked)text='<p>这次请求因联系屏蔽已撤销，旧许可不能继续使用。解除后等待对方的新消息。</p>';else if(r.status==='declined')text='<p>这次未分享私人资料。没有向原聊天追加回复。</p>';else text=`<p>${E(r.sender)}直接问我周三的演示时间，还想了解当天的安排。我可以只回复两个可用时段，需要你确认。</p><div class="source-label">来自${E(destinationLabel(key))} · ${E(requesterLabel(key))}</div><div class="actions">${button(r.status==='unknown'?'核对发送结果':'查看要分享的内容',`reviewRelease('${key}')`,'primary')}</div>`;html+=message(s.name,text,{pa:true});}
 if(!html)html=message(s.name,s.paused?'我在这里。观察已暂停，你仍然可以直接找我聊需要推进的事。':'我会留意范围内的消息和你负责的任务。发现需要你决定的事情，会带着来源和下一步来找你。',{pa:true});return html;}
function composer(){const personal=s.chat==='assistant',source=s.sources[s.chat];const unavailable=!personal&&!source?.available;const delivery=s.delivery?.chat===s.chat?s.delivery:null;return `<footer class="composer">${s.attachments[s.chat]?.map(x=>`<span class="attachment">▧ ${E(x)}</span>`).join('')||''}${delivery?`<div class="warning">${delivery.status==='unknown'?'发送结果尚未确认，未再次提交。':'正在发送这条消息…'}${delivery.status==='unknown'?`<div>${button('核对发送结果','finishDelivery()')}</div>`:''}</div>`:''}<div class="composebox"><label class="sr-only" for="compose">${personal?'给个人助手的消息':'发送消息'}</label><textarea id="compose" placeholder="${unavailable?'当前会话不可用':personal?'告诉'+E(s.name)+'你想推进什么…':'给'+E(source?.name||'对方')+'发消息…'}" ${unavailable||delivery?'disabled':''}>${E(unavailable?'':s.drafts[s.chat]||'')}</textarea><button class="send" onclick="sendOwner()" aria-label="发送消息" ${unavailable||delivery?'disabled':''}>↑</button></div><div class="composer-hint"><span>${personal?'只有你与个人助手可见':'以陈同学的身份发送到当前聊天'}</span><span>${!s.online?'电脑离线':''}</span></div></footer>`;}
function ownerChat(){const personal=s.chat==='assistant',x=s.sources[s.chat];const available=personal||x?.available;const title=personal?s.name:available?x.name:'会话不可用';let html=personal?proactiveMessages():available?message(x.name,nl(x.text),{role:x.kind,menu:sourceMenu(s.chat)}):'<div class="empty"><h2>无法访问这个来源</h2><p class="muted">建议和旧草稿不能继续应用。回到聊天列表选择仍可访问的会话。</p>'+button('返回聊天列表','backToList()')+'</div>';html+=(available?s.sent:[]).filter(x=>x.chat===s.chat).map(x=>message('你',nl(x.text),{user:true})).join('');return `<section class="chat" aria-label="${E(title)}的聊天"><header class="chathead"><button class="back iconbtn" onclick="backToList()" aria-label="返回聊天列表">‹</button>${avatar(personal?'pa':'',personal?'✦':x?.avatar||'·')}<div class="grow"><div class="title">${E(title)}</div><div class="sub">${personal?'个人助手 · 与你的专属私聊':available?(x.kind==='群'?'你所在的群聊':'与你的私聊'):'权限已变更'}</div></div>${personal?`<div class="head-actions">${button('设置',"openPanel('settings')")}</div>`:''}</header>${personal?observationBar():''}${s.notice?`<div class="notice" role="status">${E(s.notice)} ${s.undo&&s.chat===s.undo.chat?'<button class="link" onclick="undoDraft()">撤销放入草稿</button>':''}</div>`:''}<div class="messages"><div class="date">今天 · 10 月 16 日</div>${html}</div>${composer()}</section>`;}
function panelShell(title,body){return `<aside class="panel" aria-label="${E(title)}"><div class="panelhead"><h2>${E(title)}</h2><button class="iconbtn" onclick="closePanel()" aria-label="返回聊天，保留草稿">×</button></div>${body}</aside>`;}
function changeContact(key,checked){s.contactDraft=checked?[...new Set([...s.contactDraft,key])]:s.contactDraft.filter(x=>x!==key);}
function saveContacts(){if(!s.online){s.notice='电脑离线，屏蔽设置仍为草稿，尚未生效。';render();return;}if(s.contactExpected!==s.contactRevision){s.notice='联系策略已更新，请返回设置重新核对；本次未覆盖。';render();return;}const added=s.contactDraft.filter(x=>!s.blocked.includes(x));s.blocked=[...s.contactDraft];s.contactRevision++;s.contactExpected=s.contactRevision;for(const key of added){const r=requestFor(key);r.contactRevoked=true;r.pendingIncoming=[];if(!['sent','unknown'].includes(r.status))r.status='invalid';r.version++;}s.notice='联系设置已保存。旧聊天保留；解除屏蔽后仅接收新请求，不恢复旧许可。';render();}
function contactsPanel(){return panelShell('管理联系与屏蔽',`<p>阻止以下对象联系个人助手。保留已有聊天，不删除消息，也不会把屏蔽一个群变成屏蔽群内所有人。</p>${[['dm','林悦的私聊'],['agent','研究 Agent 的私聊'],['group','演示协作群中的触达']].map(([key,label])=>`<label class="checkrow"><input type="checkbox" ${s.contactDraft.includes(key)?'checked':''} onchange="changeContact('${key}',this.checked)"><span>屏蔽 ${E(label)}<small>${s.blocked.includes(key)?'当前已屏蔽':'当前可联系'}</small></span></label>`).join('')}<p class="muted small">保存后待处理请求与未用分享许可失效。解除后不会重放屏蔽期间的请求。</p>${!s.online?'<div class="warning">离线：修改尚未生效。</div>':''}<div class="bottom-actions actions">${button('保存联系设置','saveContacts()','primary')}${button('取消',"openPanel('settings')")}</div>`);}
function openAction(kind){save();s.actions[s.action.kind]=s.action;if(s.actions[kind]&&s.actions[kind].status!=='cancelled'){s.action=s.actions[kind];s.panel='action';s.notice='';render();return;}if(s.action.kind===kind&&s.action.status!=='cancelled'){s.panel='action';s.notice='';render();return;}s.action={kind,input:s.task.proposed,sourceRevision:s.task.revision,query:'产品演示 公开资料检查清单',revision:1,reviewRevision:null,status:'draft',operation:null,node:'电脑A',shared:false,result:'已生成演示页面草稿（示例）。',resultSelected:false};s.panel='action';s.notice='';render();}
function changeActionNode(value){save();s.action.node=value;s.action.revision++;s.action.status='draft';render();}
function reviewAction(){save();if(s.action.kind==='task'&&(!s.task.available||!sourceActive('team'))){s.action.status='blocked';s.notice='来源已不可用，不能确认或启动。';render();return;}if(s.action.kind==='task'){s.action.input=s.task.proposed;s.action.sourceRevision=s.task.revision;}s.action.reviewRevision=s.action.revision;s.action.status='review';render();}
function cancelAction(){save();s.action.status='cancelled';s.panel=null;s.notice='这次没有搜索，也没有启动制作任务。';render();}
function executeAction(){save();const a=s.action;if(a.kind==='task'&&(!s.task.available||!sourceActive('team'))){a.status='blocked';s.notice='来源已不可用，没有提交新操作。';render();return;}if(a.status!=='review'||a.reviewRevision!==a.revision||(a.kind==='task'&&a.sourceRevision!==s.task.revision)){s.notice='参数或节点已变化，请重新核对。';a.status='draft';render();return;}if(!s.online||a.kind==='task'&&a.node==='独立干净节点'){s.notice='所选执行资源不可用，未提交。请保持草稿或选择当前电脑并核对权限。';render();return;}a.operation='action-'+(++sequence);a.status='running';s.notice='已提交，正在等待执行回执。';render();later(()=>{if(a.status!=='running')return;if(a.kind==='task'&&(!s.task.available||!sourceActive('team'))){a.status='blocked';render();return;}if(s.nextUnknown){s.nextUnknown=false;a.status='unknown';}else a.status='complete';render();});}
function recoverAction(){const a=s.action;if(a.status==='blocked'&&a.operation){a.receipt='confirmed';s.notice='已核实原操作完成；来源仍不可用，结果继续隔离，没有重新执行。';render();return;}if(a.kind==='task'&&(!s.task.available||!sourceActive('team'))){a.status='blocked';render();return;}if(a.status==='unknown'){a.status='complete';s.notice='已核实原操作完成，没有重新执行。';render();}}
function shareTaskResult(){save();const a=s.action;if(a.status!=='complete'||!a.resultSelected||!s.task.available||!sourceActive('team'))return;a.shared=true;s.notice='你选中的具体结果已作为新的本人输入交给 PA；旧来源观察范围没有改变。';render();}
function actionPanel(){const a=s.action,task=a.kind==='task',review=a.status==='review';if(a.status==='blocked')return panelShell('来源已失效',`<div class="warning">${a.operation?'原操作 '+E(a.operation)+' 已提交；来源变化后已停止后续处理，不能重用旧确认或自动使用结果。':'这份任务的来源已不可用，未启动新操作。'}已发出的内容不能倒退撤回。</div>${a.operation?(a.receipt==='confirmed'?'<p class="receipt">原操作已核实完成；结果保持不可用于后续处理。</p>':button('核对原操作','recoverAction()','primary')):''}${button('返回，保留记录','closePanel()')}`);if(['running','unknown','complete'].includes(a.status)){return panelShell(task?'专业任务执行结果':'搜索回执',`<p>执行者：${E(s.name)}${task?' · 专业任务':''}<br>操作：${E(a.operation)}<br>结果与轨迹：仅你可见</p>${a.status==='running'?'<div class="warning">正在执行，尚未确认完成。</div>':a.status==='unknown'?`<div class="warning">回执未知，不能认为失败并重复提交。</div>${button('核对原操作','recoverAction()','primary')}`:task?`<div class="success">任务已完成，正文尚未交给 PA 自动处理。</div><div class="box prewrap">${E(a.result)}</div><p class="warning">广权限任务的来源无法完整追踪。结果、过程和错误正文仅供你查看，不自动进入助手记忆或后续分析。</p>${a.shared?'<p class="success">以上选中内容已作为你的新输入提供给 PA。</p>':`<label class="checkrow"><input id="task-result-selection" type="checkbox" ${a.resultSelected?'checked':''} onchange="s.action.resultSelected=this.checked;render()"><span>将上面这一段结果作为新的本人输入提供给 PA<small>只提交这段可见文字；不恢复排除来源的持续观察。</small></span></label>${button('提交选中内容','shareTaskResult()','primary',!a.resultSelected)}`}`:'<div class="success">查询已完成。仅向搜索服务发送了确认的查询词。</div>'}${button('返回私聊','closePanel()')}`);}
return panelShell(task?'确认专业任务权限':'确认公开资料搜索',`${task?`<p>用已经确认的提纲制作演示页面。执行者是${E(s.name)}的独立专业任务，不是公司共享 Agent。</p><dl class="definition"><dt>输入资料</dt><dd>演示提纲 · 原任务第 ${a.sourceRevision} 版；不传完整私聊或记忆<details><summary>查看完整输入材料</summary><div class="prewrap">${E(a.input)}</div></details></dd><dt>专业能力</dt><dd>页面制作 v1 · shell / 文件编辑</dd><dt>结果受众</dt><dd>仅你可查看任务轨迹、正文与文件</dd></dl><label class="field-label" for="action-node">执行电脑</label><select class="field" id="action-node" onchange="changeActionNode(this.value)"><option ${a.node==='电脑A'?'selected':''}>电脑A</option><option ${a.node==='独立干净节点'?'selected':''}>独立干净节点</option></select>${a.node==='电脑A'?'<div class="warning"><strong>这是广权限执行</strong><br>工具可以读写电脑 A 的工作区并联网，也可能读到同机其他文件和保留日志。这里不是“只允许读取这份提纲”的强隔离环境；批准输入不保证代码只使用这些输入。预计只在本机制作，不自动发布。你可以取消或选择独立干净节点。</div>':'<div class="warning">独立干净节点尚未配置，当前不能执行。草稿可保留，不会自动回退到电脑 A。</div>'}`:`<p>仅把以下完整查询词发送给已配置的搜索服务。不发送原聊天、附件或你的日程。</p><dl class="definition"><dt>接收服务</dt><dd>已配置搜索服务（示例：Bing）</dd><dt>操作</dt><dd>公开网页搜索一次</dd></dl><label class="field-label" for="action-query">将外传的完整查询词</label><textarea class="field" id="action-query">${E(a.query)}</textarea><p class="hint">修改查询后要重新核对。服务可能保留收到的查询，发送后无法撤回。</p>`}${review?'<div class="box">已进入确认步骤：请核对以上完整内容。只批准本次动作；参数、输入或节点变化后此确认失效。</div>':''}${a.status==='cancelled'?'<p>上次已取消，没有执行。</p>':''}${!s.online?'<div class="warning">电脑离线，不能提交；草稿保留。</div>':''}<div class="bottom-actions actions">${review?button(task?'确认广权限执行':'确认这次搜索','executeAction()','primary',!s.online||task&&a.node==='独立干净节点'):button('核对本次内容','reviewAction()','primary')}${button('取消，不执行','cancelAction()')}${button('保留草稿，返回','closePanel()')}</div>`);}
function settingsPanel(){return panelShell('个人助手设置',`<div class="row">${avatar('pa')}<div class="grow"><strong class="wrap">${E(s.name)}</strong><div class="muted small">你的个人助手</div></div></div><div class="box"><h3>名字</h3><p class="muted">名字可以随时改，聊天和正在做的事会继续保留。</p>${button('修改名字',"openPanel('name')")}</div><div class="box"><h3>持续观察</h3><p>${observationStatus()}</p><p class="muted">在你允许的消息与任务中主动找出需要处理的事。</p>${button('范围、历史与暂停',"openPanel('scope')")}</div><div class="box"><h3>谁可以联系我</h3><p>同公司的有效成员与 Agent 可以直接私聊${E(s.name)}。加入群聊需要你确认。</p><p class="muted">对方只看到自己的聊天。涉及你的私人资料，我会在这里和你具体确认。</p>${button('管理联系与屏蔽',"openPanel('contacts')")}</div><div class="box"><h3>继续推进工作</h3><p>查看两项已准备的下一步，决定具体能力与资料范围。</p>${button('审核公开资料搜索',"openAction('search')")}${button('审核演示页面制作',"openAction('task')")}</div><p class="muted small">专业 Agent 仍在“智能体”中单独管理。</p>`);}
function scopePanel(){const activeCount=Object.values(s.sources).filter(x=>x.available&&!x.excluded).length;return panelShell('观察范围与历史',`<span class="pill ${s.paused||!s.online?'neutral':''}">${observationStatus()}</span><p class="muted small" style="margin-top:13px">在你当前有权访问的私聊、已加入的群和你负责的任务中主动发现问题。不改变你的已读状态，也不会把我加入源聊天。</p>${s.cleanup==='pending'?'<div class="warning"><strong>清理尚未完成</strong><br>已停止受影响来源的新读取，相关缓存和旧建议保持不可用，自动分析等待重建。电脑重新连接后继续核对清理结果。</div>':''}<div class="actions">${s.paused?button('恢复观察','openResume()','primary',!s.online||s.cleanup==='pending'):button('暂停观察','pauseObservation()','',!s.online)}</div><div class="box"><h3>当前覆盖</h3><dl class="definition"><dt>新消息</dt><dd>已同步至 ${s.receivedAt}</dd><dt>最近检查</dt><dd>${s.checkedAt}，晚于此时间的消息可能尚未检查</dd><dt>历史窗口</dt><dd>近 30 天 · 9 月 16 日至 10 月 16 日</dd><dt>历史进度</dt><dd>${s.history==='complete'?'18 个来源已回看完成':'12 / 18 个来源已回看，其余正在分批补读'}</dd></dl>${s.history==='partial'?'<div class="progress" aria-label="18 个来源中 12 个已回看"><span></span></div><p class="muted small">新消息优先处理。尚未回看的内容可能仍有遗漏，回看完成也不代表所有任务已完成。</p>':'<p class="muted small">回看已覆盖当前授权范围。任务仍按原任务记录的状态显示。</p>'}</div><h3>排除不想被观察的会话</h3><p class="muted small">排除后停止读取并清理相关观察缓存和未发送建议。原始聊天和你自己写的消息不被删除。</p>${Object.keys(s.sources).filter(id=>s.sources[id].available).map(id=>`<label class="checkrow"><input type="checkbox" ${s.scopeDraft?.has(id)?'checked':''} onchange="changeScope('${id}',this.checked)"><span>排除 ${E(s.sources[id].name)}<small>${s.sources[id].kind==='群'?'已加入的群':'本人私聊'}${s.sources[id].kind==='Agent'?' · 对方是 Agent':''}</small></span></label>`).join('')}<p class="muted small">目前示例中有 ${activeCount} 个可观察来源。新加入且你有权限的会话遵循同一范围设置。</p><div class="actions">${button('保存范围','saveScope()','primary',!s.online)}${button('取消','closePanel()')}</div><hr class="divider"><button class="link danger" onclick="openPanel('clean-confirm')">暂停并清理已观察记录</button><p class="hint">仅清理 PA 管理的观察缓存并停用相关旧上下文。本机运行日志及历史导出可能保留；它们不再用于自动观察。无法撤回已发送给他人或模型服务的内容。</p>`);}
function replyPanel(){const id=s.replyTarget,x=s.sources[id];if(!sourceActive(id))return panelShell('来源不可用','<div class="warning">这个来源已被排除或失去访问权，旧建议不能继续应用。</div>'+button('返回聊天','closePanel()'));const conflict=s.panel==='draft-conflict';return panelShell(`${s.name} · 回复草稿`,`<div class="source-box"><strong>回复给：${E(x.name)} · 你的私聊</strong>${E(x.text)}<br><button class="link" onclick="openChat('${id}')">查看来源消息</button></div><label class="field-label" for="reply-text">建议回复</label><textarea class="field draft" id="reply-text">${E(s.replyDrafts[id]||'')}</textarea><p class="hint">你可以编辑。放入输入框后，由你在原聊天发送。</p>${conflict?`<div class="warning"><strong>原聊天已有草稿</strong><p class="prewrap">${E(s.drafts[id]||'（只有附件）')}</p>${s.attachments[id].length?'<p>保留附件：'+s.attachments[id].map(E).join('、')+'</p>':''}</div><div class="actions">${button('追加到原草稿',"applyReply('append')",'primary')}${button('替换文字',"applyReply('replace')")}${button('保留原稿，返回','closePanel()')}</div>`:`<div class="bottom-actions actions">${button('放入输入框',"applyReply('check')",'primary',!s.replyDrafts[id]?.trim())}${button('取消','closePanel()')}</div>`}<p class="hint">关闭或返回会保留这份编辑中的草稿，不会发送。</p>`);}
function taskPanel(){const t=s.task;if(!t.available||!sourceActive('team'))return panelShell('任务不可用','<div class="warning">任务来源已被排除、清理或无法访问，先前准备的内容不能继续写回。</div>'+button('返回聊天','closePanel()'));if(s.panel==='task-conflict')return panelShell('原任务已更新',`<div class="warning">你预览之后，原任务发生了修改。这次没有写回，也没有覆盖新状态。</div><div class="box"><strong>${E(t.title)}</strong><dl class="definition"><dt>最新状态</dt><dd>${E(t.status)}</dd><dt>负责人</dt><dd>${E(t.owner)}</dd><dt>原任务</dt><dd>${E(t.id)} · 第 ${t.revision} 版</dd></dl></div><p class="muted small">你的结果草稿仍然保留。任务已关闭时不能继续按旧计划提交。</p><div class="actions">${button('查看最新原任务',"s.page='tasks';s.panel=null;render()",'primary')}${button('保留结果，返回','closePanel()')}</div>`);
 const review=s.panel==='task-review';return panelShell(review?'确认写回原任务':'准备好的任务结果',`<div class="source-box"><strong>${E(t.title)}</strong><div>${E(t.id)} · 来源：产品协作群</div><dl class="definition"><dt>负责人</dt><dd>陈同学（你）</dd><dt>当前状态</dt><dd>${E(t.status)}</dd><dt>截止</dt><dd>今天 17:00</dd></dl><button class="link" onclick="save();s.page='tasks';s.panel=null;render()">打开原任务</button></div>${t.writeState==='written'?`<div class="success">已写回原任务 · 状态为待确认</div><div class="box prewrap">${E(t.result)}</div><div class="receipt">执行者：${E(s.name)}（个人助手）<br>授权者：陈同学<br>负责人仍是陈同学。<br>产品协作群已产生待确认系统通知。</div>`:review?`<h3>这次会修改</h3><dl class="definition"><dt>结果</dt><dd class="prewrap">${E(t.proposed)}</dd><dt>状态</dt><dd>${E(t.status)} → 待确认</dd><dt>执行者</dt><dd>${E(s.name)}，由你确认</dd><dt>负责人</dt><dd>仍是陈同学</dd><dt>可见范围</dt><dd>当前有权查看这个原任务的人</dd></dl><p class="hint">只补充以上结果和状态。不会改派负责人；产品协作群会产生一条“待确认”系统通知，当前有权查看该群的人可见。</p><div class="bottom-actions actions">${button(t.writeState==='writing'?'正在写回…':'确认写回','writeTask()','primary',t.writeState==='writing'||!s.online||t.status==='已关闭')}${button('返回编辑',"openPanel('task')",'',t.writeState==='writing')}</div>`:`<label class="field-label" for="task-result">准备结果 · 尚未写回</label><textarea class="field draft" id="task-result">${E(t.proposed)}</textarea><p class="hint">任务状态和负责人以原任务为准。你确认后，才把这份结果写入原记录。</p>${t.status==='已关闭'?'<div class="warning">原任务已关闭，结果草稿保留，不能继续写回。</div>':''}<div class="bottom-actions actions">${button('查看写回内容','taskReview()','primary',t.status==='已关闭')}${button('稍后再看','closePanel()')}</div>`}`);}
function releasePanel(){const key=s.showRelease,r=requestFor(key),invalid=releaseInvalid(r);if(r.status==='sent')return panelShell('已回复原聊天',`<span class="pill">已发送</span><dl class="definition"><dt>收件人</dt><dd>${E(r.deliveredRecipients||recipientText(key))}</dd><dt>位置</dt><dd>${E(r.deliveredDestination||destinationLabel(key))}</dd><dt>发言者</dt><dd>${E(s.name)} · 陈同学的个人助手</dd></dl><div class="box prewrap">${E(r.deliveredText)}</div><p class="muted small">本次许可已经用于这条回复。对方继续询问其他资料时，需要新的确认。</p>${button('返回本人私聊','closePanel()','primary')}`);
 if(r.status==='unknown')return panelShell('核对发送结果',`<div class="warning">这一次投递的回执尚未返回，不能确认对方已经收到。请先核对，不要重新发送。</div><dl class="definition"><dt>位置</dt><dd>${E(destinationLabel(key))}</dd><dt>内容</dt><dd class="prewrap">${E(r.deliveredText)}</dd></dl>${button('核对这一次发送',`finishRelease('${key}')`,'primary')}`);
 if(r.contactRevoked)return panelShell('请求已撤销','<p>联系屏蔽撤销了这次请求。解除屏蔽也不会恢复旧许可，请等待新消息。</p>'+button('返回本人私聊','closePanel()'));if(!s.releaseSource)return panelShell('资料已不可用','<div class="warning">待分享资料已经失去访问权，旧预览与确认不再有效。这次没有发送。</div>'+button('返回本人私聊','closePanel()'));
 return panelShell('确认要分享的内容',`<p>${E(r.sender)}想确认你的演示时间。我建议只回复下面两个时段。</p><div class="source-box"><strong>请求人：${E(requesterLabel(key))}</strong><span>${key==='agent'?'所属账号：research-agent（本公司）':'账号：linyue@nano.example（本公司）'}</span><br>请求来自：${E(destinationLabel(key))}</div><dl class="definition"><dt>发给谁</dt><dd>${E(recipientText(key))}${key==='group'?' · 当前全体群成员':''}</dd><dt>在哪里</dt><dd>${E(destinationLabel(key))}</dd><dt>用途</dt><dd>协调 10 月 21 日这次产品演示</dd><dt>分享依据</dt><dd>当前可用时段；不包含完整日程或其他安排的内容</dd></dl>${invalid?'<div class="warning"><strong>需要重新核对</strong><br>资料、收件人或有效时间已变化，旧确认不会继续发送。</div>':''}<label class="field-label" for="release-text">将以 ${E(s.name)} 的身份发送</label><textarea class="field draft" id="release-text" ${r.status==='sending'?'disabled':''}>${E(r.text)}</textarea><p class="hint">仅本次回复有效，最晚今天 18:00。收件人、资料或问题变化后需要重新确认。</p><div class="bottom-actions actions">${invalid?button('按当前信息重新准备','refreshRelease()','primary'):button(r.status==='sending'?'正在发送…':'确认并回复原聊天','approveRelease()','primary',r.status==='sending'||!s.online)}${button('这次不分享','declineRelease()','',r.status==='sending')}${button('稍后决定','closePanel()','',r.status==='sending')}</div><p class="hint">稍后决定会保留编辑内容；没有确认前，不会把这些时段交给对方。</p>`);}
function panel(){if(!s.panel)return '';switch(s.panel){case 'settings':return settingsPanel();case 'action':case 'action-result':return actionPanel();case 'contacts':return contactsPanel();case 'scope':return scopePanel();case 'name':return panelShell('修改个人助手的名字',`<label class="field-label" for="rename-input">名字</label><input class="field" id="rename-input" value="${E(s.nameDraft)}" maxlength="80" onkeydown="if(event.key==='Enter')rename()" aria-describedby="rename-hint"><p id="rename-hint" class="hint">入口、聊天标题与署名会更新。你的聊天和草稿继续保留。</p>${s.nameError?`<p role="alert" class="validation">${E(s.nameError)}</p>`:''}<div class="bottom-actions actions">${button('保存名字','rename()','primary')}${button('取消','cancelRename()')}</div>`);case 'reply':case 'draft-conflict':return replyPanel();case 'task':case 'task-review':case 'task-conflict':return taskPanel();case 'release':return releasePanel();case 'resume':return panelShell('恢复持续观察',`<p>恢复前先核对你现在的权限与范围。已排除或失去访问权的来源不会补读。</p><label class="checkrow"><input type="radio" name="resume-mode" value="catchup" checked><span>补读暂停期间的消息<small>按近 30 天窗口补读，合并为最新状态；你已处理的事不重复提醒。</small></span></label><label class="checkrow"><input type="radio" name="resume-mode" value="new"><span>仅从现在开始<small>不补读暂停期间的新消息，也不继续旧的未处理建议。</small></span></label>${!s.online?'<div class="warning">电脑离线，连接后才能恢复。</div>':''}${s.cleanup==='pending'?'<div class="warning">先等待清理完成，再恢复观察。</div>':''}<div class="bottom-actions actions">${button('恢复观察','resumeObservation()','primary',!s.online||s.cleanup==='pending')}${button('保持暂停',"openPanel('scope')")}</div>`);case 'clean-confirm':return panelShell('暂停并清理观察记录',`<p>暂停后，清理个人助手已保存的观察副本。</p><div class="box"><h3>会清理</h3><p>观察缓存、相关主动建议，以及尚未分享的观察结果。</p><h3>继续保留</h3><p>原始 IM 聊天、原任务、你与助手的历史、已发送消息及本机运行日志/历史导出。相关旧资料仍可供你查看，但不再自动注入新上下文。</p></div><div class="warning">已经提供给模型服务或发送给他人的信息无法倒退撤回。清理完成前会保持暂停，不会显示“已全部清理”。</div><div class="bottom-actions actions">${button('确认暂停并清理','confirmClean()','primary')}${button('取消',"openPanel('scope')")}</div>`);case 'source-unavailable':return panelShell('来源不可用','<div class="warning">来源权限或观察范围已变化。这份旧建议不能继续应用。</div>'+button('返回聊天','closePanel()'));default:return '';}}
function setupPage(){const u=s.setup;let body='';if(s.hasPA&&u.step!=='complete'){body=`<h2>你的个人助手已存在</h2><p class="muted">${E(s.name)}会继续和你一起推进事情，不需要再创建一个。</p>${button('打开原来的私聊',"s.page='chat';s.chat='assistant';s.list=false;render()",'primary')}`;}else if(u.step==='name'){body=`<span class="eyebrow">你的个人助手</span><h2>先从一个名字开始</h2><p class="muted">它会长期与你一起工作。专业 Agent 以后仍可以单独创建。</p>${u.existing?'<div class="box"><p>已有的研究 Agent 会继续保留。这里为你设置一个独立的个人助手，不会替换已有 Agent。</p></div>':''}<label class="field-label" for="setup-name">你想叫它什么？</label><input class="field" id="setup-name" placeholder="起一个你喜欢的名字" value="${E(u.name)}" maxlength="80"><label class="field-label" for="setup-goal">最近想推进什么？<span class="muted">（可选）</span></label><textarea class="field" id="setup-goal" rows="3" placeholder="例如：准备下周的产品演示">${E(u.goal)}</textarea><p class="hint">之后会放进第一条消息的草稿，由你确认后发送。</p>${u.error?`<p role="alert" class="validation">${E(u.error)}</p>`:''}<div class="setup-footer"><button class="link" onclick="exitSetup()">稍后继续</button>${button('下一步：了解持续观察','setupNext()','primary')}</div>`;}else if(u.step==='observe'){body=`<h2>让${E(u.name)}主动帮上忙</h2><p class="muted">不用逐条转发。开启后，它会留意你收到和发出的消息，查找遗漏、准备回复，并协助你负责的任务。</p><label class="checkrow"><input id="setup-observe" type="checkbox" ${u.observe?'checked':''} onchange="s.setup.observe=this.checked;render()"><span><strong>启用持续观察</strong><small>以后可以排除会话、暂停或清理记录。</small></span></label><div class="box"><h3>默认范围</h3><p>你当前可访问的真人与 Agent 私聊、你已加入的群、你负责的原任务。首次从近 30 天历史分批回看；新消息优先。</p>${Object.keys(s.sources).map(id=>`<label class="checkrow"><input type="checkbox" ${u.excluded.includes(id)?'checked':''} onchange="setupExclude('${id}',this.checked)"><span>排除 ${E(s.sources[id].name)}</span></label>`).join('')}</div><p class="small">观察不会改变你的已读状态，也不意味着自动替你发消息、承诺或分享资料。需要你决定时，${E(u.name)}会在你们的专属私聊中确认具体内容和收件人。</p><div class="box"><h3>别人怎样联系它</h3><p>同公司的有效成员与 Agent 可以直接私聊；加入群聊由你确认。对方只看到自己的聊天和你明确同意分享的内容。</p></div><div class="setup-footer">${button('返回','setupBack()')}${button(u.observe?'创建并启用观察':'创建，暂不开启观察','createPA()','primary')}</div>`;}else if(u.step==='creating'||u.step==='pending'){body=`<div class="row"><span class="spinner" aria-hidden="true"></span><h2>${u.step==='pending'?'正在确认创建结果':'正在创建'+E(u.name)}</h2></div><p class="muted" style="margin-top:17px">${u.step==='pending'?'请求已经提交，但完成回执还没确认。会继续核对同一次创建，不会再建第二个助手。':'正在保存专属身份和私聊。请稍等。'}</p>${!s.online?'<div class="warning">电脑已断线。你的名字、设置和创建进度都已保留。</div>':''}<div class="setup-footer"><button class="link" onclick="exitSetup()">稍后回来</button>${u.step==='pending'?button('重新确认结果','retryCreate()','primary'):button('正在确认…','createPA()','primary',true)}</div>`;}else{body=`<span class="pill">个人助手已创建</span><h2 style="margin-top:18px">认识一下${E(s.name)}</h2><p>你们的专属私聊已经准备好。</p><div class="box"><p>${s.paused?'持续观察暂未开启。你可以先聊天，之后到个人助手设置中开启。':'持续观察已开启；近 30 天历史会分批回看。新消息优先，尚未读完的范围会如实显示。'}</p></div>${button('进入专属私聊','enterCreated()','primary')}`;}
 return `<div class="onboarding"><div class="onboarding-inner"><span class="eyebrow">欢迎来到 nano</span><h1>${u.existing?'设置你的个人助手':'和你的个人助手开始合作'}</h1><p class="muted">先连接电脑与模型，再建立一个长期属于你的助手。</p><div class="onboarding-layout"><aside><ol class="steps"><li class="done"><span class="step-dot">✓</span>连接电脑</li><li class="done"><span class="step-dot">✓</span>准备模型</li><li class="active"><span class="step-dot">3</span>个人助手</li></ol><p class="muted small">前两步沿用现有引导。此处从已准备好的环境继续。</p></aside><section class="onboarding-card">${s.notice?`<div class="warning" role="status">${E(s.notice)}</div>`:''}${body}</section></div></div></div>`;}
function setupExclude(id,value){s.setup.excluded=value?[...new Set([...s.setup.excluded,id])]:s.setup.excluded.filter(x=>x!==id);}
function otherPage(){if(s.page==='tasks'){const t=s.task;return `<section class="placeholder"><h1>任务</h1><p class="muted small">现有任务页的相关任务详情</p>${t.available&&s.sources.team.available?`<div class="box" style="max-width:700px"><span class="pill neutral">${E(t.status)}</span><h2 style="margin-top:14px">${E(t.title)}</h2><dl class="definition"><dt>原任务</dt><dd>${E(t.id)}</dd><dt>负责人</dt><dd>陈同学</dd><dt>所属会话</dt><dd>产品协作群</dd><dt>截止</dt><dd>今天 17:00</dd></dl>${t.result?`<h3>结果</h3><p class="prewrap">${E(t.result)}</p>`:'<p class="muted small">尚未提交结果。个人助手的准备内容保留在你们的私聊中。</p>'}${t.history.map(h=>`<div class="receipt">${E(h.by)} · ${E(h.text)}</div>`).join('')}<div class="actions">${button('查看助手准备的内容',"openPanel('task')")}${button('回到来源群',"openChat('team')")}</div></div>`:'<div class="warning">当前无法访问这条任务，不展示旧标题和内容。</div>'}</section>`;}if(s.page==='agents')return `<section class="placeholder"><h1>智能体</h1><p class="muted">你的个人助手与专业 Agent</p><div class="box" style="max-width:650px">${s.hasPA?`<div class="row">${avatar('pa')}<div class="grow"><strong class="wrap">${E(s.name)}</strong><div class="muted small">个人助手 · 固定属于你</div></div>${button('打开私聊',"openChat('assistant')")}</div>`:`<h3>还没有个人助手</h3>${button('继续设置个人助手','startSetup(true)','primary')}`}<hr class="divider"><div class="row">${avatar('','研')}<div class="grow"><strong>研究 Agent</strong><div class="muted small">专业 Agent · 原有身份与聊天保留</div></div>${button('打开私聊',"openChat('agent')")}</div></div><p class="muted small">专业 Agent 的新建与配置沿用现有页面，本原型不重做该流程。</p></section>`;return `<section class="placeholder"><h1>我</h1><div class="box" style="max-width:550px"><strong>陈同学</strong><p class="muted small">账号与电脑设置沿用现有页面。</p>${button('打开个人助手',"openChat('assistant')")}</div></section>`;}
function externalList(){save();s.list=true;render();}
function selectExternal(kind){save();s.perspective=kind==='dm'?'external':kind;s.list=false;requestExternal(kind);render();}
function externalPage(){const key=externalKey(),r=requestFor(key),group=key==='group';const title=group?'演示协作群':s.name;const req=group?'@'+s.name+' 周三下午的演示时间能确认吗？':key==='agent'?'我在协调周三演示。能提供陈同学的可用时段和当天安排吗？':'陈同学周三下午哪些时间方便演示？也把当天的安排给我看一下吧。';const sidebarHtml=`<aside class="sidebar"><div class="sidehead">消息</div><div class="search" aria-hidden="true">搜索聊天…</div><button class="sideitem ${!group?'active':''}" onclick="selectExternal('${key==='agent'?'agent':'dm'}')">${avatar('pa')}<span class="grow"><strong class="ellipsis">${E(s.name)}</strong><small>陈同学的个人助手</small></span></button><button class="sideitem ${group?'active':''}" onclick="selectExternal('group')">${avatar('group','群')}<span class="grow"><strong>演示协作群</strong><small>已有群聊</small></span></button></aside>`;
 return `${sidebarHtml}<section class="chat"><header class="chathead"><button class="back iconbtn" onclick="externalList()" aria-label="返回聊天列表">‹</button>${avatar(group?'group':'pa',group?'群':'✦')}<div class="grow"><div class="title">${E(title)}</div><div class="sub">${group?E(s.groupMembers.join(' · ')):E('陈同学的个人助手 · 与'+r.sender+'的私聊')}</div></div><span class="pill neutral">${group?'群聊':'Agent'}</span></header><div class="messages"><div class="date">今天 · 10 月 16 日</div>${message(r.sender,E(req),{user:true,role:key==='agent'?'Agent':''})}${message(s.name,'我会请陈同学确认可分享的时段，确认后在这里回复你。',{pa:true})}${r.messages.map(m=>message(m.by==='pa'?s.name:m.by,nl(m.text),{pa:m.by==='pa',user:m.by!=='pa'})).join('')}</div><footer class="composer"><div class="composebox"><label for="compose" class="sr-only">在当前聊天发送消息</label><textarea id="compose" placeholder="${group?'输入 @'+E(s.name)+'…':'给'+E(s.name)+'发送消息…'}">${E(s.externalDrafts[key])}</textarea><button class="send" onclick="externalSend()" aria-label="发送消息">↑</button></div><div class="composer-hint"><span>${group?'发给当前群成员':'与你的普通私聊'}</span><span>${key==='agent'?'发言者：研究 Agent':'发言者：林悦'}</span></div></footer></section>`;}
function render(){for(const a of new Set([s.action,...Object.values(s.actions)])){if(a.kind==='task'&&a.status!=='cancelled'&&(!s.task.available||!sourceActive('team')))a.status='blocked';}const previousMessages=document.querySelector('.messages');if(previousMessages&&s.renderedChatKey)s.scrolls[s.renderedChatKey]=previousMessages.scrollTop;const app=document.querySelector('#app');const external=s.perspective!=='owner';const className=s.page==='setup'?'setup-view':s.page==='chat'?(s.list?'list-view':'conversation-view'):'other-view';app.innerHTML=`<main class="app ${className}">${topbar()}${s.page==='setup'&&!external?setupPage():`<div class="workspace ${s.panel?'panel-open':''}">${external?externalPage():s.page==='chat'?sidebar()+ownerChat():otherPage()}${external?'':panel()}</div>`}${s.page==='setup'?'':bottomNav()}</main>`;const messages=document.querySelector('.messages');const scrollKey=[s.perspective,s.page,s.chat,external?externalKey():''].join('/');if(messages)messages.scrollTop=s.scrolls[scrollKey]||0;s.renderedChatKey=scrollKey;if(s.panel&&window.innerWidth<=1100){document.querySelector('.chat')?.setAttribute('inert','');document.querySelector('.sidebar')?.setAttribute('inert','');}const select=document.querySelector('#perspective-select');if(select&&s.page!=='setup')select.value=s.perspective;}
function resetDemo(){const epoch=s.timerEpoch+1;s=initialState();s.timerEpoch=epoch;document.querySelector('#perspective-select').value='owner';document.querySelector('#demo-status').textContent='已重置内存演示。默认呈现正常的本人私聊；没有实际请求被发送。';render();}
function demoPerspective(value){save();s.panel=null;s.notice='';s.list=false;if(value==='setup'||value==='existing'){s.timerEpoch++;s.hasPA=false;s.online=true;s.cleaned=false;s.cleanup='none';s.sent=[];s.delivery=null;for(const x of Object.values(s.sources)){x.observed=false;x.handled=false;x.actualHandled=false;}for(const r of Object.values(s.requests)){r.requested=false;r.status='idle';r.messages=[];r.deliveredText='';}s.setup={step:'name',name:'',goal:'',observe:true,excluded:[],error:'',operation:null,submitted:false,createdCount:0,unknownNext:s.setup.unknownNext,existing:value==='existing'};s.page='setup';s.perspective='owner';}else{s.perspective=value;s.page='chat';s.chat='assistant';if(value!=='owner')requestExternal(externalKey());}document.querySelector('#demo-status').textContent='已切换演示视角。身份切换只存在于这一产品外控制区。';render();}
function demoEvent(event){save();let text='';switch(event){case 'human-incoming':case 'agent-incoming':{const id=event==='human-incoming'?'lin':'agent',x=s.sources[id];s.newest=id;x.actualHandled=false;x.handled=false;x.pending=true;if(isObserving()&&sourceActive(id)){x.observed=true;x.pending=false;s.checkedAt='09:43';}s.receivedAt='09:43';text=isObserving()&&sourceActive(id)?'范围内的新消息已形成有来源的主动建议。':'消息只到达原聊天；离线、暂停、排除或失权时不继续分析。';break;}case 'owner-replied':{const x=s.sources[s.newest];x.actualHandled=true;if(isObserving()&&sourceActive(s.newest))x.handled=true;text='本人在原聊天的回复已出现；可观察时停止待回复提醒，暂停时等恢复后核对。';break;}case 'offline':s.online=false;text='节点离线；保留草稿、进度与待确认投递，不伪报运行。';break;case 'online':s.online=true;if(!s.paused)reconcile();text='节点已重连；先核对权限、积压最新状态和已有操作回执。';break;case 'creation-unknown':s.setup.unknownNext=true;text='下次创建会停在“正在确认创建结果”，可从产品内继续同一次请求。';break;case 'delivery-unknown':s.nextUnknown=true;text='下次发送会缺少完成回执，需在产品内核对同一次投递。';break;case 'task-conflict':s.task.revision++;s.task.status='已关闭';if(s.panel==='task-review'){s.task.writeState='conflict';s.panel='task-conflict';}text='原任务出现并发更新；旧确认写回将被拒绝，结果草稿保留。';break;case 'source-lost':{const id=s.page==='tasks'||['task','task-review','task-conflict'].includes(s.panel)?'team':'lin';s.sources[id].available=false;s.drafts[id]='';s.attachments[id]=[];delete s.replyDrafts[id];if(id==='team')s.task.available=false;text='来源权限失效；旧来源内容、草稿和入口不再可用。';break;}case 'release-lost':s.releaseSource=false;for(const r of Object.values(s.requests))if(!['sent','unknown'].includes(r.status))r.status='invalid';text='待分享资料来源失权，未发送确认失效，不泄露旧内容。';break;case 'audience-change':if(!s.groupMembers.includes('周启'))s.groupMembers.push('周启');s.requests.group.audienceRevision++;s.requests.group.version++;text='原生群新增周启，旧群分享确认失效，须核对新的全体受众。';break;case 'release-expired':requestFor(s.showRelease).expires=true;text='这次分享确认已过期；不能沿用旧确认发送。';break;case 'cleanup-stuck':s.cleanupHold=true;text='下一次清理会保持未完成；不会仅因点击就显示已清理。';break;case 'cleanup-done':finishCleanup();text='返回清理完成回执，仅现在显示本机清理完成。';break;case 'history-complete':s.history='complete';text='历史回看覆盖完成；不把回看完成当作任务完成。';break;case 'long-name':if(s.page==='setup'){s.setup.name='陪我一起把重要事情做好并记住每个细节的小助理';}else{s.nameDraft='陪我一起把重要事情做好并记住每个细节的小助理';s.panel='name';}text='已在名称输入框填入长名字。需在产品内保存；窄屏布局仍未视觉验证。';break;}
 document.querySelector('#demo-status').textContent=text;render();}
// Static prototype only: no fetch, network, storage, backend, or real authorization.
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&s.panel){if(s.panel==='name')cancelRename();else closePanel();}});
render();
</script>
</body>
