<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>feat-676 · 记忆设置局部原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#25343c;font:14px/1.5 system-ui,-apple-system,sans-serif}button,select,textarea{font:inherit}button,select{cursor:pointer}header{background:white;border-bottom:1px solid #e3e7e8;padding:14px 24px;font-weight:650}main{max-width:1000px;margin:24px auto;padding:0 24px}.demo{color:#65727b;font-size:12px;margin-bottom:20px}.demo summary{cursor:pointer}.demo label{display:inline-flex;gap:8px;align-items:center;margin:10px 16px 0 0}.demo select{max-width:230px}article{background:white;border:1px solid #e3e7e8;border-radius:8px;padding:24px}h1{font-size:18px;margin:0 0 22px}h2{font-size:14px;margin:0}h3{font-size:13px;font-weight:600;margin:0 0 10px}.section{display:grid;grid-template-columns:136px minmax(0,1fr);gap:28px;padding:22px 0;border-top:1px solid #e3e7e8}.body{min-width:0}textarea{display:block;resize:vertical;width:100%;min-height:80px;border:1px solid #e3e7e8;border-radius:5px;margin:8px 0 20px;padding:10px}.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px}.feature{display:flex;align-items:flex-start;gap:9px;min-width:0;padding:9px 0;cursor:pointer}.feature input{width:16px;height:16px;margin:2px 0 0;flex-shrink:0;accent-color:#377f78}.name{font-size:13px;font-weight:500}.help{font-size:12px;line-height:1.5;color:#65727b;margin:3px 0 0}.policy{margin-top:20px}select{padding:8px;border:1px solid #dfe4e5;border-radius:5px;background:white;color:inherit}.policy select{width:100%}.footer{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #e3e7e8;padding-top:18px;margin-top:10px}.actions{display:flex;gap:8px;flex-shrink:0}button{background:white;border:1px solid #dfe4e5;color:#25343c;border-radius:5px;padding:8px 14px}button.primary{background:#377f78;color:white;border-color:#377f78}button:disabled{opacity:.5;cursor:default}#status{font-size:12px;color:#65727b;min-height:36px}#status.error{color:#a83b35}.work{margin-top:22px;border-top:1px solid #e3e7e8;padding-top:18px}.work summary{cursor:pointer;font-size:13px}.work p{font-size:13px}.muted{color:#65727b;font-size:12px}[hidden]{display:none!important}@media(max-width:700px){main{padding:0 14px;margin:16px auto}article{padding:18px}.section{grid-template-columns:1fr;gap:12px;padding:18px 0}.features{grid-template-columns:1fr}.feature{min-height:44px}.footer{align-items:flex-start;flex-direction:column}.actions{align-self:flex-end}header{padding:12px 18px}}
</style>
<header>nano IM <span class="muted">／配置局部原型</span></header>
<main><div class="demo">本次变化：以 Dreaming 替换记忆开关，调整技能创建说明。其余表单为现有界面背景；不连接真实服务。
<details><summary>仅演示：切换场景</summary><label>配置来源<select id="mode"><option value="document">默认文档记忆</option><option value="legacy">文件切换为 legacy</option></select></label><label>保存结果<select id="outcome"><option value="success">正常生效</option><option value="pending">等待节点应用</option><option value="failure">应用失败</option></select></label><button id="resolve">模拟节点确认</button></details></div>
<article><h1>Agent 配置</h1><div class="section"><h2>指令与行为</h2><div class="body"><label for="instruction"><strong>自定义补充指令</strong></label><textarea id="instruction" placeholder="补充此 Agent 的工作方式"></textarea><h3>特性开关</h3><div class="features">
<label class="feature"><input type="checkbox" checked><span><span class="name">Intelligent UI</span><p class="help">引导 Agent 按需使用交互卡片。</p></span></label>
<label class="feature"><input type="checkbox" checked><span><span class="name">任务图</span><p class="help">允许 Agent 记录计划、探索分支和进度。</p></span></label>
<label class="feature" id="dreaming-row"><input id="dreaming" type="checkbox" checked><span><span class="name">Dreaming · 自动整理记忆</span><p class="help">定期整理已处理的经历。关闭后仍可记住、更正和读取记忆。</p></span></label>
<label class="feature"><input type="checkbox" checked><span><span class="name">技能创建</span><p class="help">允许 Agent 在任务中创建或修改可复用技能。</p></span></label>
<label class="feature"><input type="checkbox" checked><span><span class="name">定时任务（Cron）</span><p class="help">到点自动执行计划任务，无需每次手动发起。</p></span></label>
<label class="feature"><input type="checkbox"><span><span class="name">定期汇报（Heartbeat）</span><p class="help">定期主动汇报，可设置频率和活跃时段。</p></span></label>
</div><div class="policy"><h3>群聊回复策略</h3><select aria-label="群聊回复策略"><option>仅被提及时回复</option></select></div></div></div>
<div class="footer"><div id="status" role="status" aria-live="polite">配置已生效</div><div class="actions"><button id="cancel">取消</button><button id="save" class="primary" disabled>保存</button></div></div>
<details class="work"><summary>工作记录结果示例 · 记忆整理 · 部分完成</summary><p>已核对 18 / 24 个单元；保存 2 页。入口待同步：正文已被更新，需重新核对。剩余 6 个单元留待继续处理。</p><p>内容已保存；版本记录失败。</p><p class="muted">此处仅展示既有 Work 结果中的信息语义，不规定新的卡片、入口或布局。</p></details>
</article></main>
<script>
const byId=id=>document.getElementById(id);let saved=true;let pending=false;
function status(text,error=false){byId('status').textContent=text;byId('status').className=error?'error':''}
byId('dreaming').onchange=()=>{status('有未保存的更改');byId('save').disabled=false};
byId('mode').onchange=()=>{byId('dreaming-row').hidden=byId('mode').value==='legacy';status('配置已生效');byId('save').disabled=true};
byId('cancel').onclick=()=>{byId('dreaming').checked=saved;pending=false;status('更改已取消');byId('save').disabled=true};
byId('save').onclick=()=>{const result=byId('outcome').value;if(result==='failure'){status('未能应用配置，请重试。你的选择已保留。',true);return}if(result==='pending'){pending=true;status('配置已保存，等待节点应用');byId('save').disabled=true;return}saved=byId('dreaming').checked;status('配置已生效');byId('save').disabled=true};
byId('resolve').onclick=()=>{if(pending){pending=false;saved=byId('dreaming').checked;status('配置已生效')}else{status('当前没有等待应用的配置')}};
</script></html>
