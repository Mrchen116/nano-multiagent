      color: #fff;
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 12px;
      box-shadow: var(--im-shadow-strong);
      pointer-events: none;
      z-index: 20;
      max-width: calc(100% - 32px);
    }
  </style>
</head>
<body>
  <header class="demo-chrome" aria-label="原型演示控制栏（非产品界面）">
    <div class="demo-chrome-left">
      <strong>feat-785 交互原型</strong>
      <span class="demo-tag demo-tag--bg">现有界面背景：左栏/底栏与聊天外壳</span>
      <span class="demo-tag demo-tag--new">本次重塑：三范围焦点台 · 北极星全景 · 私聊活任务卡 · 运行特性主动筹划</span>
      <span class="demo-tag demo-tag--sim">本栏仅演示控制</span>
      <button class="demo-btn" onclick="resetDemo()">重置演示数据</button>
    </div>
    <div class="demo-controls" id="demoControls"></div>
  </header>

  <main class="stage-wrap">
    <div id="stage"></div>
  </main>

  <script>
    const STATES = [
      { id: "focus-web", label: "Web 1280 · 焦点台" },
      { id: "focus-triaged", label: "Web 1280 · 翻牌后" },
      { id: "goal-web", label: "Web 1280 · 北极星全景" },
      { id: "chat-web", label: "Web 1280 · 私聊活卡片" },
      { id: "focus-mobile", label: "Web 390 · 窄屏焦点台" },
      { id: "ios-goal", label: "iOS 390 · 阶段脉络流" },
      { id: "ios-draft", label: "iOS 390 · 草稿 Sheet" },
      { id: "ios-chat", label: "iOS 390 · 私聊活卡片" },
      { id: "settings-online", label: "iOS 390 · 运行设置在线" },
      { id: "settings-offline", label: "iOS 390 · 离线只读" }
    ];

    const params = new URLSearchParams(window.location.search);
    let currentState = params.get("state") || "focus-web";

    const store = {
      scope: "mine",
      assigneeFilter: "daily-engineering",
      createTarget: "小助私聊",
      proactiveDraft: true,
      proactiveSaved: true,
      completedExpanded: false,
      subscopeTitle: "",
      toast: "",
      collapsedDoneOpen: false,
      proposals: {
        p_bot: {
          id: "p_bot",
          crumb: "新构想 · 单卡",
          crumbKind: "idea",
          prereqBlocked: false,
          title: "调研「自媒体 Bot」主流平台发布限制与防封号边界",
          rationale: "来自昨晚提到的新构想；本周主线是 Nano Demo，先挂单卡，批准后由小助后台整理对比。",
          assignee: "小助",
          status: "proposed"
        },
        p_demo_next: {
          id: "p_demo_next",
          crumb: "把 Nano 打磨成熟并推出去 › 演示发布",
          crumbKind: "goal",
          prereqBlocked: true,
          title: "整理内测种子用户首批 10 人邀请名单与体验引导",
          rationale: "3 分钟 Demo 录完后的下游准备（依赖阶段 3 录屏完成）；批准立项后进入待办排队。",
          assignee: "小助",
          status: "proposed"
        }
      },
      singleCardsAdded: []
    };

    function resetDemo() {
      store.proposals.p_bot.status = "proposed";
      store.proposals.p_demo_next.status = "proposed";
      store.singleCardsAdded = [];
      store.scope = "mine";
      store.completedExpanded = false;
      store.subscopeTitle = "";
      store.toast = "";
      render();
    }

    if (currentState === "focus-triaged") {
      store.proposals.p_bot.status = "doing";
      store.proposals.p_demo_next.status = "todo";
      store.toast = "已批准开工：调研「自媒体 Bot」主流平台发布限制";
    }

    function setState(next) {
      currentState = next;
      if (next === "focus-triaged") {
        store.proposals.p_bot.status = "doing";
        store.proposals.p_demo_next.status = "todo";
        store.toast = "已批准开工：调研「自媒体 Bot」主流平台发布限制";
      } else if (next === "focus-web") {
        store.proposals.p_bot.status = "proposed";
        store.proposals.p_demo_next.status = "proposed";
        store.scope = "mine";
        store.toast = "";
      }
      render();
    }

    function approveProposal(id) {
      const item = store.proposals[id];
      if (!item) return;
      if (item.prereqBlocked) {
        item.status = "todo";
        store.toast = `已批准立项（等前置阶段完成）：${item.title}`;
      } else {
        item.status = "doing";
        store.toast = `已批准开工：${item.title}`;
      }
      render();
    }

    function triage(id, nextStatus) {
      const item = store.proposals[id];
      if (!item) return;
      item.status = nextStatus;
      store.toast = nextStatus === "backlog"
        ? `已放入远期：${item.title}`
        : `已关闭：${item.title}`;
      render();
    }

    function openPendingProposals() {
      return Object.values(store.proposals).filter((p) => p.status === "proposed");
    }

    function renderControls() {
      const wrap = document.getElementById("demoControls");
      wrap.innerHTML = STATES.map((s) =>
        `<button class="demo-btn" aria-pressed="${s.id === currentState}" onclick="setState('${s.id}')">${s.label}</button>`
      ).join("");
    }

    function renderLeftRail(activeTab) {
      const pendingCount = openPendingProposals().length;
      return `
        <nav class="im-rail" aria-label="主导航">
          <div class="im-brand">N</div>
          <button class="im-rail-item ${activeTab === 'chat' ? 'im-rail-item--active' : ''}" onclick="setState('chat-web')">
            <span>聊天</span>
          </button>
          <button class="im-rail-item ${activeTab === 'tasks' ? 'im-rail-item--active' : ''}" onclick="setState('focus-web')">
            <span>任务</span>
            ${pendingCount > 0 ? `<span class="im-rail-badge">${pendingCount}</span>` : ""}
          </button>
          <button class="im-rail-item ${activeTab === 'agents' ? 'im-rail-item--active' : ''}" onclick="setState('settings-online')">
            <span>助手</span>
          </button>
        </nav>
      `;
    }

    function renderBottomBar(activeTab, isIOS) {
      return `
        <nav class="im-bottombar" aria-label="${isIOS ? 'iPhone 标签栏' : '移动端底部导航'}">
          <button class="${activeTab === 'chat' ? 'is-active' : ''}" onclick="setState('${isIOS ? 'ios-chat' : 'chat-web'}')">聊天</button>
          <button class="${activeTab === 'tasks' ? 'is-active' : ''}" onclick="setState('${isIOS ? 'ios-goal' : 'focus-mobile'}')">任务</button>
          <button class="${activeTab === 'agents' ? 'is-active' : ''}" onclick="setState('settings-online')">助手</button>
          <button>我的</button>
        </nav>
      `;
    }

    function renderAssigneeOrTeamScope() {
      if (store.scope === "assignee") {
        return `
          <section aria-label="按负责人查看">
            <div class="section-head">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:12.5px;font-weight:600">负责人：</span>
                <select class="select-pill" onchange="store.assigneeFilter=this.value;render()">
                  <option value="daily-engineering" ${store.assigneeFilter==='daily-engineering'?'selected':''}>E · 工程交付</option>
                  <option value="pa" ${store.assigneeFilter==='pa'?'selected':''}>小助（个人助手）</option>
                </select>
              </div>
              <span class="section-sub">跨目标图汇总该主体直接负责的节点</span>
            </div>
            <div class="stack-list">
              <article class="focus-card">
                <div class="card-main">
                  <span class="goal-crumb goal-crumb--team">研发日常群 › 双节点公网稳定性与 iPhone 无线交付打磨</span>
                  <h3 class="card-title">验证断网恢复后增量消息与任务状态追平</h3>
                  <div class="card-meta-row"><span class="badge badge--doing">推进中</span><span>负责人：E · 工程交付</span></div>
                </div>
              </article>
            </div>
          </section>
        `;
      }
      return `
        <section aria-label="团队全部可见目标">
          <div class="section-head">
            <h2 class="section-title">可访问的团队目标与独立任务 <span class="count-pill">2</span></h2>
            <span class="section-sub">按所属会话权限展示</span>
          </div>
          <div class="stack-list">
            <article class="focus-card">
              <div class="card-main">
                <span class="goal-crumb goal-crumb--team">研发日常群</span>
                <h3 class="card-title">双节点公网稳定性与 iPhone 无线交付打磨</h3>
                <div class="card-meta-row"><span class="badge badge--doing">推进中</span><span>子任务 4 项</span></div>
              </div>
            </article>
            <article class="focus-card">
              <div class="card-main">
                <span class="goal-crumb goal-crumb--team">产品体验打磨群</span>
                <h3 class="card-title">收集首轮外部试用反馈清单</h3>
                <div class="card-meta-row"><span class="badge badge--todo">待办</span><span>负责人：P · 产品体验</span></div>
              </div>
            </article>
          </div>
        </section>
      `;
    }

    function renderFocusDesk(isMobile) {
      const pending = openPendingProposals();
      const approvedBot = store.proposals.p_bot.status === "doing";
      const queuedDemoNext = store.proposals.p_demo_next.status === "todo";
      return `
        <div class="workspace">
          <div class="topbar">
            <div class="topbar-title-group">
              <h1 class="topbar-title">任务</h1>
              <div class="scope-tabs" role="tablist" aria-label="任务范围">
                <button class="scope-tab ${store.scope === 'mine' ? 'is-active' : ''}" onclick="store.scope='mine';render()">与我有关</button>
                <button class="scope-tab ${store.scope === 'assignee' ? 'is-active' : ''}" onclick="store.scope='assignee';render()">按负责人</button>
                <button class="scope-tab ${store.scope === 'all' ? 'is-active' : ''}" onclick="store.scope='all';render()">团队全部</button>
              </div>
            </div>
            ${isMobile ? "" : `<input class="search-input" placeholder="搜索任务或目标…" aria-label="搜索任务" />`}
          </div>

          <div class="focus-body">
            <form class="quick-create" onsubmit="event.preventDefault(); const v=this.elements.t.value.trim(); if(v){store.singleCardsAdded.unshift({title:v, chat:store.createTarget}); this.elements.t.value=''; store.toast='已新建单卡（'+store.createTarget+'）：'+v; render();}">
              <select class="select-pill" aria-label="归属会话" onchange="store.createTarget=this.value">
                <option value="小助私聊" ${store.createTarget==='小助私聊'?'selected':''}>归属：小助私聊</option>
                <option value="研发日常群" ${store.createTarget==='研发日常群'?'selected':''}>归属：研发日常群</option>
              </select>
              <input name="t" placeholder="${isMobile ? '记一件小事或新目标…' : '记一件小事或新目标（回车建单卡，长线可展开为目标图）…'}" aria-label="快速新建单卡事项" />
              <button type="submit" class="btn btn--primary">新建</button>
              ${isMobile ? "" : `<button type="button" class="btn btn--ghost" onclick="store.toast='打开完整表单：支持一次性创建多阶段目标图';render()">完整新建…</button>`}
            </form>

            ${store.scope !== "mine" ? renderAssigneeOrTeamScope() : `
              <section aria-label="待你拍板">
                <div class="section-head">
                  <h2 class="section-title">
                    待你拍板
                    <span class="count-pill ${pending.length ? 'count-pill--butter' : ''}">${pending.length}</span>
                  </h2>
                  <span class="section-sub">批准前不会自动执行</span>
                </div>
                ${pending.length === 0 ? `
                  <div class="calm-zero">当前没有待你拍板的事项，主线正在按计划推进。</div>
                ` : `
                  <div class="stack-list">
                    ${pending.map((p) => `
                      <article class="focus-card focus-card--proposal">
                        <div class="card-main">
                          <button class="goal-crumb ${p.crumbKind === 'idea' ? 'goal-crumb--idea' : ''}" onclick="setState('${isMobile ? 'ios-goal' : 'goal-web'}')">
                            ${p.crumb}
                          </button>
                          <h3 class="card-title">${p.title}</h3>
                          <p class="card-desc">${p.rationale}</p>
                          <div class="card-meta-row">
                            <span class="badge badge--proposed">待拍板</span>
                            <span>负责人：${p.assignee}</span>
                          </div>
                        </div>
                        <div class="card-actions">
                          <button class="btn btn--primary" onclick="approveProposal('${p.id}')">${p.prereqBlocked ? '批准立项' : '批准开工'}</button>
                          <button class="btn btn--ghost" onclick="triage('${p.id}','backlog')">放远期</button>
                          <button class="btn btn--ghost" onclick="triage('${p.id}','closed')">关闭</button>
                        </div>
                      </article>
                    `).join("")}
                  </div>
                `}
              </section>

              <section aria-label="正在推进与盯梢">
                <div class="section-head">
                  <h2 class="section-title">正在推进与盯梢 <span class="count-pill">${2 + (approvedBot ? 1 : 0) + (queuedDemoNext ? 1 : 0) + store.singleCardsAdded.length}</span></h2>
                </div>
                <div class="stack-list">
                  ${store.singleCardsAdded.map((item) => `
                    <article class="focus-card">
                      <div class="card-main">
                        <span class="goal-crumb ${item.chat==='小助私聊'?'goal-crumb--idea':'goal-crumb--team'}">${item.chat} · 单卡</span>
                        <h3 class="card-title">${item.title}</h3>
                        <div class="card-meta-row"><span class="badge badge--todo">待办</span><span>负责人：J</span></div>
                      </div>
                    </article>
                  `).join("")}

                  ${approvedBot ? `
                    <article class="focus-card">
                      <div class="card-main">
                        <span class="goal-crumb goal-crumb--idea">新构想 · 单卡</span>
                        <h3 class="card-title">${store.proposals.p_bot.title}</h3>
                        <div class="card-meta-row">
                          <span class="badge badge--doing">推进中 · 小助运行中</span>
                          <span>无未完前置，已启动执行</span>
                        </div>
                      </div>
                      <div class="card-actions">
                        <button class="btn" onclick="setState('${isMobile ? 'ios-chat' : 'chat-web'}')">回私聊</button>
                      </div>
                    </article>
                  ` : ""}

                  ${queuedDemoNext ? `
                    <article class="focus-card">
                      <div class="card-main">
                        <button class="goal-crumb" onclick="setState('${isMobile ? 'ios-goal' : 'goal-web'}')">把 Nano 打磨成熟并推出去 › 演示发布</button>
                        <h3 class="card-title">${store.proposals.p_demo_next.title}</h3>
                        <div class="card-meta-row">
                          <span class="badge badge--todo">待办 · 等前置阶段 3 完成</span>
                          <span>负责人：小助</span>
                        </div>
                      </div>
                    </article>
                  ` : ""}

                  <article class="focus-card">
                    <div class="card-main">
                      <button class="goal-crumb" onclick="setState('${isMobile ? 'ios-goal' : 'goal-web'}')">把 Nano 打磨成熟并推出去 › 演示发布</button>
                      <h3 class="card-title">录制 3 分钟真实场景 Demo 视频</h3>
                      <p class="card-desc">已备好《3 分钟 Demo 演示骨架》参考草稿，定下 3 个镜头即可开录。</p>
                      <div class="card-meta-row">
                        <span class="badge badge--doing">推进中</span>
                        <span>负责人：J</span>
                        <span>周四 16:00 复查进展</span>
                      </div>
                    </div>
                    <div class="card-actions">
                      <button class="btn btn--soft" onclick="setState('${isMobile ? 'ios-draft' : 'goal-web'}')">查看草稿</button>
                      <button class="btn" onclick="setState('${isMobile ? 'ios-goal' : 'goal-web'}')">看全景</button>
                    </div>
                  </article>

                  <article class="focus-card">
                    <div class="card-main">
                      <span class="goal-crumb goal-crumb--team">研发日常群</span>
                      <h3 class="card-title">核对主动简报发前新鲜度拦截体验</h3>
                      <div class="card-meta-row">
                        <span class="badge badge--wait">周四实测复查</span>
                        <span>负责人：小助（空闲 · 查看 Work）</span>
                      </div>
                    </div>
                  </article>
                </div>
              </section>

              <section aria-label="长线目标">
                <div class="section-head">
                  <h2 class="section-title">长线目标 <span class="count-pill">2</span></h2>
                </div>
                <div class="goal-grid">
                  <div class="goal-card" role="button" tabindex="0" onclick="setState('${isMobile ? 'ios-goal' : 'goal-web'}')">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                      <span class="badge badge--doing">个人主线</span>
                      <span style="font-size:11.5px;color:var(--im-text-muted)">已完成 2 · 推进 1 · 待拍板 ${store.proposals.p_demo_next.status === 'proposed' ? 1 : 0}</span>
                    </div>
                    <div style="font-size:14.5px;font-weight:700">把 Nano 打磨成熟并推出去</div>
                    <div style="font-size:12px;color:var(--im-text-muted)">跑通真实个人主动助手闭环，录出 3 分钟实机 Demo 并邀首批 10 位同路人试用。</div>
                    <div class="goal-bar">
                      <div class="goal-bar-done" style="width:50%"></div>
                      <div class="goal-bar-doing" style="width:25%"></div>
                      <div class="goal-bar-prop" style="width:25%"></div>
                    </div>
                    <div style="font-size:12px;color:var(--im-accent);font-weight:600">当前前沿：录制 3 分钟 Demo（含草稿）</div>
                  </div>

                  <div class="goal-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                      <span class="goal-crumb goal-crumb--team" style="margin:0">研发日常群 · 你发起</span>
                      <span style="font-size:11.5px;color:var(--im-text-muted)">成员推进中 4 项</span>
                    </div>
                    <div style="font-size:14.5px;font-weight:700">双节点公网稳定性与 iPhone 无线交付打磨</div>
                    <div style="font-size:12px;color:var(--im-text-muted)">日常主力使用零断连体感，iPhone 新包 3 分钟内无线升级完成。</div>
                    <div class="goal-bar">
                      <div class="goal-bar-done" style="width:70%"></div>
                      <div class="goal-bar-doing" style="width:30%"></div>
                    </div>
                    <div style="font-size:12px;color:var(--im-text-muted)">前沿：E 正在验证断网重连补齐</div>
                  </div>
                </div>
              </section>

              <section>
                <button class="btn btn--ghost" onclick="store.collapsedDoneOpen=!store.collapsedDoneOpen;render()">
                  ${store.collapsedDoneOpen ? "收起" : "展开"}远期与已完结（远期 ${store.proposals.p_demo_next.status === 'backlog' ? 2 : 1} · 已完成 5）
                </button>
              </section>
            `}
          </div>
        </div>
      `;
    }

    function renderGoalWeb() {
      const sprout = store.proposals.p_demo_next;
      return `
        <div class="workspace">
          <div class="topbar">
            <div class="topbar-title-group">
              <button class="btn" onclick="setState('focus-web')">返回任务</button>
              <h1 class="topbar-title">把 Nano 打磨成熟并推出去${store.subscopeTitle ? ' › ' + store.subscopeTitle : ''}</h1>
              ${store.subscopeTitle ? `<button class="btn btn--ghost" onclick="store.subscopeTitle='';render()">返回顶层全景</button>` : `<span class="badge badge--doing">个人空间</span>`}
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn" onclick="setState('chat-web')">回私聊讨论</button>
              <button class="btn btn--primary">+ 添加子节点</button>
            </div>
          </div>

          <div class="north-star-banner">
            <div>
              <div class="north-star-label">终局目标</div>
              <p class="north-star-goal">用新模型自己天天真用起来，跑顺「主动操心但不越权打扰」的闭环，录出一支 3 分钟真实演示并拿给首批 10 位同路人试用。</p>
            </div>
            <div style="font-size:12px;color:var(--im-text-muted)">已完成 2 · 推进 1 · 待拍板 ${sprout.status === 'proposed' ? 1 : 0}</div>
          </div>

          <div class="goal-split">
            <div class="goal-canvas" aria-label="阶段与探索脉络图">
              <div class="stage-flow">
                <div class="stage-col">
                  <div class="stage-col-head">阶段 1 · 已完成</div>
                  <button class="map-node" onclick="store.subscopeTitle='双节点部署子脉络';render()">
                    <span class="badge badge--done">已完成</span>
                    <div class="map-node-title">双节点部署与记忆底座</div>
                    <p class="map-node-note">Dreaming 与 iPhone 真机日常稳定运行</p>
                    <span class="subscope-link">进入子脉络 (3) ›</span>
                  </button>
                </div>

                <div class="stage-arrow" aria-hidden="true">→</div>

                <div class="stage-col">
                  <div class="stage-col-head">阶段 2 · 探索选型</div>
                  <button class="map-node">
                    <span class="badge badge--doing">已选定方向</span>
                    <div class="map-node-title">渐进式目标图 + 待拍板卡</div>
                    <p class="map-node-note">兼顾小事单卡与长线目标脉络</p>
                  </button>

                      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">

    function renderSettings(isOffline) {
      const dirty = store.proactiveDraft !== store.proactiveSaved;
      return `
        <div class="workspace">
          <div class="topbar">
            <div class="topbar-title-group">
              <button class="btn btn--ghost" onclick="setState('ios-chat')">‹ 个人助手设置</button>
              <h1 class="topbar-title" style="font-size:15px">运行设置</h1>
            </div>
            <button class="btn btn--primary" ${isOffline || !dirty ? "disabled" : ""} onclick="store.proactiveSaved=store.proactiveDraft;store.toast='已保存运行设置';render()">保存</button>
          </div>

          <div class="settings-body">
            ${isOffline ? `
              <div class="offline-banner" role="status">
                <span>所属电脑当前不可达，以下为上次保存的设置（只读）；恢复连接后刷新可修改。</span>
                <button class="btn" onclick="setState('settings-online')">重试刷新</button>
              </div>
            ` : `
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--im-text-muted)">
                <span>所属电脑：Mac mini · 在线</span>
              </div>
            `}

            <div class="settings-card">

                  </div>
                </div>
                <button
                  class="switch"
                  role="switch"
                  aria-label="主动筹划"
                  aria-checked="${store.proactiveDraft}"
                  ${isOffline ? "disabled" : ""}
                  onclick="store.proactiveDraft=!store.proactiveDraft;render()"

                <div>
                  <div style="font-weight:700;font-size:13.5px">任务图</div>
                  <div style="font-size:12px;color:var(--im-text-muted)">承载单卡事项与长线目标脉络（主动筹划开启时需保持启用）</div>

                <button
                  class="switch"
                  role="switch"
                  aria-label="任务图"
                  aria-checked="true"
                  ${isOffline ? "disabled" : ""}
                  onclick="if(store.proactiveDraft){store.toast='请先关闭「主动筹划」再关闭任务图';render();}"

              </div>
            </div>

            <div class="settings-card">
              <div class="toggle-row">
                <div>
                  <div style="font-weight:700;font-size:13.5px">Dreaming · 自动整理记忆</div>
                  <div style="font-size:12px;color:var(--im-text-muted)">夜间沉淀长期背景与主动沟通分寸规则</div>
                </div>
                <button class="switch" role="switch" aria-checked="true" ${isOffline ? "disabled" : ""}></button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      renderControls();
      const stage = document.getElementById("stage");
      const isMobile = ["focus-mobile", "ios-goal", "ios-draft", "ios-chat", "settings-online", "settings-offline"].includes(currentState);
      const isIOS = currentState.startsWith("ios-") || currentState.startsWith("settings-");

      let bodyHTML = "";
      let activeTab = "tasks";

      if (currentState === "focus-web" || currentState === "focus-triaged") {
        bodyHTML = renderFocusDesk(false);
        activeTab = "tasks";
      } else if (currentState === "focus-mobile") {
        bodyHTML = renderFocusDesk(true);
        activeTab = "tasks";
      } else if (currentState === "goal-web") {
        bodyHTML = renderGoalWeb();
        activeTab = "tasks";
      } else if (currentState === "ios-goal") {
        bodyHTML = renderIOSGoal(false);
        activeTab = "tasks";
      } else if (currentState === "ios-draft") {
        bodyHTML = renderIOSGoal(true);
        activeTab = "tasks";
      } else if (currentState === "chat-web") {
        bodyHTML = renderChat(false);
        activeTab = "chat";
      } else if (currentState === "ios-chat") {
        bodyHTML = renderChat(true);
        activeTab = "chat";
      } else if (currentState === "settings-online") {
        bodyHTML = renderSettings(false);
        activeTab = "agents";
      } else if (currentState === "settings-offline") {
        bodyHTML = renderSettings(true);
        activeTab = "agents";
      }

      const hideBottomBar = currentState === "ios-chat";
      stage.innerHTML = `
        <div class="product-frame ${isMobile ? 'product-frame--mobile' : ''}">
          ${isMobile ? "" : renderLeftRail(activeTab)}
          ${bodyHTML}
          ${isMobile && !hideBottomBar ? renderBottomBar(activeTab, isIOS) : ""}
          ${store.toast ? `<div class="floating-toast" role="status">${store.toast}</div>` : ""}
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
