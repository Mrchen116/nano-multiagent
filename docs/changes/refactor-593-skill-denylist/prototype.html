<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill 选择局部状态对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f6;color:#253b3b;font:15px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:24px}h2{font-size:19px}p{margin:8px 0}aside{padding:16px;border:1px solid #afc9c4;border-radius:12px;background:#edf6f2}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;margin-top:24px}.frame{padding:24px;background:white;border:1px solid #dbe4e2;border-radius:18px}header,footer,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}header{border-bottom:1px solid #dde6e3;padding-bottom:14px}footer{margin-top:24px;border-top:1px solid #dde6e3;padding-top:16px}.hint,.path{color:#697e7a;font-size:13px}.group{margin-top:22px}.label{display:flex;justify-content:space-between;font-size:12px;color:#5e7570;margin-bottom:9px}button{cursor:pointer;border:1px solid #d0ddda;padding:8px 14px;border-radius:8px;background:#fff;color:inherit}button.save{background:#167c73;color:white}button:disabled{opacity:.4;cursor:default}.pill{border-radius:22px;font:13px ui-monospace;padding:7px 12px;margin:3px;background:#e9eeee;color:#6d7b78}.pill[aria-pressed=true]{background:#d3eee7;border-color:#8cc4b5;color:#1b5e53}.native .row{padding:17px 0;border-bottom:1px solid #e4eae8}.native input{width:22px;height:22px;accent-color:#167c73}.native strong{font-size:17px;font-weight:500}.native .path{overflow-wrap:anywhere}.native .row div{max-width:83%}details{margin-top:20px}summary{cursor:pointer;font-weight:600}.stored{margin-top:16px;color:#6c7d76}.result{min-height:25px;color:#167c73}.demo{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px}@media(max-width:700px){main{padding:16px}.columns{grid-template-columns:1fr}.frame{padding:18px}header{align-items:flex-start}}
</style><main><h1>Skill 选择：默认可用，取消项持续禁用</h1><aside>设计对照 · 实现后补充。页面背景沿用现有 Web 分组选择与 iOS 折叠开关；本次修改默认启用语义和提示。以下为本地模拟，不接后端。演示控制位于产品区域外，真实验收另记。</aside>
<div class="columns"><section class="frame"><header><div><b>E2E Agent</b><div class="hint">Access &amp; Model</div></div><button class="save" disabled onclick="save()">保存</button></header><h2>Skills <span id="count" class="hint"></span></h2><p class="hint">新技能默认启用；取消勾选的技能保持禁用。</p><div id="web"></div><p class="stored" id="stored"></p><footer><span id="dirty">无更改</span><button onclick="preview()">提示词预览</button></footer><p class="result" id="result"></p></section>
<section class="frame native"><header><span>‹ Agent 配置</span><button class="save" disabled onclick="save()">保存</button></header><details open><summary>Skills</summary><p class="hint">新技能默认启用；取消勾选的技能保持禁用。</p><div id="ios"></div></details><p class="hint">沿用原生折叠分组、名称/路径/说明与开关；保存后回到既有确认位置。</p></section></div>
<div class="demo"><button onclick="add()">演示：复制新名称</button><button onclick="missing=!missing;render()">演示：候选暂缺 / 恢复</button><button onclick="disabled=new Set(saved);render();document.querySelector('#result').textContent='重开后仍采用已保存选择'">演示：重开配置</button></div>
<script>
let candidates=[{name:'daily-journal-write',group:'Workspace',path:'workspace/.nanoassistant/skills/daily-journal-write',description:'在日记中记录今天的进展。'},{name:'weekly-review',group:'Global',path:'owner/skills/weekly-review',description:'汇总最近一周的工作记录。'}],disabled=new Set(),saved=[],missing=false;
function render(){let visible=candidates.filter((c,i)=>!missing||i!==0);document.querySelector('#count').textContent=`${visible.filter(c=>!disabled.has(c.name)).length} 已启用`;document.querySelector('#web').replaceChildren();document.querySelector('#ios').replaceChildren();for(let group of ['Workspace','Global']){let opts=visible.filter(c=>c.group===group),n=opts.filter(c=>!disabled.has(c.name)).length;let block=document.createElement('div');block.className='group';let label=document.createElement('div');label.className='label';label.textContent=`${group} ${n}/${opts.length}`;let all=document.createElement('button');all.textContent=n===opts.length?'取消全组':'补全选择';all.onclick=()=>{opts.forEach(c=>n===opts.length?disabled.add(c.name):disabled.delete(c.name));render()};label.append(all);block.append(label);let details=document.createElement('details');details.open=true;let summary=document.createElement('summary');summary.textContent=group;details.append(summary);for(let c of opts){let pill=document.createElement('button');pill.className='pill';pill.textContent=c.name;pill.setAttribute('aria-pressed',!disabled.has(c.name));pill.onclick=()=>toggle(c.name);block.append(pill);let row=document.createElement('label');row.className='row';let text=document.createElement('div');text.innerHTML=`<strong>${c.name}</strong><div class="path">${c.path}</div><div>${c.description}</div>`;let check=document.createElement('input');check.type='checkbox';check.checked=!disabled.has(c.name);check.onchange=()=>toggle(c.name);row.append(text,check);details.append(row)}document.querySelector('#web').append(block);document.querySelector('#ios').append(details)}let dirty=JSON.stringify([...disabled].sort())!==JSON.stringify([...saved].sort());document.querySelector('#dirty').textContent=dirty?'未保存的更改':'无更改';document.querySelectorAll('.save').forEach(b=>b.disabled=!dirty);document.querySelector('#stored').textContent=missing&&disabled.has('daily-journal-write')?'daily-journal-write · 禁用选择仍已保存，目录暂未报告':''}
function toggle(n){disabled.has(n)?disabled.delete(n):disabled.add(n);render()}function save(){saved=[...disabled];render();document.querySelector('#result').textContent='配置已确认；后续回复采用新选择'}function preview(){document.querySelector('#result').textContent='可用 Skills: '+candidates.filter(c=>!disabled.has(c.name)).map(c=>c.name).join(', ')}function add(){if(!candidates.some(c=>c.name==='meeting-notes'))candidates.push({name:'meeting-notes',group:'Workspace',path:'workspace/.nanoassistant/skills/meeting-notes',description:'整理一次会议的记录。'});render()}render();
</script></main></html>
