<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">根据问题选择权威来源</title>
  <desc id="desc">图中把应该怎样、现在如何实现、某次发生了什么、为什么曾经这样决定四类问题，分别路由到当前契约、代码和配置、运行证据、历史决定，并要求继续检查状态、版本和适用范围。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1a1a1a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #6b6b6b; }
      .question { font-size: 21px; font-weight: 700; }
      .badge { font-size: 14px; font-weight: 700; }
      .card-title { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; fill: #6b6b6b; }
      .small { font-size: 14px; fill: #6b6b6b; }
      .gate { font-size: 16px; font-weight: 650; }
      .connector { stroke: #6b6b6b; stroke-width: 2; fill: none; }
      .arrow { stroke: #6b6b6b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="40" y="48" class="title">先识别要回答的问题，再判断哪个来源有权回答</text>
  <text x="40" y="78" class="subtitle">同一个主题可以同时出现在契约、代码、日志和历史中；它们不是互相覆盖，而是在回答不同问题。</text>

  <rect x="350" y="110" width="400" height="66" rx="12" fill="#f5f1ea" stroke="#e6e3dc" stroke-width="2"/>
  <text x="550" y="150" text-anchor="middle" class="question">当前任务究竟要知道什么？</text>

  <path d="M550 176 V202 M145 202 H955" class="connector"/>
  <path d="M145 202 V217" class="arrow"/>
  <path d="M415 202 V217" class="arrow"/>
  <path d="M685 202 V217" class="arrow"/>
  <path d="M955 202 V217" class="arrow"/>

  <!-- Should -->
  <rect x="30" y="225" width="230" height="268" rx="14" fill="#e6eef0" stroke="#9ab8be" stroke-width="2"/>
  <rect x="50" y="245" width="72" height="28" rx="14" fill="#2a6470"/>
  <text x="86" y="264" text-anchor="middle" class="badge" fill="#ffffff">应该</text>
  <text x="50" y="310" class="card-title" fill="#2a6470">系统应该怎样？</text>
  <text x="50" y="348" class="body">
    <tspan x="50">读取：</tspan>
    <tspan x="50" dy="25">current contract</tspan>
    <tspan x="50" dy="22">产品原则 · 架构不变量</tspan>
  </text>
  <line x1="50" y1="410" x2="240" y2="410" stroke="#9ab8be"/>
  <text x="50" y="440" class="small">不能由未来 design</text>
  <text x="50" y="462" class="small">提前覆盖已经生效的事实</text>

  <!-- Implementation -->
  <rect x="300" y="225" width="230" height="268" rx="14" fill="#ecf0e6" stroke="#a8c0a0" stroke-width="2"/>
  <rect x="320" y="245" width="72" height="28" rx="14" fill="#4a6f3a"/>
  <text x="356" y="264" text-anchor="middle" class="badge" fill="#ffffff">实现</text>
  <text x="320" y="310" class="card-title" fill="#4a6f3a">现在如何实现？</text>
  <text x="320" y="348" class="body">
    <tspan x="320">读取：</tspan>
    <tspan x="320" dy="25">code · type · schema</tspan>
    <tspan x="320" dy="22">config · migration · test</tspan>
  </text>
  <line x1="320" y1="410" x2="510" y2="410" stroke="#a8c0a0"/>
  <text x="320" y="440" class="small">代码能说明实现细节，</text>
  <text x="320" y="462" class="small">不能独自说明设计理由</text>

  <!-- Observation -->
  <rect x="570" y="225" width="230" height="268" rx="14" fill="#f5ecdb" stroke="#d4a86a" stroke-width="2"/>
  <rect x="590" y="245" width="72" height="28" rx="14" fill="#a07020"/>
  <text x="626" y="264" text-anchor="middle" class="badge" fill="#ffffff">发生</text>
  <text x="590" y="310" class="card-title" fill="#a07020">某次实际发生什么？</text>
  <text x="590" y="348" class="body">
    <tspan x="590">读取：</tspan>
    <tspan x="590" dy="25">test result · CI</tspan>
    <tspan x="590" dy="22">runtime state · log · trace</tspan>
  </text>
  <line x1="590" y1="410" x2="780" y2="410" stroke="#d4a86a"/>
  <text x="590" y="440" class="small">一次观察可以支持判断，</text>
  <text x="590" y="462" class="small">不会自动升级为长期规范</text>

  <!-- Why -->
  <rect x="840" y="225" width="230" height="268" rx="14" fill="#f1e6ec" stroke="#b88aa0" stroke-width="2"/>
  <rect x="860" y="245" width="72" height="28" rx="14" fill="#7a3a5c"/>
  <text x="896" y="264" text-anchor="middle" class="badge" fill="#ffffff">原因</text>
  <text x="860" y="310" class="card-title" fill="#7a3a5c">为什么曾经这样决定？</text>
  <text x="860" y="348" class="body">
    <tspan x="860">读取：</tspan>
    <tspan x="860" dy="25">ADR · completed change</tspan>
    <tspan x="860" dy="22">incident · retro · research</tspan>
  </text>
  <line x1="860" y1="410" x2="1050" y2="410" stroke="#b88aa0"/>
  <text x="860" y="440" class="small">历史解释过去的取舍，</text>
  <text x="860" y="462" class="small">不能冒充当前契约</text>

  <!-- Status guard -->
  <path d="M145 493 V514 M415 493 V514 M685 493 V514 M955 493 V514 M145 514 H955" class="connector"/>
  <path d="M550 514 V522" class="arrow"/>
  <rect x="70" y="530" width="960" height="108" rx="14" fill="#f5f1ea" stroke="#e6e3dc" stroke-width="2"/>
  <text x="100" y="566" class="card-title">选中来源后，再过三道状态检查</text>
  <rect x="100" y="586" width="260" height="34" rx="8" fill="#ffffff" stroke="#e6e3dc"/>
  <text x="230" y="608" text-anchor="middle" class="gate">① current / proposed / historical？</text>
  <rect x="420" y="586" width="260" height="34" rx="8" fill="#ffffff" stroke="#e6e3dc"/>
  <text x="550" y="608" text-anchor="middle" class="gate">② 对应哪个版本与环境？</text>
  <rect x="740" y="586" width="260" height="34" rx="8" fill="#ffffff" stroke="#e6e3dc"/>
  <text x="870" y="608" text-anchor="middle" class="gate">③ 能支持哪一句，不能支持什么？</text>

  <rect x="160" y="660" width="780" height="42" rx="10" fill="#e6eef0"/>
  <text x="550" y="687" text-anchor="middle" class="question" fill="#2a6470">来源冲突时，先确认问题与状态，再修正错误的一方；不存在一条覆盖所有问题的总优先级。</text>
</svg>
