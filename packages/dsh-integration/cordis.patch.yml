- id: tool-working-directory
  disabled: true
- id: agent-team
  disabled: true
- id: tool-agent-team
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: compaction-basic
  disabled: true
- id: session-projection-cache
  disabled: true
- id: session-title-llm
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: tool-workflow
  disabled: true
- id: workflow-ptc
  disabled: true
- id: session-telemetry-otel
  disabled: true
- insert:
    - id: nano-cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'
    - id: nano-cordis-inspect-host
      name: '@deepseek-ai/dsh-tool-cordis/host'
    - id: nano-tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'
    - id: nano-trajectory-tool-results
      name: '@deepseek-ai/dsh-client-ui-trajectory'
    - id: nano-compaction
      name: '@nano/dsh-integration/compaction'
    - id: nano-workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: nano-connection
      name: '@deepseek-ai/dsh-client-connection'
    - id: nano-file-uploads
      name: '@deepseek-ai/dsh-client-file-upload'
    - id: nano-agent-presets
