packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  koffi: true
  node-pty: true
  node-addon-require-builtin: false
  protobufjs: false
  "@google/genai": false
  '@deepseek-ai/dsh-subprocess-local': true
  "@deepseek-ai/dsh-subprocess-local@0.2.2-rc.5": true
  '@openuidev/lang-core': false

# Public storage-domain schemas share the exact Zod type vocabulary.
overrides:
  "@deepseek-ai/dsh-storage-domain>zod": "4.6.6"
