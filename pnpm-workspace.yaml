packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  koffi: true
  node-pty: true
  node-addon-require-builtin: false
  protobufjs: false
  "@google/genai": false
  '@deepseek-ai/dsh-subprocess-local': set this to true or false
  "@deepseek-ai/dsh-subprocess-local@0.2.1-alpha.1": true

# Public storage-domain schemas share the exact Zod type vocabulary.
overrides:
  "@deepseek-ai/dsh-storage-domain>zod": "4.6.5"
