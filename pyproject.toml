[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-multiagent"
version = "0.1.0"
description = "Nano multi-agent core skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "rich>=13.0,<14.0",
  "markdownify>=0.13,<1.0",
  "bcrypt>=4.0,<6.0",
  "pyjwt>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<2.0",
  # refactor-372-M1: 删除候选需要覆盖率证据才能安全删（决策 4）
  "pytest-cov>=5.0,<7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "coding_cli*", "personal_assistant*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "e2e: end-to-end tests that may require local runtime dependencies",
]
