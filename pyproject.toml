[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-multiagent"
version = "0.1.0"
description = "Nano multi-agent core skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "rich>=13.0,<14.0",
  "markdownify>=0.13,<1.0",
  "bcrypt>=4.0,<6.0",
  "pyjwt>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<2.0",
  # refactor-372-M1: 删除候选需要覆盖率证据才能安全删（决策 4）
  "pytest-cov>=5.0,<7.0",
  # feat-388: 固定大版本——format 输出跨大版本会变，CI/hook/本地须保持一致（决策 D5）
  "ruff==0.15.*",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "coding_cli*", "personal_assistant*"]

[tool.ruff]
# feat-388: target-version 与 requires-python = ">=3.11" 对齐
target-version = "py311"
# line-length 取默认（88），消除风格软约定，不引入新约束

[tool.ruff.lint]
# 裁剪集：纳真违规（F 系），守可变默认参（B006）和裸 except（E722）；
# 排 B008（FastAPI Depends/Query 惯用法，107 处误报，决策 D4）。
select = ["F", "B006", "E722"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# tests/ 里 fixture/helper 变量可能被 pytest 解析而不直接使用；F821 forward ref 在 string annotation 里合法
"tests/**" = ["F401", "F811", "F841", "F821"]
# 以下文件使用 string annotation forward ref 避免循环 import（ruff F821 不识别此模式）
"src/agent/core/hooks/types.py" = ["F821"]
"src/agent/core/tools/base.py" = ["F821"]
"src/agent/platform/background_tasks/wiring.py" = ["F821"]
"src/personal_assistant/main.py" = ["F821"]
# commands.py bridge 导入：模块属性供契约测试用 `is` 检查，不是真正的"未用 import"
"src/coding_cli/commands.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "e2e: end-to-end tests that may require local runtime dependencies",
]
