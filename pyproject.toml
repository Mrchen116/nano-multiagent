[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-multiagent-devtools"
version = "0.1.0"
description = "Standalone documentation and HTTP acceptance tooling"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0", "pyyaml>=6.0,<7.0", "websockets>=13,<17", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<2.0",
  "pytest-xdist>=3,<4",
  "pytest-timeout>=2.3,<3.0",
  "ruff==0.15.*",
  "markdown-it-py>=4,<5",
]

[tool.setuptools]
packages = []

[tool.ruff]
# feat-388: target-version 与 requires-python = ">=3.11" 对齐
target-version = "py311"
# line-length 取默认（88），消除风格软约定，不引入新约束

[tool.ruff.lint]
# 裁剪集：纳真违规（F 系），守可变默认参（B006）和裸 except（E722）；
# 排 B008（FastAPI Depends/Query 惯用法，107 处误报，决策 D4）。
select = ["F", "B006", "E722"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# tests/ 里 fixture/helper 变量可能被 pytest 解析而不直接使用；F821 forward ref 在 string annotation 里合法
"tests/**" = ["F401", "F811", "F841", "F821"]
[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
# feat-434: 单测超时兜底。CI 上偶发某测试挂死会让整个 pytest job 被 runner 以
# "The operation was canceled" 收尸（无 traceback、无法定位）。per-test 超时把它降级成
# 单条测试失败 + thread 法 faulthandler 栈转储，止血且可精确定位。90s 对单测极宽松
addopts = "--timeout=90 --timeout-method=thread"
markers = [
  "e2e: end-to-end tests that may require local runtime dependencies",
]
